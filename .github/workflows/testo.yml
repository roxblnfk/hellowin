on:
  pull_request: null
  push:
    branches:
      - 'master'

name: testo

permissions:
  contents: read

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.4', '8.5']
      dependencies: >-
        ['locked']
      extensions: sockets, mbstring
