on:
  push:
    branches:
      - 'master'
  workflow_dispatch: null

name: deploy

permissions:
  contents: read

# One rollout at a time; a push during a rollout waits for it instead of cancelling a half-built stack.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 72.56.98.57
      DEPLOY_HOST_KEY: 72.56.98.57 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICdgbDAyUDoc8/sg+oVclWkNps5bAqdXD+T5ndh7NyZg
    steps:
      - uses: actions/checkout@v4

      # The key's forced command on the server is docker/deploy.sh: it reads the archive from stdin and rebuilds the stack.
      - name: Ship master to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          git archive --format=tar HEAD | ssh -i ~/.ssh/deploy -o ServerAliveInterval=30 "root@$DEPLOY_HOST"
