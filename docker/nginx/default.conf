map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS. Upstreams are resolved per request (proxy_pass with variables),
    # so nginx starts even when some backend container is not running yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $app_upstream http://app:8080;
    set $centrifugo_upstream http://centrifugo:8000;
    set $grafana_upstream http://grafana:3000;

    # Keep redirects relative: the container listens on 80, but is published on ${HTTP_PORT}.
    absolute_redirect off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /connection/ {
        proxy_pass $centrifugo_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Grafana runs with serve_from_sub_path, so the /grafana/ prefix is passed through unchanged.
    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location / {
        proxy_pass $app_upstream;
    }
}
