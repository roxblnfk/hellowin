version: '3'

rpc:
  listen: 'tcp://127.0.0.1:6001'

server:
  command: 'php app.php'
  relay: pipes

# RoadRunner faces the browser itself, with no proxy in front: it serves the static files, compresses, sets the
# security headers and limits requests by IP. Middleware wrap each other from left to right, so http_metrics counts
# everything, the headers and gzip cover the static files too, and rate_limiter after static guards only the PHP pages.
http:
  address: '0.0.0.0:8080'
  max_request_size: 1
  middleware:
    - http_metrics
    - headers
    - gzip
    - static
    - rate_limiter
  headers:
    response:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: strict-origin-when-cross-origin
      Permissions-Policy: 'camera=(), microphone=(), geolocation=()'
      # No script-src or style-src: the pages load Pixi from a CDN and style SVG inline
      Content-Security-Policy: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
  static:
    dir: public
    forbid:
      - .php
      - .htaccess
    calculate_etag: true
    response:
      # File names carry no hash: the browser revalidates every file by its ETag and gets 304 while it is unchanged
      Cache-Control: no-cache
  # A token bucket per client IP: `burst` requests at once, then `rate` per second; over it — 429 with Retry-After
  rate_limiter:
    key: ip
    rate: 5
    burst: 20
  pool:
    num_workers: 2
    allocate_timeout: 10s
    max_queue_size: 100
    destroy_timeout: 10s
    supervisor:
      max_worker_memory: 100
      exec_ttl: 30s

# Centrifugo proxies connect/subscribe/rpc requests here; the app publishes back through its gRPC API.
centrifuge:
  proxy_address: 'tcp://0.0.0.0:10001'
  grpc_api_address: '${CENTRIFUGO_GRPC_API:-centrifugo:10000}'
  pool:
    num_workers: 2
    # Centrifugo stops waiting for a proxy answer after 3s (docker/centrifugo/config.json)
    allocate_timeout: 3s
    destroy_timeout: 10s

metrics:
  address: '0.0.0.0:2112'

# Game state: scene, round, pumpkins. Valkey keeps it across restarts of the app.
kv:
  hellowin:
    driver: redis
    config:
      addrs:
        - '${VALKEY_ADDR:-valkey:6379}'
  # Lives as long as the RoadRunner process: the server start time for the uptime survives worker restarts only
  process:
    driver: memory
    config: {}

# Transition jobs. A memory pipeline loses queued jobs on restart; the next click over the threshold pushes again.
jobs:
  consume: [transitions]
  pool:
    num_workers: 2
  pipelines:
    transitions:
      driver: memory
      config:
        priority: 10
        prefetch: 100

# The lock plugin needs no configuration: it is served over rpc. Locks live in this RoadRunner process,
# which is enough while a single app instance runs.

# The periodic process of the game: flyer launches and sweeps, the shooters' top. One long-running PHP process outside
# the worker pools, so restarting or scaling workers never runs a second schedule; it reaches kv, lock, metrics
# and centrifuge over rpc like a worker. The RoadRunner lock `ticker` keeps an overlapping second copy idle.
service:
  ticker:
    command: 'php app.php hellowin:ticker'
    process_num: 1
    remain_after_exit: true
    restart_sec: 2
    exec_timeout: 0s
