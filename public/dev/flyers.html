<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Hellowin — летуны</title>
    <style>
        body { margin: 0; padding: 16px; background: #1b1b22; color: #ddd; font: 13px/1.4 monospace; }
        h2 { margin: 18px 0 6px; font-size: 14px; color: #fff; }
        canvas { image-rendering: pixelated; display: block; }
        .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 10px; }
        .sky { background: #8ccff0; }
        .grass { background: #2e7a34; }
        .dusk { background: #c86a5a; }
        .night { background: #1a1834; }
        /* The lawn under the blood moon (night.js, LIGHTINGS.blood); sprites on it are relit the same way. */
        .blood { background: #2a0e14; }
        /* The bar's floor boards in its firelight. */
        .wood { background: #8a4a2a; }
        .night .cell span, .dusk .cell span, .blood .cell span, .wood .cell span { color: #eee; }
        .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .cell span { font-size: 11px; color: #123; }
        .grass .cell span { color: #eee; }
    </style>
</head>
<body>
<h2>Живая сцена 3× (параметры: ?t=мс — стоп-кадр, ?zoom=N — масштаб листов, ?only=kind,kind, ?live=0 — без сцен)</h2>
<div id="live"></div>
<h2>Ночь: вороны, мыши, призраки, ведьма, бегун на горизонте, зомби и червяк на лужайке</h2>
<div id="live-night"></div>
<div id="out"></div>
<script type="module">
    import { FLYERS, BUSH, DIGITS, digitsSprite, feathersOf, bake } from '../js/pixel/flyers.js';
    import { PALETTE } from '../js/pixel/palette.js';
    import { relightCanvas } from '../js/pixel/night.js';

    const out = document.getElementById('out');
    const params = new URLSearchParams(location.search);
    const zoom = Math.max(1, Math.round(Number(params.get('zoom')) || 3));
    const css = (key) => `#${PALETTE[key].toString(16).padStart(6, '0')}`;
    const baked = new Map();
    const tex = (s) => baked.get(s) ?? baked.set(s, bake(s)).get(s);

    function view(sprite, scale, label, lit = 'day', glow = null) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const c = lit === 'day' ? bake(sprite) : relightCanvas(bake(sprite), lit);
        // A light layer (the firefly's lantern) goes over the body unlit.
        if (glow) c.getContext('2d').drawImage(bake(glow), 0, 0);
        c.style.width = `${sprite.w * scale}px`;
        c.style.height = `${sprite.h * scale}px`;
        cell.append(c);
        if (label) {
            const s = document.createElement('span');
            s.textContent = label;
            cell.append(s);
        }
        return cell;
    }

    function section(title, bg, items) {
        const h = document.createElement('h2');
        h.textContent = title;
        const row = document.createElement('div');
        row.className = `row ${bg}`;
        row.append(...items);
        out.append(h, row);
    }

    // Backdrops per kind: the night flyers must also read on the sunset and night skies; ground runners on grass.
    const BACKDROPS = {
        duck: ['sky', 'grass'],
        chicken: ['sky', 'grass'],
        crow: ['sky', 'dusk', 'night'],
        bat: ['dusk', 'night'],
        ghost: ['sky', 'night'],
        witch: ['sky', 'dusk', 'night'],
        roadrunner: ['sky', 'grass'],
        zombie: ['grass', 'night'],
        worm: ['grass', 'night', 'blood'],
        firefly: ['night', 'blood'],
        fly: ['wood'],
    };
    const only = params.get('only')?.split(',');
    for (const [kind, bgs] of Object.entries(BACKDROPS)) {
        if (only && !only.includes(kind)) continue;
        for (const bg of bgs) {
            // A ground kind shares one set between depths: it is shown once. The worm also emerges and burrows.
            const lit = bg === 'blood' ? 'blood' : 'day';
            section(`${kind}: fly ×4, hit, fall ×2 — depth 0/1/2, ${zoom}× (${bg})`, bg, FLYERS[kind].flatMap((set, depth, all) => (depth && set === all[depth - 1] ? [] : [
                ...(set.emerge ?? []).map((s, i) => view(s, zoom, `d${depth} emerge${i}`, lit)),
                ...set.fly.map((s, i) => view(s, zoom, `d${depth} fly${i}`, lit)),
                // The fly sitting on a stop and the splat it leaves.
                ...(set.sit ?? []).map((s, i) => view(s, zoom, `d${depth} sit${i}`, lit)),
                ...(set.splat ? [view(set.splat, zoom, `d${depth} splat`, lit)] : []),
                ...(set.burrow ?? []).map((s, i) => view(s, zoom, `d${depth} burrow${i}`, lit)),
                // The firefly's lantern levels (dim, mid, bright) over the mid-stroke frame.
                ...(set.glow ?? []).map((g, i) => view(set.fly[1], zoom, `d${depth} glow${i}`, lit, g)),
                view(set.hit, zoom, `d${depth} hit`, lit),
                ...set.fall.map((s, i) => view(s, zoom, `d${depth} fall${i}`, lit)),
            ])));
        }
    }
    section('перья 6×, куст idle ×2 и rustle ×3 3×, цифры 4×', 'grass', [
        ...FLYERS.feathers.map((s, i) => view(s, 6, `${s.kind}${i}`)),
        ...BUSH.idle.map((s, i) => view(s, 3, `idle${i}`)),
        ...BUSH.rustle.map((s, i) => view(s, 3, `rustle${i}`)),
        ...Object.entries(DIGITS).map(([ch, s]) => view(s, 4, ch)),
        view(digitsSprite('+1'), 4), view(digitsSprite('+2'), 4), view(digitsSprite('+3'), 4),
    ]);

    // Live: positions in % of the art canvas, as the `flyer` events send them.
    const W = 320;
    const H = 180;
    const HORIZON = 70;
    const PERIOD = 3000 * 4;
    const BUSH_AT = { x: 14, y: 88 };
    const DAY = {
        el: 'live',
        sky: 'sky',
        bush: true,
        flights: [
            { kind: 'duck', depth: 0, from: { x: -8, y: 18.4 }, to: { x: 108, y: 10.2 }, start: 0, duration: 9000 },
            { kind: 'chicken', depth: 1, from: { x: 108, y: 30 }, to: { x: -8, y: 14 }, start: 500, duration: 6000 },
            { kind: 'duck', depth: 2, bush: true, from: BUSH_AT, via: { x: 30, y: 18 }, to: { x: 75, y: -8 }, start: 1500, duration: 4000, shotAt: 2600, points: 1 },
            { kind: 'chicken', depth: 2, from: { x: -8, y: 40 }, via: { x: 50, y: 5 }, to: { x: 108, y: 30 }, start: 3000, duration: 5000, shotAt: 5200, points: 2 },
            { kind: 'duck', depth: 1, from: { x: 108, y: 22 }, to: { x: -8, y: 30 }, start: 6000, duration: 6000, shotAt: 8000, points: 3 },
            // The road-runner hint: it runs along the horizon line, never shot.
            { kind: 'roadrunner', depth: 0, ground: true, from: { x: 108, y: (HORIZON / H) * 100 }, to: { x: -8, y: (HORIZON / H) * 100 }, start: 7000, duration: 3500 },
        ],
    };
    const NIGHT = {
        el: 'live-night',
        sky: 'night',
        flights: [
            { kind: 'crow', depth: 0, from: { x: -8, y: 20 }, to: { x: 108, y: 12 }, start: 0, duration: 9000 },
            { kind: 'bat', depth: 1, from: { x: 108, y: 26 }, to: { x: -8, y: 16 }, start: 300, duration: 5000 },
            { kind: 'ghost', depth: 2, from: { x: -8, y: 30 }, via: { x: 40, y: 10 }, to: { x: 108, y: 24 }, start: 1000, duration: 6000, shotAt: 3800, points: 2 },
            { kind: 'witch', depth: 1, from: { x: 108, y: 12 }, via: { x: 50, y: 4 }, to: { x: -8, y: 18 }, start: 4500, duration: 5000, shotAt: 7400, points: 10 },
            { kind: 'crow', depth: 2, from: { x: 108, y: 34 }, to: { x: -8, y: 20 }, start: 6000, duration: 4500, shotAt: 8200, points: 1 },
            { kind: 'bat', depth: 2, from: { x: -8, y: 16 }, via: { x: 50, y: 30 }, to: { x: 108, y: 8 }, start: 8000, duration: 3500 },
            { kind: 'roadrunner', depth: 0, ground: true, from: { x: -8, y: (HORIZON / H) * 100 }, to: { x: 108, y: (HORIZON / H) * 100 }, start: 2000, duration: 3500 },
            { kind: 'zombie', depth: 1, ground: true, walk: 150, from: { x: 30, y: 72 }, to: { x: 80, y: 74 }, start: 0, duration: 11000, shotAt: 9800, points: 3 },
            // Worms meander across the lawn (wobble), out of the ground and back into it; the second one is shot.
            { kind: 'worm', depth: 1, ground: true, walk: 150, from: { x: 70, y: 90 }, to: { x: 50, y: 88 }, wobble: { amp: 1.5, waves: 4 }, start: 1000, duration: 6500 },
            { kind: 'worm', depth: 1, ground: true, walk: 150, from: { x: 8, y: 82 }, to: { x: 28, y: 86 }, wobble: { amp: 1.2, waves: 3.5 }, start: 5000, duration: 6500, shotAt: 9000, points: 2 },
            // Fireflies of the cursed world drift on lazy loops, their lanterns blinking; the second one is shot.
            { kind: 'firefly', depth: 1, from: { x: -8, y: 30 }, to: { x: 108, y: 22 }, wobble: { amp: 4, waves: 2 }, start: 500, duration: 6500 },
            { kind: 'firefly', depth: 2, from: { x: 108, y: 40 }, via: { x: 50, y: 20 }, to: { x: -8, y: 30 }, wobble: { amp: 3, waves: 2.5 }, start: 3000, duration: 4000, shotAt: 5200, points: 1 },
        ],
    };
    // The lantern's blink as in scene.js: dim most of the time, bright for a moment (flickering), mid in between.
    const LANTERN_MS = 1700;
    const lanternLevel = (t) => {
        const beat = t % LANTERN_MS;
        return beat < 120 || (beat >= 600 && beat < 720) ? 1 : beat < 600 ? (Math.floor(t / 90) % 5 ? 2 : 1) : 0;
    };
    const FLAP = [180, 130, 90];

    const lerp = (a, b, t) => a + (b - a) * t;
    function pointAt(f, t) {
        if (!f.via) return { x: lerp(f.from.x, f.to.x, t), y: lerp(f.from.y, f.to.y, t) };
        const u = 1 - t;
        return {
            x: u * u * f.from.x + 2 * u * t * f.via.x + t * t * f.to.x,
            y: u * u * f.from.y + 2 * u * t * f.via.y + t * t * f.to.y,
        };
    }
    const toArt = (p) => ({ x: (p.x / 100) * W, y: (p.y / 100) * H });
    // A flyer's `wobble` sway across its path, as in scene.js (pathAt).
    function swayed(f, t) {
        const p = pointAt(f, t);
        if (!f.wobble) return p;
        const dx = f.to.x - f.from.x;
        const dy = f.to.y - f.from.y;
        const len = Math.hypot(dx, dy) || 1;
        const off = f.wobble.amp * Math.sin(2 * Math.PI * f.wobble.waves * t);
        return { x: p.x - (dy / len) * off, y: p.y + (dx / len) * off };
    }
    // The worm's clock as in scene.js: it emerges at `from`, crawls the path in between, burrows at `to`.
    const EMERGE_MS = 3 * 130;
    const BURROW_MS = 2 * 150;
    function wormAt(f, local) {
        const t = Math.min(1, Math.max(0, (local - EMERGE_MS) / (f.duration - EMERGE_MS - BURROW_MS)));
        const p = pointAt(f, t);
        const dx = f.to.x - f.from.x;
        const dy = f.to.y - f.from.y;
        const len = Math.hypot(dx, dy) || 1;
        const off = f.wobble.amp * Math.sin(2 * Math.PI * f.wobble.waves * t);
        return { t, p: { x: p.x - (dy / len) * off, y: p.y + (dx / len) * off } };
    }

    function live(cfg) {
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        canvas.style.width = `${W * 3}px`;
        canvas.style.height = `${H * 3}px`;
        document.getElementById(cfg.el).append(canvas);
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        function draw(sprite, x, y, flip = false, alpha = 1) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(Math.round(x), Math.round(y));
            if (flip) ctx.scale(-1, 1);
            ctx.drawImage(tex(sprite), -sprite.anchor.x, -sprite.anchor.y);
            ctx.restore();
        }

        return (now) => {
            const t = now % PERIOD;
            ctx.fillStyle = cfg.sky === 'night' ? '#1a1834' : css('sky');
            ctx.fillRect(0, 0, W, HORIZON);
            ctx.fillStyle = css(cfg.sky === 'night' ? 'leafDark' : 'leaf');
            ctx.fillRect(0, HORIZON, W, H - HORIZON);
            ctx.fillStyle = css(cfg.sky === 'night' ? 'soilDark' : 'soil');
            ctx.fillRect(0, HORIZON + 30, W, H - HORIZON - 30);

            const bp = toArt(BUSH_AT);
            let bushSprite = null;
            const bushFlyer = cfg.flights.find((f) => f.bush);
            if (bushFlyer) {
                const rustling = t >= bushFlyer.start - 600 && t < bushFlyer.start + 300;
                bushSprite = rustling ? BUSH.rustle[Math.floor(t / 90) % 3] : BUSH.idle[0];
                draw(BUSH.idle[1], bp.x + 220, bp.y + 4);
            }

            for (const f of [...cfg.flights].sort((a, b) => a.depth - b.depth)) {
                const set = FLYERS[f.kind][f.depth];
                const local = t - f.start;
                if (local < 0) continue;
                const flip = f.to.x < f.from.x;
                if (f.shotAt && t >= f.shotAt) {
                    const fall = t - f.shotAt;
                    const p0 = toArt(f.kind === 'worm' ? wormAt(f, f.shotAt - f.start).p : swayed(f, (f.shotAt - f.start) / f.duration));
                    if (f.kind === 'worm') {
                        // The worm writhes side to side, then sinks into the ground.
                        if (fall < 1300) draw(fall < 450 ? set.hit : set.fall[fall < 850 ? 0 : 1], p0.x, p0.y, fall < 450 ? (Math.floor(fall / 90) % 2 ? !flip : flip) : flip);
                    } else if (f.ground) {
                        // A ground target collapses where it stands.
                        if (fall < 1600) draw(fall < 160 ? set.hit : set.fall[fall < 420 ? 0 : 1], p0.x, p0.y, flip, Math.min(1, 2 - fall / 800));
                    } else {
                        const y = p0.y + 0.00012 * fall * fall;
                        if (y < H + 20) draw(fall < 160 ? set.hit : set.fall[Math.floor(fall / 120) % 2], p0.x, y, flip);
                    }
                    feathersOf(f.kind).concat(feathersOf(f.kind)).forEach((feather, i, all) => {
                        if (fall > 1400) return;
                        const a = (i / all.length) * Math.PI * 2 + 0.6;
                        const s = fall / 1000;
                        const cy = f.ground ? p0.y - set.hit.h / 2 : p0.y;
                        draw(feather, p0.x + Math.cos(a) * 26 * s, cy + Math.sin(a) * 14 * s + 22 * s * s, false, 1 - fall / 1400);
                    });
                    if (fall < 1200) {
                        const top = f.ground ? p0.y - set.hit.h - 4 : p0.y - set.hit.h / 2 - 6;
                        draw(digitsSprite(`+${f.points}`), p0.x, top - fall * 0.012, false, Math.min(1, 2 - fall / 600));
                    }
                    continue;
                }
                if (local > f.duration) continue;
                if (f.kind === 'worm') {
                    const p = toArt(wormAt(f, local).p);
                    const frame = local < EMERGE_MS ? set.emerge[Math.floor(local / 130)]
                        : local > f.duration - BURROW_MS ? set.burrow[Math.min(1, Math.floor((local - f.duration + BURROW_MS) / 150))]
                        : set.fly[Math.floor(local / f.walk) % 4];
                    draw(frame, p.x, p.y, flip);
                    continue;
                }
                const p = toArt(swayed(f, local / f.duration));
                const period = f.walk ?? (f.kind === 'roadrunner' ? 70 : FLAP[f.depth]);
                draw(set.fly[Math.floor(local / period) % 4], p.x, p.y, flip);
                if (set.glow) draw(set.glow[lanternLevel(t + f.start * 7)], p.x, p.y, flip);
            }
            if (bushSprite) draw(bushSprite, bp.x, bp.y);
        };
    }

    if (params.get('live') === '0') {
        for (const id of ['live', 'live-night']) {
            document.getElementById(id).previousElementSibling.remove();
            document.getElementById(id).remove();
        }
    }
    const frames = params.get('live') === '0' ? [] : [live(DAY), live(NIGHT)];
    const fixed = params.get('t');
    if (fixed !== null) {
        frames.forEach((frame) => frame(Number(fixed)));
    } else {
        const loop = (now) => {
            frames.forEach((frame) => frame(now));
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
