<!--
  Sandbox for the pixel scene without a backend (docs/spec/frontend.md, "Проверка"): a fake snapshot and a fake
  engine that emits channel events through the same client model as app.js.
  Query: ?auto=1 auto-clicks, ?w=px narrows the page, ?stage=N starts every pumpkin at stage N, ?freeze=ms stops the frame loop after ms,
  ?ui=0 hides the controls, ?sound=1 plays the real sound (unlocked by the first press; window.audio is the engine), ?hits=1 outlines the hit zones, ?reset=ms restarts the round at that frozen-clock moment, ?flyers=1 launches three flyers and shoots one (?shoot=0..2 picks the depth, ?shotAt=ms the moment, ?kind=<id> the kind — the sunset has none of its own), ?fps=1 logs the frame rate, ?skew=ms shifts the client clock.
  Characters: ?walkers=N wandering bots (default 3, 0 with ?freeze; frozen bots all set off at once), ?me=1 puts
  your own character on the field at once (click the ground to walk), ?join=1 opens the join screen, ?shooter=1 makes
  the ?flyers=1 shot one of the first walker, ?item=<id> hands that item out in every scene, ?bodies=id,id… gives the
  bots those bodies in order (no hat, no cloak). The "выстрел" button
  launches a bird that a walker shoots down. ?clink=1 stands the bots in little groups a few steps apart and keeps them
  there: with ?finale=5 (beer in every hand) they clink glasses, ?finale=5&clink=1&walkers=8&freeze=ms catches a clink.
  Clinking by click (cursed world, ?finale=5): with ?me=1 a click on a bot walks up to it and clinks (RPC `clink` →
  `move`, then `clink` at the arrival), a click on a reachable pumpkin (the front ones by the lawn, `reachable`)
  clinks with it. ?clickclink=1 stands the bots apart and keeps them there, and they clink by click themselves: bot 1
  with bot 2 (a two-voice toast), bot 3 with pumpkin-10, bot 4 with bot 5 — at the start and every 9 s; ?toast=N gives
  all of them toast N. ?finale=5&clickclink=1&walkers=5&freeze=1900 catches the strike, 2700 the toasts, 3700 the reply.
  Items in the final scene follow `finale_items`: the red flame at step 0, empty hands on steps 1–4, beer from step 5.
  Story: ?mod=1 makes this page the moderator (the console shows; without it console RPCs answer `forbidden`),
  ?scene=N starts in scene N, ?ready=1 starts with every pumpkin done and the scene ready, ?finale=N starts at finale
  step N (a fake `reveal` from step 4), ?paused=1 starts with the pause of the progress on, ?owl=<line id> or
  ?say=<text> has the owl speak at the start, ?specials=1 launches a witch, a road-runner and a zombie at the start
  (?zshot=ms shoots the zombie). Flyer kinds follow the scene like HELLOWIN_FLYER_KINDS (worms in the final scene, with
  a small wobble; the cursed world flies worms, bats and fireflies); ?worms=1 sends three worms over the lawn at the start
  in any scene (?wshot=ms shoots the first one); ?fireflies=1 launches three fireflies at the start (?fshot=ms shoots a
  near one); ?flies=N launches N flies (the bar's flyer: loops between landings on the tables and the counter) at the
  start in any scene, seeded (?flyshot=ms has the first walker shoot the first one);
  zombies wander at finale steps 5–6 (protocol.md, «Бродячие зомби»): ?zmin=N at least (HELLOWIN_ZOMBIE_MIN, default
  5), all of them at once on entering step 5 and a new one at once after a death below it, then one every 4–9 s while
  fewer than max(zmin, ?zper=N × walkers) live (HELLOWIN_ZOMBIE_PER_PLAYER, default 5);
  ?wander=N starts with N already wandering (zmin by default at steps 5–6), ?gone=ms sends
  them away at that moment (as the dawn and a reset do), ?wkill=ms shoots the first one; the scene is ready when every pumpkin is done, and
  waits for «Следующая сцена».
  Bonfire (scenes 2–3): locked until every pumpkin of the scene is done (a click on it then answers `locked` and sends
  nothing), its own limit `bonfire` (?bclicks=N — a flat N instead of the formula) and last stages per scene
  0,0,4,7 (HELLOWIN_BONFIRE_STAGE_MAX); owl lines last-pumpkin → bonfire-open, then ready → bonfire-done → scene-ready.
  ?bonfire=N starts the bonfire at stage N; ?next=ms presses «Следующая сцена» (forced) at that frozen-clock moment —
  without ?scene out of the bar, with ?scene=1 the sunset fade, with ?scene=3 the explosion.
  Magic circle (docs/spec/scenario.md «Магический круг»): on the bonfire's spot, clickable in the final scene at finale
  step 0 (the bonfire before it, never both), own limit `circle` (?cclicks=N — flat) and CIRCLE_STAGES = 4 stages, the
  last stage in `scene.circleStageMax`; closed → ready, circle-done, scene-ready. ?circle=N starts it at stage N;
  ?nocircle=1 leaves it out.
  Finale (docs/spec/scenario.md «Финал»): step 1 only from the closed circle (`not ready` without it, «Шаг финала 1» on
  the console forces it after a confirm); on step 2 every walker gets a `move` outward to the edge of the lawn, like
  the server's scatter; the snapshot's `startedAt` is 3 h 07 min before the start (the HUD's uptime from step 3, the
  reveal's from step 4). ?finale=N starts settled at step N (bots stand around the circle and do not wander until
  step 2); ?play=ms with ?freeze presses «Шаг финала» (forced) at that frozen-clock moment, so ?finale=1&play=0&freeze=1600
  captures the lightning of step 2 mid-way; ?ritual=1 starts at step 0 with the circle closed. Step 1 from step 0 waits
  for the owl's countdown (SUMMON_MS, «Призыв»): ?ritual=1&play=0&freeze=500 — «Призыв через 3…», 2500 — «1…», 3300 — the
  circle's flash after it.
  Limits (protocol.md, «Лимиты и баланс»): every limit is max(1, ceil(k × (BASE + PER_PLAYER × (n − 1)))) plus the
  moderator's addition (the bar, the cursed world, the boss; gone with a reset), BASE and PER_PLAYER the defaults of
  engine.md; n the walkers on the field (at least 1), followed once it has held 3 s, or ?players=N for good; k from the
  console's «Лимиты» (`thresholds`), from 0.1 to 10, kept across a reset; ?k=N starts with it. The engine sends
  `limits {players, k, burst, limits}` with the current context's limits whenever they change, and catches up: a
  pumpkin with clicks enough for a lowered limit goes to its next stage, a bar goal at `drunk` makes the bar ready.
  «Пуск летунов» (?mod=1, shown while the set has flyers — `burst`) is `flyers.burst`: ceil(5 + 0.2 × (n − 1)) of the
  current set at once, no cooldown, no ceiling. `online` is the number of walkers, in the snapshot and in a
  `leaderboard` event every 5 s (a removed event the client only reads `online` from).
  The pause of the progress (protocol.md, «Пауза прогресса»; the console's «Пауза прогресса», ?paused=1): `click`,
  `drink`, `strike` and `roll` go through with `counted: false` in the reply and the event, and the task stands
  still — a click keeps the element's clicks and stage, a drink grows no goal (no `drinks`), a strike keeps the hp, a
  6-6-6 does not win; no readiness comes. The page shows players nothing of it, only the console has the button and its
  badge. Flyers, wandering zombies and shots go on, a zombie shot then does not count for the cursed world's goal. Its
  end catches up like a lowered limit; a reset and «В бар» lift it (no `pause` event: `reset` says so).
  The goals' numbers («Готово 3 из 8», «Выпито 12 из 30», «HP 57 / 90») are the moderator's (?mod=1): a player sees
  the bars alone (scenario.md, «Цифры прогресса»).
  Scenes are numbered with the bar first (docs/spec/scenario.md): 0 bar, 1 day, 2 sunset, 3 night, 4 the final scene.
  Bar (the default without ?scene): the ticker pours one mug at a time (?mugs=N at the start, default 5; ?pour=ms per
  mug, default 2500), about every third pour with a `rumor`; `bar.take` walks to the counter and takes a mug on arrival
  (a latecomer gets `take ok:false` and `bar-empty`); `drink` needs a clink (`not clinked`), counts `drunk` against the
  goal (the limit `bar`, ?target=N — flat; ?drunk=N already drunk) and sends `drinks`; the goal reached or «Отмашка» (`bar.ready`,
  ?mod=1) makes the bar ready once (`ready`, `bar-intro`); «+5/−5 бокалов» is `bar.target` (an addition); clinks by click need beer on
  both sides, `clink.auto` is reported by your browser and, for the bots, by the lab. Bots fetch beer, clink and drink.
  ?bar=1 stands beer-holding bots in pairs by the tables (?bar=1&walkers=8&epoch=18000&freeze=5100 — the strike, 6400 —
  toasts to PHP); ?bardemo=1 plays a scripted evening (two mugs, a slow pour, the farthest bot shrugs, two clink and
  drink). With ?me=1: the counter takes a mug, Space or «Выпить» drinks; my character, ?me=1 or from the join screen,
  walks in through the door. ?walkin=N — N bots walk in through the door 1.5 s apart (?walkin=1&freeze=300 — the
  door wide open, 1200 — closing).
  Click shots (docs/spec/frontend.md, «Выстрел по клику»): a click event carries its clicker like the server's — your
  click your character when it is on the field, a random or automatic click a random bot, or nobody with the share
  ?anon=0..1 (default 0.25); a standing clicker shoots the element with what it holds. ?still=1 keeps the bots where
  they stand (no wandering, frozen bots do not set off), so ?auto=1&still=1&walkers=8 shows a crowd shooting.
  Rapier (docs/spec/frontend.md, «Рапира»; finale steps 5–7): ?finale=5 — the cursed world's goal: the engine counts
  mugs drunk and zombies slain against the limits `drinks` and `zombies` (?goal=N — both flat N; the console's ±5 adds),
  ?cursed=drunk,slain — starting counters; `beer {pumpkin}` hands out a mug at a reachable pumpkin, drinking needs a clink
  unless you are alone; both goals met — `ready` and `cursed-ready`, step 6 only from the console. Bots fetch beer from the
  pumpkins, clink and drink. ?zdeaths=1 — six zombies one after another, one per kind of death, the first walker shoots
  each (?zdeaths=1&freeze=1900 — the first death). ?finale=6 — the owl's rapier and the word form; the lab does not know
  the word: ?word=ok — every answer right, ?word=fail — every answer wrong, by default every second one wrong; bots say the
  word, the wrong ones shamble as zombies (the engine walks them every 2–4 s), other bots cure them. ?boss=hp,max — the
  boss awake at once (his addition makes up max); otherwise he wakes with the limit `boss`; ?strike=1 — bots with a rapier strike FrankenPHP every 600 ms; the last blow says `boss-down` and
  goes to step 7. ?zombified=1 (with ?me=1) — my walker a zombie. ?finale=7 — the dawn, FrankenPHP an ash pile, ducks and
  chickens more often; «В бар» on the console (?mod=1) is a new round of the evening (`reset` with `again`, `bar-again`).
  RoadRunner behind the counter (`bar.roadrunner`): ?roadrunner=1 opens the bar as «В бар» from the dawn does, with him
  there (the console's reset sends him away, «В бар» brings him back); ?rrclink=1 — and the first bot, beer in hand,
  clinks with him at the start (?toast=N — its toast). With ?me=1 and beer a click on him is `clink {roadrunner: true}`.
  Dice (docs/spec/frontend.md, «Кости»; finale step 1): entering step 1 turns the dice on; ?finale=1&dice=1 starts there.
  The engine throws like DiceService, but seeded — the faces a hash of (round, player, attempt) where the server rolls
  random_int and stores the answer; a repeat the same throw, `bad attempt` with `last`, 1800 ms between throws
  (`busy`), the first 6-6-6 wins (`dice`, `ready`, `dice-win`). ?roll=a,b,c — my next throw falls so; ?bots666=N — the first bot rolls 6-6-6 on its N-th attempt (else the
  bots throw every 2–4 s and never win); «Сова бросает» (?mod=1) — the owl's 1st and 2nd throws anything but 6-6-6, the
  3rd 6-6-6. With ?me=1 and ?freeze my «Бросить» is pressed at the start: ?finale=1&dice=1&me=1&freeze=900 — the dice
  rolling, 1800 — landed. Meep (?mod=1): a click on a runner on the horizon, on RoadRunner of the finale (step 3+) or
  behind the counter is `meep`; ?meep=ms sends one at that frozen moment (?meepflyer=1 — over the first runner flyer).
  ?owlroll=ms[,ms…] — «Сова бросает» at those frozen moments (?finale=1&dice=1&owlroll=0&freeze=900 — the owl's dice);
  ?owlrolls=N — the owl has rolled N times already (`dice.owl` of the snapshot, as after a reload).
  The evening's top shooters (docs/spec/frontend.md, «Топ стрелков»): every hit of a player in any scene adds the flyer's
  points; the whole board (`top`, rows `{player, points}`, ordered like the server) goes out at most every 500 ms
  (HELLOWIN_TOP_INTERVAL) and stands in the snapshot; neither a reset nor «В бар» clears it. ?dawntop=N — N shooters of
  different aim (the bots first, then shooters off the field) fire at thicker flyers in any scene; ?dawnboard=15 — a
  board of 15 at once, me 12th (with ?me=1 — my row under the line); ?dawntop=8&freeze=ms — the overtakes of a seeded
  run at that moment; ?dawnopen=1|0 — the table starts unfolded / folded (the dawn unfolds it anyway); ?topold=1 — the
  server before the rename: `dawn` in the snapshot and the events. E.g. ?scene=1&dawnboard=15&me=1 — folded by day,
  ?finale=7&dawnboard=15&me=1 — the dawn's ten.
  An action stops the walk (docs/spec/frontend.md, «Действие останавливает ход»): ?walkstop=shoot|click|strike|drink|dice
  puts my character on the field and walks it left; at ?stopat=ms (default 1600) the `move` with `stop` comes — its
  point the server's, ?stoplag=ms (default 250) of walking past the one drawn — then the action's own event. ?walkon=ms
  sends a new move at that moment (inside the pause it cancels the pause). Under ?freeze lab.walkTrace holds my drawn
  point per frame: ?walkstop=shoot&scene=1&freeze=2000 — the shot where it stopped, 3200 — walking on to the server's.
  Chat (docs/spec/frontend.md, «Чат»): with a character (?me=1) «Чат» or Enter opens the field, `say` is checked like the
  server's (HELLOWIN_CHAT_MAX 120, 1 per second with a burst of 3). ?chat=N — N bots talk every 6 s (under ?freeze — once
  at the start: ?chat=4&freeze=1500 shows their bubbles); ?chatzombie=1 — every second of them a zombie worker, whose
  line comes from chat.js; ?mod=1 — the console's «Чат» with a short history and «заглушить» (a muted player's `say`
  answers `muted`).
  HUD (docs/spec/frontend.md, «Разметка и DOM-хуки»): ?conn=ok|reconnect|down — the connection lamp green, yellow
  blinking, red; RoadRunner's uptime beside it from ?finale=3 on and in the bar with ?roadrunner=1. The console (?mod=1)
  shows only what works in the scene or finale step: ?mod=1&scene=1, ?mod=1&finale=5, ?mod=1&finale=6&boss=60,100.
-->
<body data-scene="0">
<main class="patch" id="app" data-centrifugo-url="" data-round="1" data-scene-stages="4" data-stage-max="0" data-threshold="5" data-chat-max="120"
      data-bushes='[{"id":"bush-1","x":4,"y":86},{"id":"bush-2","x":96,"y":88},{"id":"bush-3","x":2,"y":62},{"id":"bush-4","x":98,"y":66},{"id":"bush-5","x":16,"y":44},{"id":"bush-6","x":88,"y":43}]'>
    <a class="help-link" href="/how-it-works" title="Как это работает" aria-label="Как это работает">
        <span aria-hidden="true">🎃</span><span class="help-link__mark" aria-hidden="true">?</span>
    </a>
    <button type="button" class="bar-counter" data-bar-counter aria-disabled="true" hidden aria-label="Взять пиво" title="Взять пиво"><span class="bar-counter__emoji" aria-hidden="true">🍺</span></button>
    <button type="button" class="roadrunner" data-roadrunner aria-disabled="true" hidden aria-label="Чокнуться с RoadRunner" title="Чокнуться с RoadRunner"><span class="roadrunner__emoji" aria-hidden="true">🐦</span></button>
    <!-- The rapier (docs/spec/frontend.md, «Рапира»): over FrankenPHP his health and the button a rapier strikes; at the
         top the magic word, or the line of a zombie worker. -->
    <button type="button" class="franken" data-franken aria-disabled="true" hidden aria-label="FrankenPHP: ударить рапирой" title="Ударить рапирой"><span class="franken__emoji" aria-hidden="true">🧟</span></button>
    <div class="boss-hp" data-boss-hp role="progressbar" aria-label="Здоровье FrankenPHP" aria-valuemin="0" hidden><span class="boss-hp__bar" aria-hidden="true"><span class="boss-hp__fill"></span></span><span class="boss-hp__text" data-boss-hp-text></span></div>
    <form class="word" data-word hidden>
        <label class="word__label" for="word-input">Молви слово</label>
        <input class="word__input" id="word-input" data-word-input name="word" maxlength="40" autocomplete="off" spellcheck="false">
        <button type="submit" class="word__button" data-word-submit>Молвить</button>
        <p class="word__note" data-word-note role="alert"></p>
    </form>
    <p class="word-zombie" data-word-zombie role="status" hidden>Ты зомби-воркер. Жди, пока расколдуют</p>
    <!-- The dice of finale step 1 (docs/spec/frontend.md, «Кости»): the call or the winner, my roll drawn big, «Бросить». -->
    <section class="dice" data-dice hidden aria-label="Кости">
        <p class="dice__note" data-dice-note role="status"></p>
        <div class="dice__faces" data-dice-faces hidden><span class="dice__face" data-dice-face></span><span class="dice__face" data-dice-face></span><span class="dice__face" data-dice-face></span></div>
        <button type="button" class="dice__roll" data-dice-roll aria-disabled="true">Бросить</button>
    </section>
    <!-- The evening's top shooters (docs/spec/frontend.md, «Топ стрелков»). -->
    <section class="dawn-top" data-dawn-top hidden aria-labelledby="dawn-top-title">
        <h2 class="dawn-top__title" id="dawn-top-title">Лучшие стрелки вечера</h2>
        <button type="button" class="dawn-top__toggle" data-dawn-toggle aria-expanded="true" aria-controls="dawn-top-list"><span data-dawn-strip></span></button>
        <p class="dawn-top__row dawn-top__head" data-dawn-head aria-hidden="true"><span class="dawn-top__place">место</span><span class="dawn-top__name">имя</span><span class="dawn-top__shots">очки</span></p>
        <ol class="dawn-top__list" id="dawn-top-list" data-dawn-list></ol>
        <p class="dawn-top__empty" data-dawn-empty>Сбивайте уток рапирой!</p>
        <p class="dawn-top__row dawn-top__row--mine" data-dawn-mine hidden></p>
    </section>
    <!-- The moderator's hit zone over RoadRunner of the finale: a click makes him meep. -->
    <button type="button" class="rr-meep" data-rr-meep hidden aria-label="RoadRunner: мип-мип" title="Мип-мип"></button>
    <aside class="debug" data-debug-panel hidden aria-label="Пульт ведущего"></aside>
    <!-- The chat (docs/spec/frontend.md, «Чат»). -->
    <form class="chat" data-chat hidden>
        <label class="chat__label" for="chat-input">Сказать всем</label>
        <input class="chat__input" id="chat-input" data-chat-input name="text" maxlength="120" autocomplete="off" spellcheck="false" enterkeyhint="send">
        <button type="submit" class="chat__button" data-chat-submit>Сказать</button>
        <p class="chat__note" data-chat-note role="alert"></p>
    </form>
    <aside class="debug lab-tools" data-lab-panel aria-label="Лаборатория">
        <button type="button" class="debug__button" data-lab-duck>утка</button>
        <button type="button" class="debug__button" data-lab-click>клик</button>
        <button type="button" class="debug__button" data-lab-auto aria-pressed="false">авто</button>
        <button type="button" class="debug__button" data-lab-shot>выстрел</button>
        <select data-lab-stage aria-label="стадия">
            <option value="">стадия…</option>
            <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option>
        </select>
    </aside>
    <footer class="hud">
        <span class="hud__item hud__status" data-status="connected" role="img" aria-label="Связь: есть" title="Связь: есть"></span>
        <span class="hud__item hud__runner" data-hud-runner hidden></span>
        <span class="hud__item hud__scene-name" data-hud-scene-name></span>
        <span class="hud__item hud__drinks" data-hud-drinks role="progressbar" aria-label="Выпито в баре" aria-valuemin="0" hidden><span class="hud__meter" aria-hidden="true"><span class="hud__meter-fill"></span></span><span data-hud-drinks-text></span></span>
        <span class="hud__item hud__drinks hud__goal" data-hud-goal="drinks" role="progressbar" aria-label="Выпито в проклятом мире" aria-valuemin="0" hidden><span class="hud__meter" aria-hidden="true"><span class="hud__meter-fill"></span></span><span data-hud-goal-text></span></span>
        <span class="hud__item hud__drinks hud__goal hud__goal--zombies" data-hud-goal="zombies" role="progressbar" aria-label="Упокоено зомби" aria-valuemin="0" hidden><span class="hud__skull" aria-hidden="true"></span><span class="hud__meter" aria-hidden="true"><span class="hud__meter-fill"></span></span><span data-hud-goal-text></span></span>
        <span class="hud__item hud__drinks hud__goal--pumpkins" data-hud-progress role="progressbar" aria-label="Готово тыкв" aria-valuemin="0"><span class="hud__meter" aria-hidden="true"><span class="hud__meter-fill"></span></span><span data-hud-progress-text>Готово</span></span>
        <button type="button" class="hud__item hud__button" data-reveal-open hidden>Числа вечера</button>
        <button type="button" class="hud__item hud__button hud__button--drink" data-drink hidden>Выпить</button>
        <button type="button" class="hud__item hud__button" data-chat-open aria-expanded="false" hidden>Чат</button>
        <button type="button" class="hud__item hud__button" data-join-open>Персонаж</button>
        <button type="button" class="hud__item hud__button" data-sound-toggle aria-pressed="true" hidden>Звук: вкл</button>
    </footer>
</main>
<dialog class="join" data-join aria-labelledby="join-title">
    <form class="join__form" method="dialog">
        <h2 class="join__title" id="join-title">Кто идёт на поле?</h2>
        <div class="join__body">
            <canvas class="join__preview" data-join-preview width="48" height="48" aria-hidden="true"></canvas>
            <div class="join__fields">
                <label class="join__label" for="join-name">Имя</label>
                <input class="join__name" id="join-name" data-join-name name="name" maxlength="24" autocomplete="nickname"
                       autofocus spellcheck="false" aria-describedby="join-error">

<script type="module">
    import { bindBar, bindClinking, bindDice, bindMeep, bindObjectKeys, bindShooting, bindStriking, bindWalking, bindWord, createClient, readSnapshot } from '/js/client.js';
    import { deathOf } from '/js/sound.js';
    import { BAR_LAYOUT, barCounterOf } from '/js/layout.js';
    import { initDebugPanel } from '/js/debug.js';
    import { bindChat } from '/js/chat.js';
    import { initJoin, storedLook } from '/js/join.js';
    import { LINES, createOwl } from '/js/owl.js';

    const params = new URLSearchParams(location.search);
    const root = document.getElementById('app');
    // ?w=390: headless windows have a minimum width, so narrow layouts are checked in a narrowed #app.

        }
    }

        [47.8, 51.2, 'm'], [55.7, 55, 's'], [66.2, 48.3, 's'], [62.8, 56, 's'], [71.2, 58.4, 'm'], [64.7, 63.7, 's'],
        [71, 72.8, 'l'], [59.6, 71.1, 'm'], [60.7, 80.8, 'm'], [50.4, 82.7, 'l'], [40, 83.7, 'm'], [43.6, 74.1, 'm'],
        [29.3, 78.5, 'l'], [35.4, 69.6, 's'], [27.7, 60.2, 'm'], [40.6, 64, 's'], [35.8, 51.5, 's'], [45.2, 58.4, 's'],
    ];
    // The pumpkins reachable for a clink by click (the `reachable` defaults of app/config/hellowin.php).
    const REACHABLE = new Set([3, 5, 7, 9, 10, 11, 13, 15, 17]);
    const startStage = Math.max(0, Math.min(11, Number.parseInt(params.get('stage') ?? '0', 10) || 0));
    // The bonfire of app/config/hellowin.php: on the root, its own limit and last stage per scene.
    const BONFIRE_STAGE_MAX = [0, 0, 4, 7, 7];
    // The magic circle of the final scene (HELLOWIN_CIRCLE_STAGES).
    const CIRCLE_STAGES = 4;

    // (HELLOWIN_<X>_BASE / _PER_PLAYER). ?bclicks, ?cclicks, ?target and ?goal make one flat: N at k = 1 whoever plays.
    const flat = (name) => (params.has(name) ? [Math.max(1, Number.parseInt(params.get(name), 10) || 1), 0] : null);
    const LIMITS = {
        pumpkin: [2, 5],
        bonfire: flat('bclicks') ?? [8, 20],
        circle: flat('cclicks') ?? [15, 40],
        bar: flat('target') ?? [5, 1.5],
        drinks: flat('goal') ?? [5, 4],
        zombies: flat('goal') ?? [5, 4],
        boss: [45, 60],
    };
    // HELLOWIN_FLYER_BURST_BASE, _PER_PLAYER: the moderator's wave of flyers, without k, no cooldown or ceiling.
    const BURST = { base: 5, perPlayer: 0.2 };
    // The figures on the floor have to hold this long before the limits follow them (the server's debounce).
    const PLAYERS_HOLD_MS = 3000;

    ELEMENTS.forEach(([x, y, size], i) => {

    });
    {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'bonfire';
        b.dataset.element = 'bonfire';
        b.dataset.type = 'bonfire';
        b.dataset.stage = '0';
        b.dataset.clicks = '0';
        b.dataset.threshold = String(LIMITS.bonfire[0]);
        b.dataset.stageMax = '0';
        b.style.setProperty('--x', '50');
        b.style.setProperty('--y', '63');
        b.style.zIndex = '630';
        b.setAttribute('aria-label', 'Костёр');

    }
    if (params.get('nocircle') !== '1') {

        b.className = 'circle';
        b.dataset.element = 'circle';
        b.dataset.type = 'circle';
        b.dataset.stage = '0';
        b.dataset.clicks = '0';
        b.dataset.threshold = String(LIMITS.circle[0]);
        b.dataset.stageMax = '0';
        b.style.setProperty('--x', '50');
        b.style.setProperty('--y', '63');
        b.style.zIndex = '630';

    }
    // The thresholds themselves come from the engine's limits at the start (startState).
    root.dataset.k = String(Math.min(10, Math.max(0.1, Number.parseFloat(params.get('k') ?? '1') || 1)));
    if (params.has('hits')) root.classList.add('show-hits');

    // With ?freeze the lab runs on its own clock: headless screenshots get no animation frames, so time is stepped
    // by hand and every timer below goes through this queue.
    const freeze = Number.parseInt(params.get('freeze') ?? '', 10);
    const simulated = freeze > 0;
    let simTime = 0;
    const queue = [];
    function later(fn, ms) {
        if (!simulated) return setTimeout(fn, ms);
        queue.push({ at: simTime + ms, fn });
    }

    // Server time of the fake engine; the frozen clock runs from a fixed epoch. ?skew=ms shifts the client's own
    // clock, which the snapshot's `now` has to compensate.
    // ?epoch=ms moves the frozen clock's start (a multiple of 6000 keeps the clink slots in place: ?epoch=336000 reaches a
    // two-voice toast without stepping through minutes).
    const EPOCH = 1_700_000_000_000 + (Number.parseInt(params.get('epoch') ?? '0', 10) || 0);
    const serverTime = () => (simulated ? EPOCH + simTime : Date.now());
    const skew = Number.parseInt(params.get('skew') ?? '0', 10) || 0;
    const clientTime = () => serverTime() + skew;
    root.dataset.now = String(serverTime());
    // RoadRunner has been up a while when the lab starts: the finale's uptime (protocol.md, `startedAt`).
    const UPTIME = (3 * 60 + 7) * 60000 + 20000;
    root.dataset.startedAt = String(serverTime() - UPTIME);

    // Walking of players.md («На поле»): the zone of app/config/hellowin.php (`walk`), the lawn rectangle minus the
    // patch ellipse, and HELLOWIN_WALK_SPEED in percents per second along the path.
    const WALK = { area: { x1: 3, y1: 44, x2: 97, y2: 97 }, patch: { cx: 50, cy: 63, rx: 31, ry: 25 } };
    const WALK_SPEED = 12;
    const ME = 'lab-me-0000000001';
    const round1 = (p) => ({ x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 });
    const ellipse = (p) => Math.hypot((p.x - WALK.patch.cx) / WALK.patch.rx, (p.y - WALK.patch.cy) / WALK.patch.ry);
    const angleOf = (p) => Math.atan2((p.y - WALK.patch.cy) / WALK.patch.ry, (p.x - WALK.patch.cx) / WALK.patch.rx);
    const rim = (a, k) => ({ x: WALK.patch.cx + Math.cos(a) * WALK.patch.rx * k, y: WALK.patch.cy + Math.sin(a) * WALK.patch.ry * k });
    const lengthOf = (path) => path.slice(1).reduce((sum, p, i) => sum + Math.hypot(p.x - path[i].x, p.y - path[i].y), 0);

    function walkPoint(walk, now) {
        const path = walk.path;
        const total = lengthOf(path);
        const span = walk.arrivesAt - walk.startedAt;
        let left = (total > 0 && span > 0 ? Math.min(1, Math.max(0, (now - walk.startedAt) / span)) : 1) * total;
        for (let i = 1; i < path.length; i++) {
            const d = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
            if (left <= d) {
                const k = d > 0 ? left / d : 1;
                return { x: path[i - 1].x + (path[i].x - path[i - 1].x) * k, y: path[i - 1].y + (path[i].y - path[i - 1].y) * k };
            }
            left -= d;
        }
        return path[path.length - 1];
    }

    // Outside the rectangle — to its edge; inside the patch — out to the rim, sideways where the rim is off the lawn.
    function clampToZone(p) {
        const { x1, y1, x2, y2 } = WALK.area;
        let q = { x: Math.min(x2, Math.max(x1, p.x)), y: Math.min(y2, Math.max(y1, p.y)) };
        const r = ellipse(q);
        if (r < 1.02) {
            q = r > 0 ? rim(angleOf(q), 1.02) : rim(Math.PI / 2, 1.02);
            if (q.y < y1) {
                const half = WALK.patch.rx * 1.02 * Math.sqrt(Math.max(0, 1 - ((y1 - WALK.patch.cy) / (WALK.patch.ry * 1.02)) ** 2));
                q = { x: q.x < WALK.patch.cx ? WALK.patch.cx - half : WALK.patch.cx + half, y: y1 };
            }
        }
        return round1(q);
    }

    // A straight line when it misses the patch, else along the rim on the shorter side that stays on the lawn (the
    // far rim is beyond the lawn's top edge, so in practice around the near side).
    function route(from, to) {
        const blocked = Array.from({ length: 31 }, (_, i) => i / 30)
            .some((t) => ellipse({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t }) < 1);
        if (!blocked) return [from, to];
        const a0 = angleOf(from);
        const a1 = angleOf(to);
        const turn = 2 * Math.PI;
        const arcs = [1, -1].map((sign) => {
            const delta = sign > 0 ? (((a1 - a0) % turn) + turn) % turn : -((((a0 - a1) % turn) + turn) % turn);
            const steps = Math.max(1, Math.ceil(Math.abs(delta) / (Math.PI / 12)));
            const points = Array.from({ length: steps + 1 }, (_, i) => round1(rim(a0 + (delta * i) / steps, 1.06)));
            return [from, ...points, to];
        });
        const onLawn = (path) => path.every((p) => p.y >= WALK.area.y1 - 0.01 && p.x >= WALK.area.x1 && p.x <= WALK.area.x2);
        const valid = arcs.filter(onLawn);
        return (valid.length ? valid : arcs).sort((a, b) => lengthOf(a) - lengthOf(b))[0];
    }

    // The bar's floor (`walk.bar`, protocol.md «Бар»): the area minus the counter and the tables. The fake router walks
    // straight when the line is clear, else through one or two corners of the obstacles' boxes — enough for a lab.
    const BAR = JSON.parse(root.dataset.barLayout || 'null') ?? BAR_LAYOUT;
    root.dataset.barLayout = JSON.stringify(BAR);
    const BAR_COUNTER = barCounterOf(BAR);
    const BAR_MARGIN = 1.5;
    const insideObstacle = (p, o, m = 0) => (Number.isFinite(o.cx)
        ? Math.hypot((p.x - o.cx) / (o.rx + m), (p.y - o.cy) / (o.ry + m)) < 1
        : p.x > o.x1 - m && p.x < o.x2 + m && p.y > o.y1 - m && p.y < o.y2 + m);
    const barBlocked = (p) => BAR.obstacles.some((o) => insideObstacle(p, o));
    function clampToBar(p) {
        const { x1, y1, x2, y2 } = BAR.area;
        let q = { x: Math.min(x2, Math.max(x1, p.x)), y: Math.min(y2, Math.max(y1, p.y)) };
        for (const o of BAR.obstacles) {
            if (!insideObstacle(q, o, BAR_MARGIN)) continue;
            if (Number.isFinite(o.cx)) {
                const a = Math.atan2((q.y - o.cy) / o.ry, (q.x - o.cx) / o.rx) || Math.PI / 2;
                q = { x: o.cx + Math.cos(a) * (o.rx + BAR_MARGIN), y: o.cy + Math.sin(a) * (o.ry + BAR_MARGIN) };
            } else {
                const out = [[q.x - (o.x1 - BAR_MARGIN), { x: o.x1 - BAR_MARGIN, y: q.y }], [o.x2 + BAR_MARGIN - q.x, { x: o.x2 + BAR_MARGIN, y: q.y }], [o.y2 + BAR_MARGIN - q.y, { x: q.x, y: o.y2 + BAR_MARGIN }]];
                q = out.sort((a, b) => a[0] - b[0])[0][1];
            }
            q = { x: Math.min(x2, Math.max(x1, q.x)), y: Math.min(y2, Math.max(y1, q.y)) };
        }
        return round1(q);
    }
    const barClear = (a, b) => Array.from({ length: 41 }, (_, i) => i / 40).every((t) => !barBlocked({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }));
    function barRoute(from, to) {
        if (barClear(from, to)) return [from, to];
        const corners = BAR.obstacles.flatMap((o) => {
            const [ax, ay, bx, by] = Number.isFinite(o.cx) ? [o.cx - o.rx, o.cy - o.ry, o.cx + o.rx, o.cy + o.ry] : [o.x1, o.y1, o.x2, o.y2];
            const m = BAR_MARGIN + 0.5;
            return [{ x: ax - m, y: ay - m }, { x: bx + m, y: ay - m }, { x: ax - m, y: by + m }, { x: bx + m, y: by + m }].map(clampToBar);
        });
        let best = null;
        const consider = (path) => {
            if (path.slice(1).every((p, i) => barClear(path[i], p)) && (!best || lengthOf(path) < lengthOf(best))) best = path;
        };
        corners.forEach((c) => consider([from, c, to]));
        if (!best) corners.forEach((c) => corners.forEach((d) => c !== d && consider([from, c, d, to])));
        return best ?? [from, to];
    }

    // Seeded randomness for the bots' looks, so a reload shows the same crowd.
    const seeded = (seed) => () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const BOT_NAMES = ['Jack', 'Тыквоед', 'Ведьма Ира', 'Graf_Drak', 'Мумия', 'Bones', 'Кот-Баюн', 'Zed.13'];
    const botCount = Math.max(0, Math.min(BOT_NAMES.length, Number.parseInt(params.get('walkers') ?? (simulated ? '0' : '3'), 10) || 0));
    const standing = (p, at) => ({ path: [p], startedAt: at, arrivesAt: at });
    // A newcomer's walk in the bar, as WalkService sends it: from the door's threshold `door_in` down onto the floor.
    function doorWalk(at) {
        const path = [BAR.door, clampToBar({ x: BAR.door.x, y: BAR.door.y + (BAR.door_in ?? 6) })];
        return { path, startedAt: at, arrivesAt: at + Math.round((lengthOf(path) / WALK_SPEED) * 1000) };
    }
    // In the finale the bots start around the patch, as a room gathered for the ritual would.
    const finaleStart = params.has('finale') || params.get('ritual') === '1';
    // The lab starts in the bar unless the query names another scene (or a stage past the bar's).
    const barStart = !finaleStart && (Number.parseInt(params.get('scene') ?? '0', 10) || 0) === 0 && startStage === 0;
    // Where the walk zone of the current scene is: the bar's floor or the lawn.
    let inBarZone = barStart;
    const zoneClamp = (p) => (inBarZone ? clampToBar(p) : clampToZone(p));
    const spawnPoint = (random = Math.random) => (inBarZone
        ? clampToBar({ x: 8 + random() * 84, y: BAR.spawn.y1 + random() * (BAR.spawn.y2 - BAR.spawn.y1) })
        : clampToZone({ x: 8 + random() * 84, y: 91 + random() * 5 }));
    // ?bar=1: the bots start in the bar with beer, in pairs by the tables, and stay there — the planner clinks them.
    const barPairs = barStart && params.get('bar') === '1';
    const BAR_SPOTS = [{ x: 14, y: 70 }, { x: 19, y: 71 }, { x: 33, y: 89 }, { x: 38, y: 90 }, { x: 66, y: 85 }, { x: 71, y: 86 }, { x: 52, y: 64 }, { x: 57, y: 65 }];
    // ?bardemo=1: a scripted evening at the counter — two mugs, three bots go for them, the farthest one shrugs; the
    // first two clink by click and drink; the latecomer takes the next poured mug.
    const barDemo = barStart && params.get('bardemo') === '1';
    // ?roadrunner=1: the bar as the dawn's «В бар» opens it — RoadRunner behind the counter; ?rrclink=1 — and the first
    // bot, beer in hand, walks up and clinks with him at the start.
    const rrClinkStart = barStart && params.get('rrclink') === '1';
    const rrStart = barStart && (params.get('roadrunner') === '1' || rrClinkStart);
    const DEMO_SPOTS = [{ x: 50, y: 70 }, { x: 58, y: 74 }, { x: 10, y: 94 }, { x: 30, y: 60 }, { x: 86, y: 92 }];
    const gatherPoint = (i, n) => clampToZone(rim(Math.PI * (0.08 + (0.84 * i) / Math.max(1, n - 1)), 1.12));
    // ?clink=1: the bots stand in little groups of 2, 3, 2, 1… a few steps apart, off the patch, and do not wander — in
    // the cursed world (?finale=5) the beer glasses clink.
    const clinkStart = params.get('clink') === '1';
    const CLINK_GROUPS = [{ x: 22, y: 93, n: 2 }, { x: 70, y: 94, n: 3 }, { x: 9, y: 66, n: 2 }, { x: 91, y: 64, n: 1 }, { x: 46, y: 95, n: 2 }];
    // ?clickclink=1: the bots stand apart, off the patch, and do not wander; in the cursed world they walk up and clink.
    const clickClinkStart = params.get('clickclink') === '1';
    const CLICK_SPOTS = [{ x: 14, y: 93 }, { x: 30, y: 92 }, { x: 66, y: 95 }, { x: 78, y: 93 }, { x: 92, y: 80 }];
    function clinkPoint(i) {
        if (clickClinkStart) return CLICK_SPOTS[i] ? clampToZone(CLICK_SPOTS[i]) : spawnPoint();
        let k = i;
        for (const g of CLINK_GROUPS) {
            if (k < g.n) return clampToZone({ x: g.x + (k - (g.n - 1) / 2) * 5.5, y: g.y - (k % 2) * 1.5 });
            k -= g.n;
        }
        return spawnPoint();
    }
    // ?bodies=gopher,priest,…: the bots' bodies in order, bare-headed and without a cloak, face and eyes still random.
    const botBodies = params.get('bodies')?.split(',') ?? [];
    const startWalkers = [];
    for (let i = 0; i < botCount; i++) {
        const random = seeded(1000 + i);
        startWalkers.push({
            id: `lab-bot-${String(i).padStart(9, '0')}`,
            name: BOT_NAMES[i],
            look: botBodies[i] ? { ...randomLook(random), body: botBodies[i], cloak: 'none', hat: 'none' } : randomLook(random),
            item: barStart ? (barPairs || (rrClinkStart && i === 0) ? 'beer' : null) : i % 3 === 1 && ITEMS.length ? ITEMS[i % ITEMS.length].id : null,
            walk: standing(barPairs ? clampToBar(BAR_SPOTS[i] ?? spawnPoint(random)) : barDemo ? clampToBar(DEMO_SPOTS[i] ?? spawnPoint(random))
                : barStart ? spawnPoint(random)
                : clinkStart || clickClinkStart ? clinkPoint(i) : finaleStart ? gatherPoint(i, botCount) : spawnPoint(random), serverTime()),
        });
    }
    const walkStop = params.get('walkstop');
    if (params.get('me') === '1' || walkStop) {
        const walk = barStart && BAR.door ? doorWalk(serverTime()) : standing(zoneClamp({ x: 50, y: 93 }), serverTime());
        startWalkers.push({ id: ME, name: 'Я', look: storedLook() ?? randomLook(seeded(7)), item: null, walk });
    }
    root.dataset.walkers = JSON.stringify(startWalkers);

    // Fake engine: the server side of protocol.md, with queue latency before a stage transition.
    const engine = readSnapshot(root);
    // HELLOWIN_BAR_MUGS and HELLOWIN_BAR_POUR_MS: ?mugs=N full mugs at the start, ?pour=ms per mug.
    const BAR_MUGS = 5;
    // The scripted demo pours slowly, so its latecomer finds the counter empty.
    const POUR_MS = Math.max(200, Number.parseInt(params.get('pour') ?? (barDemo ? '8000' : '2500'), 10) || 2500);
    const startMugs = Math.max(0, Math.min(BAR_MUGS, Number.parseInt(params.get('mugs') ?? (barDemo ? '2' : String(BAR_MUGS)), 10)));
    // HELLOWIN_BAR_RUMOR_CHANCE: about every third pour carries a rumour. The hall's goal is the limit `bar` (startState).
    const RUMOR_CHANCE = 1 / 3;
    const startDrunk = Math.max(0, Number.parseInt(params.get('drunk') ?? '0', 10) || 0);
    engine.bar = { mugs: barStart ? startMugs : 0, pouring: null, drunk: startDrunk, target: 1, roadrunner: rrStart };
    // HELLOWIN_SCENE_STAGE_MAX=0,4,8,11 (the bar first); the final scene keeps the last value.
    const SCENE_STAGE_MAX = [0, 4, 8, 11, 11];
    // Stand-in for the `items` of app/config/hellowin.php (what the walkers hold in each scene); an id without art
    // yet shows an empty hand.
    // ?item=<id> makes every scene hand out that item (a candle at night, say).
    const ITEM_BY_SCENE = params.has('item') ? [null, ...Array(4).fill(params.get('item'))] : [null, 'pistol', 'candle', 'book', 'red-flame'];
    // And of `finale_items`: the final scene's item at step 0, empty hands on steps 1–4, beer at step 5, nothing at step 6
    // (undefined: everyone keeps their own), the rapier at the dawn.
    const itemOfFinale = (step) => (params.has('item') ? params.get('item') : step === 0 ? ITEM_BY_SCENE[4] : step === 5 ? 'beer' : step === 6 ? undefined : step >= 7 ? 'rapier' : null);
    const CURSED_STEP = 5;
    const BOSS_STEP = 6;
    const LAST_STEP = 7;
    // The moderator's additions on top of the formula, which live until a reset (protocol.md, «Лимиты и баланс»).
    const limitBonus = { bar: 0, drinks: 0, zombies: 0, boss: 0 };
    // n of the formula: the figures on the floor once they have held (limitsTick), or ?players=N for good.
    const playersParam = params.has('players') ? Math.max(1, Number.parseInt(params.get('players'), 10) || 1) : null;
    const fieldCount = () => playersParam ?? Math.max(1, engine.walkers.length);
    let limitPlayers = 1;
    const moderator = params.get('mod') === '1';
    // The evening's numbers for the reveal, counted like the engine's (protocol.md, «Снимок»).
    const stats = { clicks: 0, jobs: 0, burned: 0, shot: 0, drinks: 0, slain: 0, damage: 0, rolls: 0, lastPumpkin: null };
    const pending = new Set();
    // A random 20–60 ms of latency, but in order: the channel never reorders publications.
    let deliveredBy = 0;
    const deliver = (event) => {
        const now = simulated ? simTime : performance.now();
        deliveredBy = Math.max(deliveredBy + 1, now + 20 + Math.random() * 40);
        later(() => client.apply({ round: engine.round, ...event }), deliveredBy - now);
    };
    const engineSnapshot = () => ({ ...structuredClone({ ...engine, walkers: engine.walkers.map(publicWalker) }), dawn: undefined, [topOld ? 'dawn' : 'top']: structuredClone(engine.dawn), online: engine.walkers.length, presence: { players: engine.walkers.length, connections: engine.walkers.length + 1 }, now: serverTime(), flyers: structuredClone(wandering().map(([, f]) => f.event)), dice: engine.dice && { ...engine.dice, owl: diceState.owl } });
    const playerOf = (w) => (w ? { id: w.id, name: w.name } : null);
    // Who "clicked" in the lab: your character if it is on the field, else the first bot, else nobody.
    const someone = () => playerOf(engine.walkers.find((w) => w.id === ME) ?? engine.walkers[0]);

    const engineBonfire = () => engine.elements.find((e) => e.type === 'bonfire');
    const engineCircle = () => engine.elements.find((e) => e.type === 'circle') ?? null;
    const enginePumpkins = () => engine.elements.filter((e) => e.type === 'pumpkin');
    const pumpkinsDone = () => enginePumpkins().every((e) => e.stage >= engine.stageMax);
    // The scene needs its bonfire when the bonfire's last stage of the scene is above where it stands now.
    let bonfireNeeded = false;

    // The scene is ready, not switched: the moderator moves on («Следующая сцена»).
    function sceneReady(player, line) {
        engine.ready = true;
        stats.lastPumpkin = player;
        deliver({ type: 'ready', scene: engine.scene });
        if (player) deliver({ type: 'owl', line, params: { player } });
        deliver({ type: 'owl', line: 'scene-ready' });
    }

    // Who a random or automatic click comes from: a random bot, or nobody for the ?anon share of clicks.
    const anonShare = params.has('anon') ? Number(params.get('anon')) : 0.25;
    const randomClicker = () => {
        const bots = wanderers();
        return !bots.length || Math.random() < anonShare ? null : playerOf(bots[Math.floor(Math.random() * bots.length)]);
    };
    const myClicker = () => playerOf(engine.walkers.find((w) => w.id === ME) ?? null);

    function engineClick(id, by = null) {
        const p = engine.elements.find((e) => e.id === id);
        const isBonfire = p.type === 'bonfire';
        const isCircle = p.type === 'circle';
        const own = isBonfire || isCircle;
        // A locked bonfire or circle: not counted, not broadcast (protocol.md, `locked`).
        if (isBonfire && !(engine.scene < engine.sceneStages && pumpkinsDone() && p.stage < p.stageMax)) return { ok: false, error: 'locked' };
        if (isCircle && !(engine.scene >= engine.sceneStages && (engine.finale?.step ?? 0) === 0 && p.stage < p.stageMax)) return { ok: false, error: 'locked' };
        const threshold = own ? p.threshold : engine.threshold;
        const max = own ? p.stageMax : engine.stageMax;
        // Pumpkins and the bonfire stop in the final scene; the circle is drawn only there.
        const moving = isCircle || engine.scene < engine.sceneStages;
        stats.clicks++;
        // On the pause of the progress the click goes through uncounted: the element keeps its clicks and stage.
        const uncounted = engine.paused ? { counted: false } : {};
        if (!engine.paused) {
            if (moving && p.stage < max && p.clicks < threshold) p.clicks++;
            else stats.burned++;
        }
        deliver({ type: 'click', element: id, emoji: isBonfire ? '🔥' : isCircle ? '⭕' : '🎃', clicks: p.clicks, threshold, stage: p.stage, ...(by ? { player: by } : {}), ...uncounted });
        stageUp(p, by);
        return { ok: true, ...uncounted };
    }

    // The element's next stage once its clicks reach the threshold — after a click, or when the limit drops below them.
    function stageUp(p, by = null) {
        // The pause of the progress holds the stages; its end catches up (enginePause).
        if (engine.paused) return;
        const id = p.id;
        const isBonfire = p.type === 'bonfire';
        const isCircle = p.type === 'circle';
        const own = isBonfire || isCircle;
        const threshold = own ? p.threshold : engine.threshold;
        const max = own ? p.stageMax : engine.stageMax;
        if (p.clicks >= threshold && p.stage < max && !pending.has(id)) {
            pending.add(id);
            const player = by ?? someone();
            later(() => {
                pending.delete(id);
                p.stage++;
                p.clicks = 0;
                stats.jobs++;
                deliver({ type: 'pumpkin', element: id, stage: p.stage, ...(player ? { player } : {}) });
                if (isCircle) {
                    if (!engine.ready && p.stage >= p.stageMax) sceneReady(player, 'circle-done');
                    return;
                }
                if (engine.ready || engine.scene >= engine.sceneStages || !pumpkinsDone()) return;
                if (isBonfire) {
                    if (p.stage >= p.stageMax) sceneReady(player, 'bonfire-done');
                } else if (bonfireNeeded) {
                    // The last pumpkin opens the bonfire instead of finishing the scene.
                    if (player) deliver({ type: 'owl', line: 'last-pumpkin', params: { player } });
                    deliver({ type: 'owl', line: 'bonfire-open' });
                } else {
                    sceneReady(player, 'last-pumpkin');
                }
            }, 150);
        }
    }

    function engineReset({ again = false } = {}) {
        engine.round++;
        // A reset lifts the pause of the progress; the `reset` event says so, no `pause` comes.
        engine.paused = false;
        engine.scene = 0;
        engine.stageMax = SCENE_STAGE_MAX[0];
        engine.ready = false;
        engine.finale = null;
        // The evening's numbers: «В бар» keeps them, only the moderator's reset zeroes them.
        if (!again) Object.assign(stats, { clicks: 0, jobs: 0, burned: 0, shot: 0, drinks: 0, slain: 0, damage: 0, rolls: 0, lastPumpkin: null });
        engine.cursed = null;
        engine.dice = null;
        diceForget();
        engine.boss = null;
        Object.assign(limitBonus, { bar: 0, drinks: 0, zombies: 0, boss: 0 });
        cursedReadySaid = false;
        engine.elements.forEach((e) => { e.stage = 0; e.clicks = 0; });
        engineBonfire().stageMax = BONFIRE_STAGE_MAX[0];
        if (engineCircle()) engineCircle().stageMax = 0;
        bonfireNeeded = false;
        // Back into the bar: everyone put down on its floor with empty hands, the counter full, nothing drunk yet; the
        // goal by the formula, without the moderator's addition.
        engine.ready = false;
        inBarZone = true;
        // RoadRunner comes with the dawn's «В бар» and leaves with the moderator's reset.
        engine.bar = { mugs: BAR_MUGS, pouring: null, drunk: 0, target: limitOf('bar'), roadrunner: again };
        const now = serverTime();
        engine.walkers.forEach((w) => {
            w.item = null;
            w.clinked = false;
            w.taking = null;
            delete w.clink;
            delete w.zombie;
            w.walk = standing(clampToBar(walkPoint(w.walk, now)), now);
        });
        wanderGone();
        deliver({ type: 'reset', item: null, walkers: structuredClone(engine.walkers.map(publicWalker)), bar: structuredClone(engine.bar), ...(again ? { again: true } : {}) });
        if (again) deliver({ type: 'owl', line: 'bar-again' });
        settleLimits();
    }

    // A walker as the protocol shows it: the server's own flags (a pending take, the clinked mug) stay inside.
    const publicWalker = ({ taking, clinked, ...w }) => w;

    const finaleOf = (step) => (step >= 4 ? { step, reveal: structuredClone(stats) } : { step });

    function engineSceneNext({ scene, force }) {
        if (!Number.isInteger(scene) || scene < 0) throw new Error('invalid scene');
        if (scene !== engine.scene) return { ok: true, scene: engine.scene, round: engine.round };
        if (engine.scene >= engine.sceneStages) {
            // At the dawn «В бар» is a new round of the evening: the same as a reset, told apart by `again`.
            if ((engine.finale?.step ?? 0) < LAST_STEP) throw new Error('final scene');
            engineReset({ again: true });
            return { ok: true, scene: 0, round: engine.round };
        }
        if (!engine.ready && force !== true) throw new Error('not ready');
        if (!engine.ready) stats.lastPumpkin = null;
        const to = engine.scene + 1;
        later(() => {
            stats.jobs++;
            const fromBar = engine.scene === 0;
            engine.scene = to;
            engine.stageMax = SCENE_STAGE_MAX[to];
            engine.ready = false;
            setBonfireMax();
            engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[to]; });
            // Out of the bar: mugs burn, pending takes and clinks are dropped, everyone stands on the lawn at once.
            let walkers;
            if (fromBar) {
                inBarZone = false;
                engine.bar = { ...engine.bar, mugs: 0, pouring: null };
                const now = serverTime();
                engine.walkers.forEach((w) => {
                    w.taking = null;
                    w.clinked = false;
                    delete w.clink;
                    w.walk = standing(clampToZone(walkPoint(w.walk, now)), now);
                });
                walkers = structuredClone(engine.walkers.map(publicWalker));
            }
            deliver({ type: 'scene', scene: to, stageMax: engine.stageMax, bonfireStageMax: engineBonfire().stageMax, circleStageMax: engineCircle()?.stageMax ?? 0, item: ITEM_BY_SCENE[to], ...(walkers ? { walkers } : {}) });
            if (to >= engine.sceneStages) {
                engine.finale = finaleOf(0);
                deliver({ type: 'finale', ...engine.finale, item: itemOfFinale(0) });
            }
            deliver({ type: 'owl', line: `scene-${to}` });
            settleLimits();
        }, 150);
        return { ok: true, scene: to };
    }

    function engineFinaleStep({ step, force }) {
        if (!Number.isInteger(step)) throw new Error('invalid step');
        if (engine.scene < engine.sceneStages || !engine.finale) throw new Error('not final');
        if (step === engine.finale.step + 1 && step <= LAST_STEP) {
            // Step 1 waits for the closed circle, step 6 for the cursed world's goals, step 7 for the boss to fall —
            // unless forced.
            if ((step === 1 || step === 2 || step === BOSS_STEP) && !engine.ready && force !== true) throw new Error('not ready');
            if (step === LAST_STEP && !(engine.boss?.hp === 0) && force !== true) throw new Error('not ready');
            engine.finale = finaleOf(step);
            // Step 1 waits for the first 6-6-6; a forced step 2 turns the dice off without a winner.
            if (step === 1) engine.ready = false;
            const diceOff = step === 2 && engine.dice?.on === true;
            if (diceOff) engine.dice = { on: false };
            if (step === CURSED_STEP) {
                engine.ready = false;
                engine.cursed = { drunk: 0, slain: 0, ...cursedTargets() };
            }
            // The dawn: every zombie lifted, FrankenPHP down whether he fell or was forced.
            if (step === LAST_STEP) {
                engine.walkers.forEach((w) => delete w.zombie);
                if (engine.boss) engine.boss.hp = 0;
            }
            const item = itemOfFinale(step);
            if (item !== undefined) engine.walkers.forEach((w) => { w.item = item; w.clinked = false; });
            // Like the server: the dice go off before the step's event.
            if (diceOff) deliver({ type: 'dice', on: false });
            deliver({ type: 'finale', ...structuredClone(engine.finale), ...(item !== undefined ? { item } : {}) });
            if (step === CURSED_STEP) {
                deliver({ type: 'cursed', ...engine.cursed });
                wanderTopUp();
            }
            if (step === LAST_STEP) wanderGone();
            // Step 2 scatters the walkers: each one outward from the patch to the edge of the lawn.
            if (step === 2) engine.walkers.forEach((w) => engineMove(w.id, scatterTarget(walkPoint(w.walk, serverTime()))));
            deliver({ type: 'owl', line: `finale-${step}` });
            if (step === 1) diceBegin();
            settleLimits();
        }
        return { ok: true, step: engine.finale.step };
    }

    // Straight out from the patch centre through the walker, to the edge of the walk zone.
    function scatterTarget(p) {
        const a = Math.atan2(p.y - WALK.patch.cy, p.x - WALK.patch.cx);
        const { x1, y1, x2, y2 } = WALK.area;
        let k = 0;
        while (k < 200) {
            const q = { x: p.x + Math.cos(a) * (k + 1), y: p.y + Math.sin(a) * (k + 1) };
            if (q.x < x1 || q.x > x2 || q.y < y1 || q.y > y2) break;
            k++;
        }
        return { x: p.x + Math.cos(a) * k, y: p.y + Math.sin(a) * k };
    }

    function engineOwl({ line, params: lineParams, text }) {
        if (text !== undefined) {
            if (typeof text !== 'string' || text.trim().length < 1 || text.trim().length > 200) throw new Error('invalid text');
            deliver({ type: 'owl', text: text.trim() });
            return { ok: true };
        }
        if (typeof line !== 'string' || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(line) || line.length > 32) throw new Error('invalid line');
        if (lineParams !== undefined && (typeof lineParams !== 'object' || lineParams === null || Array.isArray(lineParams))) throw new Error('invalid params');
        deliver({ type: 'owl', line, ...(lineParams && Object.keys(lineParams).length ? { params: lineParams } : {}) });
        return { ok: true };
    }

    function enginePause({ on }) {
        if (typeof on !== 'boolean') throw new Error('invalid on');
        if (engine.paused !== on) {
            engine.paused = on;
            deliver({ type: 'pause', on });
            if (!on) catchUp();
        }
        return { ok: true, on };
    }

    // The end of the pause of the progress: what the clicks and mugs reached meanwhile comes now, like a lowered limit —
    // the stages, the bar's goal, the cursed world's goals.
    function catchUp() {
        if (engine.scene === 0 && engine.bar.drunk >= engine.bar.target) barReady();
        cursedUpdate();
        if (!engine.ready) engine.elements.forEach((p) => stageUp(p));
    }

    // Like the server: `limits` only when k changes something.
    function engineThresholds({ k }) {
        if (typeof k !== 'number' || !(k >= 0.1 && k <= 10)) throw new Error('invalid k');
        engine.k = k;
        const { players, limits } = settleLimits();
        return { ok: true, k, players, limits };
    }

    // The limits of protocol.md, «Лимиты и баланс»: the formula of [BASE, PER_PLAYER], k and n, then the addition.
    const formula = (key) => {
        const [base, perPlayer] = LIMITS[key];
        // A hair under: k × (BASE + …) like 1.1 × 10 must not round up past 11.
        return Math.max(1, Math.ceil((engine.k ?? 1) * (base + perPlayer * (limitPlayers - 1)) - 1e-9));
    };
    const limitOf = (key) => Math.max(1, formula(key) + (limitBonus[key] ?? 0));
    // The current context: the bar's goal in the bar, the pumpkins in scenes 1–3 and the bonfire where it has stages, the
    // circle at finale step 0, the cursed world's goals at step 5, FrankenPHP's health at step 6 until he falls.
    function limitKeys() {
        if (engine.scene === 0) return ['bar'];
        if (engine.scene < engine.sceneStages) return engineBonfire().stageMax > 0 ? ['pumpkin', 'bonfire'] : ['pumpkin'];
        const step = engine.finale?.step ?? 0;
        if (step === 0) return ['circle'];
        if (step === CURSED_STEP) return ['drinks', 'zombies'];
        if (step === BOSS_STEP && engine.boss?.hp !== 0) return ['boss'];
        return [];
    }
    const limitsState = () => ({ players: limitPlayers, k: engine.k ?? 1, burst: kindsNow().length > 0, limits: Object.fromEntries(limitKeys().map((key) => [key, limitOf(key)])) });

    // Puts the limits into the engine — thresholds, the bar's goal, the cursed world's targets, the boss's health — with
    // their own events and the catch-up of progress a lowered limit leaves behind; `limits` when the told ones changed.
    // `silent` — the start of the lab: the snapshot carries it all.
    let toldLimits = null;
    function settleLimits({ silent = false } = {}) {
        engine.threshold = limitOf('pumpkin');
        engineBonfire().threshold = limitOf('bonfire');
        if (engineCircle()) engineCircle().threshold = limitOf('circle');
        const target = limitOf('bar');
        if (target !== engine.bar.target) {
            engine.bar.target = target;
            if (!silent && engine.scene === 0) {
                drinksEvent();
                if (engine.bar.drunk >= engine.bar.target && !engine.paused) barReady();
            }
        }
        if (engine.cursed) {
            const targets = cursedTargets();
            if (targets.drinksTarget !== engine.cursed.drinksTarget || targets.zombiesTarget !== engine.cursed.zombiesTarget) {
                if (silent) Object.assign(engine.cursed, targets);
                else cursedUpdate();
            }
        }
        const boss = engine.boss;
        if (boss && boss.hp > 0) {
            // The damage stays: hp = max(1, max − damage).
            const max = limitOf('boss');
            const hp = Math.max(1, max - (boss.max - boss.hp));
            if (max !== boss.max || hp !== boss.hp) {
                engine.boss = { hp, max };
                if (!silent) deliver({ type: 'boss', ...engine.boss });
            }
        }
        const state = limitsState();
        engine.limits = state;
        const told = JSON.stringify(state);
        if (told !== toldLimits) {
            toldLimits = told;
            if (!silent) deliver({ type: 'limits', ...structuredClone(state) });
        }
        if (!silent && !engine.ready) engine.elements.forEach((p) => stageUp(p));
        return state;
    }

    // n follows the figures on the floor once their number has held PLAYERS_HOLD_MS, checked every second.
    let pendingPlayers = null;
    function limitsTick() {
        const n = fieldCount();
        if (n === limitPlayers) pendingPlayers = null;
        else if (pendingPlayers?.n !== n) pendingPlayers = { n, since: serverTime() };
        else if (serverTime() - pendingPlayers.since >= PLAYERS_HOLD_MS) {
            limitPlayers = n;
            pendingPlayers = null;
            settleLimits();
        }
        later(limitsTick, 1000);
    }

    // `flyers.burst`: a wave of the current set at once, without the rare one; no cooldown, no ceiling, the pause does
    // not hold it.
    function engineBurst() {
        if (!kindsNow().length) throw new Error('no flyers');
        const count = Math.ceil(BURST.base + BURST.perPlayer * (fieldCount() - 1) - 1e-9);
        for (let i = 0; i < count; i++) engineFlyer({ kind: pick(kindsNow()) });
        return { ok: true, count };
    }

    // Console RPCs (protocol.md, «Модератор»): `forbidden` before anything else for a non-moderator.
    async function engineCall(method, data) {
        if (!moderator) throw new Error('forbidden');
        switch (method) {
            case 'scene.next': return engineSceneNext(data);
            case 'finale.step': return engineFinaleStep(data);
            case 'owl.say': return engineOwl(data);
            case 'flyer.special':
                if (data.kind !== 'witch' && data.kind !== 'roadrunner') throw new Error('unknown kind');
                return { ok: true, flyer: engineFlyer({ kind: data.kind }) };
            case 'pause': return enginePause(data);
            case 'flyers.burst': return engineBurst();
            case 'thresholds': return engineThresholds(data);
            case 'bar.target': return engineBarTarget(data);
            case 'bar.ready': return engineBarReady();
            case 'cursed.target': return engineCursedTarget(data);
            case 'boss.hp': return engineBossHp(data);
            case 'dice.owl': return engineDiceOwl();
            case 'chat.history': return { ok: true, messages: structuredClone(chatLog), muted: [...chatMuted.values()] };
            case 'chat.mute': return engineChatMute(data);
            case 'meep':
                // A flyer that is no id is dropped, like the server's.
                deliver({ type: 'meep', ...(typeof data?.flyer === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(data.flyer) ? { flyer: data.flyer } : {}), at: serverTime() });
                return { ok: true };
            case 'reset':
                if (data.round === engine.round) engineReset();
                return { ok: true, round: engine.round };
            default: throw new Error('unknown method');
        }
    }

    // Flyers as the server launches them: a depth picks duration and points, near ducks may start from a bush and
    // arc through `via`; a shot counts until duration + 500 ms.
    const DURATION = [16000, 6500, 4000];
    const POINTS = [3, 2, 1];
    // HELLOWIN_FLYER_KINDS and HELLOWIN_FLYER_RARE by scene, the rare one at a 1-in-8 chance; the sunset has none.
    const KINDS = [['fly'], ['duck', 'chicken'], [], ['bat'], ['worm']];
    // HELLOWIN_FLYER_KINDS_CURSED: the cursed world (finale step 5) flies its own set.
    const CURSED_KINDS = ['worm', 'bat', 'firefly'];
    // HELLOWIN_FLYER_KINDS_DAWN: the dawn's ducks and chickens, launched more often (HELLOWIN_FLYER_INTERVAL_DAWN).
    const DAWN_KINDS = ['duck', 'chicken'];
    const FIREFLY_POINTS = 1;
    const RARE = [null, 'roadrunner', null, null, null];
    const RARE_POINTS = 5;
    const HORIZON = 38;
    const ZOMBIE = { duration: 14000, points: 2 };
    const live = new Map();
    let flyerSeq = 0;
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    const nextId = () => `f-${(++flyerSeq).toString(16).padStart(8, '0')}`;

    function launchFlyer(id, kind, depth, duration, points, path) {
        const launchedAt = serverTime();
        const expiresAt = launchedAt + duration;
        live.set(id, { until: expiresAt + 500, points, kind, shot: false });
        deliver({ type: 'flyer', flyer: id, kind, depth, duration, points, launchedAt, expiresAt, ...path });
        return id;
    }

    // Runs along the horizon at the near depth's speed; never hit (engineShoot), no points.
    function engineRoadrunner(ltr = Math.random() < 0.5) {
        const path = { from: { x: ltr ? -8 : 108, y: HORIZON }, to: { x: ltr ? 108 : -8, y: HORIZON } };
        return launchFlyer(nextId(), 'roadrunner', 0, DURATION[2], 0, path);
    }

    // From the patch rim out along a ray to the edge of the lawn, in config coordinates like the walkers.
    function engineZombie(angle = Math.random() * Math.PI * 2, id = nextId()) {
        const from = round1(rim(angle, 1.02));
        let k = 1.02;
        const { x1, y1, x2, y2 } = WALK.area;
        while (k < 6) {
            const p = rim(angle, k + 0.05);
            if (p.x < x1 || p.x > x2 || p.y < y1 || p.y > y2) break;
            k += 0.05;
        }
        return launchFlyer(id, 'zombie', 1, ZOMBIE.duration, ZOMBIE.points, { from, to: round1(rim(angle, k)) });
    }

    // The wandering zombies of finale steps 5–6 (protocol.md, «Бродячие зомби»): HELLOWIN_ZOMBIE_MIN (?zmin, 5) at
    // least, topped up at once after a death; one more every HELLOWIN_ZOMBIE_INTERVAL (4–9 s) while fewer than
    // max(MIN, HELLOWIN_ZOMBIE_PER_PLAYER (?zper, 5) × walkers) live, the pause of the progress or not; the dawn
    // and a reset send them away with `gone`. Seeded under ?freeze, so a frozen screenshot shows the same crowd.
    const ZOMBIE_MIN = Math.max(0, Number.parseInt(params.get('zmin') ?? '5', 10) || 0);
    const ZOMBIE_PER = Math.max(0, Number.parseInt(params.get('zper') ?? '5', 10) || 0);
    let wanderRandom = simulated ? seeded(6150) : Math.random;
    const wandering = () => [...live].filter(([, f]) => f.wander && !f.shot);
    const wanderOn = () => engine.scene >= engine.sceneStages && [CURSED_STEP, BOSS_STEP].includes(engine.finale?.step);

    function engineWanderer(launchedAt = serverTime()) {
        let from;
        do from = round1({ x: 5 + wanderRandom() * 90, y: 46 + wanderRandom() * 49 });
        while (!inWanderZone(from));
        const id = nextId();
        const event = { flyer: id, kind: 'zombie', depth: 1, from, points: ZOMBIE.points, launchedAt, wander: true };
        live.set(id, { until: Infinity, points: ZOMBIE.points, kind: 'zombie', shot: false, wander: true, event });
        if (launchedAt >= serverTime()) deliver({ type: 'flyer', ...event });
        return id;
    }

    function wanderTopUp() {
        if (!wanderOn()) return;
        for (let n = wandering().length; n < ZOMBIE_MIN; n++) engineWanderer();
    }

    function wanderTick() {
        if (wanderOn() && wandering().length < Math.max(ZOMBIE_MIN, ZOMBIE_PER * engine.walkers.length)) engineWanderer();
        later(wanderTick, 4000 + wanderRandom() * 5000);
    }

    function wanderGone() {
        const ids = wandering().map(([id]) => id);
        ids.forEach((id) => live.delete(id));
        if (ids.length) deliver({ type: 'gone', flyers: ids });
    }

    // A worm crawls from one lawn point to another 12–25 % away, both off the patch and the line between them clear of
    // it (20 tries, else along the bottom of the lawn); a small wobble makes it meander. Depth 1's duration and points.
    function engineWorm(random = Math.random) {
        const { x1, y1, x2, y2 } = WALK.area;
        const clear = (a, b) => Array.from({ length: 31 }, (_, i) => i / 30)
            .every((t) => ellipse({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }) >= 1.02);
        let path = null;
        for (let i = 0; i < 20 && !path; i++) {
            const from = round1({ x: x1 + random() * (x2 - x1), y: y1 + random() * (y2 - y1) });
            const a = random() * Math.PI * 2;
            const d = 12 + random() * 13;
            const to = round1({ x: from.x + Math.cos(a) * d, y: from.y + Math.sin(a) * d });
            if (to.x >= x1 && to.x <= x2 && to.y >= y1 && to.y <= y2 && clear(from, to)) path = { from, to };
        }
        path ??= { from: { x: 30, y: 94 }, to: { x: 48, y: 95 } };
        path.wobble = { amp: Math.round((0.8 + random() * 1.2) * 10) / 10, waves: Math.round((3 + random() * 3) * 10) / 10 };
        return launchFlyer(nextId(), 'worm', 1, DURATION[1], POINTS[1], path);
    }

    // A fly like FlyerFactory::fly (protocol.md, `fly`): 2–3 stops (HELLOWIN_FLYER_FLY_STOPS), never the same surface
    // twice running — a table top (y = cy − ry/2, x within cx ± rx/2), the counter top (its x range, the upper half
    // of the counter rectangle) or a perch of `walk.bar.perches`; a sit of 900–1600 ms (HELLOWIN_FLYER_FLY_SIT) at each, 900 ms a leg
    // (HELLOWIN_FLYER_FLY_LEG); in and out over a side wall (x1 − 3 or x2 + 3) or from a point over the floor, half and half.
    const FLY = { stops: [2, 3], sit: [900, 1600], leg: 900, points: 1, inset: 3 };
    function engineFly(random = Math.random) {
        const int = (a, b) => a + Math.floor(random() * (b - a + 1));
        const float = (a, b) => Math.round((a + random() * (b - a)) * 10) / 10;
        const surfaces = BAR.obstacles.filter((o) => Number.isFinite(o.cx))
            .map((o) => ({ x: [o.cx - o.rx / 2, o.cx + o.rx / 2], y: [o.cy - o.ry / 2, o.cy - o.ry / 2] }));
        const box = BAR.obstacles.find((o) => Number.isFinite(o.x1));
        surfaces.push(box
            ? { x: [Math.max(BAR.counter.x1, box.x1), Math.min(BAR.counter.x2, box.x2)], y: [box.y1, (box.y1 + box.y2) / 2] }
            : { x: [BAR.counter.x1, BAR.counter.x2], y: [BAR.counter.y - 10, BAR.counter.y - 4] });
        // Every perch of the layout is a surface of its own: along its line, or its point.
        for (const p of BAR.perches ?? []) surfaces.push({ x: [p.x1, p.x2], y: [p.y, p.y] });
        const stops = [];
        let last = -1;
        for (let i = int(...FLY.stops); i > 0; i--) {
            let pick = int(0, surfaces.length - 1);
            if (pick === last && surfaces.length > 1) pick = (pick + 1) % surfaces.length;
            last = pick;
            const { x, y } = surfaces[pick];
            stops.push({ x: float(...x), y: float(...y), sit: int(...FLY.sit) });
        }
        const { x1, y1, x2, y2 } = BAR.area;
        const end = () => {
            const y = float(y1 + FLY.inset, y2 - FLY.inset);
            if (random() < 0.5) return { x: random() < 0.5 ? x1 - FLY.inset : x2 + FLY.inset, y };
            return { x: float(x1 + FLY.inset, x2 - FLY.inset), y };
        };
        const from = end();
        const to = end();
        const duration = FLY.leg * (stops.length + 1) + stops.reduce((sum, stop) => sum + stop.sit, 0);
        return launchFlyer(nextId(), 'fly', 1, duration, FLY.points, { from, stops, to });
    }

    // The set of flyers now: the dawn's, the cursed world's (finale step 5 on) or the scene's; the rare one aside.
    function kindsNow() {
        const step = engine.scene >= engine.sceneStages ? engine.finale?.step ?? -1 : -1;
        return step >= LAST_STEP ? DAWN_KINDS : step >= CURSED_STEP ? CURSED_KINDS : KINDS[engine.scene] ?? KINDS[0];
    }

    function engineFlyer({ kind = null, depth = Math.floor(Math.random() * 3), bush = depth === 2 && Math.random() < 0.4, ltr = Math.random() < 0.5 } = {}) {
        const rare = RARE[engine.scene];
        kind ??= rare && Math.random() < 0.125 ? rare : pick(kindsNow());
        if (!kind) return null;
        if (kind === 'roadrunner') return engineRoadrunner(ltr);
        if (kind === 'worm') return engineWorm();
        if (kind === 'fly') return engineFly();
        if (kind === 'witch') depth = Math.max(1, depth);
        // Fireflies keep to depths 1–2 (FIREFLY_DEPTHS); the lab's bushes are all near ones.
        if (kind === 'firefly') depth = depth === 0 ? 1 + Math.floor(Math.random() * 2) : depth;
        const id = nextId();
        let path;
        if (bush) {
            const b = typeof bush === 'string' ? engine.bushes.find((x) => x.id === bush) : pick(engine.bushes);
            const left = b.x < 50;
            path = {
                bush: b.id,
                from: { x: b.x, y: b.y },
                via: { x: left ? 20 + Math.random() * 20 : 60 + Math.random() * 20, y: 8 + Math.random() * 14 },
                to: { x: left ? 108 : -8, y: -8 + Math.random() * 16 },
            };
        } else {
            const y = depth === 2 ? 22 + Math.random() * 20 : 6 + Math.random() * 20;
            path = { from: { x: ltr ? -8 : 108, y }, to: { x: ltr ? 108 : -8, y: y + (Math.random() - 0.5) * 12 } };
            if (Math.random() < 0.5) path.via = { x: 50, y: Math.max(2, y - 8 - Math.random() * 8) };
        }
        // Bats sway across their path (protocol.md, `wobble`).
        if (kind === 'bat') path.wobble = { amp: 3 + Math.random() * 4, waves: 2 + Math.random() * 3 };
        // Fireflies sway lazily: smaller and slower (engine.md, FIREFLY_AMP, FIREFLY_WAVES).
        if (kind === 'firefly') path.wobble = { amp: Math.round((2 + Math.random() * 3) * 10) / 10, waves: Math.round((1.5 + Math.random() * 1.5) * 10) / 10 };
        const points = kind === 'witch' ? RARE_POINTS : kind === 'firefly' ? FIREFLY_POINTS : POINTS[depth];
        return launchFlyer(id, kind, depth, DURATION[depth], points, path);
    }

    function engineShoot(id, player = null) {
        const f = live.get(id);
        if (!f || f.shot || f.kind === 'roadrunner' || serverTime() > f.until) return { ok: true, hit: false };
        f.shot = true;
        stats.shot++;
        const by = playerOf(player);
        deliver({ type: 'shot', flyer: id, points: f.points, ...(by ? { player: by } : {}) });
        if (by && f.points > 0) dawnHit(by, f.points);
        if (f.kind === 'witch' && by) deliver({ type: 'owl', line: 'witch-down', params: { player: by } });
        // A zombie worker slain from step 5 on counts for the cursed world's goal — not while the progress is paused.
        if (f.kind === 'zombie' && engine.cursed && !engine.paused) {
            stats.slain++;
            engine.cursed.slain++;
            cursedUpdate();
        }
        if (f.wander) {
            live.delete(id);
            wanderTopUp();
        }
        return { ok: true, hit: true, points: f.points };
    }

    // Characters: `register` with a look puts the player on the field, `move` sends it along a route.
    function engineWalker(walker) {
        const old = engine.walkers.find((w) => w.id === walker.id);
        const next = { ...walker, walk: old?.walk ?? walker.walk };
        engine.walkers = [...engine.walkers.filter((w) => w.id !== walker.id), next];
        deliver({ type: 'walker', walker: structuredClone(next) });
    }

    // Any new path cancels a clink by click not reached yet; `clink` — the target of one, sent with the move.
    function engineMove(id, target, clink = null) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        const now = serverTime();
        const from = round1(walkPoint(w.walk, now));
        const path = inBarZone ? barRoute(from, clampToBar(target)) : route(from, clampToZone(target));
        w.walk = { path, startedAt: now, arrivesAt: now + Math.round((lengthOf(path) / WALK_SPEED) * 1000) };
        if (clink) w.clink = clink;
        else delete w.clink;
        // Any new path drops a `bar.take` not reached yet.
        w.taking = null;
        deliver({ type: 'move', player: { id }, walk: structuredClone(w.walk), ...(clink ? { clink: structuredClone(clink) } : {}) });
        return { ok: true, walk: w.walk };
    }

    // RPC `clink` like WalkService::clink (engine.md, «Чоканье по клику»; walk.clink_gap, walk.clink_duration): to a
    // walker — beside the end of its path, CLINK_GAP in x on the clinker's side (the other side when the lawn's edge
    // pushed the spot onto it); to a reachable pumpkin — the nearest lawn point. The move carries `clink`; once both
    // have arrived (plus the ticker's delay) and neither was sent elsewhere, `clink` with a random toast. `busy` while
    // the player's last clink plays; a clink with a mug already clinked is `{ok: true}` and changes nothing.
    // The mug's busy spells like the server's (docs/spec/frontend.md, «Ввод в баре»): `clinkedUntil` — a clink by click
    // plays to `at` + CLINK_DURATION for both mugs, a counted `clink.auto` to now + CLINK_DURATION; a `drink` meanwhile
    // is `busy`. HELLOWIN_DRINK_MS after a drink, and until a pumpkin's hand-over is over (`take` with `until`,
    // HELLOWIN_BEER_HANDOVER_MS), `drink`, `bar.take` and `beer` are `busy` too.
    const CLINK_GAP = 4;
    const CLINK_DURATION = 3200;
    const CLINK_TICK = 100;
    const DRINK_MS = 1200;
    const HANDOVER_MS = 900;
    const clinkedUntil = new Map();
    const drankAt = new Map();
    const handUntil = new Map();
    const drinkBusy = (id) => serverTime() < Math.max((drankAt.get(id) ?? -Infinity) + DRINK_MS, handUntil.get(id) ?? -Infinity);
    function engineClink(id, { walker, pumpkin, roadrunner } = {}, toast = null) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (roadrunner === true) return engineClinkRoadrunner(w, toast);
        const bar = engine.scene === 0;
        if (!bar && !(engine.scene >= engine.sceneStages && (engine.finale?.step ?? -1) >= CURSED_STEP)) return { ok: false, error: 'not cursed' };
        // In the bar both glasses have to be there: mine first, then the target's (protocol.md, RPC `clink`).
        if (bar && w.item !== 'beer') return { ok: false, error: 'no beer' };
        if (bar && walker === undefined) return { ok: false, error: 'no target' };
        const t = walker !== undefined ? engine.walkers.find((x) => x.id === walker) : null;
        if (bar && t && t.item !== 'beer') return { ok: false, error: 'no target' };
        let spot;
        let target;
        if (walker !== undefined) {
            if (!t || walker === id) return { ok: false, error: 'no target' };
            const end = t.walk.path[t.walk.path.length - 1];
            const side = walkPoint(w.walk, serverTime()).x <= end.x ? -1 : 1;
            spot = zoneClamp({ x: end.x + side * CLINK_GAP, y: end.y });
            if (Math.abs(spot.x - end.x) < CLINK_GAP / 2) spot = zoneClamp({ x: end.x - side * CLINK_GAP, y: end.y });
            target = { walker: { id: walker } };
        } else {
            const p = engine.elements.find((e) => e.id === pumpkin);
            if (!p || p.type !== 'pumpkin' || !p.reachable || engine.finale?.step !== CURSED_STEP) return { ok: false, error: 'no target' };
            spot = clampToZone(p);
            target = { pumpkin: { id: pumpkin } };
        }
        if (w.item === 'beer' && w.clinked) return { ok: true };
        if (serverTime() < (clinkedUntil.get(id) ?? -Infinity)) return { ok: false, error: 'busy' };
        const { walk } = engineMove(id, spot, target);
        const targetWalk = t?.walk;
