<!--
  Sandbox for the pixel scene without a backend (docs/spec/frontend.md, "Проверка"): a fake snapshot and a fake
  engine that emits channel events through the same client model as app.js.
  Query: ?auto=1 auto-clicks, ?w=px narrows the page, ?stage=N starts every pumpkin at stage N, ?freeze=ms stops the frame loop after ms,
  ?ui=0 hides the controls, ?sound=1 plays the real sound (unlocked by the first press; window.audio is the engine), ?hits=1 outlines the hit zones, ?reset=ms restarts the round at that frozen-clock moment, ?flyers=1 launches three flyers and shoots one (?shoot=0..2 picks the depth, ?shotAt=ms the moment, ?kind=<id> the kind — the sunset has none of its own), ?fps=1 logs the frame rate, ?skew=ms shifts the client clock.
  Characters: ?walkers=N wandering bots (default 3, 0 with ?freeze; frozen bots all set off at once), ?me=1 puts
  your own character on the field at once (click the ground to walk), ?join=1 opens the join screen, ?shooter=1 makes
  the ?flyers=1 shot one of the first walker, ?item=<id> hands that item out in every scene. The "выстрел" button
  launches a bird that a walker shoots down. ?clink=1 stands the bots in little groups a few steps apart and keeps them
  there: with ?finale=5 (beer in every hand) they clink glasses, ?finale=5&clink=1&walkers=8&freeze=ms catches a clink.
  Clinking by click (cursed world, ?finale=5): with ?me=1 a click on a bot walks up to it and clinks (RPC `clink` →
  `move`, then `clink` at the arrival), a click on a reachable pumpkin (the front ones by the lawn, `reachable`)
  clinks with it. ?clickclink=1 stands the bots apart and keeps them there, and they clink by click themselves: bot 1
  with bot 2 (a two-voice toast), bot 3 with pumpkin-10, bot 4 with bot 5 — at the start and every 9 s; ?toast=N gives
  all of them toast N. ?finale=5&clickclink=1&walkers=5&freeze=1900 catches the strike, 2700 the toasts, 3700 the reply.
  Items in the final scene follow `finale_items`: the red flame at step 0, empty hands on steps 1–4, beer from step 5.
  Story: ?mod=1 makes this page the moderator (the console shows; without it console RPCs answer `forbidden`),
  ?scene=N starts in scene N, ?ready=1 starts with every pumpkin done and the scene ready, ?finale=N starts at finale
  step N (a fake `reveal` from step 4), ?paused=1 / ?zombies=1 start with the switch on, ?owl=<line id> or
  ?say=<text> has the owl speak at the start, ?specials=1 launches a witch, a road-runner and a zombie at the start
  (?zshot=ms shoots the zombie). Flyer kinds follow the scene like HELLOWIN_FLYER_KINDS (worms in the final scene, with
  a small wobble; the cursed world flies worms, bats and fireflies); ?worms=1 sends three worms over the lawn at the start
  in any scene (?wshot=ms shoots the first one); ?fireflies=1 launches three fireflies at the start (?fshot=ms shoots a
  near one);
  zombies walk only at finale step 5 with zombies on and no pause; the scene is ready when every pumpkin is done, and
  waits for «Следующая сцена».
  Bonfire (scenes 2–3): locked until every pumpkin of the scene is done (a click on it then answers `locked` and sends
  nothing), its own threshold ?bclicks=N (default 20, HELLOWIN_BONFIRE_CLICKS_PER_STAGE) and last stages per scene
  0,0,4,7 (HELLOWIN_BONFIRE_STAGE_MAX); owl lines last-pumpkin → bonfire-open, then ready → bonfire-done → scene-ready.
  ?bonfire=N starts the bonfire at stage N; ?next=ms presses «Следующая сцена» (forced) at that frozen-clock moment —
  without ?scene out of the bar, with ?scene=1 the sunset fade, with ?scene=3 the explosion.
  Magic circle (docs/spec/scenario.md «Магический круг»): on the bonfire's spot, clickable in the final scene at finale
  step 0 (the bonfire before it, never both), own threshold ?cclicks=N (default 10) and CIRCLE_STAGES = 4 stages, the
  last stage in `scene.circleStageMax`; closed → ready, circle-done, scene-ready. ?circle=N starts it at stage N;
  ?nocircle=1 leaves it out.
  Finale (docs/spec/scenario.md «Финал»): step 1 only from the closed circle (`not ready` without it, «Шаг финала 1» on
  the console forces it after a confirm); on step 2 every walker gets a `move` outward to the edge of the lawn, like
  the server's scatter; the snapshot's `startedAt` is 3 h 07 min before the start (the HUD's uptime from step 3, the
  reveal's from step 4). ?finale=N starts settled at step N (bots stand around the circle and do not wander until
  step 2); ?play=ms with ?freeze presses «Шаг финала» (forced) at that frozen-clock moment, so ?finale=1&play=0&freeze=1600
  captures the lightning of step 2 mid-way; ?ritual=1 starts at step 0 with the circle closed.
  Thresholds (docs/spec/scenario.md «Множитель порогов»): the console's «Пороги» multiply the base values (pumpkins 5,
  the bonfire ?bclicks, the circle ?cclicks) by k, max(1, round(base × k)), k from 0.1 to 10 kept across a reset;
  ?k=N starts with that multiplier. `online` is the number of walkers, in the snapshot and in a `leaderboard` event
  every 5 s (with an empty `top`).
  Scenes are numbered with the bar first (docs/spec/scenario.md): 0 bar, 1 day, 2 sunset, 3 night, 4 the final scene.
  Bar (the default without ?scene): the ticker pours one mug at a time (?mugs=N at the start, default 5; ?pour=ms per
  mug, default 2500), about every third pour with a `rumor`; `bar.take` walks to the counter and takes a mug on arrival
  (a latecomer gets `take ok:false` and `bar-empty`); `drink` needs a clink (`not clinked`), counts `drunk` against the
  goal ?target=N (default 10; ?drunk=N already drunk) and sends `drinks`; the goal reached or «Отмашка» (`bar.ready`,
  ?mod=1) makes the bar ready once (`ready`, `bar-intro`); «+5/−5 бокалов» is `bar.target`; clinks by click need beer on
  both sides, `clink.auto` is reported by your browser and, for the bots, by the lab. Bots fetch beer, clink and drink.
  ?bar=1 stands beer-holding bots in pairs by the tables (?bar=1&walkers=8&epoch=18000&freeze=5100 — the strike, 6400 —
  toasts to PHP); ?bardemo=1 plays a scripted evening (two mugs, a slow pour, the farthest bot shrugs, two clink and
  drink). With ?me=1: the counter takes a mug, Space or «Выпить» drinks.
  Click shots (docs/spec/frontend.md, «Выстрел по клику»): a click event carries its clicker like the server's — your
  click your character when it is on the field, a random or automatic click a random bot, or nobody with the share
  ?anon=0..1 (default 0.25); a standing clicker shoots the element with what it holds. ?still=1 keeps the bots where
  they stand (no wandering, frozen bots do not set off), so ?auto=1&still=1&walkers=8 shows a crowd shooting.
-->

<script type="module">
    import { bindBar, bindClinking, bindShooting, bindWalking, createClient, readSnapshot } from '/js/client.js';
    import { BAR_LAYOUT, barCounterOf } from '/js/layout.js';
    import { initDebugPanel } from '/js/debug.js';
    import { initJoin, storedLook } from '/js/join.js';
    import { LINES, createOwl } from '/js/owl.js';
    import { createReveal } from '/js/reveal.js';
    import { ITEMS, randomLook } from '/js/pixel/characters.js';
    import { createScene } from '/js/pixel/scene.js';

    const params = new URLSearchParams(location.search);
    const root = document.getElementById('app');
    // ?w=390: headless windows have a minimum width, so narrow layouts are checked in a narrowed #app.
    if (params.has('w')) root.style.width = `${Number.parseInt(params.get('w'), 10)}px`;
    // Same set as the elements of app/config/hellowin.php: an uneven flat ring around the root at 50% / 63%.
    const ELEMENTS = [
        [47.8, 51.2, 'm'], [55.7, 55, 's'], [66.2, 48.3, 's'], [62.8, 56, 's'], [71.2, 58.4, 'm'], [64.7, 63.7, 's'],
        [71, 72.8, 'l'], [59.6, 71.1, 'm'], [60.7, 80.8, 'm'], [50.4, 82.7, 'l'], [40, 83.7, 'm'], [43.6, 74.1, 'm'],
        [29.3, 78.5, 'l'], [35.4, 69.6, 's'], [27.7, 60.2, 'm'], [40.6, 64, 's'], [35.8, 51.5, 's'], [45.2, 58.4, 's'],
    ];
    // The pumpkins reachable for a clink by click (the `reachable` defaults of app/config/hellowin.php).
    const REACHABLE = new Set([3, 5, 7, 9, 10, 11, 13, 15, 17]);
    const startStage = Math.max(0, Math.min(11, Number.parseInt(params.get('stage') ?? '0', 10) || 0));
    // The bonfire of app/config/hellowin.php: on the root, its own threshold and last stage per scene.
    const BONFIRE_CLICKS = Math.max(1, Number.parseInt(params.get('bclicks') ?? '20', 10) || 20);
    const BONFIRE_STAGE_MAX = [0, 0, 4, 7, 7];
    // The magic circle of the final scene (HELLOWIN_CIRCLE_CLICKS_PER_STAGE, HELLOWIN_CIRCLE_STAGES; no values yet).
    const CIRCLE_CLICKS = Math.max(1, Number.parseInt(params.get('cclicks') ?? '10', 10) || 10);
    const CIRCLE_STAGES = 4;

    ELEMENTS.forEach(([x, y, size], i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pumpkin';
        b.dataset.element = `pumpkin-${i + 1}`;
        b.dataset.type = 'pumpkin';
        b.dataset.size = size;
        b.dataset.stage = String(Math.min(startStage, 4));
        b.dataset.clicks = String(startStage === 4 ? 0 : i % 6);
        b.style.setProperty('--x', String(x));
        b.style.setProperty('--y', String(y));
        b.style.zIndex = String(Math.round(y * 10));
        if (REACHABLE.has(i + 1)) b.dataset.reachable = '';
        b.setAttribute('aria-label', `Тыква ${b.dataset.element}`);
        b.innerHTML = '<span class="pumpkin__emoji" aria-hidden="true">🎃</span>';
        root.insertBefore(b, root.querySelector('.hud'));
    });
    {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'bonfire';
        b.dataset.element = 'bonfire';
        b.dataset.type = 'bonfire';
        b.dataset.stage = '0';
        b.dataset.clicks = '0';
        b.dataset.threshold = String(BONFIRE_CLICKS);
        b.dataset.stageMax = '0';
        b.style.setProperty('--x', '50');
        b.style.setProperty('--y', '63');
        b.style.zIndex = '630';
        b.setAttribute('aria-label', 'Костёр');
        b.innerHTML = '<span class="element__emoji" aria-hidden="true">🔥</span>';
        root.insertBefore(b, root.querySelector('.hud'));
    }
    if (params.get('nocircle') !== '1') {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'circle';
        b.dataset.element = 'circle';
        b.dataset.type = 'circle';
        b.dataset.stage = '0';
        b.dataset.clicks = '0';
        b.dataset.threshold = String(CIRCLE_CLICKS);
        b.dataset.stageMax = '0';
        b.style.setProperty('--x', '50');
        b.style.setProperty('--y', '63');
        b.style.zIndex = '630';
        b.setAttribute('aria-label', 'Магический круг');
        b.innerHTML = '<span class="element__emoji" aria-hidden="true">⭕</span>';
        root.insertBefore(b, root.querySelector('.hud'));
    }
    // The base thresholds of app/config/hellowin.php; the moderator's k multiplies all three.
    const BASE_THRESHOLDS = { pumpkin: Number.parseInt(root.dataset.threshold, 10), bonfire: BONFIRE_CLICKS, circle: CIRCLE_CLICKS };
    const thresholdsFor = (k) => Object.fromEntries(Object.entries(BASE_THRESHOLDS).map(([type, base]) => [type, Math.max(1, Math.round(base * k))]));
    {
        const k = Math.min(10, Math.max(0.1, Number.parseFloat(params.get('k') ?? '1') || 1));
        const start = thresholdsFor(k);
        root.dataset.k = String(k);
        root.dataset.threshold = String(start.pumpkin);
        root.querySelectorAll('.bonfire, .circle').forEach((b) => { b.dataset.threshold = String(start[b.dataset.type]); });
    }
    if (params.has('hits')) root.classList.add('show-hits');

    // With ?freeze the lab runs on its own clock: headless screenshots get no animation frames, so time is stepped
    // by hand and every timer below goes through this queue.
    const freeze = Number.parseInt(params.get('freeze') ?? '', 10);
    const simulated = freeze > 0;
    let simTime = 0;
    const queue = [];
    function later(fn, ms) {
        if (!simulated) return setTimeout(fn, ms);
        queue.push({ at: simTime + ms, fn });
    }

    // Server time of the fake engine; the frozen clock runs from a fixed epoch. ?skew=ms shifts the client's own
    // clock, which the snapshot's `now` has to compensate.
    // ?epoch=ms moves the frozen clock's start (a multiple of 6000 keeps the clink slots in place: ?epoch=336000 reaches a
    // two-voice toast without stepping through minutes).
    const EPOCH = 1_700_000_000_000 + (Number.parseInt(params.get('epoch') ?? '0', 10) || 0);
    const serverTime = () => (simulated ? EPOCH + simTime : Date.now());
    const skew = Number.parseInt(params.get('skew') ?? '0', 10) || 0;
    const clientTime = () => serverTime() + skew;
    root.dataset.now = String(serverTime());
    // RoadRunner has been up a while when the lab starts: the finale's uptime (protocol.md, `startedAt`).
    const UPTIME = (3 * 60 + 7) * 60000 + 20000;
    root.dataset.startedAt = String(serverTime() - UPTIME);

    // Walking of players.md («На поле»): the zone of app/config/hellowin.php (`walk`), the lawn rectangle minus the
    // patch ellipse, and HELLOWIN_WALK_SPEED in percents per second along the path.
    const WALK = { area: { x1: 3, y1: 44, x2: 97, y2: 97 }, patch: { cx: 50, cy: 63, rx: 31, ry: 25 } };
    const WALK_SPEED = 12;
    const ME = 'lab-me-0000000001';
    const round1 = (p) => ({ x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 });
    const ellipse = (p) => Math.hypot((p.x - WALK.patch.cx) / WALK.patch.rx, (p.y - WALK.patch.cy) / WALK.patch.ry);
    const angleOf = (p) => Math.atan2((p.y - WALK.patch.cy) / WALK.patch.ry, (p.x - WALK.patch.cx) / WALK.patch.rx);
    const rim = (a, k) => ({ x: WALK.patch.cx + Math.cos(a) * WALK.patch.rx * k, y: WALK.patch.cy + Math.sin(a) * WALK.patch.ry * k });
    const lengthOf = (path) => path.slice(1).reduce((sum, p, i) => sum + Math.hypot(p.x - path[i].x, p.y - path[i].y), 0);

    function walkPoint(walk, now) {
        const path = walk.path;
        const total = lengthOf(path);
        const span = walk.arrivesAt - walk.startedAt;
        let left = (total > 0 && span > 0 ? Math.min(1, Math.max(0, (now - walk.startedAt) / span)) : 1) * total;
        for (let i = 1; i < path.length; i++) {
            const d = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
            if (left <= d) {
                const k = d > 0 ? left / d : 1;
                return { x: path[i - 1].x + (path[i].x - path[i - 1].x) * k, y: path[i - 1].y + (path[i].y - path[i - 1].y) * k };
            }
            left -= d;
        }
        return path[path.length - 1];
    }

    // Outside the rectangle — to its edge; inside the patch — out to the rim, sideways where the rim is off the lawn.
    function clampToZone(p) {
        const { x1, y1, x2, y2 } = WALK.area;
        let q = { x: Math.min(x2, Math.max(x1, p.x)), y: Math.min(y2, Math.max(y1, p.y)) };
        const r = ellipse(q);
        if (r < 1.02) {
            q = r > 0 ? rim(angleOf(q), 1.02) : rim(Math.PI / 2, 1.02);
            if (q.y < y1) {
                const half = WALK.patch.rx * 1.02 * Math.sqrt(Math.max(0, 1 - ((y1 - WALK.patch.cy) / (WALK.patch.ry * 1.02)) ** 2));
                q = { x: q.x < WALK.patch.cx ? WALK.patch.cx - half : WALK.patch.cx + half, y: y1 };
            }
        }
        return round1(q);
    }

    // A straight line when it misses the patch, else along the rim on the shorter side that stays on the lawn (the
    // far rim is beyond the lawn's top edge, so in practice around the near side).
    function route(from, to) {
        const blocked = Array.from({ length: 31 }, (_, i) => i / 30)
            .some((t) => ellipse({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t }) < 1);
        if (!blocked) return [from, to];
        const a0 = angleOf(from);
        const a1 = angleOf(to);
        const turn = 2 * Math.PI;
        const arcs = [1, -1].map((sign) => {
            const delta = sign > 0 ? (((a1 - a0) % turn) + turn) % turn : -((((a0 - a1) % turn) + turn) % turn);
            const steps = Math.max(1, Math.ceil(Math.abs(delta) / (Math.PI / 12)));
            const points = Array.from({ length: steps + 1 }, (_, i) => round1(rim(a0 + (delta * i) / steps, 1.06)));

        });
        const onLawn = (path) => path.every((p) => p.y >= WALK.area.y1 - 0.01 && p.x >= WALK.area.x1 && p.x <= WALK.area.x2);

    }

    // The bar's floor (`walk.bar`, protocol.md «Бар»): the area minus the counter and the tables. The fake router walks
    // straight when the line is clear, else through one or two corners of the obstacles' boxes — enough for a lab.
    const BAR = JSON.parse(root.dataset.barLayout || 'null') ?? BAR_LAYOUT;
    root.dataset.barLayout = JSON.stringify(BAR);
    const BAR_COUNTER = barCounterOf(BAR);
    const BAR_MARGIN = 1.5;
    const insideObstacle = (p, o, m = 0) => (Number.isFinite(o.cx)
        ? Math.hypot((p.x - o.cx) / (o.rx + m), (p.y - o.cy) / (o.ry + m)) < 1

    const barBlocked = (p) => BAR.obstacles.some((o) => insideObstacle(p, o));
    function clampToBar(p) {
        const { x1, y1, x2, y2 } = BAR.area;
        let q = { x: Math.min(x2, Math.max(x1, p.x)), y: Math.min(y2, Math.max(y1, p.y)) };
        for (const o of BAR.obstacles) {
            if (!insideObstacle(q, o, BAR_MARGIN)) continue;
            if (Number.isFinite(o.cx)) {
                const a = Math.atan2((q.y - o.cy) / o.ry, (q.x - o.cx) / o.rx) || Math.PI / 2;
                q = { x: o.cx + Math.cos(a) * (o.rx + BAR_MARGIN), y: o.cy + Math.sin(a) * (o.ry + BAR_MARGIN) };
            } else {
                const out = [[q.x - (o.x1 - BAR_MARGIN), { x: o.x1 - BAR_MARGIN, y: q.y }], [o.x2 + BAR_MARGIN - q.x, { x: o.x2 + BAR_MARGIN, y: q.y }], [o.y2 + BAR_MARGIN - q.y, { x: q.x, y: o.y2 + BAR_MARGIN }]];
                q = out.sort((a, b) => a[0] - b[0])[0][1];

    }
    const barClear = (a, b) => Array.from({ length: 41 }, (_, i) => i / 40).every((t) => !barBlocked({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }));
    function barRoute(from, to) {
        if (barClear(from, to)) return [from, to];
        const corners = BAR.obstacles.flatMap((o) => {
            const [ax, ay, bx, by] = Number.isFinite(o.cx) ? [o.cx - o.rx, o.cy - o.ry, o.cx + o.rx, o.cy + o.ry] : [o.x1, o.y1, o.x2, o.y2];
            const m = BAR_MARGIN + 0.5;

        });

        const consider = (path) => {
            if (path.slice(1).every((p, i) => barClear(path[i], p)) && (!best || lengthOf(path) < lengthOf(best))) best = path;

        corners.forEach((c) => consider([from, c, to]));

    }

    // Seeded randomness for the bots' looks, so a reload shows the same crowd.
    const seeded = (seed) => () => {
        seed = (seed + 0x6d2b79f5) | 0;

    const BOT_NAMES = ['Jack', 'Тыквоед', 'Ведьма Ира', 'Graf_Drak', 'Мумия', 'Bones', 'Кот-Баюн', 'Zed.13'];
    const botCount = Math.max(0, Math.min(BOT_NAMES.length, Number.parseInt(params.get('walkers') ?? (simulated ? '0' : '3'), 10) || 0));
    const standing = (p, at) => ({ path: [p], startedAt: at, arrivesAt: at });
    // In the finale the bots start around the patch, as a room gathered for the ritual would.
    const finaleStart = params.has('finale') || params.get('ritual') === '1';
    // The lab starts in the bar unless the query names another scene (or a stage past the bar's).
    const barStart = !finaleStart && (Number.parseInt(params.get('scene') ?? '0', 10) || 0) === 0 && startStage === 0;
    // Where the walk zone of the current scene is: the bar's floor or the lawn.
    let inBarZone = barStart;
    const zoneClamp = (p) => (inBarZone ? clampToBar(p) : clampToZone(p));
    const spawnPoint = (random = Math.random) => (inBarZone
        ? clampToBar({ x: 8 + random() * 84, y: BAR.spawn.y1 + random() * (BAR.spawn.y2 - BAR.spawn.y1) })
        : clampToZone({ x: 8 + random() * 84, y: 91 + random() * 5 }));
    // ?bar=1: the bots start in the bar with beer, in pairs by the tables, and stay there — the planner clinks them.
    const barPairs = barStart && params.get('bar') === '1';
    const BAR_SPOTS = [{ x: 14, y: 70 }, { x: 19, y: 71 }, { x: 33, y: 89 }, { x: 38, y: 90 }, { x: 66, y: 85 }, { x: 71, y: 86 }, { x: 52, y: 64 }, { x: 57, y: 65 }];
    // ?bardemo=1: a scripted evening at the counter — two mugs, three bots go for them, the farthest one shrugs; the
    // first two clink by click and drink; the latecomer takes the next poured mug.
    const barDemo = barStart && params.get('bardemo') === '1';
    const DEMO_SPOTS = [{ x: 50, y: 70 }, { x: 58, y: 74 }, { x: 10, y: 94 }, { x: 30, y: 60 }, { x: 86, y: 92 }];
    const gatherPoint = (i, n) => clampToZone(rim(Math.PI * (0.08 + (0.84 * i) / Math.max(1, n - 1)), 1.12));
    // ?clink=1: the bots stand in little groups of 2, 3, 2, 1… a few steps apart, off the patch, and do not wander — in
    // the cursed world (?finale=5) the beer glasses clink.
    const clinkStart = params.get('clink') === '1';
    const CLINK_GROUPS = [{ x: 22, y: 93, n: 2 }, { x: 70, y: 94, n: 3 }, { x: 9, y: 66, n: 2 }, { x: 91, y: 64, n: 1 }, { x: 46, y: 95, n: 2 }];
    // ?clickclink=1: the bots stand apart, off the patch, and do not wander; in the cursed world they walk up and clink.
    const clickClinkStart = params.get('clickclink') === '1';
    const CLICK_SPOTS = [{ x: 14, y: 93 }, { x: 30, y: 92 }, { x: 66, y: 95 }, { x: 78, y: 93 }, { x: 92, y: 80 }];
    function clinkPoint(i) {

        }
        return spawnPoint();
    }
    const startWalkers = [];
    for (let i = 0; i < botCount; i++) {
        const random = seeded(1000 + i);
        startWalkers.push({
            id: `lab-bot-${String(i).padStart(9, '0')}`,
            name: BOT_NAMES[i],
            look: randomLook(random),
            item: barStart ? (barPairs ? 'beer' : null) : i % 3 === 1 && ITEMS.length ? ITEMS[i % ITEMS.length].id : null,
            walk: standing(barPairs ? clampToBar(BAR_SPOTS[i] ?? spawnPoint(random)) : barDemo ? clampToBar(DEMO_SPOTS[i] ?? spawnPoint(random))
                : barStart ? spawnPoint(random)
                : clinkStart || clickClinkStart ? clinkPoint(i) : finaleStart ? gatherPoint(i, botCount) : spawnPoint(random), serverTime()),
        });
    }
    if (params.get('me') === '1') {
        startWalkers.push({ id: ME, name: 'Я', look: storedLook() ?? randomLook(seeded(7)), item: null, walk: standing(zoneClamp({ x: 50, y: 93 }), serverTime()) });
    }
    root.dataset.walkers = JSON.stringify(startWalkers);

    // Fake engine: the server side of protocol.md, with queue latency before a stage transition.
    const engine = readSnapshot(root);
    // HELLOWIN_BAR_MUGS and HELLOWIN_BAR_POUR_MS: ?mugs=N full mugs at the start, ?pour=ms per mug.
    const BAR_MUGS = 5;
    // The scripted demo pours slowly, so its latecomer finds the counter empty.
    const POUR_MS = Math.max(200, Number.parseInt(params.get('pour') ?? (barDemo ? '8000' : '2500'), 10) || 2500);
    const startMugs = Math.max(0, Math.min(BAR_MUGS, Number.parseInt(params.get('mugs') ?? (barDemo ? '2' : String(BAR_MUGS)), 10)));
    // HELLOWIN_BAR_DRINKS: the hall's goal, ?target=N (default 10 in the lab); kept across a reset like k.
    // HELLOWIN_BAR_RUMOR_CHANCE: about every third pour carries a rumour.
    const BAR_TARGET = Math.max(1, Number.parseInt(params.get('target') ?? '10', 10) || 10);
    const RUMOR_CHANCE = 1 / 3;
    const startDrunk = Math.max(0, Number.parseInt(params.get('drunk') ?? '0', 10) || 0);
    engine.bar = { mugs: barStart ? startMugs : 0, pouring: null, drunk: startDrunk, target: BAR_TARGET };
    // HELLOWIN_SCENE_STAGE_MAX=0,4,8,11 (the bar first); the final scene keeps the last value.
    const SCENE_STAGE_MAX = [0, 4, 8, 11, 11];
    // Stand-in for the `items` of app/config/hellowin.php (what the walkers hold in each scene); an id without art
    // yet shows an empty hand.
    // ?item=<id> makes every scene hand out that item (a candle at night, say).
    const ITEM_BY_SCENE = params.has('item') ? [null, ...Array(4).fill(params.get('item'))] : [null, 'pistol', 'candle', 'book', 'red-flame'];
    // And of `finale_items`: the final scene's item at step 0, empty hands on steps 1–4, beer from step 5 on.
    const itemOfFinale = (step) => (params.has('item') ? params.get('item') : step === 0 ? ITEM_BY_SCENE[4] : step >= 5 ? 'beer' : null);

    const moderator = params.get('mod') === '1';
    // The evening's numbers for the reveal, counted like the engine's (protocol.md, «Снимок»).
    const stats = { clicks: 0, jobs: 0, burned: 0, shot: 0, drinks: 0, lastPumpkin: null };

    // A random 20–60 ms of latency, but in order: the channel never reorders publications.

        const now = simulated ? simTime : performance.now();

        later(() => client.apply({ round: engine.round, ...event }), deliveredBy - now);
    };
    const engineSnapshot = () => ({ ...structuredClone({ ...engine, walkers: engine.walkers.map(publicWalker) }), online: engine.walkers.length, now: serverTime() });
    const playerOf = (w) => (w ? { id: w.id, name: w.name } : null);
    // Who "clicked" in the lab: your character if it is on the field, else the first bot, else nobody.
    const someone = () => playerOf(engine.walkers.find((w) => w.id === ME) ?? engine.walkers[0]);

        const bots = wanderers();

    };
    const myClicker = () => playerOf(engine.walkers.find((w) => w.id === ME) ?? null);

    function engineClick(id, by = null) {
        const p = engine.elements.find((e) => e.id === id);

        const isCircle = p.type === 'circle';

    function engineReset() {

        engine.ready = false;

    function engineOwl({ line, params: lineParams, text }) {

            engine.k = k;

    // Console RPCs (protocol.md, «Модератор»): `forbidden` before anything else for a non-moderator.
    async function engineCall(method, data) {
        if (!moderator) throw new Error('forbidden');
        switch (method) {
            case 'scene.next': return engineSceneNext(data);
            case 'finale.step': return engineFinaleStep(data);

    // Flyers as the server launches them: a depth picks duration and points, near ducks may start from a bush and

    const DURATION = [16000, 6500, 4000];
    const POINTS = [3, 2, 1];

    const KINDS = [[], ['duck', 'chicken'], [], ['bat'], ['worm']];

    const ZOMBIE = { duration: 14000, points: 2 };
    const live = new Map();
    let flyerSeq = 0;
    const pick = (list) => list[Math.floor(Math.random() * list.length)];
    const nextId = () => `f-${(++flyerSeq).toString(16).padStart(8, '0')}`;

    function launchFlyer(id, kind, depth, duration, points, path) {
        const launchedAt = serverTime();
        const expiresAt = launchedAt + duration;
        live.set(id, { until: expiresAt + 500, points, kind, shot: false });
        deliver({ type: 'flyer', flyer: id, kind, depth, duration, points, launchedAt, expiresAt, ...path });
        return id;
    }

    // Runs along the horizon at the near depth's speed; never hit (engineShoot), no points.
    function engineRoadrunner(ltr = Math.random() < 0.5) {
        const path = { from: { x: ltr ? -8 : 108, y: HORIZON }, to: { x: ltr ? 108 : -8, y: HORIZON } };
        return launchFlyer(nextId(), 'roadrunner', 0, DURATION[2], 0, path);
    }

    // From the patch rim out along a ray to the edge of the lawn, in config coordinates like the walkers.
    function engineZombie(angle = Math.random() * Math.PI * 2) {
        const from = round1(rim(angle, 1.02));
        let k = 1.02;
        const { x1, y1, x2, y2 } = WALK.area;
        while (k < 6) {
            const p = rim(angle, k + 0.05);
            if (p.x < x1 || p.x > x2 || p.y < y1 || p.y > y2) break;
            k += 0.05;
        }
        return launchFlyer(nextId(), 'zombie', 1, ZOMBIE.duration, ZOMBIE.points, { from, to: round1(rim(angle, k)) });
    }

    // A worm crawls from one lawn point to another 12–25 % away, both off the patch and the line between them clear of
    // it (20 tries, else along the bottom of the lawn); a small wobble makes it meander. Depth 1's duration and points.
    function engineWorm(random = Math.random) {
        const { x1, y1, x2, y2 } = WALK.area;
        const clear = (a, b) => Array.from({ length: 31 }, (_, i) => i / 30)
            .every((t) => ellipse({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }) >= 1.02);
        let path = null;
        for (let i = 0; i < 20 && !path; i++) {
            const from = round1({ x: x1 + random() * (x2 - x1), y: y1 + random() * (y2 - y1) });
            const a = random() * Math.PI * 2;
            const d = 12 + random() * 13;
            const to = round1({ x: from.x + Math.cos(a) * d, y: from.y + Math.sin(a) * d });
            if (to.x >= x1 && to.x <= x2 && to.y >= y1 && to.y <= y2 && clear(from, to)) path = { from, to };
        }
        path ??= { from: { x: 30, y: 94 }, to: { x: 48, y: 95 } };
        path.wobble = { amp: Math.round((0.8 + random() * 1.2) * 10) / 10, waves: Math.round((3 + random() * 3) * 10) / 10 };
        return launchFlyer(nextId(), 'worm', 1, DURATION[1], POINTS[1], path);
    }

    function engineFlyer({ kind = null, depth = Math.floor(Math.random() * 3), bush = depth === 2 && Math.random() < 0.4, ltr = Math.random() < 0.5 } = {}) {
        const rare = RARE[engine.scene];
        const cursed = engine.scene >= engine.sceneStages && (engine.finale?.step ?? -1) >= 5;
        kind ??= rare && Math.random() < 0.125 ? rare : pick(cursed ? CURSED_KINDS : KINDS[engine.scene] ?? KINDS[0]);
        if (!kind) return null;
        if (kind === 'roadrunner') return engineRoadrunner(ltr);
        if (kind === 'worm') return engineWorm();
        if (kind === 'witch') depth = Math.max(1, depth);
        // Fireflies keep to depths 1–2 (FIREFLY_DEPTHS); the lab's bushes are all near ones.
        if (kind === 'firefly') depth = depth === 0 ? 1 + Math.floor(Math.random() * 2) : depth;
        const id = nextId();
        let path;
        if (bush) {
            const b = typeof bush === 'string' ? engine.bushes.find((x) => x.id === bush) : pick(engine.bushes);
            const left = b.x < 50;
            path = {
                bush: b.id,
                from: { x: b.x, y: b.y },
                via: { x: left ? 20 + Math.random() * 20 : 60 + Math.random() * 20, y: 8 + Math.random() * 14 },
                to: { x: left ? 108 : -8, y: -8 + Math.random() * 16 },
            };
        } else {
            const y = depth === 2 ? 22 + Math.random() * 20 : 6 + Math.random() * 20;
            path = { from: { x: ltr ? -8 : 108, y }, to: { x: ltr ? 108 : -8, y: y + (Math.random() - 0.5) * 12 } };
            if (Math.random() < 0.5) path.via = { x: 50, y: Math.max(2, y - 8 - Math.random() * 8) };
        }
        // Bats sway across their path (protocol.md, `wobble`).
        if (kind === 'bat') path.wobble = { amp: 3 + Math.random() * 4, waves: 2 + Math.random() * 3 };
        // Fireflies sway lazily: smaller and slower (engine.md, FIREFLY_AMP, FIREFLY_WAVES).
        if (kind === 'firefly') path.wobble = { amp: Math.round((2 + Math.random() * 3) * 10) / 10, waves: Math.round((1.5 + Math.random() * 1.5) * 10) / 10 };
        const points = kind === 'witch' ? RARE_POINTS : kind === 'firefly' ? FIREFLY_POINTS : POINTS[depth];
        return launchFlyer(id, kind, depth, DURATION[depth], points, path);
    }

    function engineShoot(id, player = null) {
        const f = live.get(id);
        if (!f || f.shot || f.kind === 'roadrunner' || serverTime() > f.until) return { ok: true, hit: false };
        f.shot = true;
        stats.shot++;
        const by = playerOf(player);
        deliver({ type: 'shot', flyer: id, points: f.points, ...(by ? { player: by } : {}) });
        if (f.kind === 'witch' && by) deliver({ type: 'owl', line: 'witch-down', params: { player: by } });
        return { ok: true, hit: true, points: f.points };
    }

    // Characters: `register` with a look puts the player on the field, `move` sends it along a route.
    function engineWalker(walker) {
        const old = engine.walkers.find((w) => w.id === walker.id);
        const next = { ...walker, walk: old?.walk ?? walker.walk };
        engine.walkers = [...engine.walkers.filter((w) => w.id !== walker.id), next];
        deliver({ type: 'walker', walker: structuredClone(next) });
    }

    // Any new path cancels a clink by click not reached yet; `clink` — the target of one, sent with the move.
    function engineMove(id, target, clink = null) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        const now = serverTime();
        const from = round1(walkPoint(w.walk, now));
        const path = inBarZone ? barRoute(from, clampToBar(target)) : route(from, clampToZone(target));
        w.walk = { path, startedAt: now, arrivesAt: now + Math.round((lengthOf(path) / WALK_SPEED) * 1000) };
        if (clink) w.clink = clink;
        else delete w.clink;
        // Any new path drops a `bar.take` not reached yet.
        w.taking = null;
        deliver({ type: 'move', player: { id }, walk: structuredClone(w.walk), ...(clink ? { clink: structuredClone(clink) } : {}) });
        return { ok: true, walk: w.walk };
    }

    // RPC `clink` like WalkService::clink (engine.md, «Чоканье по клику»; walk.clink_gap, walk.clink_duration): to a
    // walker — beside the end of its path, CLINK_GAP in x on the clinker's side (the other side when the lawn's edge
    // pushed the spot onto it); to a reachable pumpkin — the nearest lawn point. The move carries `clink`; once both
    // have arrived (plus the ticker's delay) and neither was sent elsewhere, `clink` with a random toast. `busy` while
    // the player's last clink plays.
    const CLINK_GAP = 4;
    const CLINK_DURATION = 3200;
    const CLINK_TICK = 100;
    const clinkedAt = new Map();
    function engineClink(id, { walker, pumpkin } = {}, toast = null) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        const bar = engine.scene === 0;
        if (!bar && !(engine.scene >= engine.sceneStages && (engine.finale?.step ?? -1) >= LAST_STEP)) return { ok: false, error: 'not cursed' };
        // In the bar both glasses have to be there: mine first, then the target's (protocol.md, RPC `clink`).
        if (bar && w.item !== 'beer') return { ok: false, error: 'no beer' };
        if (bar && walker === undefined) return { ok: false, error: 'no target' };
        const t = walker !== undefined ? engine.walkers.find((x) => x.id === walker) : null;
        if (bar && t && t.item !== 'beer') return { ok: false, error: 'no target' };
        let spot;
        let target;
        if (walker !== undefined) {
            if (!t || walker === id) return { ok: false, error: 'no target' };
            const end = t.walk.path[t.walk.path.length - 1];
            const side = walkPoint(w.walk, serverTime()).x <= end.x ? -1 : 1;
            spot = zoneClamp({ x: end.x + side * CLINK_GAP, y: end.y });
            if (Math.abs(spot.x - end.x) < CLINK_GAP / 2) spot = zoneClamp({ x: end.x - side * CLINK_GAP, y: end.y });
            target = { walker: { id: walker } };
        } else {
            const p = engine.elements.find((e) => e.id === pumpkin);
            if (!p || p.type !== 'pumpkin' || !p.reachable) return { ok: false, error: 'no target' };
            spot = clampToZone(p);
            target = { pumpkin: { id: pumpkin } };
        }
        if (serverTime() < (clinkedAt.get(id) ?? -Infinity) + CLINK_DURATION) return { ok: false, error: 'busy' };
        const { walk } = engineMove(id, spot, target);
        const targetWalk = t?.walk;
        const due = Math.max(walk.arrivesAt, targetWalk?.arrivesAt ?? 0) + CLINK_TICK;
        later(() => {
            if (w.walk !== walk || w.clink !== target) return;
            delete w.clink;
            if (t && (t.walk !== targetWalk || !engine.walkers.includes(t))) return;
            // In the bar nobody may have drunk up on the way; the clink counts for both mugs.
            if (bar && (engine.scene !== 0 || w.item !== 'beer' || t?.item !== 'beer')) return;
            if (bar) w.clinked = t.clinked = true;
            const at = serverTime();
            clinkedAt.set(id, at);
            deliver({ type: 'clink', player: { id }, ...target, toast: toast ?? Math.floor(Math.random() * 2 ** 31), at });
        }, due - serverTime());
        return { ok: true, walk };
    }

    // ?clickclink=1: the bots clink by click themselves — the first round with fixed toasts, later ones random; ?toast=N always N.
    let clinkRounds = 0;
    function startClinks() {
        const first = clinkRounds++ === 0;
        const bots = wanderers();
        const forced = params.has('toast') ? Number.parseInt(params.get('toast'), 10) || 0 : null;
        const plans = [[0, 1, 27], [2, 'pumpkin-10', 1], [3, 4, 0]];
        for (const [by, target, toast] of plans) {
            if (!bots[by] || (typeof target === 'number' && !bots[target])) continue;
            engineClink(bots[by].id, typeof target === 'number' ? { walker: bots[target].id } : { pumpkin: target }, forced ?? (first ? toast : null));
        }
    }

    // The bar as the server plays it (protocol.md, «Бар»). The ticker pours one mug at a time while there is room; the
    // first walker to reach the counter gets a mug, a latecomer none (and the owl's `bar-empty`, at most every 20 s).
    const BAR_TICK = 200;
    const EMPTY_LINE_MS = 20000;
    let emptySaidAt = -Infinity;
    let takeSeq = 0;
    function pourTick() {
        if (engine.scene !== 0) return;
        const now = serverTime();
        const bar = engine.bar;
        if (bar.pouring && now >= bar.pouring.until) {
            bar.mugs++;
            bar.pouring = null;
            deliver({ type: 'mugs', mugs: bar.mugs });
        }
        if (!bar.pouring && bar.mugs < BAR_MUGS) {
            bar.pouring = { since: now, until: now + POUR_MS };
            if (Math.random() < RUMOR_CHANCE) bar.pouring.rumor = Math.floor(Math.random() * 2 ** 31);
            deliver({ type: 'pour', ...bar.pouring });
        }
    }

    // The bar is ready once the hall has drunk its goal or the moderator waved: once per round, `ready` and `bar-intro`.
    function barReady() {
        if (engine.scene !== 0 || engine.ready) return;
        engine.ready = true;
        deliver({ type: 'ready', scene: 0 });
        deliver({ type: 'owl', line: 'bar-intro' });
    }
    const drinksEvent = () => deliver({ type: 'drinks', drunk: engine.bar.drunk, target: engine.bar.target });
    function engineBarTarget({ delta }) {
        if (!Number.isInteger(delta)) throw new Error('invalid delta');
        engine.bar.target = Math.max(1, engine.bar.target + delta);
        drinksEvent();
        if (engine.bar.drunk >= engine.bar.target) barReady();
        return { ok: true, target: engine.bar.target };
    }
    function engineBarReady() {
        if (engine.scene !== 0) throw new Error('not bar');
        barReady();
        return { ok: true };
    }
    function tickBar() {
        pourTick();
        later(tickBar, BAR_TICK);
    }

    function engineTake(id) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (engine.scene !== 0) return { ok: false, error: 'not bar' };
        if (w.item === 'beer') return { ok: false, error: 'has beer' };
        const here = walkPoint(w.walk, serverTime());
        const spot = { x: Math.min(BAR.counter.x2, Math.max(BAR.counter.x1, here.x)), y: BAR.counter.y };
        const { walk } = engineMove(id, spot);
        const token = ++takeSeq;
        w.taking = token;
        later(() => {
            if (w.taking !== token || engine.scene !== 0) return;
            w.taking = null;
            if (engine.bar.mugs > 0) {
                engine.bar.mugs--;
                w.item = 'beer';
                w.clinked = false;
                deliver({ type: 'take', player: { id }, ok: true, mugs: engine.bar.mugs });
                return;
            }
            deliver({ type: 'take', player: { id }, ok: false });
            if (serverTime() - emptySaidAt >= EMPTY_LINE_MS) {
                emptySaidAt = serverTime();
                deliver({ type: 'owl', line: 'bar-empty' });
            }
        }, walk.arrivesAt + CLINK_TICK - serverTime());
        return { ok: true, walk };
    }

    function engineDrink(id) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (engine.scene !== 0) return { ok: false, error: 'not bar' };
        if (w.item !== 'beer') return { ok: false, error: 'no beer' };
        if (!w.clinked) return { ok: false, error: 'not clinked' };
        w.item = null;
        w.clinked = false;
        stats.drinks++;
        engine.bar.drunk++;
        deliver({ type: 'drink', player: { id } });
        drinksEvent();
        if (engine.bar.drunk >= engine.bar.target) barReady();
        return { ok: true };
    }

    // Reported by a participant's browser at the strike of an automatic clink; counts for the caller only, says nothing.
    function engineClinkAuto(id, { walker } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (engine.scene !== 0) return { ok: false, error: 'not bar' };
        if (w.item !== 'beer') return { ok: false, error: 'no beer' };
        const t = engine.walkers.find((x) => x.id === walker);
        const now = serverTime();
        if (!t || walker === id || t.item !== 'beer') return { ok: false, error: 'no target' };
        const a = walkPoint(w.walk, now);
        const b = walkPoint(t.walk, now);
        if (Math.hypot(a.x - b.x, a.y - b.y) > BAR.clink_reach) return { ok: false, error: 'no target' };
        w.clinked = true;
        return { ok: true };
    }

    // The bots' evening in the bar: empty hands go to the counter, a mug in hand looks for company (a clink by click
    // with another beer, or standing by it so the planner clinks), a clinked mug is drunk after a while. Bots report
    // their own automatic clinks like a browser would (botAutoClinks).
    function barBot(w) {
        const others = engine.walkers.filter((x) => x.id !== w.id && x.id !== ME);
        if (w.item !== 'beer') return w.taking ? null : engineTake(w.id);
        if (w.clinked) return Math.random() < 0.5 ? engineDrink(w.id) : null;
        const mate = others.find((x) => x.item === 'beer');
        if (mate && Math.random() < 0.5) return engineClink(w.id, { walker: mate.id });
        return engineMove(w.id, barTarget());
    }
    const barTarget = (random = Math.random) => clampToBar({ x: BAR.area.x1 + random() * (BAR.area.x2 - BAR.area.x1), y: 58 + random() * (BAR.area.y2 - 58) });

    // The scripted ?bardemo=1 evening, on the frozen clock or live: ms → step.
    function barDemoSteps() {
        const bots = wanderers();
        const at = (ms, fn) => later(fn, ms);
        if (bots.length < 3) return;
        at(300, () => bots.slice(0, 3).forEach((b) => engineTake(b.id)));
        at(5200, () => engineClink(bots[0].id, { walker: bots[1].id }, 2));
        at(10500, () => engineDrink(bots[0].id));
        at(11300, () => engineDrink(bots[1].id));
        at(12000, () => engineTake(bots[2].id));
    }

    // Name rules of players.md: trimmed, 1–24 letters, digits, single spaces, _ . -, at least one letter or digit.
    async function engineRegister(rawName, look) {
        const name = rawName.trim();
        if (!/^(?=.*[\p{L}\p{N}])(?!.*  )[\p{L}\p{N} _.-]{1,24}$/u.test(name)) throw new Error('invalid name');
        engineWalker({ id: ME, name, look, item: null, walk: standing(spawnPoint(), serverTime()) });
        client.setMe(ME);
        return { id: ME, name, look };
    }

    const wanderers = () => engine.walkers.filter((w) => w.id !== ME);
    const randomTarget = (random = Math.random) => ({ x: 3 + random() * 94, y: 44 + random() * 53 });
    function wander(id) {
        later(() => {
            if (!engine.walkers.some((w) => w.id === id)) return;
            // Through the ritual (closed circle, step 1) the bots stand with their hands up.
            const ritual = engine.scene >= engine.sceneStages && (engine.finale?.step === 1 || (engine.finale?.step === 0 && engine.ready));
            const w = engine.walkers.find((x) => x.id === id);
            if (engine.scene === 0) barBot(w);
            else if (!ritual) engineMove(id, randomTarget());
            wander(id);
        }, 3000 + Math.random() * 6000);
    }

    // A bird that one of the walkers (you first, if you are on the field) shoots down a moment later.
    function engineShotByWalker() {
        const shooter = engine.walkers.find((w) => w.id === ME) ?? engine.walkers[Math.floor(Math.random() * engine.walkers.length)];
        const id = engineFlyer({ depth: 1, bush: false });
        later(() => engineShoot(id, shooter ?? null), 1500);
    }

    // The bonfire's last stage in the current scene; whether the scene needs it (only when that is above its stage).
    function setBonfireMax() {
        const b = engineBonfire();
        b.stageMax = BONFIRE_STAGE_MAX[Math.min(engine.scene, engine.sceneStages - 1)];
        bonfireNeeded = engine.scene < engine.sceneStages && b.stageMax > b.stage;
        // The circle's last stage is 0 before the final scene.
        const c = engineCircle();
        if (c) c.stageMax = engine.scene >= engine.sceneStages ? CIRCLE_STAGES : 0;
    }

    // Stages past 4 belong to later scenes: the jump moves the scene along with them; the bonfire stands where the
    // scenes before left it.
    function engineJump(stage) {
        // The bar has no stages: a jump goes to the first scene of the patch that reaches the stage.
        engine.scene = SCENE_STAGE_MAX.findIndex((max, i) => i > 0 && max >= stage);
        engine.stageMax = SCENE_STAGE_MAX[engine.scene];
        engine.ready = false;
        if (inBarZone) {
            inBarZone = false;
            engine.bar = { ...engine.bar, mugs: 0, pouring: null };
            engine.walkers.forEach((w) => { w.walk = standing(clampToZone(walkPoint(w.walk, serverTime())), serverTime()); });
        }
        engine.finale = engine.scene >= engine.sceneStages ? finaleOf(0) : null;
        enginePumpkins().forEach((e) => { e.stage = stage; e.clicks = 0; });
        Object.assign(engineBonfire(), { stage: engine.scene > 0 ? BONFIRE_STAGE_MAX[engine.scene - 1] : 0, clicks: 0 });
        setBonfireMax();
        engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        client.load(engineSnapshot());
    }

    // ?scene=N / ?ready=1 / ?finale=N / ?paused=1 / ?zombies=1: the state the lab starts from.
    function startState() {
        const sceneParam = params.has('finale') ? engine.sceneStages : Number.parseInt(params.get('scene') ?? '', 10);
        if (Number.isInteger(sceneParam)) {
            engine.scene = Math.max(0, Math.min(engine.sceneStages, sceneParam));
            engine.stageMax = SCENE_STAGE_MAX[engine.scene];
            const stage = engine.scene > 0 ? SCENE_STAGE_MAX[engine.scene - 1] : 0;
            enginePumpkins().forEach((e) => { e.stage = stage; e.clicks = 0; });
            engineBonfire().stage = engine.scene > 0 ? BONFIRE_STAGE_MAX[engine.scene - 1] : 0;
            if (engine.scene > 0) engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        }
        // ?ready=1 in the bar: the goal is reached already.
        if (engine.scene === 0 && params.get('ready') === '1') {
            engine.bar.drunk = Math.max(engine.bar.drunk, engine.bar.target);
            engine.ready = true;
        }
        if (params.has('bonfire')) engineBonfire().stage = Math.max(0, Math.min(7, Number.parseInt(params.get('bonfire'), 10) || 0));
        if (params.has('circle') && engineCircle()) engineCircle().stage = Math.max(0, Math.min(CIRCLE_STAGES, Number.parseInt(params.get('circle'), 10) || 0));
        setBonfireMax();
        if (params.get('ready') === '1' && engine.scene < engine.sceneStages) {
            enginePumpkins().forEach((e) => { e.stage = engine.stageMax; e.clicks = 0; });
            engineBonfire().stage = Math.max(engineBonfire().stage, engineBonfire().stageMax);
            engine.ready = true;
        }
        if (params.get('ritual') === '1') {
            engine.scene = engine.sceneStages;
            engine.stageMax = SCENE_STAGE_MAX[engine.scene];
            enginePumpkins().forEach((e) => { e.stage = engine.stageMax; e.clicks = 0; });
            engineBonfire().stage = BONFIRE_STAGE_MAX[engine.scene - 1];
            setBonfireMax();
            if (engineCircle()) engineCircle().stage = CIRCLE_STAGES;
            engine.ready = true;
            engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        }
        if (engine.scene >= engine.sceneStages) {
            Object.assign(stats, { clicks: 5230, jobs: 312, burned: 1720, shot: 87, drinks: 41, lastPumpkin: { id: ME, name: 'Jack' } });
            // From step 1 on the circle is closed and the scene stays ready (protocol.md).
            if ((Number.parseInt(params.get('finale') ?? '0', 10) || 0) >= 1 && engineCircle()) {
                engineCircle().stage = CIRCLE_STAGES;
                engine.ready = true;
            }
            engine.finale = finaleOf(Math.max(0, Math.min(LAST_STEP, Number.parseInt(params.get('finale') ?? '0', 10) || 0)));
            engine.walkers.forEach((w) => { w.item = itemOfFinale(engine.finale.step); });
        }
        engine.paused = params.get('paused') === '1';
        engine.zombies = params.get('zombies') === '1';
    }

    // At the start of the run: the owl's line and the special flyers of the query; returns the zombie and the first
    // worm (?zshot, ?wshot).
    function startEvents() {
        if (params.has('owl')) deliver({ type: 'owl', line: params.get('owl'), ...(params.get('owl').match(/last-pumpkin|witch-down/) ? { params: { player: someone() ?? { id: ME, name: null } } } : {}) });
        if (params.has('say')) deliver({ type: 'owl', text: params.get('say') });
        // Seeded, so a frozen screenshot shows the same worms every time.
        const worms = params.get('worms') === '1' ? [0, 1, 2].map(() => engineWorm(seeded(4242 + flyerSeq))) : [];
        let zombie = null;
        if (params.get('specials') === '1') {
            engineFlyer({ kind: 'witch', depth: 2, bush: false, ltr: true });
            engineRoadrunner(false);
            zombie = engineZombie(Math.PI * 0.62);
        }
        // ?fireflies=1: three fireflies right away, one far-ish and two near (one out of a bush).
        const fireflies = params.get('fireflies') === '1'
            ? [engineFlyer({ kind: 'firefly', depth: 1, bush: false, ltr: true }), engineFlyer({ kind: 'firefly', depth: 2, bush: false, ltr: false }), engineFlyer({ kind: 'firefly', depth: 2, bush: 'bush-1' })]
            : [];
        return { zombie, worm: worms[0] ?? null, firefly: fireflies[1] ?? null };
    }

    const scene = await createScene(root, readSnapshot(root));
    root.classList.add(scene ? 'has-canvas' : 'no-canvas');
    if (params.has('hits')) scene?.showHits(true);
    // ?sound=1: the real audio engine, wired like app.js (the first press anywhere unlocks it).
    let client = null;
    let sound = null;
    if (params.get('sound') === '1') {
        const [{ createAudio }, { bindSoundControls, bindUiClicks, createSound }] = await Promise.all([import('/js/audio/engine.js'), import('/js/sound.js')]);
        const audio = createAudio();
        audio.unlockOn(document);
        bindSoundControls(root, audio);
        bindUiClicks(root, audio);
        sound = createSound(audio, { serverNow: () => client?.serverNow() ?? Date.now(), owlGone: () => Boolean(scene?.owlGone?.()) });
        window.audio = audio;
    }
    const owl = createOwl(root, scene, { ...(simulated ? { now: () => simTime, later } : {}), onShow: (line) => sound?.owl(line) });
    const reveal = createReveal(root);
    // The lab shows the console when it plays the moderator (?mod=1); the fake engine answers like the server would.
    const moderatorConsole = initDebugPanel(root.querySelector('[data-debug-panel]'), {
        open: params.get('ui') !== '0' ? undefined : false,
        call: engineCall,
        clickAll: () => engine.elements.forEach((e, i) => later(() => client.clickable(e.id) && engineClick(e.id, randomClicker()), i * 30)),
    });
    client = createClient(root, scene, {
        requestState: async () => engineSnapshot(),
        now: clientTime,
        owl,
        reveal,
        sound,
        onChange: (model) => moderatorConsole?.update(model),
    });
    client.start();
    client.setStatus('connected');
    startState();
    client.load(engineSnapshot());
    client.setModerator(moderator && params.get('ui') !== '0');
    if (params.get('ui') === '0') root.querySelector('[data-lab-panel]').hidden = true;
    if (params.get('me') === '1') client.setMe(ME);
    bindWalking(root, scene, () => client.canWalk(), (point) => engineMove(ME, point));
    const join = initJoin(document.querySelector('[data-join]'), { register: engineRegister });
    root.querySelector('[data-join-open]').addEventListener('click', () => join.open());
    if (params.get('join') === '1') join.open();
    root.querySelector('[data-lab-shot]').addEventListener('click', engineShotByWalker);
    const still = params.get('still') === '1';
    if (!simulated && !clinkStart && !clickClinkStart && !barPairs && !barDemo && !still) wanderers().forEach((w) => wander(w.id));
    // Handle for scripted checks from the console or a test page.
    window.lab = { client, engine, scene };
    if (startStage > 4) engineJump(startStage);

    // Random clicks go where a click counts: an open bonfire, else the pumpkins (like a room would).
    const randomId = () => {
        const open = engine.elements.filter((e) => client.clickable(e.id));
        const bonfire = open.find((e) => e.type === 'bonfire');
        if (bonfire && Math.random() < 0.7) return bonfire.id;
        const list = open.filter((e) => e.type !== 'bonfire' && e.stage < engine.stageMax);
        return (list.length ? list : open)[Math.floor(Math.random() * (list.length || open.length))].id;
    };
    // Your clinks by click, warned like app.js warns a rejected RPC.
    const labClink = (target) => {
        const reply = engineClink(ME, target);
        if (!reply.ok) console.warn('clink rejected', reply.error);
    };
    // Like app.js: a locked bonfire is not even asked, a reachable pumpkin in the cursed world takes a clink instead.
    root.addEventListener('click', (event) => {
        const el = event.target.closest('[data-element]');
        if (!el) return;
        if (client.clinksPumpkin(el.dataset.element)) labClink({ pumpkin: el.dataset.element });
        else if (client.clickable(el.dataset.element)) engineClick(el.dataset.element, myClicker());
    });
    root.querySelector('[data-lab-click]').addEventListener('click', () => engineClick(randomId(), randomClicker()));
    root.querySelector('[data-lab-duck]').addEventListener('click', () => engineFlyer());
    // Your shots are yours when your character is on the field: a witch then gets the owl's `witch-down`.
    bindShooting(root, scene, (id) => engineShoot(id, engine.walkers.find((w) => w.id === ME) ?? null));
    bindClinking(root, scene, client, labClink);
    // The bar like app.js: the counter, Space and «Выпить»; `not clinked` is a hint over my walker only.
    const warned = (reply, method) => {
        if (!reply.ok) console.warn(`${method} rejected`, reply.error);
        return reply;
    };
    bindBar(root, client, {
        take: () => warned(engineTake(ME), 'bar.take'),
        drink: () => {
            const reply = warned(engineDrink(ME), 'drink');
            if (reply.error === 'not clinked') scene?.hint?.(ME, LINES['bar-clink'].text);
        },
    });
    // The scene's moments: the sound, and the automatic clinks of the bar — my browser reports mine (like app.js), the
    // bots theirs, each with its nearest partner holding beer.
    scene?.onCue((cue) => {
        sound?.cue(cue);
        if (cue?.type !== 'clink' || engine.scene !== 0 || !Array.isArray(cue.sides)) return;
        const partner = client.autoClinkPartner(cue);
        if (partner && warned(engineClinkAuto(ME, { walker: partner }), 'clink.auto').ok) client.clinkedAuto();
        for (const side of cue.sides) {
            if (side.id === ME) continue;
            const mate = cue.sides.filter((o) => o.id !== side.id).sort((a, b) => Math.hypot(a.x - side.x, a.y - side.y) - Math.hypot(b.x - side.x, b.y - side.y))[0];
            if (mate) engineClinkAuto(side.id, { walker: mate.id });
        }
    });
    // A flyer every 3–8 s, like the server's launcher; none while paused.
    const launchLater = () => setTimeout(() => {
        if (!engine.paused) engineFlyer();
        launchLater();
    }, 3000 + Math.random() * 5000);
    // Zombies only in the cursed world, with zombies on and no pause (HELLOWIN_ZOMBIE_INTERVAL 4000-9000).
    const zombieLater = () => setTimeout(() => {
        if (engine.zombies && !engine.paused && engine.finale?.step === LAST_STEP) engineZombie();
        zombieLater();
    }, 4000 + Math.random() * 5000);
    if (!simulated) {
        setInterval(() => deliver({ type: 'leaderboard', top: [], online: engine.walkers.length }), 5000);
        launchLater();
        zombieLater();
        later(startEvents, 500);
        tickBar();
        if (barDemo) barDemoSteps();
        // ?bar=1: the paired bots drink once their beer is clinked, then fetch the next one.
        if (barPairs) setInterval(() => wanderers().forEach((w) => engine.scene === 0 && (w.clinked ? engineDrink(w.id) : w.item !== 'beer' && !w.taking && engineTake(w.id))), 4000);
        if (clickClinkStart) {
            later(startClinks, 800);
            setInterval(startClinks, 9000);
        }
    }
    root.querySelector('[data-lab-stage]').addEventListener('change', (event) => {
        if (event.target.value !== '') engineJump(Number(event.target.value));
        event.target.value = '';
    });

    let auto = 0;
    const autoButton = root.querySelector('[data-lab-auto]');
    const toggleAuto = () => {
        if (auto) {
            clearInterval(auto);
            auto = 0;
        } else {
            auto = setInterval(() => engineClick(randomId(), randomClicker()), 70);
        }
        autoButton.setAttribute('aria-pressed', String(Boolean(auto)));
    };
    autoButton.addEventListener('click', toggleAuto);
    if (params.get('auto') === '1' && !simulated) toggleAuto();

    const initial = engineSnapshot();
    const resetAt = Number.parseInt(params.get('reset') ?? '-1', 10);
    const flyersOn = params.get('flyers') === '1';
    const shotAt = Math.round((Number.parseInt(params.get('shotAt') ?? '896', 10) || 896) / 16) * 16;
    const nextAt = params.has('next') ? Math.round(Number.parseInt(params.get('next'), 10) / 16) * 16 : -1;
    const playAt = params.has('play') ? Math.round(Number.parseInt(params.get('play'), 10) / 16) * 16 : -1;
    function simulate() {
        Object.assign(engine, structuredClone(initial));
        setBonfireMax();
        queue.length = 0;
        pending.clear();
        live.clear();
        clinkedAt.clear();
        inBarZone = engine.scene === 0;
        emptySaidAt = -Infinity;
        takeSeq = 0;
        flyerSeq = 0;
        deliveredBy = 0;
        client.load(engineSnapshot());
        let nextClick = 0;
        let target = null;
        let zombie = null;
        let worm = null;
        let firefly = null;
        const fireflyShotAt = Math.round((Number.parseInt(params.get('fshot') ?? '-1', 10)) / 16) * 16;
        const zombieShotAt = Math.round((Number.parseInt(params.get('zshot') ?? '-1', 10)) / 16) * 16;
        const wormShotAt = Math.round((Number.parseInt(params.get('wshot') ?? '-1', 10)) / 16) * 16;
        for (simTime = 0; simTime < freeze; simTime += 16) {
            if (params.get('auto') === '1' && simTime >= nextClick) {
                engineClick(randomId(), randomClicker());
                nextClick += 70;
            }
            if (simTime === resetAt) engineReset();
            if (simTime === nextAt) engineSceneNext({ scene: engine.scene, force: true });
            if (simTime === playAt && engine.finale) engineFinaleStep({ step: engine.finale.step + 1, force: true });
            // ?flyers=1: one flyer per depth right away (the near one from a bush); ?shoot=N (default 1) is shot at ?shotAt=ms (default 896, a multiple of 16).
            if (flyersOn && simTime === 0) {
                const kind = params.get('kind') ?? undefined;
                const launched = [engineFlyer({ kind, depth: 0, bush: false, ltr: true }),
                    engineFlyer({ kind, depth: 1, bush: false, ltr: false }),
                    engineFlyer({ kind, depth: 2, bush: 'bush-1' })];
                target = launched[Math.min(2, Math.max(0, Number.parseInt(params.get('shoot') ?? '1', 10) || 0))];
            }
            if (flyersOn && simTime === shotAt) engineShoot(target, params.get('shooter') === '1' ? engine.walkers[0] : null);
            if (simTime === 0) ({ zombie, worm, firefly } = startEvents());
            if (simTime === 0 && clickClinkStart) {
                clinkRounds = 0;
                startClinks();
            }
            if (firefly && simTime === fireflyShotAt) engineShoot(firefly, engine.walkers[0] ?? null);
            if (zombie && simTime === zombieShotAt) engineShoot(zombie, engine.walkers[0] ?? null);
            if (worm && simTime === wormShotAt) engineShoot(worm, engine.walkers[0] ?? null);
            // Frozen bots all set off at the start, so a screenshot catches them on the way.
            if (simTime === 0) {
                tickBar();
                if (barDemo) barDemoSteps();
            }
            if (simTime === 0 && !finaleStart && !barPairs && !barDemo && !still) {
                const random = seeded(99);
                // The ?shooter=1 walker stays put: a walker on the way does not stop to shoot.
                wanderers().filter((w, i) => !(i === 0 && params.get('shooter') === '1')).forEach((w) => engineMove(w.id, randomTarget(random)));
            }
            queue.sort((a, b) => a.at - b.at);
            while (queue.length && queue[0].at <= simTime) queue.shift().fn();
            scene?.step(16);
        }
    }

    // ?fps=1 logs the frame rate every 2 s (counts animation frames, the same ones Pixi renders on).
    if (params.get('fps') === '1') {
        let frames = 0;
        let since = performance.now();
        const count = (now) => {
            frames++;
            if (now - since >= 2000) {
                console.log('FPS', Math.round((frames * 1000) / (now - since)));
                frames = 0;
                since = now;
            }
            requestAnimationFrame(count);
        };
        requestAnimationFrame(count);
    }

    if (simulated) {
        simulate();
        // Headless Edge resizes the window right before the capture; replaying keeps the frozen frame at the final
        // size. Runs before paint, unlike the debounced resize inside the scene.
        let size = `${root.clientWidth}x${root.clientHeight}`;
        new ResizeObserver(() => {
            const next = `${root.clientWidth}x${root.clientHeight}`;
            if (next !== size) {
                size = next;
                simulate();
            }
        }).observe(root);
    }
</script>
</body>
</html>
