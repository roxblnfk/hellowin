        const due = Math.max(walk.arrivesAt, targetWalk?.arrivesAt ?? 0) + CLINK_TICK;
        later(() => {
            if (w.walk !== walk || w.clink !== target) return;
            delete w.clink;
            if (t && (t.walk !== targetWalk || !engine.walkers.includes(t))) return;
            // In the bar nobody may have drunk up on the way; the clink counts for both mugs.
            if (bar && (engine.scene !== 0 || w.item !== 'beer' || t?.item !== 'beer')) return;
            // The clink counts for both mugs; with a pumpkin, for the one who came up.
            w.clinked = true;
            if (t) t.clinked = true;
            const at = serverTime();
            clinkedUntil.set(id, at + CLINK_DURATION);
            if (t) clinkedUntil.set(t.id, at + CLINK_DURATION);
            deliver({ type: 'clink', player: { id }, ...target, toast: toast ?? Math.floor(Math.random() * 2 ** 31), at });
        }, due - serverTime());
        return { ok: true, walk };
    }

    // `clink {roadrunner: true}` like WalkService::clinkRoadrunner: `not bar`, `no target` (he is not behind the
    // counter), `no beer`, `busy`; a walk to the counter's line in front of him (the free spot of the real server is
    // not looked for), then on arrival `clink {roadrunner: true}` if the bar, he and the beer are all still there.
    function engineClinkRoadrunner(w, toast) {
        const id = w.id;
        if (engine.scene !== 0) return { ok: false, error: 'not bar' };
        if (!engine.bar.roadrunner || !BAR.roadrunner) return { ok: false, error: 'no target' };
        if (w.item !== 'beer') return { ok: false, error: 'no beer' };
        if (w.clinked) return { ok: true };
        if (serverTime() < (clinkedUntil.get(id) ?? -Infinity)) return { ok: false, error: 'busy' };
        const target = { roadrunner: true };
        const spot = { x: Math.min(BAR.counter.x2, Math.max(BAR.counter.x1, BAR.roadrunner.x)), y: BAR.counter.y };
        const { walk } = engineMove(id, spot, target);
        later(() => {
            if (w.walk !== walk || w.clink !== target) return;
            delete w.clink;
            if (engine.scene !== 0 || !engine.bar.roadrunner || w.item !== 'beer') return;
            w.clinked = true;
            const at = serverTime();
            clinkedUntil.set(id, at + CLINK_DURATION);
            deliver({ type: 'clink', player: { id }, roadrunner: true, toast: toast ?? Math.floor(Math.random() * 2 ** 31), at });
        }, walk.arrivesAt + CLINK_TICK - serverTime());
        return { ok: true, walk };
    }

    // ?clickclink=1: the bots clink by click themselves — the first round with fixed toasts, later ones random; ?toast=N always N.
    let clinkRounds = 0;
    function startClinks() {
        const first = clinkRounds++ === 0;
        const bots = wanderers();
        const forced = params.has('toast') ? Number.parseInt(params.get('toast'), 10) || 0 : null;
        const plans = [[0, 1, 27], [2, 'pumpkin-10', 1], [3, 4, 0]];
        for (const [by, target, toast] of plans) {
            if (!bots[by] || (typeof target === 'number' && !bots[target])) continue;
            engineClink(bots[by].id, typeof target === 'number' ? { walker: bots[target].id } : { pumpkin: target }, forced ?? (first ? toast : null));
        }
    }

    // The bar as the server plays it (protocol.md, «Бар»). The ticker pours one mug at a time while there is room; the
    // first walker to reach the counter gets a mug, a latecomer none (and the owl's `bar-empty`, at most every 20 s).
    const BAR_TICK = 200;
    const EMPTY_LINE_MS = 20000;
    let emptySaidAt = -Infinity;
    let takeSeq = 0;
    function pourTick() {
        if (engine.scene !== 0) return;
        const now = serverTime();
        const bar = engine.bar;
        if (bar.pouring && now >= bar.pouring.until) {
            bar.mugs++;
            bar.pouring = null;
            deliver({ type: 'mugs', mugs: bar.mugs });
        }
        if (!bar.pouring && bar.mugs < BAR_MUGS) {
            bar.pouring = { since: now, until: now + POUR_MS };
            if (Math.random() < RUMOR_CHANCE) bar.pouring.rumor = Math.floor(Math.random() * 2 ** 31);
            deliver({ type: 'pour', ...bar.pouring });
        }
    }

    // The bar is ready once the hall has drunk its goal or the moderator waved: once per round, `ready` and `bar-intro`.
    function barReady() {
        if (engine.scene !== 0 || engine.ready) return;
        engine.ready = true;
        deliver({ type: 'ready', scene: 0 });
        deliver({ type: 'owl', line: 'bar-intro' });
    }
    const drinksEvent = () => deliver({ type: 'drinks', drunk: engine.bar.drunk, target: engine.bar.target });
    // The moderator's addition on top of the formula, until the round ends; the goal not below 1.
    function engineBarTarget({ delta }) {
        if (!Number.isInteger(delta)) throw new Error('invalid delta');
        if (engine.scene !== 0) throw new Error('not bar');
        limitBonus.bar = Math.max(limitBonus.bar + delta, 1 - formula('bar'));
        settleLimits();
        return { ok: true, target: engine.bar.target };
    }
    function engineBarReady() {
        if (engine.scene !== 0) throw new Error('not bar');
        barReady();
        return { ok: true };
    }
    function tickBar() {
        pourTick();
        later(tickBar, BAR_TICK);
    }

    function engineTake(id) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (engine.scene !== 0) return { ok: false, error: 'not bar' };
        if (w.item === 'beer') return { ok: false, error: 'has beer' };
        if (drinkBusy(id)) return { ok: false, error: 'busy' };
        const here = walkPoint(w.walk, serverTime());
        const spot = { x: Math.min(BAR.counter.x2, Math.max(BAR.counter.x1, here.x)), y: BAR.counter.y };
        const { walk } = engineMove(id, spot);
        const token = ++takeSeq;
        w.taking = token;
        later(() => {
            if (w.taking !== token || engine.scene !== 0) return;
            w.taking = null;
            if (engine.bar.mugs > 0) {
                engine.bar.mugs--;
                w.item = 'beer';
                w.clinked = false;
                deliver({ type: 'take', player: { id }, ok: true, mugs: engine.bar.mugs });
                return;
            }
            deliver({ type: 'take', player: { id }, ok: false });
            if (serverTime() - emptySaidAt >= EMPTY_LINE_MS) {
                emptySaidAt = serverTime();
                deliver({ type: 'owl', line: 'bar-empty' });
            }
        }, walk.arrivesAt + CLINK_TICK - serverTime());
        return { ok: true, walk };
    }

    function engineDrink(id) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (!drinkWorld()) return { ok: false, error: 'not bar' };
        if (w.item !== 'beer') return { ok: false, error: 'no beer' };
        if (!w.clinked && engine.walkers.length > 1) return { ok: false, error: 'not clinked' };
        if (drinkBusy(id) || serverTime() < (clinkedUntil.get(id) ?? -Infinity)) return { ok: false, error: 'busy' };
        w.item = null;
        w.clinked = false;
        drankAt.set(id, serverTime());
        stats.drinks++;
        // On the pause the beer is drunk, but no goal grows.
        if (engine.paused) {
            deliver({ type: 'drink', player: { id }, counted: false });
            return { ok: true, counted: false };
        }
        deliver({ type: 'drink', player: { id } });
        if (engine.scene !== 0) {
            if (engine.cursed) {
                engine.cursed.drunk++;
                cursedUpdate();
            }
            return { ok: true };
        }
        engine.bar.drunk++;
        drinksEvent();
        if (engine.bar.drunk >= engine.bar.target) barReady();
        return { ok: true };
    }

    // Reported by a participant's browser at the strike of an automatic clink; counts for the caller only, says nothing.
    function engineClinkAuto(id, { walker } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (!drinkWorld()) return { ok: false, error: 'not bar' };
        if (w.item !== 'beer') return { ok: false, error: 'no beer' };
        const t = engine.walkers.find((x) => x.id === walker);
        const now = serverTime();
        if (!t || walker === id || t.item !== 'beer') return { ok: false, error: 'no target' };
        const a = walkPoint(w.walk, now);
        const b = walkPoint(t.walk, now);
        if (Math.hypot(a.x - b.x, a.y - b.y) > BAR.clink_reach) return { ok: false, error: 'no target' };
        if (w.clinked) return { ok: true };
        w.clinked = true;
        clinkedUntil.set(id, now + CLINK_DURATION);
        return { ok: true };
    }

    // Drinking and automatic clinks: in the bar and in the cursed world while it still has beer (steps 5–6).
    const drinkWorld = () => engine.scene === 0 || (engine.scene >= engine.sceneStages && [CURSED_STEP, BOSS_STEP].includes(engine.finale?.step));

    // The cursed world's goal (protocol.md, «Рапира»): the limits `drinks` and `zombies` with the moderator's
    // additions; both met — `ready` and `cursed-ready` once per round.
    let cursedReadySaid = false;
    const cursedTargets = () => ({ drinksTarget: limitOf('drinks'), zombiesTarget: limitOf('zombies') });
    function cursedUpdate() {
        if (!engine.cursed) return;
        Object.assign(engine.cursed, cursedTargets());
        deliver({ type: 'cursed', ...engine.cursed });
        const c = engine.cursed;
        if (engine.paused || engine.finale?.step !== CURSED_STEP || cursedReadySaid || c.drunk < c.drinksTarget || c.slain < c.zombiesTarget) return;
        cursedReadySaid = true;
        engine.ready = true;
        deliver({ type: 'ready', scene: engine.scene });
        deliver({ type: 'owl', line: 'cursed-ready' });
    }
    function engineCursedTarget({ goal, delta }) {
        if (engine.finale?.step !== CURSED_STEP || engine.scene < engine.sceneStages) throw new Error('not cursed');
        if (goal !== 'drinks' && goal !== 'zombies') throw new Error('invalid goal');
        if (!Number.isInteger(delta)) throw new Error('invalid delta');
        // Not below 1: the addition stops where the target would.
        limitBonus[goal] = Math.max(limitBonus[goal] + delta, 1 - formula(goal));
        settleLimits();
        return { ok: true, target: engine.cursed[goal === 'drinks' ? 'drinksTarget' : 'zombiesTarget'] };
    }
    // The addition to his max; the damage stays (settleLimits).
    function engineBossHp({ delta }) {
        if (!Number.isInteger(delta)) throw new Error('invalid delta');
        if (!engine.boss || engine.boss.hp <= 0) throw new Error('not now');
        limitBonus.boss = Math.max(limitBonus.boss + delta, 1 - formula('boss'));
        settleLimits();
        return { ok: true, ...engine.boss };
    }

    // `beer {pumpkin}` at step 5: a walk to the pumpkin like a clink with it, a mug on arrival — bottomless. The `take`
    // goes out on arrival with `until`, when the hand-over is over; the walker holds the beer from then.
    function engineBeer(id, { pumpkin } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (engine.scene < engine.sceneStages || engine.finale?.step !== CURSED_STEP) return { ok: false, error: 'not cursed' };
        if (w.item === 'beer') return { ok: false, error: 'has beer' };
        if (drinkBusy(id)) return { ok: false, error: 'busy' };
        const p = engine.elements.find((e) => e.id === pumpkin);
        if (!p || p.type !== 'pumpkin' || !p.reachable) return { ok: false, error: 'no target' };
        const { walk } = engineMove(id, clampToZone(p));
        const token = ++takeSeq;
        w.taking = token;
        later(() => {
            if (w.taking !== token || engine.finale?.step !== CURSED_STEP) return;
            w.taking = null;
            const until = serverTime() + HANDOVER_MS;
            handUntil.set(id, until);
            w.clinked = false;
            deliver({ type: 'take', player: { id }, pumpkin: { id: pumpkin }, ok: true, until });
            later(() => {
                if (engine.walkers.includes(w) && engine.finale?.step === CURSED_STEP) w.item = 'beer';
            }, HANDOVER_MS);
        }, walk.arrivesAt + CLINK_TICK - serverTime());
        return { ok: true, walk };
    }

    // `word {text}` at step 6. The lab does not know the word (only the server does): ?word=ok / ?word=fail, by default
    // every second answer is wrong. The first right one wakes the boss.
    let wordSeq = 0;
    function engineWord(id, { text } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (engine.scene < engine.sceneStages || engine.finale?.step !== BOSS_STEP) return { ok: false, error: 'not now' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (w.item === 'rapier') return { ok: false, error: 'has rapier' };
        const said = typeof text === 'string' ? text.trim() : '';
        if (said.length < 1 || said.length > 40) return { ok: false, error: 'invalid text' };
        const mode = params.get('word');
        const correct = mode === 'ok' ? true : mode === 'fail' ? false : wordSeq++ % 2 === 0;
        if (correct) w.item = 'rapier';
        else w.zombie = true;
        deliver({ type: 'word', player: playerOf(w), ok: correct });
        if (correct && !engine.boss) {
            const max = limitOf('boss');
            engine.boss = { hp: max, max };
            deliver({ type: 'boss', ...engine.boss });
        }
        return { ok: true, correct };
    }

    // `cure {walker}`: the first one under the walker's lock; a latecomer gets `cured: false`.
    function engineCure(id, { walker } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (engine.scene < engine.sceneStages || engine.finale?.step !== BOSS_STEP) return { ok: false, error: 'not now' };
        const t = engine.walkers.find((x) => x.id === walker);
        if (!t || walker === id) return { ok: false, error: 'no target' };
        if (!t.zombie) return { ok: true, cured: false };
        delete t.zombie;
        deliver({ type: 'cure', player: playerOf(t), by: playerOf(w) });
        return { ok: true, cured: true };
    }

    // `strike {}`: −1 under the boss's lock; the last blow names its striker and brings the dawn.
    function engineStrike(id) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (!engine.boss || engine.boss.hp <= 0 || engine.finale?.step !== BOSS_STEP) return { ok: false, error: 'not now' };
        if (w.item !== 'rapier') return { ok: false, error: 'no rapier' };
        stats.damage++;
        // On the pause the lightning strikes, the health stays.
        if (engine.paused) {
            deliver({ type: 'strike', player: playerOf(w), hp: engine.boss.hp, counted: false });
            return { ok: true, hp: engine.boss.hp, counted: false };
        }
        engine.boss.hp--;
        deliver({ type: 'strike', player: playerOf(w), hp: engine.boss.hp });
        if (engine.boss.hp === 0) {
            deliver({ type: 'owl', line: 'boss-down', params: { player: playerOf(w) } });
            engineFinaleStep({ step: LAST_STEP });
        }
        return { ok: true, hp: engine.boss.hp };
    }

    // A zombie player is walked by the server: an ordinary move over the lawn every 2–4 s.
    function zombieWalks() {
        for (const w of engine.walkers) {
            if (!w.zombie || serverTime() < (w.shambleAt ?? 0)) continue;
            w.shambleAt = serverTime() + 2000 + Math.random() * 2000;
            engineMove(w.id, randomTarget());
        }
        later(zombieWalks, 500);
    }

    // The bots in the cursed world: beer from a pumpkin, a clink, a drink (step 5); the word, curing the zombies (step 6).
    function cursedBot(w) {
        const step = engine.finale?.step;
        const reachable = enginePumpkins().filter((e) => e.reachable);
        if (w.zombie) return null;
        if (step === CURSED_STEP) {
            if (w.item !== 'beer') return w.taking ? null : engineBeer(w.id, { pumpkin: pick(reachable).id });
            if (w.clinked) return engineDrink(w.id);
            return Math.random() < 0.5 ? engineClink(w.id, { pumpkin: pick(reachable).id }) : engineMove(w.id, randomTarget());
        }
        if (step === BOSS_STEP) {
            const zombie = engine.walkers.find((x) => x.zombie && x.id !== w.id);
            if (zombie && Math.random() < 0.6) return engineCure(w.id, { walker: zombie.id });
            if (w.item !== 'rapier') return engineWord(w.id, { text: 'рапира' });
        }
        return engineMove(w.id, randomTarget());
    }

    // ?strike=1: every bot with a rapier strikes FrankenPHP every 600 ms.
    function strikeBots() {
        if (params.get('strike') === '1') wanderers().forEach((w) => w.item === 'rapier' && engineStrike(w.id));
        later(strikeBots, 600);
    }

    // The dice of finale step 1 like DiceService: HELLOWIN_DICE_COOLDOWN_MS between a player's throws; the faces of an
    // attempt are a hash of it, so a repeat answers the same throw (the lab keeps the thrown ones, for ?roll and
    // ?bots666 bend some of them).
    const DICE_COOLDOWN_MS = 1800;
    const SIX = [6, 6, 6];
    const diceState = { last: new Map(), at: new Map(), thrown: new Map(), uncounted: new Map(), owl: 0, botAt: new Map() };
    const rollParam = (params.get('roll') ?? '').split(',').map((n) => Number.parseInt(n, 10));
    let forcedRoll = rollParam.length === 3 && rollParam.every((n) => n >= 1 && n <= 6) ? rollParam : null;
    const bots666 = Math.max(0, Number.parseInt(params.get('bots666') ?? '0', 10) || 0);
    const isSix = (d) => d.every((n) => n === 6);
    function fnv(text) {
        let h = 0x811c9dc5;
        for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 0x01000193) >>> 0;
        return h;
    }
    const facesOf = (key) => [0, 1, 2].map((i) => 1 + (fnv(`${key}:${i}`) % 6));
    const diceOn = () => engine.scene >= engine.sceneStages && engine.finale?.step === 1 && engine.dice?.on === true;

    function diceForget() {
        diceState.last.clear();
        diceState.at.clear();
        diceState.thrown.clear();
        diceState.uncounted.clear();
        diceState.botAt.clear();
        diceState.owl = 0;
    }

    function diceBegin() {
        diceForget();
        engine.dice = { on: true };
        // The bots' first throws come one after another, once their pages have counted the owl's countdown down.
        wanderers().forEach((w, i) => diceState.botAt.set(w.id, serverTime() + SUMMON_MS + 300 + i * 450));
        deliver({ type: 'dice', on: true });
    }

    function diceWin(winner) {
        engine.dice = { on: false, winner };
        engine.ready = true;
        deliver({ type: 'dice', on: false, winner });
        deliver({ type: 'ready', scene: engine.scene });
        deliver(winner.owl ? { type: 'owl', line: 'dice-owl-win' } : { type: 'owl', line: 'dice-win', params: winner });
    }

    // `roll {attempt}`: the last attempt again — the same throw, no event; the next one — a new throw.
    function engineRoll(id, { attempt }) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        if (w.zombie) return { ok: false, error: 'zombified' };
        if (!(engine.scene >= engine.sceneStages && engine.finale?.step === 1 && engine.dice)) return { ok: false, error: 'not now' };
        const last = diceState.last.get(id) ?? 0;
        if (last > 0 && attempt === last) return { ok: true, attempt, dice: diceState.thrown.get(`${id}:${last}`), ...diceState.uncounted.get(`${id}:${last}`) };
        if (!engine.dice.on) return { ok: false, error: 'not now' };
        if (attempt !== last + 1) return { ok: false, error: 'bad attempt', last };
        if (serverTime() - (diceState.at.get(id) ?? -1e12) < DICE_COOLDOWN_MS) return { ok: false, error: 'busy' };
        let faces = facesOf(`${engine.round}:${id}:${attempt}`);
        if (id === ME && forcedRoll) {
            faces = forcedRoll;
            forcedRoll = null;
        } else if (id !== ME) {
            const lucky = bots666 > 0 && id === wanderers()[0]?.id && attempt === bots666;
            faces = lucky ? SIX : isSix(faces) ? [6, 6, 5] : faces;
        }
        diceState.last.set(id, attempt);
        diceState.at.set(id, serverTime());
        diceState.thrown.set(`${id}:${attempt}`, faces);
        // On the pause the attempt is spent, but a 6-6-6 does not win; a repeat answers with the same `counted`.
        const uncounted = engine.paused ? { counted: false } : {};
        diceState.uncounted.set(`${id}:${attempt}`, uncounted);
        stats.rolls++;
        deliver({ type: 'roll', player: playerOf(w), attempt, dice: faces, at: serverTime(), ...uncounted });
        if (isSix(faces) && !engine.paused) diceWin({ player: playerOf(w), attempt });
        return { ok: true, attempt, dice: faces, ...uncounted };
    }

    // «Сова бросает»: anything but 6-6-6 twice, then 6-6-6.
    function engineDiceOwl() {
        if (!diceOn()) throw new Error('not now');
        const attempt = ++diceState.owl;
        let faces = attempt >= 3 ? SIX : facesOf(`${engine.round}:owl:${attempt}`);
        if (attempt < 3 && isSix(faces)) faces = [6, 6, 5];
        deliver({ type: 'roll', owl: true, attempt, dice: faces, at: serverTime() });
        if (isSix(faces)) diceWin({ owl: true, attempt });
        return { ok: true, attempt, dice: faces };
    }

    // The bots throw every 2–4 s (by a hash of their attempt, so a frozen run repeats) while the dice are on.
    function diceBots() {
        if (diceOn()) {
            for (const w of wanderers()) {
                const at = diceState.botAt.get(w.id) ?? serverTime();
                if (serverTime() < at) continue;
                const attempt = (diceState.last.get(w.id) ?? 0) + 1;
                diceState.botAt.set(w.id, serverTime() + 2000 + (fnv(`${w.id}:${attempt}`) % 2000));
                engineRoll(w.id, { attempt });
            }
        }
        later(diceBots, 100);
    }

    // The evening's top like the server's: a player's hit in any scene adds the flyer's points (the player's `points`;
    // a reset keeps them), and the whole board goes out after the `shot`, glued to one `top` per 500 ms
    // (HELLOWIN_TOP_INTERVAL) — most points first, of equal ones the earlier, then the id. The engine keeps it in
    // `engine.dawn`; the snapshot calls it `top` (`dawn` with ?topold=1).
    const dawnScores = new Map();
    const topOld = params.get('topold') === '1';
    const TOP_INTERVAL_MS = 500;
    let topDue = false;
    engine.dawn = { board: [] };
    function dawnBoard() {
        return [...dawnScores]
            .sort(([a, x], [b, y]) => y.points - x.points || x.at - y.at || (a < b ? -1 : a > b ? 1 : 0))
            .map(([id, s]) => ({ player: { id, name: s.name }, points: s.points }));
    }
    function dawnHit(player, points) {
        dawnScores.set(player.id, { points: (dawnScores.get(player.id)?.points ?? 0) + points, at: serverTime(), name: player.name ?? null });
        engine.dawn = { board: dawnBoard() };
        if (topDue) return;
        topDue = true;
        later(() => {
            topDue = false;
            deliver({ type: topOld ? 'dawn' : 'top', board: structuredClone(engine.dawn.board) });
        }, TOP_INTERVAL_MS);
    }
    const DAWN_NAMES = ['Ann', 'Lilith', 'Vlad', 'Пугало', 'Призрак Оля', 'Gremlin', 'Банши', 'Nosferatu', 'Скелетон', 'Moth', 'Леший', 'Wisp'];
    // ?dawnboard=N: a board of N shooters at the start, in any scene, me 12th with 4 points (or last of a shorter one).
    function dawnSeed() {
        dawnScores.clear();
        topDue = false;
        engine.dawn = { board: [] };
        const others = [...wanderers().map(playerOf), ...DAWN_NAMES.map((name, i) => ({ id: `lab-dawn-${String(i).padStart(8, '0')}`, name }))];
        const n = Math.min(others.length + 1, Math.max(0, Number.parseInt(params.get('dawnboard') ?? '0', 10) || 0));
        const mine = Math.min(11, n - 1);
        for (let i = 0, o = 0; i < n; i++) {
            const player = i === mine ? { id: ME, name: 'Я' } : others[o++];
            const points = i === mine ? 4 : Math.max(1, 21 - Math.round(i * 1.6));
            dawnScores.set(player.id, { points, at: serverTime() - 60000 + i * 1000, name: player.name });
        }
        engine.dawn = { board: dawnBoard() };
    }
    // ?dawntop=N: N shooters (the bots on the field first, then shooters off it) of different aim fire at the flyers of
    // any scene, which come thicker; seeded, so a frozen run (?freeze) replays the same overtakes.
    const dawnTop = Math.max(0, Math.min(20, Number.parseInt(params.get('dawntop') ?? '0', 10) || 0));
    let dawnRandom = seeded(1807);
    function dawnShooters() {
        const field = wanderers().map(playerOf);
        const off = DAWN_NAMES.map((name, i) => ({ id: `lab-dawn-${String(i).padStart(8, '0')}`, name }));
        return [...field, ...off].slice(0, dawnTop).map((player, i) => ({ player, aim: 0.3 + 0.7 * (((i * 7) % dawnTop) + 1) / dawnTop }));
    }
    function dawnBots() {
        if (dawnTop) {
            const open = [...live].filter(([, f]) => !f.shot && f.kind !== 'roadrunner' && serverTime() < f.until - 600);
            if (open.length < 3) engineFlyer();
            const shooters = dawnShooters();
            const sum = shooters.reduce((s, x) => s + x.aim, 0);
            let pick = dawnRandom() * sum;
            const shooter = shooters.find((x) => (pick -= x.aim) <= 0) ?? shooters[0];
            if (open.length && dawnRandom() < shooter.aim) engineShoot(open[Math.floor(dawnRandom() * open.length)][0], shooter.player);
        }
        later(dawnBots, 220 + Math.floor(dawnRandom() * 260));
    }

    // The bots' evening in the bar: empty hands go to the counter, a mug in hand looks for company (a clink by click
    // with another beer, or standing by it so the planner clinks), a clinked mug is drunk after a while. Bots report
    // their own automatic clinks like a browser would (botAutoClinks).
    function barBot(w) {
        const others = engine.walkers.filter((x) => x.id !== w.id && x.id !== ME);
        if (w.item !== 'beer') return w.taking ? null : engineTake(w.id);
        if (w.clinked) return Math.random() < 0.5 ? engineDrink(w.id) : null;
        if (engine.bar.roadrunner && Math.random() < 0.25) return engineClink(w.id, { roadrunner: true });
        const mate = others.find((x) => x.item === 'beer');
        if (mate && Math.random() < 0.5) return engineClink(w.id, { walker: mate.id });
        return engineMove(w.id, barTarget());
    }
    const barTarget = (random = Math.random) => clampToBar({ x: BAR.area.x1 + random() * (BAR.area.x2 - BAR.area.x1), y: 58 + random() * (BAR.area.y2 - 58) });

    // The scripted ?bardemo=1 evening, on the frozen clock or live: ms → step.
    function barDemoSteps() {
        const bots = wanderers();
        const at = (ms, fn) => later(fn, ms);
        if (bots.length < 3) return;
        at(300, () => bots.slice(0, 3).forEach((b) => engineTake(b.id)));
        at(5200, () => engineClink(bots[0].id, { walker: bots[1].id }, 2));
        at(10500, () => engineDrink(bots[0].id));
        at(11300, () => engineDrink(bots[1].id));
        at(12000, () => engineTake(bots[2].id));
    }

    // ?rrclink=1: the first bot clinks with RoadRunner (?toast=N — the toast's index).
    function rrClinkSteps() {
        const bot = wanderers()[0];
        if (bot) engineClink(bot.id, { roadrunner: true }, params.has('toast') ? Number.parseInt(params.get('toast'), 10) || 0 : null);
    }

    // ?walkstop=<stop>: my walk is cut where the server has it at ?stopat, and the action's event follows the move,
    // in the server's order.
    const walkTrace = [];
    function walkStopSteps() {
        if (!walkStop) return;
        const stopAt = Math.max(16, Number.parseInt(params.get('stopat') ?? '1600', 10) || 1600);
        const lag = Number.parseInt(params.get('stoplag') ?? '250', 10) || 0;
        const flyer = walkStop === 'shoot' ? engineFlyer({ depth: 1, bush: false }) : null;
        later(() => engineMove(ME, { x: 8, y: 92 }), 0);
        later(() => {
            const w = engine.walkers.find((x) => x.id === ME);
            const now = serverTime();
            w.walk = { path: [round1(walkPoint(w.walk, now + lag))], startedAt: now, arrivesAt: now };
            delete w.clink;
            deliver({ type: 'move', player: { id: ME }, walk: structuredClone(w.walk), stop: walkStop });
            const player = playerOf(w);
            if (walkStop === 'shoot') {
                if (flyer && live.has(flyer)) engineShoot(flyer, w);
                else deliver({ type: 'shot', flyer: 'lab-none', points: 0, player });
            }
            if (walkStop === 'click') engineClick(enginePumpkins()[0].id, player);
            if (walkStop === 'strike') deliver({ type: 'strike', player, ...(engine.boss ? { hp: engine.boss.hp } : {}) });
            if (walkStop === 'drink') deliver({ type: 'drink', player: { id: ME } });
            if (walkStop === 'dice') deliver({ type: 'roll', player, attempt: 1, dice: [3, 5, 6], at: serverTime() });
        }, stopAt);
        if (params.has('walkon')) later(() => engineMove(ME, { x: 90, y: 92 }), Number.parseInt(params.get('walkon'), 10) || 0);
    }

    // ?walkin=N: N bots come into the bar through its door one after another, 1.5 s apart.
    const walkIns = barStart && BAR.door ? Math.max(0, Math.min(8, Number.parseInt(params.get('walkin') ?? '0', 10) || 0)) : 0;
    function walkInSteps() {
        for (let i = 0; i < walkIns; i++) {
            later(() => engineWalker({
                id: `lab-in-${String(i).padStart(10, '0')}`,
                name: BOT_NAMES[(i + 3) % BOT_NAMES.length],
                look: randomLook(seeded(2000 + i)),
                item: null,
                walk: doorWalk(serverTime()),
            }), i * 1500);
        }
    }

    // Name rules of players.md: trimmed, 1–24 letters, digits, single spaces, _ . -, at least one letter or digit.
    // The chat (protocol.md, «Чат»): `say` cleaned like the server's (control characters and line breaks to a space,
    // spaces collapsed), 1…HELLOWIN_CHAT_MAX characters, the bucket HELLOWIN_RPC_RATE_SAY (1 per second, burst 3); a
    // zombie's event goes without its text, the history keeps it. ?chat=N — N bots talk, ?chatzombie=1 — every second of
    // them a zombie worker; with ?mod=1 the history starts with a few lines and the console mutes.
    const CHAT_MAX = Number.parseInt(root.dataset.chatMax, 10) || 120;
    const CHAT_HISTORY = 50;
    const SAY_RATE = { perSecond: 1, burst: 3 };
    const chatLog = [];
    const chatMuted = new Map();
    const sayBuckets = new Map();
    let chatSeq = 0;
    // The history a replay of a frozen run starts from.
    let chatSeed = [];
    const CHAT_LINES = ['кто украл мою метлу?!', 'тыквы сами себя не вырежут', 'ух ты, ведьма!', 'а где пиво?', 'RoadRunner жив, я знаю',
        'кто со мной чокнуться?', 'смотрите, летучая мышь', 'я тут впервые, что делать?', 'ещё по одной!', 'это всё через один воркер?!',
        'не толкайтесь у стойки', 'ура, костёр!'];
    function engineSay(id, { text } = {}) {
        const w = engine.walkers.find((x) => x.id === id);
        if (!w) return { ok: false, error: 'no character' };
        const t = serverTime();
        const bucket = sayBuckets.get(id) ?? { tokens: SAY_RATE.burst, at: t };
        bucket.tokens = Math.min(SAY_RATE.burst, bucket.tokens + ((t - bucket.at) / 1000) * SAY_RATE.perSecond);
        bucket.at = t;
        sayBuckets.set(id, bucket);
        if (bucket.tokens < 1) return { ok: false, error: 'rate limited' };
        bucket.tokens -= 1;
        const said = typeof text === 'string' ? text.replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim() : '';
        if (said.length < 1 || [...said].length > CHAT_MAX) return { ok: false, error: 'invalid text' };
        if (chatMuted.has(id)) return { ok: false, error: 'muted' };
        const player = playerOf(w);
        chatLog.push({ id: `m-${++chatSeq}`, player, text: said, ...(w.zombie ? { zombie: true } : {}), at: t });
        chatLog.splice(0, Math.max(0, chatLog.length - CHAT_HISTORY));
        deliver(w.zombie ? { type: 'say', player, zombie: true, at: t } : { type: 'say', player, text: said, at: t });
        return { ok: true };
    }
    const chatBots = () => wanderers().slice(0, Math.max(0, Number.parseInt(params.get('chat') ?? '0', 10) || 0));
    function chatSetup() {
        if (params.get('chatzombie') === '1') chatBots().forEach((w, i) => i % 2 === 1 && (w.zombie = true));
        if (!moderator) return;
        const [a, b] = wanderers();
        const t = serverTime();
        if (a) chatLog.push({ id: `m-${++chatSeq}`, player: playerOf(a), text: 'всем привет из лаборатории!', at: t - 95000 });
        if (b) chatLog.push({ id: `m-${++chatSeq}`, player: playerOf(b), text: 'где тут пиво наливают?', zombie: true, at: t - 61000 });
        if (a) chatLog.push({ id: `m-${++chatSeq}`, player: playerOf(a), text: 'у стойки, справа', at: t - 30000 });
        chatSeed = structuredClone(chatLog);
    }
    // Under ?freeze every chatting bot speaks at once, a little apart, so a frozen frame shows their bubbles.
    function chatBotsTalk(random = Math.random) {
        chatBots().forEach((w, i) => later(() => engineSay(w.id, { text: CHAT_LINES[Math.floor(random() * CHAT_LINES.length)] }), 120 + i * 140));
    }
    function engineChatMute({ player, on } = {}) {
        const w = engine.walkers.find((x) => x.id === player);
        const known = w ? playerOf(w) : chatLog.find((m) => m.player.id === player)?.player;
        if (!known) throw new Error('no target');
        if (typeof on !== 'boolean') throw new Error('invalid on');
        if (on) chatMuted.set(known.id, known);
        else chatMuted.delete(known.id);
        return { ok: true, muted: [...chatMuted.values()] };
    }

    async function engineRegister(rawName, look) {
        const name = rawName.trim();
        if (!/^(?=.*[\p{L}\p{N}])(?!.*  )[\p{L}\p{N} _.-]{1,24}$/u.test(name)) throw new Error('invalid name');
        engineWalker({ id: ME, name, look, item: null, walk: inBarZone && BAR.door ? doorWalk(serverTime()) : standing(spawnPoint(), serverTime()) });
        client.setMe(ME);
        return { id: ME, name, look };
    }

    const wanderers = () => engine.walkers.filter((w) => w.id !== ME);
    const randomTarget = (random = Math.random) => ({ x: 3 + random() * 94, y: 44 + random() * 53 });
    function wander(id) {
        later(() => {
            if (!engine.walkers.some((w) => w.id === id)) return;
            // Through the ritual (closed circle, step 1) the bots stand with their hands up.
            const ritual = engine.scene >= engine.sceneStages && (engine.finale?.step === 1 || (engine.finale?.step === 0 && engine.ready));
            const w = engine.walkers.find((x) => x.id === id);
            if (engine.scene === 0) barBot(w);
            else if ((engine.finale?.step ?? -1) >= CURSED_STEP && engine.scene >= engine.sceneStages) cursedBot(w);
            else if (!ritual) engineMove(id, randomTarget());
            wander(id);
        }, 3000 + Math.random() * 6000);
    }

    // A bird that one of the walkers (you first, if you are on the field) shoots down a moment later.
    function engineShotByWalker() {
        const shooter = engine.walkers.find((w) => w.id === ME) ?? engine.walkers[Math.floor(Math.random() * engine.walkers.length)];
        const id = engineFlyer({ depth: 1, bush: false });
        later(() => engineShoot(id, shooter ?? null), 1500);
    }

    // The bonfire's last stage in the current scene; whether the scene needs it (only when that is above its stage).
    function setBonfireMax() {
        const b = engineBonfire();
        b.stageMax = BONFIRE_STAGE_MAX[Math.min(engine.scene, engine.sceneStages - 1)];
        bonfireNeeded = engine.scene < engine.sceneStages && b.stageMax > b.stage;
        // The circle's last stage is 0 before the final scene.
        const c = engineCircle();
        if (c) c.stageMax = engine.scene >= engine.sceneStages ? CIRCLE_STAGES : 0;
    }

    // Stages past 4 belong to later scenes: the jump moves the scene along with them; the bonfire stands where the
    // scenes before left it.
    function engineJump(stage) {
        // The bar has no stages: a jump goes to the first scene of the patch that reaches the stage.
        engine.scene = SCENE_STAGE_MAX.findIndex((max, i) => i > 0 && max >= stage);
        engine.stageMax = SCENE_STAGE_MAX[engine.scene];
        engine.ready = false;
        if (inBarZone) {
            inBarZone = false;
            engine.bar = { ...engine.bar, mugs: 0, pouring: null };
            engine.walkers.forEach((w) => { w.walk = standing(clampToZone(walkPoint(w.walk, serverTime())), serverTime()); });
        }
        engine.finale = engine.scene >= engine.sceneStages ? finaleOf(0) : null;
        enginePumpkins().forEach((e) => { e.stage = stage; e.clicks = 0; });
        Object.assign(engineBonfire(), { stage: engine.scene > 0 ? BONFIRE_STAGE_MAX[engine.scene - 1] : 0, clicks: 0 });
        setBonfireMax();
        engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        settleLimits({ silent: true });
        client.load(engineSnapshot());
    }

    // ?scene=N / ?ready=1 / ?finale=N / ?paused=1: the state the lab starts from.
    function startState() {
        limitPlayers = fieldCount();
        engine.bar.target = limitOf('bar');
        const sceneParam = params.has('finale') ? engine.sceneStages : Number.parseInt(params.get('scene') ?? '', 10);
        if (Number.isInteger(sceneParam)) {
            engine.scene = Math.max(0, Math.min(engine.sceneStages, sceneParam));
            engine.stageMax = SCENE_STAGE_MAX[engine.scene];
            const stage = engine.scene > 0 ? SCENE_STAGE_MAX[engine.scene - 1] : 0;
            enginePumpkins().forEach((e) => { e.stage = stage; e.clicks = 0; });
            engineBonfire().stage = engine.scene > 0 ? BONFIRE_STAGE_MAX[engine.scene - 1] : 0;
            if (engine.scene > 0) engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        }
        // ?ready=1 in the bar: the goal is reached already.
        if (engine.scene === 0 && params.get('ready') === '1') {
            engine.bar.drunk = Math.max(engine.bar.drunk, engine.bar.target);
            engine.ready = true;
        }
        if (params.has('bonfire')) engineBonfire().stage = Math.max(0, Math.min(7, Number.parseInt(params.get('bonfire'), 10) || 0));
        if (params.has('circle') && engineCircle()) engineCircle().stage = Math.max(0, Math.min(CIRCLE_STAGES, Number.parseInt(params.get('circle'), 10) || 0));
        setBonfireMax();
        if (params.get('ready') === '1' && engine.scene < engine.sceneStages) {
            enginePumpkins().forEach((e) => { e.stage = engine.stageMax; e.clicks = 0; });
            engineBonfire().stage = Math.max(engineBonfire().stage, engineBonfire().stageMax);
            engine.ready = true;
        }
        if (params.get('ritual') === '1') {
            engine.scene = engine.sceneStages;
            engine.stageMax = SCENE_STAGE_MAX[engine.scene];
            enginePumpkins().forEach((e) => { e.stage = engine.stageMax; e.clicks = 0; });
            engineBonfire().stage = BONFIRE_STAGE_MAX[engine.scene - 1];
            setBonfireMax();
            if (engineCircle()) engineCircle().stage = CIRCLE_STAGES;
            engine.ready = true;
            engine.walkers.forEach((w) => { w.item = ITEM_BY_SCENE[engine.scene]; });
        }
        if (engine.scene >= engine.sceneStages) {
            Object.assign(stats, { clicks: 5230, jobs: 312, burned: 1720, shot: 87, drinks: 41, rolls: 23, lastPumpkin: { id: ME, name: 'Jack' } });
            // From step 1 on the circle is closed and the scene stays ready (protocol.md).
            if ((Number.parseInt(params.get('finale') ?? '0', 10) || 0) >= 1 && engineCircle()) {
                engineCircle().stage = CIRCLE_STAGES;
                engine.ready = true;
            }
            engine.finale = finaleOf(Math.max(0, Math.min(LAST_STEP, Number.parseInt(params.get('finale') ?? '0', 10) || 0)));
            // Step 6 hands nothing out: the lab starts it with the beer of step 5.
            const step = engine.finale.step;
            engine.walkers.forEach((w) => { w.item = itemOfFinale(step) ?? (step === BOSS_STEP ? 'beer' : null); });
            if (step >= CURSED_STEP) {
                const [drunk, slain] = (params.get('cursed') ?? '0,0').split(',').map((n) => Math.max(0, Number.parseInt(n, 10) || 0));
                engine.cursed = { drunk, slain, ...cursedTargets() };
                stats.slain = slain;
                // From step 5 on only the goal makes the scene ready.
                if (step === CURSED_STEP) engine.ready = drunk >= engine.cursed.drinksTarget && slain >= engine.cursed.zombiesTarget;
                cursedReadySaid = step > CURSED_STEP || engine.ready;
            }
            if (params.has('boss')) {
                const [hp, max] = params.get('boss').split(',').map((n) => Math.max(0, Number.parseInt(n, 10) || 0));
                engine.boss = { hp: Math.max(1, hp), max: Math.max(1, hp, max) };
                // The moderator's addition makes up the max asked for.
                limitBonus.boss = engine.boss.max - formula('boss');
            }
            if (step >= LAST_STEP) engine.boss = { hp: 0, max: engine.boss?.max ?? 90 };
            // ?dice=1 at step 1: the dice on, the step not ready; past it the dice are off.
            if (step === 1 && params.get('dice') === '1') {
                engine.dice = { on: true };
                engine.ready = false;
                diceState.owl = Math.max(0, Math.min(2, Number.parseInt(params.get('owlrolls') ?? '0', 10) || 0));
                wanderers().forEach((w, i) => diceState.botAt.set(w.id, serverTime() + 300 + i * 450));
            } else if (step >= 2) {
                engine.dice = { on: false };
            }
            if (step === BOSS_STEP && params.get('zombified') === '1') {
                const me = engine.walkers.find((w) => w.id === ME);
                if (me) me.zombie = true;
            }
        }
        dawnSeed();
        engine.paused = params.get('paused') === '1';
        settleLimits({ silent: true });
        seedWanderers();
    }

    // Steps 5–6 open on a crowd already wandering: ?wander=N of them (HELLOWIN_ZOMBIE_MIN by default), risen 2–40 s ago.
    function seedWanderers() {
        const cursedNow = engine.scene >= engine.sceneStages && [CURSED_STEP, BOSS_STEP].includes(engine.finale?.step);
        const n = params.has('wander') ? Math.max(0, Number.parseInt(params.get('wander'), 10) || 0) : cursedNow ? ZOMBIE_MIN : 0;
        for (let i = 0; i < n; i++) engineWanderer(serverTime() - 2000 - Math.round(wanderRandom() * 38000));
    }

    // At the start of the run: the owl's line and the special flyers of the query; returns the zombie and the first
    // worm (?zshot, ?wshot).
    function startEvents() {
        if (params.has('owl')) deliver({ type: 'owl', line: params.get('owl'), ...(params.get('owl').match(/last-pumpkin|witch-down/) ? { params: { player: someone() ?? { id: ME, name: null } } } : {}) });
        if (params.has('say')) deliver({ type: 'owl', text: params.get('say') });
        // Seeded, so a frozen screenshot shows the same worms every time.
        const worms = params.get('worms') === '1' ? [0, 1, 2].map(() => engineWorm(seeded(4242 + flyerSeq))) : [];
        let zombie = null;
        if (params.get('specials') === '1') {
            engineFlyer({ kind: 'witch', depth: 2, bush: false, ltr: true });
            engineRoadrunner(false);
            zombie = engineZombie(Math.PI * 0.62);
        }
        // ?fireflies=1: three fireflies right away, one far-ish and two near (one out of a bush).
        const fireflies = params.get('fireflies') === '1'
            ? [engineFlyer({ kind: 'firefly', depth: 1, bush: false, ltr: true }), engineFlyer({ kind: 'firefly', depth: 2, bush: false, ltr: false }), engineFlyer({ kind: 'firefly', depth: 2, bush: 'bush-1' })]
            : [];
        // ?flies=N: N flies right away, seeded so a frozen screenshot shows the same loops and stops.
        const flies = Array.from({ length: Math.max(0, Number.parseInt(params.get('flies') ?? '0', 10) || 0) }, (_, i) => engineFly(seeded(777 + i)));
        // ?zdeaths=1: one zombie per kind of death, 2.5 s apart, each shot 1.4 s after it sets off by the first walker;
        // the ids are picked so the scene's DEATHS[crc32(id) % length] gives each kind once.
        if (params.get('zdeaths') === '1') {
            const kinds = [];
            for (let n = 1; kinds.length < 6 && n < 5000; n++) {
                const id = `f-dead${n.toString(16).padStart(4, '0')}`;
                const kind = deathOf(id);
                if (kind && !kinds.some((k) => k.kind === kind)) kinds.push({ id, kind });
            }
            kinds.forEach(({ id }, i) => {
                later(() => engineZombie(Math.PI * (0.18 + 0.13 * i), id), i * 2500);
                later(() => engineShoot(id, engine.walkers[0] ?? null), i * 2500 + 1400);
            });
        }
        return { zombie, worm: worms[0] ?? null, firefly: fireflies[1] ?? null, fly: flies[0] ?? null };
    }

    const scene = await createScene(root, readSnapshot(root));
    root.classList.add(scene ? 'has-canvas' : 'no-canvas');
    if (params.has('hits')) scene?.showHits(true);
    // ?sound=1: the real audio engine, wired like app.js (the first press anywhere unlocks it).
    let client = null;
    let sound = null;
    if (params.get('sound') === '1') {
        const [{ createAudio }, { bindSoundControls, bindUiClicks, createSound }] = await Promise.all([import('/js/audio/engine.js'), import('/js/sound.js')]);
        const audio = createAudio();
        audio.unlockOn(document);
        bindSoundControls(root, audio);
        bindUiClicks(root, audio);
        sound = createSound(audio, {
            serverNow: () => client?.serverNow() ?? Date.now(),
            owlGone: () => Boolean(scene?.owlGone?.()),
            owlX: () => {
                const perch = scene?.perch?.();
                return perch && root.clientWidth ? (perch.x / root.clientWidth) * 100 : null;
            },
            runnerAt: (flyer) => scene?.runnerAt?.(flyer) ?? null,
        });
        window.audio = audio;
    }
    const owl = createOwl(root, scene, { ...(simulated ? { now: () => simTime, later } : {}), onShow: (line) => sound?.owl(line) });
    // RPC `reveal` of the panel: the engine's numbers now, on the lab's clock.
    // `calls` — every player action on the server; the lab counts only the ones it keeps numbers of.
    const reveal = createReveal(root, { request: async () => ({ ...structuredClone(stats), calls: stats.clicks + stats.shot + stats.drinks + stats.damage + stats.rolls }), later });
    // The lab shows the console when it plays the moderator (?mod=1); the fake engine answers like the server would.
    const moderatorConsole = initDebugPanel(root.querySelector('[data-debug-panel]'), {
        open: params.get('ui') !== '0' ? undefined : false,
        call: engineCall,
        clickAll: () => engine.elements.forEach((e, i) => later(() => client.clickable(e.id) && engineClick(e.id, randomClicker()), i * 30)),
    });
    client = createClient(root, scene, {
        requestState: async () => engineSnapshot(),
        now: clientTime,
        owl,
        reveal,
        sound,
        onChange: (model) => moderatorConsole?.update(model),
        onSay: (event) => moderatorConsole?.say(event),
        roll: async (attempt) => engineRoll(ME, { attempt }),
        later,
    });
    client.start();
    // ?conn=ok|reconnect|down — the HUD's lamp: green, yellow blinking, red.
    client.setStatus({ reconnect: 'connecting', down: 'disconnected' }[params.get('conn')] ?? 'connected');
    startState();
    chatSetup();
    client.load(engineSnapshot());
    client.setModerator(moderator && params.get('ui') !== '0');
    if (params.get('ui') === '0') root.querySelector('[data-lab-panel]').hidden = true;
    if (params.get('me') === '1') client.setMe(ME);
    // ?dawnopen=0 at the dawn: the table folded back, as the player's own click would.
    const topTable = root.querySelector('[data-dawn-top]');
    if (params.get('dawnopen') === '0' && topTable && !topTable.hidden && !topTable.hasAttribute('data-folded')) root.querySelector('[data-dawn-toggle]')?.click();
    bindWalking(root, scene, () => client.canWalk(), (point) => engineMove(ME, point));
    const join = initJoin(document.querySelector('[data-join]'), { register: engineRegister });
    root.querySelector('[data-join-open]').addEventListener('click', () => join.open());
    if (params.get('join') === '1') join.open();
    root.querySelector('[data-lab-shot]').addEventListener('click', engineShotByWalker);
    const still = params.get('still') === '1';
    if (!simulated && !clinkStart && !clickClinkStart && !barPairs && !barDemo && !rrClinkStart && !still) wanderers().forEach((w) => wander(w.id));
    // Handle for scripted checks from the console or a test page.
    window.lab = { client, engine, scene, walkTrace };
    if (startStage > 4) engineJump(startStage);

    // Random clicks go where a click counts: an open bonfire, else the pumpkins (like a room would).
    const randomId = () => {
        const open = engine.elements.filter((e) => client.clickable(e.id));
        const bonfire = open.find((e) => e.type === 'bonfire');
        if (bonfire && Math.random() < 0.7) return bonfire.id;
        const list = open.filter((e) => e.type !== 'bonfire' && e.stage < engine.stageMax);
        return (list.length ? list : open)[Math.floor(Math.random() * (list.length || open.length))].id;
    };
    // Your mug RPCs like app.js: none while the mug is busy, a refusal warned unless it is `busy`.
    const mugCall = (method, call) => client.mugRpc(method, () => {
        const reply = call();
        if (!reply.ok && reply.error !== 'busy') console.warn(`${method} rejected`, reply.error);
        return reply;
    });
    const labClink = (target) => mugCall('clink', () => engineClink(ME, target));
    // Like app.js: a locked bonfire is not even asked, a reachable pumpkin in the cursed world takes a clink instead.
    root.addEventListener('click', (event) => {
        const el = event.target.closest('[data-element]');
        if (!el) return;
        if (client.beersPumpkin(el.dataset.element)) mugCall('beer', () => engineBeer(ME, { pumpkin: el.dataset.element }));
        else if (client.clinksPumpkin(el.dataset.element)) labClink({ pumpkin: el.dataset.element });
        else if (client.clickable(el.dataset.element)) warned(engineClick(el.dataset.element, myClicker()), 'click');
    });
    root.querySelector('[data-lab-click]').addEventListener('click', () => engineClick(randomId(), randomClicker()));
    root.querySelector('[data-lab-duck]').addEventListener('click', () => engineFlyer());
    // Your shots are yours when your character is on the field: a witch then gets the owl's `witch-down`.
    // The moderator's click on a runner on the horizon is a meep, like app.js.
    const meep = (data = {}) => engineCall('meep', data).catch((error) => console.warn('meep failed', error));
    bindShooting(root, scene, (id) => (client.meepsFlyer(scene?.flyerKind?.(id)) ? meep({ flyer: id }) : engineShoot(id, engine.walkers.find((w) => w.id === ME) ?? null)));
    bindMeep(root, () => meep());
    bindObjectKeys();
    bindDice(root, client);
    bindClinking(root, scene, client, labClink, (target) => warned(engineCure(ME, target), 'cure'));
    bindWord(root, client, async (text) => engineWord(ME, { text }));
    bindStriking(root, client, () => warned(engineStrike(ME), 'strike'));
    bindChat(root, client, async (text) => engineSay(ME, { text }));
    // The bar like app.js: the counter, Space and «Выпить»; `not clinked` is a hint over my walker only.
    const warned = (reply, method) => {
        if (!reply.ok) console.warn(`${method} rejected`, reply.error);
        return reply;
    };
    bindBar(root, client, {
        take: () => mugCall('bar.take', () => engineTake(ME)),
        clink: () => labClink({ roadrunner: true }),
        meep: () => meep(),
        drink: () => mugCall('drink', () => engineDrink(ME)).then((reply) => {
            if (reply?.error === 'not clinked') scene?.hint?.(ME, LINES['bar-clink'].text);
        }),
    });
    // The scene's moments: the sound, and the automatic clinks of the bar — my browser reports mine (like app.js), the
    // bots theirs, each with its nearest partner holding beer.
    scene?.onCue((cue) => {
        sound?.cue(cue);
        if (cue?.type !== 'clink' || !drinkWorld() || !Array.isArray(cue.sides)) return;
        const partner = client.autoClinkPartner(cue);
        if (partner && warned(engineClinkAuto(ME, { walker: partner }), 'clink.auto').ok) client.clinkedAuto();
        for (const side of cue.sides) {
            if (side.id === ME) continue;
            const mate = cue.sides.filter((o) => o.id !== side.id).sort((a, b) => Math.hypot(a.x - side.x, a.y - side.y) - Math.hypot(b.x - side.x, b.y - side.y))[0];
            if (mate) engineClinkAuto(side.id, { walker: mate.id });
        }
    });
    // A flyer every 3–8 s, like the server's launcher; the pause of the progress does not hold them.
    const launchLater = () => setTimeout(() => {
        engineFlyer();
        launchLater();
    }, (engine.finale?.step ?? -1) >= LAST_STEP ? 800 + Math.random() * 1600 : 3000 + Math.random() * 5000);
    // ?gone=ms: the wandering zombies sent away at that moment, as at the dawn.
    const goneAt = params.has('gone') ? Math.round(Number.parseInt(params.get('gone'), 10) / 16) * 16 : -1;
    // ?wkill=ms (with ?freeze): the first walker shoots the first wandering zombie at that moment.
    const wkillAt = params.has('wkill') ? Math.round(Number.parseInt(params.get('wkill'), 10) / 16) * 16 : -1;
    if (!simulated) {
        setInterval(() => deliver({ type: 'leaderboard', online: engine.walkers.length }), 5000);
        launchLater();
        later(wanderTick, 4000 + Math.random() * 5000);
        later(limitsTick, 1000);
        if (goneAt >= 0) later(wanderGone, goneAt);
        later(startEvents, 500);
        tickBar();
        zombieWalks();
        strikeBots();
        diceBots();
        dawnBots();
        if (barDemo) barDemoSteps();
        walkInSteps();
        walkStopSteps();
        if (rrClinkStart) later(rrClinkSteps, 300);
        if (chatBots().length) {
            chatBotsTalk();
            setInterval(() => chatBotsTalk(), 6000);
        }
        // ?bar=1: the paired bots drink once their beer is clinked, then fetch the next one.
        if (barPairs) setInterval(() => wanderers().forEach((w) => engine.scene === 0 && (w.clinked ? engineDrink(w.id) : w.item !== 'beer' && !w.taking && engineTake(w.id))), 4000);
        if (clickClinkStart) {
            later(startClinks, 800);
            setInterval(startClinks, 9000);
        }
    }
    root.querySelector('[data-lab-stage]').addEventListener('change', (event) => {
        if (event.target.value !== '') engineJump(Number(event.target.value));
        event.target.value = '';
    });

    let auto = 0;
    const autoButton = root.querySelector('[data-lab-auto]');
    const toggleAuto = () => {
        if (auto) {
            clearInterval(auto);
            auto = 0;
        } else {
            auto = setInterval(() => engineClick(randomId(), randomClicker()), 70);
        }
        autoButton.setAttribute('aria-pressed', String(Boolean(auto)));
    };
    autoButton.addEventListener('click', toggleAuto);
    if (params.get('auto') === '1' && !simulated) toggleAuto();

    const initial = engineSnapshot();
    const initialBonus = { ...limitBonus };
    const resetAt = Number.parseInt(params.get('reset') ?? '-1', 10);
    const flyersOn = params.get('flyers') === '1';
    const shotAt = Math.round((Number.parseInt(params.get('shotAt') ?? '896', 10) || 896) / 16) * 16;
    const nextAt = params.has('next') ? Math.round(Number.parseInt(params.get('next'), 10) / 16) * 16 : -1;
    const playAt = params.has('play') ? Math.round(Number.parseInt(params.get('play'), 10) / 16) * 16 : -1;
    const meepAt = params.has('meep') ? Math.round(Number.parseInt(params.get('meep'), 10) / 16) * 16 : -1;
    const owlRollsAt = (params.get('owlroll') ?? '').split(',').filter(Boolean).map((ms) => Math.round(Number.parseInt(ms, 10) / 16) * 16);
    function simulate() {
        Object.assign(engine, structuredClone(initial));
        setBonfireMax();
        queue.length = 0;
        pending.clear();
        live.clear();
        clinkedUntil.clear();
        drankAt.clear();
        handUntil.clear();
        inBarZone = engine.scene === 0;
        emptySaidAt = -Infinity;
        takeSeq = 0;
        wordSeq = 0;
        sayBuckets.clear();
        chatMuted.clear();
        chatLog.splice(0, chatLog.length, ...structuredClone(chatSeed));
        Object.assign(limitBonus, initialBonus);
        toldLimits = JSON.stringify(engine.limits);
        flyerSeq = 0;
        deliveredBy = 0;
        simTime = 0;
        walkTrace.length = 0;
        diceForget();
        client.forgetDice();
        diceState.owl = initial.dice?.owl ?? 0;
        dawnRandom = seeded(1807);
        dawnSeed();
        forcedRoll = rollParam.length === 3 && rollParam.every((n) => n >= 1 && n <= 6) ? rollParam : null;
        if (engine.dice?.on) wanderers().forEach((w, i) => diceState.botAt.set(w.id, serverTime() + 300 + i * 450));
        wanderRandom = seeded(6150);
        seedWanderers();
        client.load(engineSnapshot());
        let nextClick = 0;
        let target = null;
        let zombie = null;
        let worm = null;
        let firefly = null;
        let fly = null;
        const flyShotAt = params.has('flyshot') ? Math.round(Number.parseInt(params.get('flyshot'), 10) / 16) * 16 : -1;
        const fireflyShotAt = params.has('fshot') ? Math.round(Number.parseInt(params.get('fshot'), 10) / 16) * 16 : -1;
        const zombieShotAt = params.has('zshot') ? Math.round(Number.parseInt(params.get('zshot'), 10) / 16) * 16 : -1;
        const wormShotAt = params.has('wshot') ? Math.round(Number.parseInt(params.get('wshot'), 10) / 16) * 16 : -1;
        for (simTime = 0; simTime < freeze; simTime += 16) {
            if (params.get('auto') === '1' && simTime >= nextClick) {
                engineClick(randomId(), randomClicker());
                nextClick += 70;
            }
            if (simTime === resetAt) engineReset();
            if (simTime === nextAt) engineSceneNext({ scene: engine.scene, force: true });
            if (simTime === playAt && engine.finale) engineFinaleStep({ step: engine.finale.step + 1, force: true });
            // ?flyers=1: one flyer per depth right away (the near one from a bush); ?shoot=N (default 1) is shot at ?shotAt=ms (default 896, a multiple of 16).
            if (flyersOn && simTime === 0) {
                const kind = params.get('kind') ?? undefined;
                const launched = [engineFlyer({ kind, depth: 0, bush: false, ltr: true }),
                    engineFlyer({ kind, depth: 1, bush: false, ltr: false }),
                    engineFlyer({ kind, depth: 2, bush: 'bush-1' })];
                target = launched[Math.min(2, Math.max(0, Number.parseInt(params.get('shoot') ?? '1', 10) || 0))];
            }
            if (flyersOn && simTime === shotAt) engineShoot(target, params.get('shooter') === '1' ? engine.walkers[0] : null);
            if (simTime === 0) ({ zombie, worm, firefly, fly } = startEvents());
            if (fly && simTime === flyShotAt) engineShoot(fly, engine.walkers[0] ?? null);
            if (simTime === 0 && clickClinkStart) {
                clinkRounds = 0;
                startClinks();
            }
            if (firefly && simTime === fireflyShotAt) engineShoot(firefly, engine.walkers[0] ?? null);
            if (zombie && simTime === zombieShotAt) engineShoot(zombie, engine.walkers[0] ?? null);
            if (worm && simTime === wormShotAt) engineShoot(worm, engine.walkers[0] ?? null);
            // Frozen bots all set off at the start, so a screenshot catches them on the way.
            if (simTime === goneAt) wanderGone();
            if (simTime === wkillAt && wandering().length) engineShoot(wandering()[0][0], engine.walkers[0] ?? null);
            if (simTime === 0) {
                later(wanderTick, 4000 + wanderRandom() * 5000);
                tickBar();
                zombieWalks();
                strikeBots();
                diceBots();
                dawnBots();
                // My «Бросить», pressed at the start of a frozen run.
                if (params.get('dice') === '1' && params.get('me') === '1') root.querySelector('[data-dice-roll]')?.click();
                if (barDemo) barDemoSteps();
                walkInSteps();
                walkStopSteps();
                if (rrClinkStart) rrClinkSteps();
                chatBotsTalk(seeded(2121));
            }
            if (simTime === 0 && !finaleStart && !barPairs && !barDemo && !rrClinkStart && !still) {
                const random = seeded(99);
                // The ?shooter=1 walker stays put: a walker on the way does not stop to shoot.
                wanderers().filter((w, i) => !(i === 0 && params.get('shooter') === '1')).forEach((w) => engineMove(w.id, randomTarget(random)));
            }
            if (owlRollsAt.includes(simTime) && diceOn()) engineDiceOwl();
            if (simTime === meepAt) {
                const runner = params.get('meepflyer') === '1' ? [...live].find(([, f]) => f.kind === 'roadrunner')?.[0] : null;
                deliver({ type: 'meep', ...(runner ? { flyer: runner } : {}), at: serverTime() });
            }
            queue.sort((a, b) => a.at - b.at);
            while (queue.length && queue[0].at <= simTime) queue.shift().fn();
            scene?.step(16);
            client.frame();
            if (walkStop) walkTrace.push({ t: simTime, ...scene?.walkerAt(ME) });
        }
        // DOM animations (the dawn table's slides) run on the wall clock: the frozen frame shows where they end.
        document.getAnimations?.().forEach((a) => {
            try {
                a.finish();
            } catch {
                // An endless one (the dice's shake) has no end to jump to.
            }
        });
    }

    // ?fps=1 logs the frame rate every 2 s (counts animation frames, the same ones Pixi renders on).
    if (params.get('fps') === '1') {
        let frames = 0;
        let since = performance.now();
        const count = (now) => {
            frames++;
            if (now - since >= 2000) {
                console.log('FPS', Math.round((frames * 1000) / (now - since)));
                frames = 0;
                since = now;
            }
            requestAnimationFrame(count);
        };
        requestAnimationFrame(count);
    }

    if (simulated) {
        simulate();
        // Headless Edge resizes the window right before the capture; replaying keeps the frozen frame at the final
        // size. Runs before paint, unlike the debounced resize inside the scene.
        let size = `${root.clientWidth}x${root.clientHeight}`;
        new ResizeObserver(() => {
            const next = `${root.clientWidth}x${root.clientHeight}`;
            if (next !== size) {
                size = next;
                simulate();
            }
        }).observe(root);
    }
</script>
</body>
