<svg xmlns="http://www.w3.org/2000/svg" class="diagram__svg" viewBox="0 0 1210 750" width="1210" height="750" role="img">
<title>Hellowin modules: the browser goes straight to three published ports: :8080 is the RoadRunner HTTP plugin, :8000 is the Centrifugo WebSocket, :3000 is Grafana. Inside RoadRunner there are three plugins with PHP worker pools: http, centrifuge and jobs, and the ticker process under the service plugin. The workers and the ticker call the kv, lock, jobs, metrics and centrifuge plugins over RPC. The game state (kv, redis driver) and the idempotency keys (predis) are kept in Valkey. Prometheus scrapes metrics from RoadRunner and Centrifugo.</title>
