<svg xmlns="http://www.w3.org/2000/svg" class="diagram__svg" viewBox="0 0 1100 838" width="1100" height="838" role="img">
<title>Idempotent transition: clicks over the threshold push several TransitionPumpkin jobs with one key into the transitions queue. The jobs workers take them in parallel; each one's IdempotencyInterceptor does SET NX EX in Valkey. The first gets OK and performs the transition: under the pumpkin lock it checks the round and the stage, writes stage + 1 and clicks = 0, publishes the pumpkin event and checks whether the scene is ready. The rest are refused: the handler isn't called, the job is acknowledged.</title>
<style>
