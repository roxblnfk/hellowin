.diagram__svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.diagram__svg text { fill: #2b1d0e; stroke: none; font-size: 11px; }
.diagram__svg .d-t { font-size: 12px; font-weight: 600; }
.diagram__svg .d-h { font-size: 13px; font-weight: 600; }
.diagram__svg .d-s { fill: rgba(43, 29, 14, 0.68); }
.diagram__svg .d-m, .diagram__svg .d-l { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
.diagram__svg .d-phase { fill: #e06c00; }
.diagram__svg .d-bad { fill: #d03b3b; }
.d-box { fill: rgba(43, 29, 14, 0.035); stroke: rgba(43, 29, 14, 0.6); stroke-width: 1.2; }
