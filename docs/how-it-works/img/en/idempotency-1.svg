.d-mk path { fill: rgba(43, 29, 14, 0.72); }
.d-mk--acc path { fill: #8247e5; }
.d-mk--ok path { fill: #2f9a2c; }
.d-mk--kv path { fill: #d6334a; }
.d-life { fill: none; stroke: rgba(43, 29, 14, 0.22); stroke-width: 1; stroke-dasharray: 3 4; }
.d-wait { fill: rgba(43, 29, 14, 0.06); stroke: rgba(43, 29, 14, 0.68); stroke-width: 1; stroke-dasharray: 3 3; }
.d-risk { stroke: #d03b3b; }
@media (prefers-color-scheme: dark) {
  .d-bg { fill: #130b27; stroke: rgba(246, 231, 208, 0.22); }
  .diagram__svg text { fill: #f6e7d0; }
  .diagram__svg .d-s { fill: rgba(246, 231, 208, 0.66); }
  .diagram__svg .d-phase { fill: #ff8a1f; }
  .diagram__svg .d-bad { fill: #e65c5c; }
  .d-box { fill: rgba(255, 255, 255, 0.035); stroke: rgba(246, 231, 208, 0.6); }
  .d-box.g-rr { stroke: #ff8a1f; }
  .d-box.g-cf { stroke: #b98cff; }
  .d-box.g-php { stroke: #7cc4ff; }
  .d-box.g-kv { stroke: #ff7a8a; }
  .d-e { stroke: rgba(246, 231, 208, 0.72); }
  .d-e--acc { stroke: #b98cff; }
  .d-mk path { fill: rgba(246, 231, 208, 0.72); }
  .d-mk--acc path { fill: #b98cff; }
  .d-mk--ok path { fill: #6bd968; }
  .d-mk--kv path { fill: #ff7a8a; }
  .d-life { stroke: rgba(246, 231, 208, 0.22); }
