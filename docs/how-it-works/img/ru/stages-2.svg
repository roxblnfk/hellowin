<svg xmlns="http://www.w3.org/2000/svg" class="diagram__svg" viewBox="0 0 1000 442" width="1000" height="442" role="img">
<title>Слева без лока: два воркера читают clicks = 2 и оба пишут 3, один клик теряется. Справа с локом pumpkin:{id}: второй воркер ждёт, читает уже 3 и пишет 4.</title>
<style>
.d-bg { fill: #fffaf2; stroke: rgba(43, 29, 14, 0.22); stroke-width: 1; }
.diagram__svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.diagram__svg text { fill: #2b1d0e; stroke: none; font-size: 11px; }
.diagram__svg .d-t { font-size: 12px; font-weight: 600; }
.diagram__svg .d-h { font-size: 13px; font-weight: 600; }
.diagram__svg .d-s, .diagram__svg .d-n { fill: rgba(43, 29, 14, 0.68); }
.diagram__svg .d-m, .diagram__svg .d-l { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
.diagram__svg .d-bad { fill: #d03b3b; }
.diagram__svg .d-ok { fill: #2f9a2c; }
.d-box { fill: rgba(43, 29, 14, 0.035); stroke: rgba(43, 29, 14, 0.6); stroke-width: 1.2; }
.d-box.g-rr { stroke: #e06c00; }
.d-box.g-php { stroke: #1f7fc8; }
.d-e { fill: none; stroke: rgba(43, 29, 14, 0.72); stroke-width: 1.4; }
.d-e--ret { stroke-dasharray: 5 4; }
.d-mk path { fill: rgba(43, 29, 14, 0.72); }
.d-mk--acc path { fill: #8247e5; }
.d-mk--ok path { fill: #2f9a2c; }
.d-mk--kv path { fill: #d6334a; }
.d-life, .d-sep { fill: none; stroke: rgba(43, 29, 14, 0.22); stroke-width: 1; stroke-dasharray: 3 4; }
.d-sep { stroke-dasharray: none; }
.d-crit { fill: rgba(255, 138, 31, 0.3); stroke: #e06c00; stroke-width: 1; }
.d-wait { fill: rgba(43, 29, 14, 0.06); stroke: rgba(43, 29, 14, 0.68); stroke-width: 1; stroke-dasharray: 3 3; }
.d-note { fill: rgba(43, 29, 14, 0.035); stroke: rgba(43, 29, 14, 0.22); }
.d-note--bad { stroke: #d03b3b; }
.d-note--ok { stroke: #2f9a2c; }
@media (prefers-color-scheme: dark) {
  .d-bg { fill: #130b27; stroke: rgba(246, 231, 208, 0.22); }
  .diagram__svg text { fill: #f6e7d0; }
  .diagram__svg .d-s, .diagram__svg .d-n { fill: rgba(246, 231, 208, 0.66); }
  .diagram__svg .d-bad { fill: #e65c5c; }
  .diagram__svg .d-ok { fill: #6bd968; }
  .d-box { fill: rgba(255, 255, 255, 0.035); stroke: rgba(246, 231, 208, 0.6); }
  .d-box.g-rr { stroke: #ff8a1f; }
  .d-box.g-php { stroke: #7cc4ff; }
  .d-e { stroke: rgba(246, 231, 208, 0.72); }
  .d-mk path { fill: rgba(246, 231, 208, 0.72); }
  .d-mk--acc path { fill: #b98cff; }
  .d-mk--ok path { fill: #6bd968; }
  .d-mk--kv path { fill: #ff7a8a; }
  .d-life, .d-sep { stroke: rgba(246, 231, 208, 0.22); }
  .d-crit { fill: rgba(255, 138, 31, 0.35); stroke: #ff8a1f; }
  .d-wait { fill: rgba(246, 231, 208, 0.08); stroke: rgba(246, 231, 208, 0.66); }
  .d-note { fill: rgba(255, 255, 255, 0.035); stroke: rgba(246, 231, 208, 0.22); }
  .d-note--bad { stroke: #e65c5c; }
  .d-note--ok { stroke: #6bd968; }
}
</style>
