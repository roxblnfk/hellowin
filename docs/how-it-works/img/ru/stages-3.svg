<svg xmlns="http://www.w3.org/2000/svg" class="diagram__svg" viewBox="0 0 1000 484" width="1000" height="484" role="img">
<title>Сброс: два вызова ResetService::reset(1) почти одновременно. Первый берёт локи scene и всех pumpkin:{id}, видит round = 1, сбрасывает сцену и тыквы, пишет round = 2, отпускает локи и публикует reset. Второй ждёт локи, видит round = 2, не равный 1, и ничего не делает.</title>
