<text class="d-t" x="180" y="34" text-anchor="middle">RR middleware</text>
<text class="d-m" x="180" y="49" text-anchor="middle">:8080</text>
<rect class="d-box g-rr" x="241" y="16" width="114" height="44" rx="6"/>
