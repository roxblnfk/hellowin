<svg xmlns="http://www.w3.org/2000/svg" class="diagram__svg" viewBox="0 0 1000 974" width="1000" height="974" role="img">
<title>Загрузка страницы: GET / проходит middleware HTTP-плагина RoadRunner в пул воркеров и HomeController; SnapshotFactory без лока читает раунд, сцену, сюжет, тыквы и фигурки из KV и отдаёт снимок в шаблон. Затем браузер открывает WebSocket напрямую к Centrifugo на :8000 с секретом игрока в data, Centrifugo спрашивает ConnectService через connect proxy, получает user, meta и канал и подписывает клиента на канал hellowin на стороне сервера. При переподключении или событии с чужим раундом клиент вызывает RPC state и получает тот же снимок.</title>
<style>
.d-bg { fill: #fffaf2; stroke: rgba(43, 29, 14, 0.22); stroke-width: 1; }
.diagram__svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.diagram__svg text { fill: #2b1d0e; stroke: none; font-size: 11px; }
.diagram__svg .d-t { font-size: 12px; font-weight: 600; }
.diagram__svg .d-h { font-size: 13px; font-weight: 600; }
.diagram__svg .d-m, .diagram__svg .d-l { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
.diagram__svg .d-phase { fill: #e06c00; }
.d-box { fill: rgba(43, 29, 14, 0.035); stroke: rgba(43, 29, 14, 0.6); stroke-width: 1.2; }
.d-box.g-rr { stroke: #e06c00; }
.d-box.g-cf { stroke: #8247e5; }
.d-box.g-php { stroke: #1f7fc8; }
.d-e { fill: none; stroke: rgba(43, 29, 14, 0.72); stroke-width: 1.4; }
.d-e--ret { stroke-dasharray: 5 4; }
.d-e--acc { stroke: #8247e5; }
.d-mk path { fill: rgba(43, 29, 14, 0.72); }
.d-mk--acc path { fill: #8247e5; }
.d-mk--ok path { fill: #2f9a2c; }
.d-mk--kv path { fill: #d6334a; }
.d-life { fill: none; stroke: rgba(43, 29, 14, 0.22); stroke-width: 1; stroke-dasharray: 3 4; }
@media (prefers-color-scheme: dark) {
  .d-bg { fill: #130b27; stroke: rgba(246, 231, 208, 0.22); }
  .diagram__svg text { fill: #f6e7d0; }
  .diagram__svg .d-phase { fill: #ff8a1f; }
  .d-box { fill: rgba(255, 255, 255, 0.035); stroke: rgba(246, 231, 208, 0.6); }
  .d-box.g-rr { stroke: #ff8a1f; }
  .d-box.g-cf { stroke: #b98cff; }
  .d-box.g-php { stroke: #7cc4ff; }
  .d-e { stroke: rgba(246, 231, 208, 0.72); }
  .d-e--acc { stroke: #b98cff; }
  .d-mk path { fill: rgba(246, 231, 208, 0.72); }
  .d-mk--acc path { fill: #b98cff; }
  .d-mk--ok path { fill: #6bd968; }
  .d-mk--kv path { fill: #ff7a8a; }
  .d-life { stroke: rgba(246, 231, 208, 0.22); }
}
</style>
<rect class="d-bg" x="0.5" y="0.5" width="999" height="973" rx="10"/>
<defs><marker id="b-ln" class="d-mk d-mk--ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-lns" class="d-mk d-mk--ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-acc" class="d-mk d-mk--acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-accs" class="d-mk d-mk--acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-ok" class="d-mk d-mk--ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-oks" class="d-mk d-mk--ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-kv" class="d-mk d-mk--kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="b-kvs" class="d-mk d-mk--kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
