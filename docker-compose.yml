name: hellowin

services:
  app:
    build:
      context: .
      target: app
    image: hellowin-app:latest
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      # Not taken from .env: it is shared with a local (non-Docker) setup that usually runs APP_ENV=local, DEBUG=true.
      APP_ENV: prod
      DEBUG: "false"
      HELLOWIN_PUMPKIN_BASE: ${HELLOWIN_PUMPKIN_BASE:-2}
      HELLOWIN_PUMPKIN_PER_PLAYER: ${HELLOWIN_PUMPKIN_PER_PLAYER:-5}
      HELLOWIN_BONFIRE_BASE: ${HELLOWIN_BONFIRE_BASE:-8}
      HELLOWIN_BONFIRE_PER_PLAYER: ${HELLOWIN_BONFIRE_PER_PLAYER:-20}
      HELLOWIN_CIRCLE_BASE: ${HELLOWIN_CIRCLE_BASE:-15}
      HELLOWIN_CIRCLE_PER_PLAYER: ${HELLOWIN_CIRCLE_PER_PLAYER:-40}
      HELLOWIN_BAR_BASE: ${HELLOWIN_BAR_BASE:-5}
      HELLOWIN_BAR_PER_PLAYER: ${HELLOWIN_BAR_PER_PLAYER:-1.5}
      HELLOWIN_CURSED_DRINKS_BASE: ${HELLOWIN_CURSED_DRINKS_BASE:-10}
      HELLOWIN_CURSED_DRINKS_PER_PLAYER: ${HELLOWIN_CURSED_DRINKS_PER_PLAYER:-8}
      HELLOWIN_CURSED_ZOMBIES_BASE: ${HELLOWIN_CURSED_ZOMBIES_BASE:-15}
      HELLOWIN_CURSED_ZOMBIES_PER_PLAYER: ${HELLOWIN_CURSED_ZOMBIES_PER_PLAYER:-12}
      HELLOWIN_BOSS_HP_BASE: ${HELLOWIN_BOSS_HP_BASE:-45}
      HELLOWIN_BOSS_HP_PER_PLAYER: ${HELLOWIN_BOSS_HP_PER_PLAYER:-60}
      HELLOWIN_MODERATOR_SECRET: ${HELLOWIN_MODERATOR_SECRET:-}
      HELLOWIN_SCENE_STAGE_MAX: ${HELLOWIN_SCENE_STAGE_MAX:-0,4,8,11}
      HELLOWIN_BONFIRE_STAGE_MAX: ${HELLOWIN_BONFIRE_STAGE_MAX:-0,0,4,7}
      HELLOWIN_CIRCLE_STAGES: ${HELLOWIN_CIRCLE_STAGES:-4}
      HELLOWIN_BAR_MUGS: ${HELLOWIN_BAR_MUGS:-60}
      HELLOWIN_BAR_POUR_MS: ${HELLOWIN_BAR_POUR_MS:-2500}
      HELLOWIN_BAR_POUR_PER: ${HELLOWIN_BAR_POUR_PER:-10}
      HELLOWIN_BAR_RUMOR_CHANCE: ${HELLOWIN_BAR_RUMOR_CHANCE:-0.33}
      HELLOWIN_DRINK_MS: ${HELLOWIN_DRINK_MS:-1200}
      HELLOWIN_MUG_LITRES: ${HELLOWIN_MUG_LITRES:-0.5}
      HELLOWIN_BEER_HANDOVER_MS: ${HELLOWIN_BEER_HANDOVER_MS:-900}
      HELLOWIN_FLYER_INTERVAL: ${HELLOWIN_FLYER_INTERVAL:-3000-8000}
      HELLOWIN_FLYER_DURATION: ${HELLOWIN_FLYER_DURATION:-16000,6500,4000}
      HELLOWIN_FLYER_POINTS: ${HELLOWIN_FLYER_POINTS:-3,2,1}
      HELLOWIN_FLYER_BUSH_CHANCE: ${HELLOWIN_FLYER_BUSH_CHANCE:-0.4}
      HELLOWIN_FLYER_ARC_CHANCE: ${HELLOWIN_FLYER_ARC_CHANCE:-0.5}
      HELLOWIN_FLYER_KINDS: ${HELLOWIN_FLYER_KINDS:-fly;duck,chicken;;bat;worm}
      HELLOWIN_FLYER_KINDS_CURSED: ${HELLOWIN_FLYER_KINDS_CURSED:-worm,bat,firefly}
      HELLOWIN_FLYER_FIREFLY_POINTS: ${HELLOWIN_FLYER_FIREFLY_POINTS:-1}
      HELLOWIN_FLYER_KINDS_DAWN: ${HELLOWIN_FLYER_KINDS_DAWN:-duck,chicken}
      HELLOWIN_FLYER_INTERVAL_DAWN: ${HELLOWIN_FLYER_INTERVAL_DAWN:-1000-2500}
      HELLOWIN_FLYER_FLY_STOPS: ${HELLOWIN_FLYER_FLY_STOPS:-2-3}
      HELLOWIN_FLYER_FLY_SIT: ${HELLOWIN_FLYER_FLY_SIT:-900-1600}
      HELLOWIN_FLYER_FLY_LEG: ${HELLOWIN_FLYER_FLY_LEG:-900}
      HELLOWIN_FLYER_FLY_POINTS: ${HELLOWIN_FLYER_FLY_POINTS:-1}
      HELLOWIN_FLYER_RARE: ${HELLOWIN_FLYER_RARE:-;;;;}
      HELLOWIN_FLYER_RARE_CHANCE: ${HELLOWIN_FLYER_RARE_CHANCE:-0.08}
      HELLOWIN_FLYER_RARE_POINTS: ${HELLOWIN_FLYER_RARE_POINTS:-10}
      HELLOWIN_FLYER_BURST_BASE: ${HELLOWIN_FLYER_BURST_BASE:-5}
      HELLOWIN_FLYER_BURST_PER_PLAYER: ${HELLOWIN_FLYER_BURST_PER_PLAYER:-0.2}
      HELLOWIN_ZOMBIE_INTERVAL: ${HELLOWIN_ZOMBIE_INTERVAL:-2000-5000}
      HELLOWIN_ZOMBIE_MIN: ${HELLOWIN_ZOMBIE_MIN:-5}
      HELLOWIN_ZOMBIE_PER_PLAYER: ${HELLOWIN_ZOMBIE_PER_PLAYER:-5}
      HELLOWIN_ZOMBIE_POINTS: ${HELLOWIN_ZOMBIE_POINTS:-2}
      HELLOWIN_ZOMBIE_BURN_MS: ${HELLOWIN_ZOMBIE_BURN_MS:-5000}
      HELLOWIN_ZOMBIE_HEAL: ${HELLOWIN_ZOMBIE_HEAL:-3}
      HELLOWIN_ELEPHANT_INTERVAL: ${HELLOWIN_ELEPHANT_INTERVAL:-180000,360000}
      HELLOWIN_ELEPHANT_DURATION: ${HELLOWIN_ELEPHANT_DURATION:-26000}
      HELLOWIN_ELEPHANT_FART_COOLDOWN_MS: ${HELLOWIN_ELEPHANT_FART_COOLDOWN_MS:-1000}
      HELLOWIN_ELEPHANT_LOW_CHANCE: ${HELLOWIN_ELEPHANT_LOW_CHANCE:-0.33}
      HELLOWIN_TOP_BOARD: ${HELLOWIN_TOP_BOARD:-200}
      HELLOWIN_TOP_INTERVAL: ${HELLOWIN_TOP_INTERVAL:-500}
      HELLOWIN_CHAT_MAX: ${HELLOWIN_CHAT_MAX:-120}
      HELLOWIN_CHAT_HISTORY: ${HELLOWIN_CHAT_HISTORY:-50}
      HELLOWIN_EMOTES: ${HELLOWIN_EMOTES:-🎃,👻,💀,😂,😱,😍,👍,👏,🔥,🍺,🤘,🙏,🎉}
      HELLOWIN_EMOTE_COOLDOWN_MS: ${HELLOWIN_EMOTE_COOLDOWN_MS:-1000}
      HELLOWIN_MEEP_COOLDOWN_MS: ${HELLOWIN_MEEP_COOLDOWN_MS:-1500}
      HELLOWIN_DICE_IDEMPOTENCY_TTL: ${HELLOWIN_DICE_IDEMPOTENCY_TTL:-900}
      HELLOWIN_DICE_COOLDOWN_MS: ${HELLOWIN_DICE_COOLDOWN_MS:-1800}
      HELLOWIN_WORD_HINT_MS: ${HELLOWIN_WORD_HINT_MS:-180000}
      HELLOWIN_ZOMBIE_PLAYER_MS: ${HELLOWIN_ZOMBIE_PLAYER_MS:-60000}
      HELLOWIN_WALK_SPEED: ${HELLOWIN_WALK_SPEED:-12}
      HELLOWIN_WALK_LEAVE_AFTER: ${HELLOWIN_WALK_LEAVE_AFTER:-5000}
      HELLOWIN_RPC_RATE_CLICK: ${HELLOWIN_RPC_RATE_CLICK:-20,40}
      HELLOWIN_RPC_RATE_SHOOT: ${HELLOWIN_RPC_RATE_SHOOT:-20,40}
      HELLOWIN_RPC_RATE_MOVE: ${HELLOWIN_RPC_RATE_MOVE:-10,20}
      HELLOWIN_RPC_RATE_SAY: ${HELLOWIN_RPC_RATE_SAY:-1,3}
      HELLOWIN_RPC_RATE_OTHER: ${HELLOWIN_RPC_RATE_OTHER:-10,30}
      HELLOWIN_AUTO_PAUSE_MS: ${HELLOWIN_AUTO_PAUSE_MS:-4000}
      HELLOWIN_AUTO_DAWN_MIN_MS: ${HELLOWIN_AUTO_DAWN_MIN_MS:-300000}
      HELLOWIN_AUTO_DAWN_MAX_MS: ${HELLOWIN_AUTO_DAWN_MAX_MS:-600000}
      HELLOWIN_AUTO_DICE_MS: ${HELLOWIN_AUTO_DICE_MS:-90000}
      HELLOWIN_AUTO_STALL_MS: ${HELLOWIN_AUTO_STALL_MS:-0}
      HELLOWIN_AUTO_EMPTY_RESET_MS: ${HELLOWIN_AUTO_EMPTY_RESET_MS:-30000}
      # Game state (RoadRunner kv, redis driver) and idempotency keys (predis) live in the same Valkey.
      VALKEY_ADDR: valkey:6379
      VALKEY_DSN: tcp://valkey:6379
      BROADCAST_CONNECTION: centrifugo
      CENTRIFUGO_GRPC_API: centrifugo:10000
      RR_CENTRIFUGE_WORKERS: ${RR_CENTRIFUGE_WORKERS:-4}
      # RoadRunner proxies nothing: the browser reaches Centrifugo and Grafana on their own ports of the page's host
      CENTRIFUGO_WS_URL: ${CENTRIFUGO_WS_URL:-:${CENTRIFUGO_PORT:-8000}/connection/websocket}
      GRAFANA_URL: ${GRAFANA_URL:-:${GRAFANA_PORT:-3000}/}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    expose:
      - "10001"
      - "2112"
    restart: unless-stopped

  # AOF on a volume: the ritual and its idempotency keys survive restarts of app and valkey.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    # AOF and noeviction: idempotency markers must survive restarts and memory pressure, or a transition could run twice
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6.9.7
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    environment:
      # Space-separated list of allowed browser origins (scheme://host[:port]).
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:8080 http://127.0.0.1:8080}
      CENTRIFUGO_ADMIN_ENABLED: ${CENTRIFUGO_ADMIN_ENABLED:-false}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    # 8000 is the WebSocket for browsers; /metrics and /health stay on the internal port 9000
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    expose:
      - "9000"
      - "10000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}/}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The port is public: no password login at all, neither the form nor basic auth on the API, so a default admin
      # password is no way in; set it to false in .env for a while to sign in as the admin
      GF_AUTH_DISABLE_LOGIN_FORM: ${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/hellowin.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  valkey-data:
  prometheus-data:
  grafana-data:
