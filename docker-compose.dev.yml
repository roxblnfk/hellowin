# Development override: bind-mounts the source code and exposes internal services on localhost.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -V
# vendor/ lives in an anonymous volume filled from the image; -V refreshes it after composer.lock changes.
# PHP code changes need a worker reset: docker compose exec app rr reset

services:
  app:
    build:
      target: dev
    image: hellowin-app:dev
    environment:
      APP_ENV: local
      DEBUG: "true"
    user: root
    volumes:
      - ./:/app
      - /app/vendor
    healthcheck:
      disable: true

  centrifugo:
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
