# Development override: bind-mounts the source code and exposes Prometheus on localhost.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -V
# vendor/ lives in an anonymous volume filled from the image; -V refreshes it after composer.lock changes.
# PHP code changes need a worker reset: docker compose exec app rr reset

services:
  app:
    build:
      target: dev
    image: hellowin-app:dev
    environment:
      APP_ENV: local
      DEBUG: "true"
      # PHP boots ~15s from a Windows bind mount: the prod pool timeouts would kill the workers before they are up
      RR_HTTP_ALLOCATE_TIMEOUT: 60s
      RR_CENTRIFUGE_ALLOCATE_TIMEOUT: 60s
    user: root
    volumes:
      - ./:/app
      - /app/vendor
    healthcheck:
      disable: true

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
