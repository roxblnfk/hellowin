<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// The green blast: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Scene 3 → 4: the enchanted bonfire roars green but will not blow; the owl reads the last ingredient out of the
// necromancer's book — Fart Time. The crowd and a herd of elephants fart, the green clouds spiral into the fire, a
// farting duck is shot over it and falls in: the blast. The vines char to ash, the moon turns red, the summoning
// circle lights on the pit and the dark silhouette rises in it — from there on the frame is franken-rise's opening.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, PUMPKIN_SHADOW, bake, pumpkinLayers, seedOf } from '/js/pixel/sprites.js';
import { ASH, BONFIRE, EXPLOSION } from '/js/pixel/bonfire.js';
import { EMISSIVE, LIT_PALETTE, NIGHT, halo, litColor, paintSky, relightCanvas } from '/js/pixel/night.js';
import { characterFrame, randomLook } from '/js/pixel/characters.js';
import { OWL, glowing } from '/js/pixel/owl.js';
import { FX, FINALE_EMISSIVE, SILHOUETTE } from '/js/pixel/finale.js';
import { ELEPHANT, bannerFrame, fartAt, fartCloud, flightAt, hookOf, PUFFS } from '/js/pixel/elephant.js';
import { FART_SCALE } from '/js/pixel/ability.js';
import { BUSH, FLYERS, feathersOf } from '/js/pixel/flyers.js';
import { speechPlan, beakAt, wingAt } from '/js/owl-speech.js';

const W = 1920, H = 1080;
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const rgbOf = (n) => [(n >> 16) & 255, (n >> 8) & 255, n & 255];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };

const mod = (a, m) => ((a % m) + m) % m;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const frameAt = (ms, n, per) => Math.floor(mod(ms, n * per) / per);
function rng(seed) {
    return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. Each line hangs for its speech plus 2 s to read it.
const line = (lines) => { const text = lines.join(' '); return { lines, text, plan: speechPlan(text) }; };
const L = [
    line(['Достаточно…', 'сейчас рванёт!']),                       // owl.js, scene-ready of scene 3
    line(['Так… тут сказано…', 'последний ингредиент?..']),
    line(['Не смотрите на меня так.', 'Это написано в книге!']),
    line(['Все вместе.', 'На счёт три!']),
];
const say = (l, from) => { l.from = from; l.said = from + l.plan.ms / 1000; l.to = l.said + 2 + Math.max(0.4, l.text.length * 0.02); return l; };
const STAGE_UP = 3.0;                       // the bonfire climbs to its last stage
const OWL1 = 4.6;                           // close-up: «Достаточно… сейчас рванёт!»
say(L[0], OWL1 + 1.2);
const COVER = L[0].said + 0.6;              // the owl hides behind its wing
const FIZZLE = L[0].to + 0.2;               // wide: nothing — the fire trembles, sinks, nearly goes out
const OWL2 = FIZZLE + 2.8;                  // close-up: the book
const BOOK_UP = [OWL2 + 0.25, OWL2 + 0.75];
const FLIPS = [OWL2 + 0.95, OWL2 + 1.35, OWL2 + 1.75];
say(L[1], OWL2 + 2.3);
const STARE = L[1].to;                      // the owl looks up from the book at the crowd
const CROWD = STARE + 1.0;                  // the crowd stares back
const OWL3 = CROWD + 1.8;
say(L[2], OWL3 + 0.35);
say(L[3], L[2].to + 0.25);
const STRAIN = L[3].to + 0.2;               // wide: everyone strains
const ELE = [0, 1, 2].map((i) => ({ from: STRAIN + 0.9 + i * 0.55, y: [36, 26, 46][i], x0: [70, 150, 10][i], speed: 44 + i * 4 }));
const DUCK_OUT = STRAIN + 5.6;
const SHOT = DUCK_OUT + 2.3;
const DROP = SHOT + 0.62;                   // the duck lands in the fire
const BLAST = DROP + 0.1;
const BURN = BLAST + 0.25, BURN_STEP = 0.42, BURN_FRAMES = 6;   // as scene.js, slowed down
const BURNT = BURN + BURN_STEP * BURN_FRAMES;
const MOON_RED = BLAST + 3.8;               // the moon fills with red
const BLOOD = [BLAST + 4.4, BLAST + 7.2];   // the light turns red
const RITUAL_AT = BLAST + 5.8;              // the crowd raises its hands, as franken-rise opens
const SETTLE = BLAST + 8.6;                 // the camera has landed on franken-rise's frame
const CIRCLE = [SETTLE - 0.4, SETTLE + 1.4];// the summoning circle draws itself on the pit
const SUMMON = CIRCLE[1] + 0.5;             // franken-rise's t = 0 from here on
const DURATION = SUMMON + 3.9;              // up to just before franken-rise's first bubble (its t = 1.8 + 2 calm s)
const BLAST_FRAMES = [0.08, 0.08, 0.09, 0.14, 0.17, 0.2, 0.24, 0.32];
// franken-rise's own timeline (its constants), counted from SUMMON
const F = { STRIKE: 6.6 };

// ---------------------------------------------------------------------------------------------------------------
// The stage of the finale (as franken-rise stages it): 320 × 180 art px.
const UNLIT = new Set([...EMISSIVE, ...FINALE_EMISSIVE]);
const baked = new WeakMap();
function bakeF(sprite, lighting = 'day') {
    if (!baked.has(sprite)) baked.set(sprite, new Map());
    const per = baked.get(sprite);
    if (per.has(lighting)) return per.get(lighting);
    const [c, ctx] = canvas(sprite.w, sprite.h);
    const img = ctx.createImageData(sprite.w, sprite.h);
    for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
        const k = sprite.legend[sprite.rows[y][x]];
        if (!k) continue;
        const color = UNLIT.has(k) || lighting === 'day' ? PALETTE[k] : LIT_PALETTE[lighting][k];
        const i = (y * sprite.w + x) * 4;
        img.data[i] = (color >> 16) & 255; img.data[i + 1] = (color >> 8) & 255; img.data[i + 2] = color & 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    per.set(lighting, c);
    return c;
}
const light = (s) => bakeF(s, 'day');
const stamp = (ctx, c, def, x, y) => ctx.drawImage(c, Math.round(x - def.anchor.x), Math.round(y - def.anchor.y));
const stampFlip = (ctx, c, def, x, y) => { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -(def.w - def.anchor.x), Math.round(y - def.anchor.y)); ctx.restore(); };
const additive = (ctx, c, def, x, y, a) => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; stamp(ctx, c, def, x, y); ctx.restore(); };
const glowCache = new WeakMap();
const glow = (s) => glowCache.get(s) ?? glowCache.set(s, glowing(s)).get(s);

const MW = 320, MH = 180, HORIZON = 62;
const CENTRE = { x: 166, y: 124 };
const RING = [
    [-70, -18, 'm', 'pumpkin-1'], [-38, -30, 's', 'pumpkin-2'], [6, -34, 's', 'pumpkin-3'], [44, -28, 'm', 'pumpkin-5'],
    [78, -12, 's', 'pumpkin-6'], [96, 14, 'l', 'pumpkin-7'], [60, 38, 'm', 'pumpkin-8'], [14, 46, 'l', 'pumpkin-10'],
    [-34, 44, 'm', 'pumpkin-11'], [-80, 26, 'l', 'pumpkin-13'], [-100, 0, 's', 'pumpkin-14'],
];
const TREE_AT = { x: 34, y: 118 };
const PERCH = { x: TREE_AT.x - DECOR.tree.anchor.x + DECOR.tree.perch[0], y: TREE_AT.y - DECOR.tree.anchor.y + DECOR.tree.perch[1] };
const looks = Array.from({ length: 6 }, (_, i) => randomLook(((s) => () => ((s = (s * 16807) % 2147483647) / 2147483647))(41 + i * 13)));
const AROUND = [[-58, 8], [58, 8], [-34, 30], [34, 30], [0, 38], [-74, -10]];
const DUCK_BUSH = { x: 300, y: 100 };

const LAWN = (() => {
    const [c, ctx] = canvas(MW, MH);
    let seed = 9;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let x = 0; x < MW; x += DECOR.hills.w) ctx.drawImage(bake(DECOR.hills), x, HORIZON - DECOR.hills.h);
    for (let y = HORIZON; y < MH; y++) for (let x = 0; x < MW; x++) {
        const d = Math.hypot((x - CENTRE.x) / 132, (y - CENTRE.y + 4) / 52);
        let k;
        if (d < 0.9 || (d < 1 && (x + y) % 2 === 0)) {
            const lane = ((((x - CENTRE.x) / (y - HORIZON + 30)) * 9) % 1 + 1) % 1;
            k = lane < 0.2 ? 'soilDark' : lane < 0.3 ? 'soilLight' : 'soil';
        } else { const n = r(); k = n < 0.06 ? 'leafLight' : n < 0.18 ? 'leafDark' : 'leaf'; }
        ctx.fillStyle = hex(PALETTE[k]); ctx.fillRect(x, y, 1, 1);
    }
    stamp(ctx, bake(DECOR.tree), DECOR.tree, TREE_AT.x, TREE_AT.y);
    return c;
})();
// The bonfire's reach: warm firelight inside it, cold moonlight beyond (scene 3's two light sources).
const FIRE_REACH = { x: CENTRE.x, y: CENTRE.y - 2, rx: 92, ry: 34, near: 'firelight' };

// The vines of the patch: from the bonfire's heap out to where every pumpkin grew, leaves and tendrils along them —
// the ground layer that burns at the blast.
const VINES = (() => {
    const [c, ctx] = canvas(MW, MH);
    const random = rng(17);
    const stroke = (pts, width) => {
        const pass = (key, grow, dy) => {
            ctx.fillStyle = hex(PALETTE[key]);
            for (const p of pts) { const w = Math.max(1, Math.round(width(p.t)) + grow); ctx.fillRect(Math.round(p.x) - (w >> 1), Math.round(p.y) - (w >> 1) + dy, w, w); }
        };
        pass('leafDark', 0, 1); pass('leafLight', -1, 0);
    };
    const curve = (a, c1, c2, b) => Array.from({ length: 80 }, (_, i) => {
        const t = i / 79, u = 1 - t;
        return { t, x: u * u * u * a.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * b.x, y: u * u * u * a.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * b.y };
    });
    const leaves = [];
    RING.forEach(([dx, dy], i) => {
        const to = { x: CENTRE.x + dx * 0.86, y: CENTRE.y + dy * 0.86 + 2 };
        const side = random() < 0.5 ? 1 : -1;
        const c1 = { x: CENTRE.x + dx * 0.3 - dy * 0.3 * side, y: CENTRE.y + dy * 0.3 + dx * 0.12 * side };
        const c2 = { x: to.x + side * 10, y: to.y - 8 };
        const pts = curve({ x: CENTRE.x, y: CENTRE.y }, c1, c2, to);
        stroke(pts, (t) => 3.5 - 2 * t);
        for (let k = 0; k < 5; k++) {
            const p = pts[Math.floor((0.18 + k * 0.17 + random() * 0.05) * 79)];
            const leaf = DECOR.leaf[Math.min(DECOR.leaf.length - 1, Math.floor(random() * DECOR.leaf.length))];
            leaves.push({ def: leaf, x: p.x + (k % 2 ? 5 : -5), y: p.y + leaf.anchor.y - (leaf.h >> 1) });
        }
        const tendril = DECOR.tendril[i % DECOR.tendril.length];
        leaves.push({ def: tendril, x: to.x + side * 4, y: to.y - 2 + tendril.anchor.y - (tendril.h >> 1) });
    });
    for (let i = 0; i < 18; i++) {
        const a = random() * Math.PI * 2, r = Math.sqrt(random());
        const big = [DECOR.bigLeaf].flat();
        leaves.push({ def: big[i % big.length], x: CENTRE.x + Math.cos(a) * r * 34, y: CENTRE.y + Math.sin(a) * r * 11 + 3 });
    }
    leaves.sort((a, b) => a.y - b.y).forEach((l) => stamp(ctx, bake(l.def), l.def, l.x, l.y));
    return c;
})();
const VINE_POINTS = (() => {
    const d = VINES.getContext('2d').getImageData(0, 0, MW, MH).data, pts = [];
    for (let y = 0; y < MH; y += 2) for (let x = 0; x < MW; x += 2) if (d[(y * MW + x) * 4 + 3]) pts.push({ x, y });
    return pts;
})();
// Charred frames (scene.js charFrames): darkened with ember specks, then charcoal and ash crumbling away in blobs
// with embers along the crumbling edge.
function charFrames(src, lighting) {
    const { width: w, height: h } = src;
    const data = src.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    const mix = (a, b) => { let x = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b, 0xc2b2ae35); x = Math.imul(x ^ (x >>> 13), 0x27d4eb2f); return (x ^ (x >>> 16)) >>> 0; };
    const ash = rgbOf(litColor(PALETTE.ash, lighting)), coal = rgbOf(litColor(PALETTE.ashDark, lighting)), ember = rgbOf(PALETTE.ember), hot = rgbOf(PALETTE.pumpkinShine);
    return Array.from({ length: BURN_FRAMES }, (_, k) => {
        const [out, octx] = canvas(w, h);
        const img = octx.createImageData(w, h);
        const gone = [0, 0.08, 0.28, 0.5, 0.7, 0.88][k];
        for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] === 0) continue;
            const x = (i >> 2) % w, y = Math.floor((i >> 2) / w);
            const n = (mix((x >> 1) * 73856093, (y >> 1) + 0xb07) / 4294967296) * 0.75 + (((x & 1) * 2 + (y & 1)) / 4) * 0.25;
            if (n < gone) continue;
            let c;
            if (k === 0) c = mix(x, y * 31 + 7) % 100 < 7 ? (mix(x, y) % 3 ? ember : hot) : [data[i] * 0.45, data[i + 1] * 0.4, data[i + 2] * 0.45];
            else {
                const lum = (data[i] * 3 + data[i + 1] * 6 + data[i + 2]) / 2550;
                c = n < gone + 0.07 && k < BURN_FRAMES - 1 ? (n < gone + 0.025 ? hot : ember) : lum > 0.3 ? ash : coal;
            }
            img.data.set([c[0], c[1], c[2], 255], i);
        }
        octx.putImageData(img, 0, 0);
        return out;
    });
}
const GROUND = { fire: relightCanvas(LAWN, 'night', FIRE_REACH), dim: relightCanvas(LAWN, 'night'), blood: relightCanvas(LAWN, 'blood') };
const VINES_LIT = relightCanvas(VINES, 'night', FIRE_REACH);
const VINES_CHAR = charFrames(relightCanvas(VINES, 'night'), 'night');
const SKY = Object.fromEntries(['blood', 'night'].map((l) => {
    const [c, ctx] = canvas(MW, HORIZON + 1);
    paintSky(ctx, MW, HORIZON + 1, l, { seed: 5 });
    return [l, c];
}));

// ---------------------------------------------------------------------------------------------------------------
// The fire: how big it burns, 0–1+. Full and roaring; it will not blow — it sinks nearly out; the farts feed it back.
const CLOUDS = [];   // filled below: every Fart Time cloud that gets drawn into the fire
function fireLevel(t) {
    let k = 1 - 0.86 * smooth(FIZZLE + 0.2, FIZZLE + 2.4, t);
    for (const c of CLOUDS) k += c.feed * smooth(c.funnel + 1.3, c.funnel + 1.8, t);
    return Math.min(1.12, k);
}
const sinking = (t) => t > FIZZLE && t < STRAIN + 4;
function bonfire(ctx, t, lighting) {
    const ms = t * 1000;
    const level = fireLevel(t);
    const stage = t < STAGE_UP ? 6 : level > 0.7 ? 7 : 6;
    const fr = BONFIRE.stages[stage][frameAt(ms, 4, 110)];
    stamp(ctx, bakeF(fr.base, lighting), fr.base, CENTRE.x, CENTRE.y);
    if (!fr.fire) return;
    const c = light(fr.fire);
    if (Math.abs(level - 1) < 0.01) { stamp(ctx, c, fr.fire, CENTRE.x, CENTRE.y); return; }
    // the flames sink toward the foot and shiver sideways in whole pixels
    const low = clamp(1 - level), shiver = sinking(t) ? 0.5 + low : 0;
    const sy = level, sx = 1 - 0.4 * low + 0.1 * Math.max(0, level - 1);
    const jx = Math.round((hash(Math.floor(t * 25)) - 0.5) * 3 * shiver);
    const jy = Math.round((hash(Math.floor(t * 25) + 9) - 0.5) * 2 * shiver * level);
    ctx.drawImage(c, Math.round(CENTRE.x - fr.fire.anchor.x * sx) + jx, Math.round(CENTRE.y - fr.fire.anchor.y * sy) + jy, Math.round(fr.fire.w * sx), Math.max(2, Math.round(fr.fire.h * sy)));
}

// ---------------------------------------------------------------------------------------------------------------
// The pumpkins: enchanted (green, stage 11) and hovering; the blast throws them out and up, they swing back; at the
// summoning they are pulled into an orbit round the circle (franken-rise).
const KICK = (t) => (t < BLAST ? 0 : Math.sin(clamp((t - BLAST) / 0.25) * Math.PI / 2) * Math.exp(-Math.max(0, t - BLAST - 0.25) * 1.3));
function pumpkinAt(i, t) {
    const [dx, dy] = RING[i];
    const fms = (t - SUMMON) * 1000;
    const len = Math.hypot(dx, dy) || 1;
    const k = KICK(t) * (1 - i % 3 * 0.15);
    let x = CENTRE.x + dx + (dx / len) * 12 * k, y = CENTRE.y + dy + (dy / len) * 5 * k;
    const calm = 6 + 2 * Math.sin(t * 1000 / 560 + i * 1.7);
    const finale = 10 + 3 * Math.sin(fms / 200 + i);
    let float = lerp(calm, finale, smooth(BLAST + 1.5, BLOOD[1], t)) + 9 * k;
    if (t >= SUMMON) {
        const tau = t - SUMMON;
        const a = (i / RING.length) * Math.PI * 2 + fms / 900;
        const pull = Math.min(1, tau / 1.5);
        x += (CENTRE.x + Math.cos(a) * 84 - x) * pull; y += (CENTRE.y + 6 + Math.sin(a) * 30 - y) * pull;
        float = 10 + 3 * Math.sin(fms / 200 + i);
    }
    return { x, y, float: Math.round(float) };
}
function pumpkin(ctx, i, t, lighting, tone) {
    const [, , size, id] = RING[i];
    const { x, y, float } = pumpkinAt(i, t);
    const ms = t >= SUMMON ? (t - SUMMON) * 1000 : t * 1000;
    const Ls = pumpkinLayers(11, size, seedOf(id), tone);
    if (float > 0) { const sh = PUMPKIN_SHADOW[size][Math.min(2, Math.floor(float / 3))]; ctx.globalAlpha = 0.5; stamp(ctx, bake(sh), sh, x, y - 1); ctx.globalAlpha = 1; }
    const h = halo(size === 'l' ? 16 : 13, 5, tone === 'violet' ? 'violet' : 'green');
    additive(ctx, light(h), h, x, y, 0.4);
    const at = (list, per) => list[frameAt(ms + i * 97, list.length, per)];
    const yy = y - float;
    if (Ls.auraFrames) stamp(ctx, light(at(Ls.auraFrames, 160)), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.back, lighting), Ls, x, yy);
    if (Ls.glowFrames) stamp(ctx, light(at(Ls.glowFrames, 120)), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.body, lighting), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.rim, lighting), Ls, x, yy);
    if (Ls.layers.stem) stamp(ctx, bakeF(Ls.layers.stem, lighting), Ls, x, yy);
    if (Ls.fireFrames) stamp(ctx, light(at(Ls.fireFrames, 110)), Ls, x, yy);

// ---------------------------------------------------------------------------------------------------------------
// The crowd round the bonfire, books up: casting at the fire, staring at the owl, straining, thrown back by the blast,
// hands raised by the red light, as franken-rise opens.
const CASTS = AROUND.map((_, i) => Array.from({ length: 6 }, (_, k) => 0.9 + i * 0.41 + k * 1.6 + hash(i * 19 + k) * 0.5).filter((c) => c < OWL1 + 0.2));
const castOf = (i, t) => CASTS[i].find((c) => t >= c && t < c + 0.62);
const FARTS = AROUND.map((_, i) => STRAIN + 0.75 + [0, 0.35, 0.15, 0.5, 0.25, 0.6][i]);   // each walker's fart, after the strain
const straining = (i, t) => t > STRAIN && t < FARTS[i] + 0.15;
function walkerAt(i, t) {
    const [dx0, dy0] = AROUND[i];
    const len = Math.hypot(dx0, dy0) || 1;
    const k = KICK(t);
    const x = clamp(CENTRE.x + dx0 + (dx0 / len) * 10 * k, 8, MW - 8), y = CENTRE.y + dy0 + (dy0 / len) * 5 * k + 3 * k;
    const hop = t > BLAST && t < BLAST + 0.4 ? Math.sin(((t - BLAST) / 0.4) * Math.PI) * 4 : 0;
    const ms = t * 1000;
    let pose = 'idle', item = 'book', frame = frameAt(ms + i * 170, 2, 600), face = CENTRE.x - (CENTRE.x + dx0);
    const cast = castOf(i, t);
    if (cast !== undefined && t - cast < 0.36) { pose = 'shoot'; frame = t - cast < 0.18 ? 0 : 1; }
    // the stare: everyone turns to the owl on its branch (to the left), palms up
    if (t >= STARE && t < STRAIN) { face = -100; if (t >= CROWD + 0.25 && t < OWL3 + 2) { pose = 'shrug'; frame = frameAt(ms + i * 130, 2, 400); } }
    if (t >= BLAST && t < BLAST + 1.9) { pose = 'shrug'; frame = frameAt(ms + i * 120, 2, 400); face = CENTRE.x - (CENTRE.x + dx0); }
    if (t >= RITUAL_AT + i * 0.12) { pose = 'ritual'; item = null; frame = frameAt(t >= SUMMON ? (t - SUMMON) * 1000 + i * 170 : ms + i * 170, 4, 380); }
    const squash = straining(i, t) ? 0.12 * smooth(STRAIN, STRAIN + 0.3, t) : t > FARTS[i] + 0.15 && t < FARTS[i] + 0.4 ? -0.06 : 0;
    return { x, y: y - hop, pose, item, frame, face, squash, shake: straining(i, t) };
}
const relit = new Map();

// Fart Time. The walkers' clouds (the elephant's, FART_SCALE smaller) over their heads, the elephants' behind them;

const herdAt = (e, t) => {
    const s = t - e.from;

    const fly = flightAt(Math.max(0, s) * 1000);

};
AROUND.forEach((_, i) => {

function elephants(ctx, t, lighting) {

    const bgZ = S * 2.1;
    const fc = { x: CENTRE.x - 10, y: CENTRE.y - 34 };
    soft(null, 13, () => {
        o.save();
        o.translate(W * 0.62 + sh.x * 0.4 - k * 10, H * 0.5 + sh.y * 0.4); o.scale(bgZ, bgZ); o.translate(-fc.x, -fc.y);
        o.drawImage(SKY.night, -60, -20, MW + 120, HORIZON + 21);
        o.drawImage(stageNow, 0, 0);
        o.restore();
    });
    const fire = { x: W * 0.62 + (CENTRE.x - fc.x) * bgZ - k * 10, y: H * 0.5 + (CENTRE.y - 20 - fc.y) * bgZ };
    const g = o.createRadialGradient(fire.x, fire.y, 40, fire.x, fire.y, 1300);
    g.addColorStop(0, `rgba(150,255,90,${(0.08 + 0.22 * level) + 0.1 * roar})`); g.addColorStop(1, 'rgba(150,255,90,0)');
    o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    soft(null, 4, () => {
        for (let i = 0; i < 26; i++) {
            const life = 2 + hash(i + 600) * 2;
            const age = mod(t + hash(i + 601) * life, life);
            const x = W * (0.3 + hash(i + 602) * 0.8) - age * 120 * (0.5 + hash(i + 603));
            const y = H + 40 - age * (260 + hash(i + 604) * 200);
            const s = 10 + hash(i + 605) * 22;
            o.fillStyle = `rgba(190,255,120,${0.7 * Math.sin((age / life) * Math.PI) * clamp(level)})`;
            o.fillRect(x, y, s, s);
        }
    });
    o.save();
    o.translate(W / 2 + sh.x, H / 2 + sh.y); o.scale(zoom, zoom); o.translate(-W / 2, -H / 2);
    const perch = { x: 600 + k * 5, y: 905 };
    const P = OWL_S / 2;
    const bark = ['outline', 'barkDark', 'bark', 'barkLight'].map((key) => hex(LIT_PALETTE.night[key]));
    for (let x = -340; x < perch.x + 560; x += P) {
        const thin = clamp((x + 340) / (perch.x + 900));
        const th = Math.max(3, Math.round(7 - thin * 4));
        const yy = perch.y - P + Math.round(((x - perch.x) * 0.05) / P) * P;
        o.fillStyle = bark[0]; o.fillRect(x, yy - P, P, (th + 2) * P);
        o.fillStyle = bark[1]; o.fillRect(x, yy, P, th * P);
        o.fillStyle = bark[2]; o.fillRect(x, yy, P, Math.ceil(th / 2) * P);
        if (Math.round(x / P) % 5 < 2) { o.fillStyle = bark[3]; o.fillRect(x, yy, P, P); }
    }
    const f = owlFrameClose(t);
    const shiver = t >= COVER && t < OWL2 ? Math.round((hash(Math.floor(t * 14)) - 0.5) * 2) * P : 0;
    o.drawImage(bakeF(glow(f), 'night'), perch.x - f.anchor.x * OWL_S + shiver, perch.y - f.anchor.y * OWL_S, f.w * OWL_S, f.h * OWL_S);
    bookInWings(t, perch);
    const rg = o.createLinearGradient(perch.x - 80, 0, perch.x + 360, 0);
    rg.addColorStop(0, 'rgba(120,255,90,0)'); rg.addColorStop(1, `rgba(120,255,90,${0.05 + 0.15 * level + 0.08 * roar})`);
    o.globalCompositeOperation = 'lighter'; o.fillStyle = rg; o.fillRect(perch.x - 330, perch.y - 640, 700, 720); o.globalCompositeOperation = 'source-over';
    o.restore();
    const v = o.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.72)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    const head = { x: W / 2 + (perch.x + 140 - W / 2) * zoom + sh.x, y: H / 2 + (perch.y - 13 * OWL_S - H / 2) * zoom + sh.y };
    for (const l of L) bubble(l, t, head, 1000, 140);
}

// ---------------------------------------------------------------------------------------------------------------
function wide(t) {
    const cam = camera(t);
    o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
    const blur = clamp((cam.z - 1.45) * 2.2, 0, 1);
    soft(blur, 6, () => sky(cam, t));
    const toScreen = layer(cam, 1, () => o.drawImage(stageCanvas(t), 0, 0));
    const fire = toScreen({ x: CENTRE.x, y: CENTRE.y - 26 });
    const level = fireLevel(t);
    const roar = 0.5 + 0.5 * Math.sin(t * 9) * Math.sin(t * 3.7);
    if (t < BLAST) {
        const flare = t > STAGE_UP && t < STAGE_UP + 0.6 ? 0.25 * (1 - (t - STAGE_UP) / 0.6) : 0;
        const g = o.createRadialGradient(fire.x, fire.y, 30, fire.x, fire.y, 1100);
        g.addColorStop(0, `rgba(150,255,90,${(0.22 + 0.07 * roar + flare) * clamp(0.2 + 0.8 * level)})`); g.addColorStop(1, 'rgba(150,255,90,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
        // the dark closes in while the fire is low
        const dim = clamp(1 - level) * 0.8;
        if (dim > 0) {
            const d = o.createRadialGradient(fire.x, fire.y + 60, 120, fire.x, fire.y + 60, 1300);
            d.addColorStop(0, 'rgba(0,0,0,0)'); d.addColorStop(1, `rgba(0,0,6,${0.55 * dim})`);
            o.fillStyle = d; o.fillRect(0, 0, W, H);
        }
    } else {
        const k = bloodAt(t);
        const c = toScreen({ x: CENTRE.x, y: CENTRE.y - 40 });
        const g = o.createRadialGradient(c.x, c.y, 30, c.x, c.y, 900);
        g.addColorStop(0, `rgba(255,60,40,${(0.22 + 0.06 * Math.sin((t - SUMMON) * 13)) * k})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    }
    const origin = toScreen({ x: CENTRE.x, y: CENTRE.y - 26 });
    const sb = t - BLAST;
    if (sb >= 0 && sb < 1.6) {
        const a = Math.exp(-sb * 2.4), warm = smooth(0.25, 0.6, sb);
        const g = o.createRadialGradient(origin.x, origin.y, 20, origin.x, origin.y, 1400);
        g.addColorStop(0, `rgba(${Math.round(lerp(170, 255, warm))},${Math.round(lerp(255, 190, warm))},${Math.round(lerp(110, 90, warm))},${0.55 * a})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    }
    shockwave(t, toScreen({ x: CENTRE.x, y: CENTRE.y }), S * cam.z);
    drawDebris(t, origin, false);
    haze(t, toScreen, S * cam.z / 6);
    drawMotes(t, cam);
    // the shot at the duck: a tracer from a gun off the bottom right, the muzzle flash at the frame's edge
    if (t > SHOT - 0.04 && t < SHOT + 0.08) {
        const d = toScreen({ x: HIT.x, y: HIT.y - 2 }), g0 = { x: W - 60, y: H + 40 };
        for (let k = 0; k < 30; k++) {
            const q = k / 30;
            o.fillStyle = k > 25 ? '#fff6c8' : 'rgba(255,214,96,0.9)';
            o.fillRect(Math.round((g0.x + (d.x - g0.x) * q) / 8) * 8 - 6, Math.round((g0.y + (d.y - g0.y) * q) / 8) * 8 - 6, 20, 20);
        }
        o.fillStyle = '#fff6c8'; o.fillRect(W - 220, H - 120, 220, 40); o.fillRect(W - 130, H - 210, 40, 220);
    }
    if (t >= SHOT && t < SHOT + 0.35) {
        // a starburst on the hit, in the Fart Time greens
        const d = toScreen({ x: HIT.x, y: HIT.y - 2 }), k = (t - SHOT) / 0.35, R = 90 + 70 * Math.sin(k * Math.PI);
        for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2 + 0.26;
            for (let s = 0; s < 4; s++) {
                const dd = R * (0.55 + s * 0.17) + (i % 2) * 20;
                o.fillStyle = s === 0 ? '#ffffff' : s < 3 ? hex(PALETTE.fartLight) : hex(PALETTE.fartDark);
                const q = (4 - s) * 6;
                o.fillRect(Math.round((d.x + Math.cos(a) * dd) / 6) * 6 - q / 2, Math.round((d.y + Math.sin(a) * dd) / 6) * 6 - q / 2, q, q);
            }
        }
    }
    foreground(t, cam);
    soft(null, 3, () => { drawDebris(t, origin, true); drawLens(t, origin); });
    const v = o.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 1.1);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    if (sb >= 0 && sb < 0.9) { o.fillStyle = sb < 0.05 ? '#ffffff' : `rgba(214,255,190,${0.8 * Math.exp(-(sb - 0.05) * 9)})`; o.fillRect(0, 0, W, H); }
    if (t >= STAGE_UP && t < STAGE_UP + 0.12) { o.fillStyle = `rgba(200,255,170,${0.35 * (1 - (t - STAGE_UP) / 0.12)})`; o.fillRect(0, 0, W, H); }
}

const closeUp = (t) => (t >= OWL1 && t < FIZZLE) || (t >= OWL2 && t < CROWD) || (t >= OWL3 && t < STRAIN);
function draw(t) {
    if (closeUp(t)) shotB(t);
    else wide(t);
    for (const c of [OWL1, FIZZLE, OWL2, CROWD, OWL3, STRAIN]) if (t >= c && t < c + 0.1) { o.fillStyle = `rgba(220,255,210,${0.35 * (1 - (t - c) / 0.1)})`; o.fillRect(0, 0, W, H); }
    const black = 1 - smooth(0, 1.0, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs). Scene 3's `night` plays full (the scene is ready), dies away as the fire sinks, comes back
// with the farts and is cut by the blast; scene 4's `blood` after it; from SUMMON franken-rise's own cues.
const panX = (x) => clamp((x - 160) / 160, -1, 1) * 0.7;
window.SOUND = [
    { music: 'night', from: 0, to: FIZZLE + 2.2, intensity: [[0, 1], [FIZZLE, 1], [FIZZLE + 2, 0.1]], fadeIn: 1.2, fadeOut: 2.0 },
    { music: 'night', from: STRAIN + 0.6, to: BLAST, intensity: [[STRAIN, 0.3], [DUCK_OUT, 1]], fadeIn: 1.5, fadeOut: 0.05 },
    { music: 'blood', from: BLAST + 2.2, to: SUMMON, intensity: [[BLAST + 2.2, 0.15], [BLOOD[1], 0.3]], fadeIn: 3, fadeOut: 0.5 },
    { music: 'rise', from: SUMMON, to: DURATION, intensity: 1, fadeIn: 0.6, fadeOut: 0.3 },
    ...AROUND.flatMap((_, i) => CASTS[i].map((c) => ({ sfx: 'bonfire.click', at: c + 0.36, pan: panX(CENTRE.x + AROUND[i][0] * 0.3), vol: 0.45 }))),
    { sfx: 'bonfire.stage', at: STAGE_UP - 0.05 },
    { sfx: 'owl.hoot', at: L[0].from - 0.95, pan: -0.3 },
    ...L.map((l) => ({ speak: 'owl', text: l.text, at: l.from, pan: -0.3 })),
    ...FLIPS.map((at, k) => ({ sfx: 'bush.rustle', at, pitch: 9, vol: 0.35, variant: k })),
    { sfx: 'owl.hoot', at: L[2].from - 0.95, pan: -0.3, vol: 0.7 },
    // the chorus: the crowd's farts (the elephant's, pitched up), the herd's
    ...AROUND.map((_, i) => ({ sfx: 'elephant.fart', at: FARTS[i], pitch: 4 + (i * 1.7) % 6, vol: 0.55, pan: panX(CENTRE.x + AROUND[i][0]) })),
    ...CLOUDS.filter((c) => c.elephant).map((c, k) => ({ sfx: 'elephant.fart', at: c.at, pitch: -1 - k, vol: 0.9, pan: -0.4 + k * 0.4 })),
    ...CLOUDS.map((c, k) => ({ sfx: 'pumpkin.enchant', at: c.funnel + 1.6, vol: 0.5, pan: 0, variant: k })),
    { sfx: 'bonfire.stage', at: CLOUDS.reduce((m, c) => Math.max(m, c.funnel), 0) + 1.7 },
    { sfx: 'bush.rustle', at: DUCK_OUT - 0.5, pan: 0.7 },
    { sfx: 'bush.rustle', at: DUCK_OUT - 0.05, pan: 0.7, variant: 1 },
    { sfx: 'duck.quack', at: DUCK_OUT + 0.1, pan: 0.6 },
    ...DUCK_PUFFS.filter((_, i) => i % 3 === 0).map((at) => ({ sfx: 'elephant.fart', at, pitch: 14, vol: 0.25, pan: panX(duckPath(at).x) })),
    { sfx: 'duck.quack', at: DUCK_OUT + 1.3, pan: 0.2, variant: 2 },
    { sfx: 'shot.pistol', at: SHOT - 0.02, pan: 0.6 },
    { sfx: 'flyer.hit', at: SHOT },
    { sfx: 'elephant.fart', at: SHOT + 0.05, pitch: 8, vol: 0.6 },
    { sfx: 'flyer.fall', at: SHOT + 0.1 },
    { sfx: 'bonfire.explode', at: BLAST },
    ...[0.35, 0.8, 1.3, 1.9, 2.4].map((d, k) => ({ sfx: 'bonfire.click', at: BURN + d, pan: (k % 2 ? 0.4 : -0.4), vol: 0.35, pitch: -2 })),
    ...[0, 1, 2].map((k) => ({ sfx: 'circle.stage', at: CIRCLE[0] + k * 0.55, variant: k, vol: 0.7 })),
    // franken-rise's opening cues
    { sfx: 'finale.wake', at: SUMMON },
    { sfx: 'owl.hoot', at: SUMMON + 0.85, pan: -0.6 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
window.T = { OWL1, FIZZLE, OWL2, STARE, CROWD, OWL3, STRAIN, DUCK_OUT, SHOT, DROP, BLAST, MOON_RED, SETTLE, CIRCLE, SUMMON, DURATION, L: L.map((l) => [l.from, l.said, l.to]) };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
</body>
</html>
