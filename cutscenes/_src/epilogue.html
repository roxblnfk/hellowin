<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// The epilogue: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Morning in the bar: RoadRunner behind the counter with a mug, the heroes with rapiers on their backs, game on the
// counter, toasts and «Мип-мип!». The owl looks round, sums the evening up, finally remembers the necromancer's name at
// his empty place by the counter's end, and doubts it is over. A dissolve to the ash pile on the empty field at dawn:
// the wind blows it away, leaving two bolts and the black glasses; zombie workers' hands come out of the ground, take
// the bolts and pull them under. The thud, a dark that looks like the end — and back: a duck lands, puts the glasses
// on, «Кря.», flies off in them.
import { DEFAULT_BAR_LAYOUT as layout, BAR_FLICKER_MS, BAR_MUG, barLights, barOwlSpot, barProps, bakeBar, paintBar } from '/js/pixel/bar.js';
import { OWL, OWL_BAR, pourFrame } from '/js/pixel/owl.js';
import { characterFrame } from '/js/pixel/characters.js';
import { EMISSIVE, halo, litColor, relightCanvas, paintSky } from '/js/pixel/night.js';
import { DECOR, bake } from '/js/pixel/sprites.js';
import { PALETTE } from '/js/pixel/palette.js';
import { FLYERS } from '/js/pixel/flyers.js';
import { RUNNER, BOSS, FRANKEN, FINALE_EMISSIVE } from '/js/pixel/finale.js';
import { speechPlan, beakAt, wingAt } from '/js/owl-speech.js';

const W = 1920, H = 1080;
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. Each line of the owl stays up for its speech, or the reading of it, plus 2.5 s.
const POUR = [0.25, 2.45];
const LIFT1 = 2.2, MEEP1 = 2.75;          // RoadRunner raises his mug: «Мип-мип!»
const CLINK1 = 5.3;                       // everyone clinks
const LIFT2 = 7.0, MEEP2 = 7.4, CLINK2 = 8.4; // another toast, another «Мип-мип!»
const LOOK = [10.4, 12.8];                // the owl looks round at everyone
const HOOT = 12.9;
const OWL_LINES = [
    ['Вот это был вечер…', 'Мы воскрешали RoadRunner,', 'а он даже не умирал.'],
    ['Похоже, слух о его смерти', 'пустил некромант.', 'Как его… Дун… Дуг…'],
    ['Дунглас! Вспомнила!'],
    ['Кстати, его с тех пор', 'никто не видел.'],
    ['Не нравится мне это…', 'Неспроста всё это.'],
    ['Кто знает…', 'может, это ещё не конец…'],
];
const BUBBLES = [
    { from: 3.1, lines: ['Мип-мип!'], meep: true, who: 'rr' },
    { from: MEEP2 + 0.15, lines: ['Мип-мип!'], meep: true, who: 'rr' },
];
BUBBLES[0].to = CLINK1 - 0.3;
BUBBLES[1].to = MEEP2 + 2.6;
{
    let at = HOOT + 0.95;
    OWL_LINES.forEach((lines, i) => {
        const text = lines.join(' ');
        const plan = speechPlan(text);
        const read = Math.max(plan.ms / 1000, text.length / 15);
        const hold = read + 2.5;
        BUBBLES.push({ from: at, to: at + hold, lines, who: 'owl', plan, hop: i === 2 });
        // the pause before the name: the owl freezes, its eyes go wide
        at += hold + (i === 1 ? 1.3 : 0.45);
    });
}
const LB = (i) => BUBBLES[2 + i];
const FREEZE = [LB(2).from - 1.0, LB(2).from];
const DISSOLVE = [LB(5).to - 0.2, LB(5).to + 2.0];
// The field, from F.
const F = DISSOLVE[0];
const BLOW = [F + 2.0, F + 6.8];
const STIR = F + 8.4, CRACK = [F + 8.9, F + 10.0];
const HANDS = [{ rise: F + 10.0 }, { rise: F + 10.55 }];
for (const h of HANDS) {
    h.grope = h.rise + 0.45;
    h.lean = h.rise + 1.45;         // down onto the bolt
    h.grab = h.lean + 0.38;
    h.lift = h.grab + 0.3;          // back upright with it
    h.sink = h.lift + 0.75;         // pulled under
    h.gone = h.sink + 0.55;
}
const CLOSE = [HANDS[1].gone + 0.1, HANDS[1].gone + 0.8];
const THUD = CLOSE[1] + 0.35;
const DARK = [THUD + 0.5, THUD + 2.0, THUD + 2.8, THUD + 3.9];  // down, black, up
const DUCK_IN = [DARK[3] + 0.3, DARK[3] + 2.0];
const PICK = DUCK_IN[1] + 0.6;            // dips to the glasses
const WEAR = PICK + 0.55;                 // they are on
const QUACK = WEAR + 1.0;
BUBBLES.push({ from: QUACK, to: QUACK + 3.0, lines: ['Кря.'], who: 'duck', plan: null });
const TAKEOFF = QUACK + 3.3;
const ACCENT = TAKEOFF + 1.5;
const FINAL = [TAKEOFF + 1.9, TAKEOFF + 2.9];
const DURATION = FINAL[1] + 0.6;

const textOf = (b) => b.lines.join(' ');
// Characters typed `ms` into bubble b: each word as the speech reaches it (owl-speech.js syllables).
function typedOf(b, ms) {
    const text = textOf(b);
    if (b.meep) return ms < 0 ? 0 : ms < 260 ? 4 : text.length;
    if (!b.plan) return Math.floor(clamp(ms / 300) * text.length);
    const plan = b.plan;
    const words = [...text.matchAll(/[\p{L}\p{N}]+/gu)];
    const counts = words.map((m) => Math.max(1, Math.min(5, (m[0].match(/[аеёиоуыэюяaeiouy]/giu) ?? []).length || Math.ceil(m[0].length / 3))));
    if (counts.reduce((a, c) => a + c, 0) !== plan.syllables.length) return Math.floor(text.length * clamp(ms / plan.ms));
    let n = 0, k = 0;
    for (let w = 0; w < words.length; w++) {
        const first = plan.syllables[k], last = plan.syllables[k + counts[w] - 1];
        k += counts[w];
        const start = first.at, end = last.at + last.len;
        const m = words[w];
        if (ms < start) return n;
        const into = clamp((ms - start) / Math.max(1, end - start));
        n = m.index + Math.ceil(m[0].length * into);
        if (into < 1) return n;
        n = words[w + 1]?.index ?? text.length;
        if (w === words.length - 1) n = text.length;
    }
    return n;
}

// Out of focus without canvas filters (slow in the software renderer): paint into a buffer 1/k the size and stretch
// it back smoothed; `amount` crossfades from the sharp painting (null — soft only).
const softBufs = new Map();
function soft(amount, k, paint) {
    if (amount !== null && amount <= 0.04) { paint(); return; }
    if (!softBufs.has(k)) softBufs.set(k, canvas(Math.ceil(W / k), Math.ceil(H / k)));
    const [c, x] = softBufs.get(k);
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(1 / k, 0, 0, 1 / k, 0, 0);
    const keep = o;
    o = x; paint(); o = keep;
    if (amount !== null) paint();
    o.save(); o.globalAlpha = amount === null ? 1 : clamp(amount); o.imageSmoothingEnabled = true;
    o.drawImage(c, 0, 0, c.width * k, c.height * k);
    o.restore();
}

// ===============================================================================================================
// THE BAR (bar-intro.html's counter, keg and hall), in the morning.
const lit = 'firelight';
const M = 14, MG = 12;
const aw = Math.ceil(W / M) + 2 * MG, ah = Math.ceil(H / M) + 2 * MG;
const top = MG + Math.round((H / M) * 0.6);
const ax = (f) => MG + Math.round((W / M) * f);
const owlA = { x: ax(0.68), y: top + 3 };
const rrA = { x: ax(0.47), y: top + 9 };              // RR_BAR_HIDE rows under the counter's back edge
const SPOT = { x: ax(0.215) };                          // the necromancer's place in nightfall.html
const POST = { x: ax(0.10) };                         // a post by the counter's end with a hook on it
const tap = { x: owlA.x + OWL_BAR.tap.x, y: owlA.y + OWL_BAR.tap.y };
const owlMug = { x: owlA.x + OWL_BAR.mug.x, y: owlA.y + OWL_BAR.mug.y };
const setMug = { x: owlA.x - 6, y: top + 2 };

const [base, bx] = canvas(aw, ah);
{
    const P = (x, y, k) => { bx.fillStyle = hex(PALETTE[k]); bx.fillRect(x, y, 1, 1); };
    // the post behind the counter's end, up out of the frame, with an iron hook
    for (let y = 0; y < top; y++) for (let x = POST.x - 3; x <= POST.x + 3; x++) {
        const e = x === POST.x - 3 || x === POST.x + 3;
        P(x, y, e ? 'outline' : x === POST.x - 2 ? 'timberLight' : x === POST.x + 2 ? 'timberDeep' : (y * 3 + x) % 17 === 0 ? 'timberDark' : 'timber');
    }
    for (const [dx, dy, k] of [[4, -30, 'outline'], [4, -29, 'ironLight'], [5, -29, 'iron'], [6, -29, 'outline'], [6, -30, 'iron'], [6, -31, 'outline'], [4, -28, 'outline'], [5, -28, 'outline']]) P(POST.x + dx, top + dy, k);
    for (let y = top + 3; y < ah; y++) for (let x = 0; x < aw; x++) {
        const plank = x % 7;
        let k = plank === 0 ? 'timberDeep' : plank === 6 ? 'timberDark' : (x * 3 + y * 7) % 23 === 0 ? 'timberDark' : 'timber';
        if (y === top + 3) k = 'outline';
        if (y === top + 4) k = 'timberDark';
        if (y === top + 9) k = 'ironLight';
        if (y === top + 10) k = 'iron';
        P(x, y, k);
    }
    for (let x = 0; x < aw; x++) { P(x, top, 'outline'); P(x, top + 1, x % 9 === 4 ? 'timberShine' : 'timberLight'); P(x, top + 2, 'timberLight'); }
    const keg = { x1: tap.x + 3, x2: tap.x + 15, y2: top, y1: top - 13 };
    for (let y = keg.y1; y < keg.y2; y++) for (let x = keg.x1; x <= keg.x2; x++) {
        const edge = x === keg.x1 || x === keg.x2 || y === keg.y1;
        const band = y === keg.y1 + 2 || y === keg.y2 - 3;
        const b = (x - keg.x1) / (keg.x2 - keg.x1);
        P(x, y, edge ? 'outline' : band ? (x % 3 ? 'iron' : 'ironLight') : b < 0.3 ? 'plankLight' : b > 0.8 ? 'plankDark' : 'plank');
    }
    for (let x = tap.x; x < keg.x1; x++) { P(x, tap.y - 1, 'outline'); P(x, tap.y, 'ironLight'); P(x, tap.y + 1, 'outline'); }
    P(tap.x + 1, tap.y - 2, 'ironLight'); P(tap.x + 1, tap.y - 3, 'ironLight'); P(tap.x + 1, tap.y - 4, 'outline');
}
const litBase = relightCanvas(base, lit);
const barBakes = new Map();
const barBake = (def) => barBakes.get(def) ?? barBakes.set(def, bakeBar(def, lit)).get(def);
// RoadRunner keeps more of his own blue in the morning light: the bar's light and his day colours half and half.
const rrBakes = new Map();
function rrBake(def) {
    if (rrBakes.has(def)) return rrBakes.get(def);
    const [c, x] = canvas(def.w, def.h);
    x.drawImage(bakeBar(def, lit), 0, 0); x.globalAlpha = 0.5; x.drawImage(bakeBar(def, 'day'), 0, 0);
    rrBakes.set(def, c);
    return c;
}
const mugC = bakeBar(BAR_MUG, lit);

// The necromancer's mug, left half drunk: no foam, the beer down to two rows, a ring of dried foam on the glass.
const HALF_MUG = { ...BAR_MUG, rows: ['.OOOOO...', 'Og...gO..', 'Oc.c.cOO.', 'O.....OgO', 'OyYYYgO.O', 'OyYYYgOgO', 'OgggggOO.', '.OOOOO...'] };
// His hood on the hook: the cowl hangs empty, its opening black, the robe's shoulders slumped under it.
const HOOD = (() => {
    const w = 17, h = 26;
    const g = Array.from({ length: h }, () => Array(w).fill('.'));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const cx = 8;
        const cowl = ((x - cx) / 6.5) ** 2 + ((y - 7.5) / 7.5) ** 2 <= 1;
        const k = (y - 9) / (h - 9);
        const drape = y >= 9 && Math.abs(x + 0.5 - cx - 0.5) <= 4.5 + k * 4 - (y === h - 1 && x % 3 === 1 ? 1 : 0);
        if (cowl || drape) g[y][x] = 'k';
    }
    for (let y = 0; y < h; y++) {
        const xs = g[y].flatMap((ch, x) => (ch !== '.' ? [x] : []));
        if (!xs.length) continue;
        const l = xs[0], r = xs[xs.length - 1];
        for (const x of xs) {
            const f = (x - l) / Math.max(1, r - l);
            g[y][x] = f > 0.8 ? 'h' : f < 0.3 ? 'K' : 'k';
            if (y > 11 && (x === 6 || x === 10) && (y + x) % 4 !== 0) g[y][x] = 'v';
        }
    }
    // the opening: a black oval, nobody in it
    for (let y = 3; y < 13; y++) for (let x = 4; x < 13; x++) if (((x - 8.5) / 3.3) ** 2 + ((y - 8) / 4.6) ** 2 <= 1) g[y][x] = 'X';
    const out = g.map((r) => r.slice());
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (g[y][x] !== '.') continue;
        if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => (g[y + b]?.[x + a] ?? '.') !== '.')) out[y][x] = 'O';
    }
    return { w, h, rows: out.map((r) => r.join('')), legend: { '.': null, O: 'outline', K: 'crowDark', k: 'crow', h: 'crowLight', v: 'violetDark', X: 'eyeBlack' }, anchor: { x: 8, y: 0 } };
})();

// Game on the counter: a duck and two hens belly up, between RoadRunner and the necromancer's end.
const GAME = [
    { def: FLYERS.duck[1].fall[1], x: ax(0.295), y: top + 2 },
    { def: FLYERS.chicken[1].fall[1], x: ax(0.33), y: top + 2, flip: true },
    { def: FLYERS.duck[1].fall[1], x: ax(0.585), y: top + 2, flip: true },
];

// ---------------------------------------------------------------------------------------------------------------
// The owl.
function owlTalkFrame(b, t) {
    const ms = (t - b.from) * 1000;
    if (ms < 0 || ms > b.plan.ms + 150) return null;
    let k = beakAt(b.plan, ms);
    const wing = wingAt(b.plan, ms);
    if (b.hop) return k ? OWL_BAR.beakWing[2] : OWL_BAR.beak[2];
    return wing ? OWL_BAR.beakWing[k] : OWL_BAR.beak[k];
}
function owlFrame(t) {
    if (t >= POUR[0] && t < POUR[1]) return pourFrame((t - POUR[0]) / (POUR[1] - POUR[0]));
    if (t >= POUR[1] && t < POUR[1] + 0.18) return OWL_BAR.set[0];
    if (t >= POUR[1] + 0.18 && t < POUR[1] + 0.36) return OWL_BAR.set[1];
    for (const c of [CLINK1, CLINK2]) if (t >= c - 0.1 && t < c + 0.9) return OWL_BAR.talk[2];
    if (t >= LOOK[0] && t < LOOK[1]) {
        const k = (t - LOOK[0]) / (LOOK[1] - LOOK[0]);
        return [OWL.turnLeft[0], OWL.turnLeft[1], OWL.turnLeft[1], OWL.turnLeft[0], OWL_BAR.idle[0], OWL.turnRight[0], OWL.turnRight[1], OWL.turnRight[0]][Math.floor(k * 8)];
    }
    if (t >= HOOT - 0.05 && t < HOOT + 0.45) return OWL.hoot;
    for (const b of BUBBLES) if (b.who === 'owl') { const f = owlTalkFrame(b, t); if (f) return f; }
    if (t >= FREEZE[0] && t < FREEZE[0] + 0.12) return OWL_BAR.blink;
    if (t >= FREEZE[0] + 0.12 && t < LB(2).to) return OWL_BAR.beak[2];
    // remembering: a look over at the counter's end while it struggles for the name
    if (t >= LB(1).from + 2.6 && t < FREEZE[0]) return OWL.turnLeft[0];
    const blink = (t % 3.3) < 0.13;
    return blink ? OWL_BAR.blink : OWL_BAR.idle[Math.floor(t / 0.7) % 2];
}

// RoadRunner: the mug at the chest; lifted for the toasts (RUNNER.l.bar 1–3), lowered after.
function rrFrame(t) {
    const up = (a, b) => (t < a ? -1 : t < b ? Math.min(3, 1 + Math.floor(((t - a) / (b - a)) * 3)) : 3);
    for (const [a, down] of [[LIFT1, CLINK1 + 1.0], [LIFT2, CLINK2 + 1.2]]) {
        if (t >= a && t < down) return RUNNER.l.bar[up(a, a + 0.45)];
        if (t >= down && t < down + 0.4) return RUNNER.l.bar[3 - Math.min(3, 1 + Math.floor(((t - down) / 0.4) * 3))];
    }
    return RUNNER.l.bar[0];
}
const rrHop = (t) => {
    for (const m of [MEEP1, MEEP2]) if (t >= m && t < m + 0.6) return Math.floor((t - m) / 0.15) % 2;
    return 0;
};

const mid = canvas(aw, ah);
function drawMid(t) {
    const [c, x] = mid;
    x.clearRect(0, 0, aw, ah);
    x.drawImage(litBase, 0, 0);
    const P = (px, py, col) => { x.fillStyle = hex(col); x.fillRect(Math.round(px), Math.round(py), 1, 1); };
    // the hood on its hook, swaying a hair
    const sway = Math.round(Math.sin(t * 0.8) * 0.4);
    x.drawImage(barBake(HOOD), POST.x + 5 - HOOD.anchor.x + sway, top - 29);
    // RoadRunner and the owl behind the counter
    const rf = rrFrame(t);
    x.drawImage(rrBake(rf), rrA.x - rf.anchor.x, rrA.y - rf.anchor.y - rrHop(t));
    const f = owlFrame(t);
    x.drawImage(barBake(f), owlA.x - f.anchor.x, owlA.y - f.anchor.y);
    // the counter over their lower halves
    x.drawImage(litBase, 0, top, aw, ah - top, 0, top, aw, ah - top);
    // mugs: the owl's freshly poured one, the necromancer's half-drunk one
    if (t > POUR[1] + 0.1) x.drawImage(mugC, setMug.x - BAR_MUG.anchor.x, setMug.y - BAR_MUG.anchor.y);
    x.drawImage(barBake(HALF_MUG), SPOT.x + 3 - BAR_MUG.anchor.x, top + 2 - BAR_MUG.anchor.y);
    // the game
    for (const g of GAME) {
        const cv = barBake(g.def);
        if (g.flip) { x.save(); x.translate(g.x, 0); x.scale(-1, 1); x.drawImage(cv, -g.def.w / 2, g.y - g.def.h + 1); x.restore(); }
        else x.drawImage(cv, Math.round(g.x - g.def.w / 2), g.y - g.def.h + 1);
    }
    // the pour
    const flow = Math.floor(t * 24);
    const BEER = [PALETTE.pumpkinShine, PALETTE.pumpkinLight], FOAM = [PALETTE.white, PALETTE.cream];
    if (t >= POUR[0] && t < POUR[1] + 0.2) {
        for (let y = tap.y + 1; y < owlMug.y - 5; y++) P(tap.x + 1, y, BEER[(y + flow) % 2]);
        const rise = smooth(POUR[0], POUR[1], t);
        if (rise > 0.6) for (let k = -2; k <= 2; k++) P(owlMug.x + k, owlMug.y - 7 - (rise > 0.85 && Math.abs(k) < 1 ? 1 : 0), FOAM[(k + flow + 9) % 2]);
    }
    // the owl's mug: its foam breathing
    if (t > POUR[1] + 0.1) for (let k = -2; k <= 2; k++) P(setMug.x + k + 1, setMug.y - 8 - ((Math.floor(t * 2) + k) % 3 === 0 ? 1 : 0), FOAM[(k + 9) % 2]);
    return c;
}

// The hall behind: the game's bar, softened and dimmed once, wider than the screen.
const back = (() => {
    const hw = 320, hh = 180;
    const [hall, hx] = canvas(hw, hh);
    paintBar(hx, hw, hh, layout, { lighting: lit });
    for (const l of barLights(layout, hw, hh)) {
        if (l.halo) { hx.save(); hx.globalCompositeOperation = 'lighter'; hx.globalAlpha = 0.3; hx.drawImage(bake(halo(l.halo.rx, l.halo.ry, 'warm')), l.halo.x - l.halo.rx, l.halo.y - l.halo.ry); hx.restore(); }
        hx.drawImage(l.frames[Math.floor(900 / BAR_FLICKER_MS + l.phase) % l.frames.length], l.x - l.anchor.x, l.y - l.anchor.y);
    }
    for (const p of barProps(layout, hw, hh, { lighting: lit })) if (p.y < hh * 0.42) hx.drawImage(p.canvas, p.x - p.anchor.x, p.y - p.anchor.y);
    const spot = barOwlSpot(layout, hw, hh);
    const Zb = M * 0.75, cw = (W * 1.5) / Zb, ch = (H * 1.4) / Zb;
    const sx = Math.max(0, Math.min(hw - cw, spot.x - cw * 0.6)), sy = Math.max(0, spot.y - ch * 0.95);
    const [c, x] = canvas(Math.round(W * 1.5), Math.round(H * 1.4));
    x.filter = 'blur(5px) brightness(0.75) saturate(0.95)';
    x.drawImage(hall, sx, sy, cw, ch, 0, 0, c.width, c.height);
    x.filter = 'none';
    // morning: a warm wash over the hall
    x.globalCompositeOperation = 'soft-light'; x.fillStyle = 'rgba(255,200,130,0.5)'; x.fillRect(0, 0, c.width, c.height);
    return c;
})();

// ---------------------------------------------------------------------------------------------------------------
// The heroes in the foreground, seen from behind: lit by the bar, shaded, a warm rim on the window side, the rapier in
// its scabbard slung across the back (hilt over the right shoulder), beer keeping its colour.
const L = {
    witch: { body: 'witch', cloak: 'cape', face: 'grin', eyes: 'green', hat: 'witch' },
    cat: { body: 'cat', cloak: 'none', face: 'smile', eyes: 'amber', hat: 'none' },

    HANDS.forEach((h, i) => {
        const c = CRACKS[i];
        for (const [at, n, up] of [[h.rise, 12, 30], [h.sink + 0.2, 6, 14]]) {
            const a = t - at;
            if (a < 0 || a > 0.8) continue;
            for (let k = 0; k < n; k++) {
                const vx = (hash(k + i * 40 + at) - 0.5) * 30, vy = -(10 + hash(k + 7 + i * 40) * up);
                const px = c.x + vx * a, py = c.y + vy * a + 60 * a * a;
                if (py > c.y + 1) continue;
                ground(px, py, hash(k + 3) < 0.4 ? 'soilLight' : hash(k + 5) < 0.6 ? 'soil' : 'ash');
            }
        }
    });
    // the duck
    if (d) {
        const cv = dawnBake(d.def);
        sx.save();
        sx.translate(Math.round(d.x), Math.round(d.y));
        if (d.tilt) sx.rotate(d.tilt);
        sx.drawImage(cv, -d.def.anchor.x, -d.def.anchor.y);
        if (worn) { const e = eyeOf(d); sx.drawImage(dawnBake(GLASSES), e.x - GLASSES.anchor.x + 1, e.y - GLASSES.anchor.y + GLASSES_DROP); }
        sx.restore();
    }
    return STAGE;
}

// The field camera: centre (art px) and zoom.
function fieldCamera(t) {
    const s = t - F;
    let cx = P0.x, cy = P0.y - 20, z = lerp(1.8, 2.05, smooth(F, BLOW[1], t));
    // closer on the bolts while the ground breaks, closer still on the hands
    const k1 = smooth(BLOW[1] + 0.5, CRACK[0], t);
    z = lerp(z, 2.5, k1); cy = lerp(cy, P0.y - 9, k1);
    const k2 = smooth(HANDS[0].rise, HANDS[0].rise + 1.2, t) * (1 - smooth(CLOSE[0], THUD + 1.5, t));
    z += 0.25 * k2;
    // the duck
    const k3 = smooth(DUCK_IN[0] - 0.4, DUCK_IN[1] + 0.4, t);
    cx = lerp(cx, DUCK_SPOT.x + 8, k3); cy = lerp(cy, DUCK_SPOT.y - 12, k3); z = lerp(z, 2.75, k3);
    z += 0.35 * smooth(WEAR, WEAR + 0.25, t) * (1 - smooth(TAKEOFF - 0.4, TAKEOFF + 0.4, t));
    cy -= 6 * smooth(WEAR, WEAR + 0.25, t) * (1 - smooth(TAKEOFF - 0.4, TAKEOFF + 0.4, t));
    const k4 = smooth(TAKEOFF, TAKEOFF + 1.6, t);
    cx = lerp(cx, DUCK_SPOT.x + 40, k4); cy = lerp(cy, DUCK_SPOT.y - 40, k4); z = lerp(z, 2.2, k4);
    cx += Math.sin(s * 0.3) * 1.2; cy += Math.cos(s * 0.23) * 0.6;
    // the thud
    const q = Math.floor(t * 30);
    const amp = t > THUD && t < THUD + 0.5 ? 1.6 * (1 - (t - THUD) / 0.5) : 0;
    return { cx: cx + (hash(q) - 0.5) * 2 * amp, cy: cy + (hash(q + 7) - 0.5) * 2 * amp, z };
}
function layer(cam, f, fn, neutral = { x: MW / 2, y: MH / 2 }) {
    const z = S * (1 + (cam.z - 1) * f);
    const cx = neutral.x + (cam.cx - neutral.x) * f, cy = neutral.y + (cam.cy - neutral.y) * f;
    o.save(); o.translate(W / 2, H / 2); o.scale(z, z); o.translate(-cx, -cy); fn(z); o.restore();
    return (p) => ({ x: (p.x - cx) * z + W / 2, y: (p.y - cy) * z + H / 2 });
}
const FG = Array.from({ length: 40 }, (_, i) => {
    const list = DECOR.grass;
    return { def: list[Math.floor(hash(i + 7) * list.length)], x: i * 62 + hash(i) * 40 - 300, s: 0.8 + hash(i + 11) * 0.7, ph: hash(i + 13) * 6 };
});
// Ash in the air: a drift all along, thick while the pile goes.
const DRIFT = Array.from({ length: 80 }, (_, i) => ({ y: hash(i + 99) * H, x: hash(i) * W, v: 120 + hash(i + 3) * 260, s: hash(i + 7) < 0.3 ? 12 : 7, ph: hash(i + 5) * 6, d: 0.5 + hash(i + 11) }));
function drift(t, cam) {
    const gust = 0.35 + 0.65 * smooth(BLOW[0] - 0.5, BLOW[0] + 0.8, t) * (1 - smooth(BLOW[1], BLOW[1] + 2, t));
    const a0 = (1 - smooth(DARK[0], DARK[1], t)) + smooth(DARK[2], DARK[3], t) * 0.6;
    for (const m of DRIFT) {
        const x = ((m.x + t * m.v * m.d - (cam.cx - 160) * 10 * m.d) % (W + 100) + W + 100) % (W + 100) - 50;
        const y = m.y + Math.sin(t * 1.3 + m.ph) * 30 - (cam.cy - 120) * 6 * m.d;
        const a = (0.15 + 0.35 * hash(m.ph)) * gust * Math.min(1, a0);
        if (a <= 0.01) continue;
        o.fillStyle = `rgba(200,190,196,${a})`;
        o.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, m.s * m.d, m.s * m.d * 0.7);
    }
}

function drawField(t) {
    const cam = fieldCamera(t);
    o.fillStyle = dhex('dawnTop'); o.fillRect(0, 0, W, H);
    soft(0.8, 6, () => layer(cam, 0.2, () => {
        o.drawImage(SKYC, -MW / 2, 0);
        o.fillStyle = dhex('dawnTop'); o.fillRect(-MW, -MH, MW * 3, MH);
        // the sun just up over the hills, on the right
        const sun = DECOR.sun;
        o.drawImage(bake(sun), 228 - (sun.w >> 1), HZ - 18);
    }));
    soft(0.7, 5, () => layer(cam, 0.55, () => o.drawImage(FAR, -MW / 2, 0)));
    const toS = layer(cam, 1, () => o.drawImage(drawStage(t), 0, 0));
    // low warm light from the sun on the right, mist on the horizon
    const sunP = toS({ x: 250, y: HZ - 10 });
    const g = o.createRadialGradient(sunP.x, sunP.y, 40, sunP.x, sunP.y, 1700);
    g.addColorStop(0, 'rgba(255,214,170,0.28)'); g.addColorStop(1, 'rgba(255,200,170,0)');
    o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    // the foreground: weeds, out of focus
    const k = 4 * (1 + (cam.z - 1) * 1.6);
    const off = -(cam.cx - 160) * k;
    soft(null, 7, () => {
        for (const gr of FG) {
            const s = Math.round(k * gr.s * 1.3);
            const x = ((gr.x + off) % 2700 + 2700) % 2700 - 300 + Math.sin(t * 1.7 + gr.ph) * 14;
            o.drawImage(dawnBake(gr.def), x - gr.def.anchor.x * s, H + 40 - gr.def.anchor.y * s, gr.def.w * s, gr.def.h * s);
        }
        o.globalCompositeOperation = 'source-atop'; o.fillStyle = 'rgba(20,12,30,0.55)'; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    });
    drift(t, cam);
    const v = o.createRadialGradient(W / 2, H * 0.48, H * 0.34, W / 2, H * 0.5, H * 1.08);
    v.addColorStop(0, 'rgba(10,6,16,0)'); v.addColorStop(1, 'rgba(10,6,16,0.62)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    // the duck's «Кря.»
    const d = duckAt(t);
    if (d) {
        const head = toS({ x: d.x + 8, y: d.y - 14 });
        bubble(BUBBLES.at(-1), t, head, (bw, bh) => ({ bx: head.x - bw - 40, by: head.y - bh - 170 }));
    }
}

// ===============================================================================================================
const [MIX, mixX] = canvas(W, H);
function draw(t) {
    if (t < DISSOLVE[0]) drawBar(t);
    else if (t >= DISSOLVE[1]) drawField(t);
    else {
        drawField(t);
        o = mixX; drawBar(t); o = OUT;
        o.save(); o.globalAlpha = 1 - smooth(DISSOLVE[0], DISSOLVE[1], t); o.drawImage(MIX, 0, 0); o.restore();
    }
    const black = 1 - smooth(0, 0.7, t)
        + smooth(DARK[0], DARK[1], t) * (1 - smooth(DARK[2], DARK[3], t))
        + smooth(FINAL[0], FINAL[1], t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// ---------------------------------------------------------------------------------------------------------------
// Sound cues (sound.mjs): the game's own synth.
const OWL_PAN = 0.3;
const owlPanAt = (at) => (at >= LB(1).from + 2 && at < LB(4).from ? 0.65 : OWL_PAN);
const wind = [];
for (let at = DISSOLVE[0] + 0.3; at < DURATION - 0.6; at += 0.42) {
    if (at > DARK[1] - 0.6 && at < DARK[2] + 0.2) continue;
    const gust = 0.55 + 0.6 * smooth(BLOW[0] - 0.5, BLOW[0] + 0.8, at) * (1 - smooth(BLOW[1], BLOW[1] + 2, at));
    const fade = smooth(DISSOLVE[0], DISSOLVE[1], at) * (1 - smooth(DARK[0], DARK[1] - 0.3, at)) + smooth(DARK[2], DARK[3], at) * 0.7 * (at > DARK[2] ? 1 : 0);
    wind.push({ sfx: 'bush.rustle', at, pitch: -15 + hash(at) * 3, vol: 0.5 * gust * clamp(fade) * (1 - smooth(FINAL[0], FINAL[1], at)), pan: Math.sin(at * 0.7) * 0.5, variant: Math.floor(at * 10) % 4 });
}
const flaps = (from, to, per, pan) => Array.from({ length: Math.max(0, Math.floor((to - from) / per)) }, (_, k) => ({ sfx: 'bush.rustle', at: from + k * per, pitch: 5, vol: 0.35, pan, variant: k % 4 }));
window.SOUND = [
    { music: 'bar', from: 0, to: DISSOLVE[0] + 1.4, intensity: [[0, 0.45], [CLINK1 - 0.5, 0.5], [CLINK1, 1], [CLINK2 + 1.5, 1], [HOOT, 0.35], [LB(2).from, 0.3], [LB(4).from, 0.15]], fadeIn: 1, fadeOut: 3.2 },
    { sfx: 'bar.pour', at: POUR[0], pan: OWL_PAN + 0.1, vol: 0.8 },
    { sfx: 'bar.mug', at: POUR[1] + 0.18, pan: OWL_PAN },
    { sfx: 'bar.take', at: LIFT1, pan: -0.05, vol: 0.7 },
    { sfx: 'finale.meep', at: MEEP1, variant: 0 },
    { sfx: 'clink.glass', at: CLINK1, pan: -0.4 },
    { sfx: 'clink.glass', at: CLINK1 + 0.06, pan: 0.4, variant: 1 },
    { sfx: 'clink.glass', at: CLINK1 + 0.15, pan: 0, variant: 2 },
    { sfx: 'clink.cheer', at: CLINK1 + 0.1, vol: 1.1 },
    { sfx: 'rr.meep', at: MEEP2, variant: 1, vol: 1.2 },
    { sfx: 'clink.glass', at: CLINK2, pan: 0.3, variant: 3 },
    { sfx: 'clink.glass', at: CLINK2 + 0.08, pan: -0.3 },
    { sfx: 'clink.cheer', at: CLINK2 + 0.1, variant: 1, vol: 1.1 },
    { sfx: 'bar.gulp', at: CLINK2 + 1.0, pan: -0.5, vol: 0.6 },
    { sfx: 'bar.gulp', at: CLINK2 + 1.3, pan: 0.5, vol: 0.6, variant: 1 },
    { sfx: 'owl.hoot', at: HOOT, pan: OWL_PAN },
    ...BUBBLES.filter((b) => b.who === 'owl').map((b) => ({ speak: 'owl', text: textOf(b), at: b.from, pan: owlPanAt(b.from), pitch: b.hop ? 2 : 0 })),
    { sfx: 'word.ok', at: LB(2).from - 0.05, pan: 0.4, vol: 0.55 },
    // the field: the wind, the ground giving, the hands, the bolts gone under, the thud
    ...wind,
    ...CRACKS.map((c, i) => ({ sfx: 'worm.squelch', at: CRACK[0] + i * 0.4, pitch: -6, vol: 0.6, pan: i ? 0.3 : -0.3, variant: i })),
    ...HANDS.flatMap((h, i) => [
        { sfx: 'bush.rustle', at: STIR + i * 0.3, pitch: -8, vol: 0.6, pan: i ? 0.3 : -0.3 },
        { sfx: 'zombie.die.sink', at: h.rise - 0.4, pitch: 6, vol: 0.5, pan: i ? 0.3 : -0.3, variant: i },
        { sfx: 'worm.squelch', at: h.rise, pitch: -3, vol: 0.9, pan: i ? 0.3 : -0.3, variant: 2 + i },
        { sfx: 'zombie.groan', at: h.rise + 0.25, pitch: -4, vol: 0.45, pan: i ? 0.3 : -0.3, variant: i },
        { sfx: 'bar.take', at: h.grab, pitch: -5, vol: 0.8, pan: i ? 0.2 : -0.2, variant: i },
        { sfx: 'zombie.die.sink', at: h.sink, pitch: -2, vol: 1.1, pan: i ? 0.3 : -0.3, variant: 2 - i },
    ]),
    { sfx: 'bonfire.explode', at: THUD, pitch: -12, vol: 1.3 },
    { sfx: 'finale.strike', at: THUD, pitch: -14, vol: 0.5 },
    // the duck
    ...flaps(DUCK_IN[0], DUCK_IN[1] - 0.2, 0.17, -0.3),
    { sfx: 'duck.quack', at: DUCK_IN[0] + 0.4, pan: -0.5, vol: 0.5 },
    { sfx: 'walk.step', at: DUCK_IN[1], pitch: 7, vol: 0.4, pan: -0.1 },
    { sfx: 'bar.take', at: WEAR, pitch: 4, vol: 0.6, pan: -0.1, variant: 2 },
    { sfx: 'duck.quack', at: QUACK + 0.02, pan: -0.1, vol: 1.2, variant: 1 },
    ...flaps(TAKEOFF, TAKEOFF + 1.5, 0.13, 0.3),
    { sfx: 'word.ok', at: ACCENT, pan: 0.2, vol: 0.8 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
window.T = { MEEP1, CLINK1, MEEP2, CLINK2, LOOK, HOOT, LINES: BUBBLES.map((b) => [b.from.toFixed(2), b.to.toFixed(2), textOf(b)]), FREEZE, DISSOLVE, BLOW, STIR, CRACK, HANDS, CLOSE, THUD, DARK, DUCK_IN, PICK, WEAR, QUACK, TAKEOFF, ACCENT, FINAL, DURATION };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
