<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// The circle: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Scene 4, the ritual on the circle: the red circle is closed on the burnt pit under the blood moon, the owl awaits a
// sign. None comes: the circle flickers like a faulty lamp. The owl reads the last ingredient out of the book —
// Fart Time; the crowd farts cloud after cloud, a herd of elephants farts over the hills, the gas spirals into the
// circle and it burns steady. A farting duck is shot over it and drops in; the pumpkins tear off and spiral in after it,
// the circle blows up into the column and the dark silhouette rises — from there on the frame is franken-rise's opening.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, PUMPKIN_SHADOW, bake, pumpkinLayers, seedOf } from '/js/pixel/sprites.js';
import { ASH } from '/js/pixel/bonfire.js';
import { EMISSIVE, LIT_PALETTE, NIGHT, halo, paintSky, relightCanvas } from '/js/pixel/night.js';
import { characterFrame, randomLook } from '/js/pixel/characters.js';
import { OWL, glowing } from '/js/pixel/owl.js';
import { FX, FINALE_EMISSIVE, SILHOUETTE } from '/js/pixel/finale.js';
import { ELEPHANT, bannerFrame, fartAt, fartCloud, flightAt, hookOf, PUFFS } from '/js/pixel/elephant.js';
import { FART_SCALE } from '/js/pixel/ability.js';
import { BUSH, FLYERS, feathersOf } from '/js/pixel/flyers.js';
import { speechPlan, beakAt, wingAt } from '/js/owl-speech.js';

const W = 1920, H = 1080;
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const rgbOf = (n) => [(n >> 16) & 255, (n >> 8) & 255, n & 255];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const mod = (a, m) => ((a % m) + m) % m;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(mod(ms, n * per) / per);

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. Each line hangs for its speech plus 2 s to read it.
const line = (lines) => { const text = lines.join(' '); return { lines, text, plan: speechPlan(text) }; };
const L = [
    line(['Круг замкнут! Ещё немного —', 'и он придёт… Ждём знака!']),
    line(['Так… тут сказано…', 'последний ингредиент?..']),
    line(['Не смотрите на меня так.', 'Это написано в книге!']),
    line(['Давайте, все вместе!']),
];
const say = (l, from) => { l.from = from; l.said = from + l.plan.ms / 1000; l.to = l.said + 2 + Math.max(0.4, l.text.length * 0.02); return l; };
const OWL1 = 2.0;                           // close-up: the circle is closed
say(L[0], OWL1 + 0.9);
const FLICKER = L[0].to + 0.1;              // wide: no sign — the circle flickers like a faulty lamp
const OWL2 = FLICKER + 3.6;                 // close-up: the book
const BOOK_UP = [OWL2 + 0.25, OWL2 + 0.75];
const FLIPS = [OWL2 + 0.95, OWL2 + 1.35, OWL2 + 1.75];
say(L[1], OWL2 + 2.2);
const CROWD = L[1].to + 0.1;                // the crowd spreads its hands, «?» over every head
const QMARKS = CROWD + 0.35;
const OWL3 = CROWD + 2.6;
say(L[2], OWL3 + 0.35);
say(L[3], L[2].to + 0.25);
const STRAIN = L[3].to + 0.15;              // wide: everyone strains
const ELE = [0, 1, 2].map((i) => ({ from: STRAIN + 0.5 + i * 0.55, y: [36, 26, 46][i], x0: [70, 150, 10][i], speed: 44 + i * 4 }));
const DUCK_OUT = STRAIN + 5.2;
const SHOT = DUCK_OUT + 2.2;
const DROP = SHOT + 0.62;                   // the duck lands in the circle's middle
const SPIRAL = [DROP + 0.25, DROP + 2.1];   // the pumpkins tear off and spiral in after it
const SUMMON = SPIRAL[1] + 0.05;            // franken-rise's t = 0 from here on
const DURATION = SUMMON + 3.9;              // up to just before franken-rise's first bubble
// franken-rise's own timeline (its constants), counted from SUMMON
const F = { STRIKE: 6.6 };

// ---------------------------------------------------------------------------------------------------------------
// The stage (as franken-rise stages it): 320 × 180 art px.
const UNLIT = new Set([...EMISSIVE, ...FINALE_EMISSIVE]);
const baked = new WeakMap();
function bakeF(sprite, lighting = 'day') {
    if (!baked.has(sprite)) baked.set(sprite, new Map());
    const per = baked.get(sprite);
    if (per.has(lighting)) return per.get(lighting);
    const [c, ctx] = canvas(sprite.w, sprite.h);
    const img = ctx.createImageData(sprite.w, sprite.h);
    for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
        const k = sprite.legend[sprite.rows[y][x]];
        if (!k) continue;
        const color = UNLIT.has(k) || lighting === 'day' ? PALETTE[k] : LIT_PALETTE[lighting][k];
        const i = (y * sprite.w + x) * 4;
        img.data[i] = (color >> 16) & 255; img.data[i + 1] = (color >> 8) & 255; img.data[i + 2] = color & 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    per.set(lighting, c);
    return c;
}
const light = (s) => bakeF(s, 'day');
const stamp = (ctx, c, def, x, y) => ctx.drawImage(c, Math.round(x - def.anchor.x), Math.round(y - def.anchor.y));
const stampFlip = (ctx, c, def, x, y) => { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -(def.w - def.anchor.x), Math.round(y - def.anchor.y)); ctx.restore(); };
const additive = (ctx, c, def, x, y, a) => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; stamp(ctx, c, def, x, y); ctx.restore(); };
const glowCache = new WeakMap();
const glow = (s) => glowCache.get(s) ?? glowCache.set(s, glowing(s)).get(s);
const big = (ctx, c, def, x, y, flip, k = 2) => {
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(c, -def.anchor.x * k, -def.anchor.y * k, def.w * k, def.h * k);
    ctx.restore();
};

const MW = 320, MH = 180, HORIZON = 62;
const CENTRE = { x: 166, y: 124 };
const RING = [
    [-70, -18, 'm', 'pumpkin-1'], [-38, -30, 's', 'pumpkin-2'], [6, -34, 's', 'pumpkin-3'], [44, -28, 'm', 'pumpkin-5'],
    [78, -12, 's', 'pumpkin-6'], [96, 14, 'l', 'pumpkin-7'], [60, 38, 'm', 'pumpkin-8'], [14, 46, 'l', 'pumpkin-10'],
    [-34, 44, 'm', 'pumpkin-11'], [-80, 26, 'l', 'pumpkin-13'], [-100, 0, 's', 'pumpkin-14'],
];
const TREE_AT = { x: 34, y: 118 };
const PERCH = { x: TREE_AT.x - DECOR.tree.anchor.x + DECOR.tree.perch[0], y: TREE_AT.y - DECOR.tree.anchor.y + DECOR.tree.perch[1] };
const looks = Array.from({ length: 6 }, (_, i) => randomLook(((s) => () => ((s = (s * 16807) % 2147483647) / 2147483647))(41 + i * 13)));
const AROUND = [[-58, 8], [58, 8], [-34, 30], [34, 30], [0, 38], [-74, -10]];
const DUCK_BUSH = { x: 300, y: 100 };

const LAWN = (() => {
    const [c, ctx] = canvas(MW, MH);
    let seed = 9;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let x = 0; x < MW; x += DECOR.hills.w) ctx.drawImage(bake(DECOR.hills), x, HORIZON - DECOR.hills.h);
    for (let y = HORIZON; y < MH; y++) for (let x = 0; x < MW; x++) {
        const d = Math.hypot((x - CENTRE.x) / 132, (y - CENTRE.y + 4) / 52);
        let k;
        if (d < 0.9 || (d < 1 && (x + y) % 2 === 0)) {
            const lane = ((((x - CENTRE.x) / (y - HORIZON + 30)) * 9) % 1 + 1) % 1;
            k = lane < 0.2 ? 'soilDark' : lane < 0.3 ? 'soilLight' : 'soil';
        } else { const n = r(); k = n < 0.06 ? 'leafLight' : n < 0.18 ? 'leafDark' : 'leaf'; }
        ctx.fillStyle = hex(PALETTE[k]); ctx.fillRect(x, y, 1, 1);
    }
    stamp(ctx, bake(DECOR.tree), DECOR.tree, TREE_AT.x, TREE_AT.y);
    return c;
})();
const GROUND = relightCanvas(LAWN, 'blood');
const SKY = (() => { const [c, ctx] = canvas(MW, HORIZON + 1); paintSky(ctx, MW, HORIZON + 1, 'blood', { seed: 5 }); return c; })();

// ---------------------------------------------------------------------------------------------------------------
// The circle (ASH.circle[7]) cut into sectors round its middle, so it can go out in patches like a dying lamp.
const CIRCLE = ASH.circle[7];
const SECTORS = 14, SQUASH = 0.34, R_OUT = 26;
const SECTOR_ART = (() => {
    const src = light(CIRCLE), w = src.width, h = src.height;
    const d = src.getContext('2d').getImageData(0, 0, w, h).data;
    return Array.from({ length: SECTORS }, (_, s) => {
        const [c, x] = canvas(w, h);
        const img = x.createImageData(w, h);
        for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
            const i = (yy * w + xx) * 4;
            if (!d[i + 3]) continue;
            const a = mod(Math.atan2((yy - CIRCLE.anchor.y) / SQUASH, xx - CIRCLE.anchor.x), Math.PI * 2);
            if (Math.floor((a / (Math.PI * 2)) * SECTORS) % SECTORS !== s) continue;
            img.data.set(d.subarray(i, i + 4), i);
        }
        x.putImageData(img, 0, 0);
        return c;
    });
})();
const ringAt = (a, r = R_OUT) => ({ x: CENTRE.x + Math.cos(a) * r, y: CENTRE.y + Math.sin(a) * r * SQUASH });

// ---------------------------------------------------------------------------------------------------------------
// Fart Time: each walker farts two or three clouds in a row, the herd's after them; every cloud, once formed, is
// drawn down a spiral into the circle and steadies it.
const STRAIN_T = (i) => STRAIN + 0.55 + [0, 0.3, 0.15, 0.45, 0.22, 0.55][i];
const FARTS = AROUND.map((_, i) => Array.from({ length: i % 2 ? 2 : 3 }, (_, k) => STRAIN_T(i) + k * 0.6 + hash(i * 7 + k) * 0.12));
const CLOUDS = [];
const herdAt = (e, t) => {
    const s = t - e.from;
    const x = e.x0 + s * e.speed;
    const rise = smooth(0, 1.6, s);                 // out from behind the hills
    const fly = flightAt(Math.max(0, s) * 1000);
    return { x, y: lerp(HORIZON + 26, e.y, rise) - 12 * Math.max(0, s - 2.6) + fly.dy, fly, alpha: 1 - smooth(4.0, 4.9, s) };
};
FARTS.forEach((list, i) => list.forEach((at, k) => {
    CLOUDS.push({ at, scale: FART_SCALE, side: (AROUND[i][0] < 0 ? -1 : 1) * (k % 2 ? -1 : 1), walker: i, origin: () => { const p = walkerAt(i, at); return { x: p.x, y: p.y - 22 }; }, funnel: at + 1.0 + k * 0.15, feed: 0.06 });
}));
ELE.forEach((e, k) => {
    [0, 0.7].forEach((d, n) => {
        const at = e.from + 1.7 + k * 0.25 + d;
        CLOUDS.push({ at, scale: 1, side: 1, elephant: e, origin: () => { const p = herdAt(e, at); return hookOf(Math.round(p.x), Math.round(p.y), true); }, funnel: at + 1.2, feed: 0.1 });
    });
});
const FUNNEL = { x: CENTRE.x, y: CENTRE.y - 3 };
// How steady the circle burns, 0 (faulty) – 1 (every cloud is in).
const steadyAt = (t) => clamp(CLOUDS.reduce((k, c) => k + c.feed * smooth(c.funnel + 1.4, c.funnel + 1.8, t), 0) / CLOUDS.reduce((k, c) => k + c.feed, 0) * 1.05);
function cloudAt(c, t) {
    const ms = (t - c.at) * 1000;
    const f = fartAt(Math.min(ms, 1500));
    if (ms < 0 || !f.cloud || t > c.funnel + 1.8) return null;
    const o0 = c.origin();
    let x = o0.x - c.side * f.cloud.back * c.scale, y = o0.y - f.cloud.up * c.scale;
    let scale = f.cloud.scale * c.scale;
    const k = smooth(c.funnel, c.funnel + 1.8, t);
    if (k > 0) {
        // down the funnel: round the circle in a tightening spiral, shrinking into its middle
        const v0 = { x: x - FUNNEL.x, y: y - FUNNEL.y };
        const a = 2.6 * Math.PI * k * k, r = (1 - k) ** 1.2;
        x = FUNNEL.x + (v0.x * Math.cos(a) - v0.y * Math.sin(a) * 2) * r;
        y = FUNNEL.y + (v0.x * Math.sin(a) * 0.35 + v0.y * Math.cos(a)) * r;
        scale *= 1 - 0.75 * k;
    }
    return { x, y, scale: Math.max(0.2, Math.round(scale * 20) / 20) };
}
function farts(ctx, t) {
    for (const c of CLOUDS) {
        const f = fartAt((t - c.at) * 1000);
        if (t >= c.at && f.puffs.length) {
            const o0 = c.origin();
            for (const p of f.puffs) { const d = PUFFS[p.size]; stamp(ctx, light(d), d, o0.x - c.side * p.back * c.scale, o0.y - p.up * c.scale + (c.elephant ? 0 : 6)); }
        }
        const at = cloudAt(c, t);
        if (!at) continue;
        const def = fartCloud(at.scale);
        stamp(ctx, light(def), def, at.x, at.y);
    }
}
function elephants(ctx, t) {
    for (const e of ELE) {
        const s = t - e.from;
        if (s < 0 || s > 4.9) continue;
        const p = herdAt(e, t);
        const x = Math.round(p.x), y = Math.round(p.y);
        const strain = CLOUDS.some((c) => c.elephant === e && t > c.at - 0.5 && t < c.at + 0.1);
        const def = strain ? ELEPHANT.strain : ELEPHANT.fly[p.fly.frame];
        const hook = hookOf(x, y, true);
        const ban = bannerFrame(p.fly.wave, 'right');
        ctx.globalAlpha = p.alpha;
        stamp(ctx, bakeF(ban, 'blood'), ban, hook.x, hook.y);
        stamp(ctx, bakeF(def, 'blood'), def, x, y);
        ctx.globalAlpha = 1;
    }
}

// ---------------------------------------------------------------------------------------------------------------
// The faulty circle: patches go dark, the whole ring flares, goes out, comes back; sparks run along the lines. The
// farts steady it.
const SLOT = 0.07;
const faultAt = (t) => smooth(FLICKER - 0.2, FLICKER + 0.5, t) * (1 - steadyAt(t));
function circleState(t) {
    const f = faultAt(t), steady = steadyAt(t);
    const q = Math.floor(t / SLOT);
    const g = hash(q * 3 + 11);
    const all = g < 0.12 ? 0.08 : g > 0.88 ? 1.6 : 1;               // the whole ring out, or a flare
    const shift = Math.floor(hash(Math.floor(t / 0.35) + 5) * SECTORS);
    const sectors = Array.from({ length: SECTORS }, (_, s) => {
        const run = Math.floor(mod(s + shift, SECTORS) / 3);
        const dark = hash(q * 7 + run * 13 + 1) < 0.45 ? 0.1 : 1;
        const b = all < 1 ? all : all > 1 ? all : dark;
        return lerp(0.92 + 0.08 * Math.sin(t * 2.4 + s), b, f) + steady * (0.35 + 0.15 * Math.sin(t * 7));
    });
    return { sectors, level: sectors.reduce((a, b) => a + b, 0) / SECTORS, f };
}
// Sparks: born on the ring during the fault, each runs a little way along it.
const SPARKS = Array.from({ length: 60 }, (_, i) => ({ born: FLICKER + hash(i + 1200) * 3.4, a: hash(i + 1201) * Math.PI * 2, dir: hash(i + 1202) < 0.5 ? -1 : 1, life: 0.25 + hash(i + 1203) * 0.3, r: hash(i + 1204) < 0.7 ? R_OUT : 21 }));
// Fault crackle: the slots where the ring flares or goes dark (for the sound).
const CRACKLES = (() => {
    const out = [];
    for (let t = FLICKER; t < OWL2 + 0.4; t += SLOT) { const g = hash(Math.floor(t / SLOT) * 3 + 11); if ((g < 0.12 || g > 0.88) && (!out.length || t - out.at(-1) > 0.15)) out.push(t); }
    return out;
})();
function drawCircle(sx, t) {
    const st = circleState(t);
    const done = t >= SUMMON;
    const base = light(CIRCLE), x0 = Math.round(CENTRE.x - CIRCLE.anchor.x), y0 = Math.round(CENTRE.y - CIRCLE.anchor.y);
    if (done) { stamp(sx, base, CIRCLE, CENTRE.x, CENTRE.y); return st; }
    st.sectors.forEach((b, s) => {
        sx.globalAlpha = clamp(b);
        sx.drawImage(SECTOR_ART[s], x0, y0);
        if (b > 1) { sx.globalCompositeOperation = 'lighter'; sx.globalAlpha = clamp(b - 1); sx.drawImage(SECTOR_ART[s], x0, y0); sx.globalCompositeOperation = 'source-over'; }
    });
    sx.globalAlpha = 1;
    const g = halo(34, 10, 'red');
    additive(sx, light(g), g, CENTRE.x, CENTRE.y, clamp(0.2 + 0.3 * st.level));
    // sparks running along the lines
    for (const p of SPARKS) {
        const s = t - p.born;
        if (s < 0 || s > p.life || faultAt(p.born) < 0.3) continue;
        for (let k = 0; k < 4; k++) {
            const q = ringAt(p.a + p.dir * (s * 2.4 - k * 0.05), p.r);
            sx.fillStyle = hex(PALETTE[k === 0 ? 'white' : k === 1 ? 'columnCore' : k === 2 ? 'bloodMoonLight' : 'rune']);
            sx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1);
        }
        if (s < 0.08) { const q = ringAt(p.a, p.r); sx.fillStyle = hex(PALETTE.white); sx.fillRect(Math.round(q.x) - 1, Math.round(q.y) - 1, 1, 1); sx.fillRect(Math.round(q.x) + 1, Math.round(q.y) - 2, 1, 1); }
    }
    return st;
}

// ---------------------------------------------------------------------------------------------------------------
// The pumpkins: violet, hovering like floats; their light trembles with the faulty circle; after the duck they tear
// off and spiral into the middle, and the summoning flings them out into franken-rise's orbit.
function spiralPos(i, t) {
    const [dx, dy] = RING[i];
    const k = clamp((t - SPIRAL[0] - i * 0.05) / (SPIRAL[1] - SPIRAL[0] - 0.5)), e = k * k * (3 - 2 * k);
    const Q = 0.36;                                 // the ring's squash (franken-rise's orbit: 84 × 30)
    const r0 = Math.hypot(dx, dy / Q), a0 = Math.atan2(dy / Q, dx);
    const r = r0 * (1 - 0.8 * e), a = a0 + 2.3 * Math.PI * e;
    return { x: CENTRE.x + Math.cos(a) * r, y: CENTRE.y + 4 * e + Math.sin(a) * r * Q, e };
}
function pumpkinAt(i, t) {
    const fms = (t - SUMMON) * 1000;
    let { x, y, e } = spiralPos(i, t);
    let float = 10 + 3 * Math.sin(fms / 200 + i) + 6 * e;
    const f = faultAt(t);
    if (f > 0) float += Math.round((hash(Math.floor(t / SLOT) * 5 + i) - 0.5) * 2.5 * f);
    if (t >= SUMMON) {
        const tau = t - SUMMON;
        const a = (i / RING.length) * Math.PI * 2 + fms / 900;
        const fx = CENTRE.x + Math.cos(a) * 84, fy = CENTRE.y + 6 + Math.sin(a) * 30;
        const out = 1 - (1 - Math.min(1, tau / 1.5)) ** 3;
        x += (fx - x) * out; y += (fy - y) * out;
        float = 10 + 3 * Math.sin(fms / 200 + i) + 6 * (1 - out);
    }
    return { x, y, float: Math.round(float) };
}
function pumpkin(ctx, i, t, level) {
    const [, , size, id] = RING[i];
    const { x, y, float } = pumpkinAt(i, t);
    const ms = (t - SUMMON) * 1000;
    const Ls = pumpkinLayers(11, size, seedOf(id), 'violet');
    if (float > 0) { const sh = PUMPKIN_SHADOW[size][Math.min(2, Math.floor(float / 3))]; ctx.globalAlpha = 0.5; stamp(ctx, bake(sh), sh, x, y - 1); ctx.globalAlpha = 1; }
    const h = halo(size === 'l' ? 16 : 13, 5, 'violet');
    additive(ctx, light(h), h, x, y, clamp(0.4 * level, 0.05, 0.75));
    const at = (list, per) => list[frameAt(ms + i * 97, list.length, per)];
    const yy = y - float;
    if (Ls.auraFrames && level > 0.35) stamp(ctx, light(at(Ls.auraFrames, 160)), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.back, 'blood'), Ls, x, yy);
    if (Ls.glowFrames && level > 0.35) stamp(ctx, light(at(Ls.glowFrames, 120)), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.body, 'blood'), Ls, x, yy);
    stamp(ctx, bakeF(Ls.layers.rim, 'blood'), Ls, x, yy);
    if (Ls.layers.stem) stamp(ctx, bakeF(Ls.layers.stem, 'blood'), Ls, x, yy);
    if (Ls.fireFrames) stamp(ctx, light(at(Ls.fireFrames, 110)), Ls, x, yy);
}

// ---------------------------------------------------------------------------------------------------------------
// The crowd round the circle, books in hand: spreading their hands at the owl, straining and farting, then hands up
// in the ritual pose as franken-rise opens.
const RITUAL_AT = DROP + 0.3;
const strainOf = (i, t) => t > STRAIN && t < FARTS[i].at(-1) + 0.15;
function walkerAt(i, t) {
    const [dx0, dy0] = AROUND[i];
    const x = clamp(CENTRE.x + dx0, 8, MW - 8), y = CENTRE.y + dy0;
    const ms = t * 1000;
    let pose = 'idle', item = 'book', frame = frameAt(ms + i * 170, 2, 600), face = CENTRE.x - x;

        o.fillStyle = '#fff6c8'; o.fillRect(W - 220, H - 120, 220, 40); o.fillRect(W - 130, H - 210, 40, 220);
    }
    if (t >= SHOT && t < SHOT + 0.35) {
        // a starburst on the hit, in the Fart Time greens
        const d = toScreen({ x: HIT.x, y: HIT.y - 2 }), k = (t - SHOT) / 0.35, R = 90 + 70 * Math.sin(k * Math.PI);
        for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2 + 0.26;
            for (let s = 0; s < 4; s++) {
                const dd = R * (0.55 + s * 0.17) + (i % 2) * 20;
                o.fillStyle = s === 0 ? '#ffffff' : s < 3 ? hex(PALETTE.fartLight) : hex(PALETTE.fartDark);
                const q = (4 - s) * 6;
                o.fillRect(Math.round((d.x + Math.cos(a) * dd) / 6) * 6 - q / 2, Math.round((d.y + Math.sin(a) * dd) / 6) * 6 - q / 2, q, q);
            }
        }
    }
    if (t >= DROP && t < DROP + 0.3) {
        // the duck lands in the circle: a red pulse off it
        const d = toScreen({ x: CENTRE.x, y: CENTRE.y - 2 }), k = (t - DROP) / 0.3;
        const gg = o.createRadialGradient(d.x, d.y, 10, d.x, d.y, 500 + 500 * k);
        gg.addColorStop(0, `rgba(255,90,60,${0.6 * (1 - k)})`); gg.addColorStop(1, 'rgba(255,90,60,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = gg; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    }
    foreground(t, cam);
    soft(null, 3, () => { drawBurst(t, origin, true); drawLens(t, origin); });
    const v = o.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 1.1);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    if (sb >= 0 && sb < 0.6) { o.fillStyle = sb < 0.05 ? '#ffffff' : `rgba(255,214,200,${0.85 * Math.exp(-(sb - 0.05) * 8)})`; o.fillRect(0, 0, W, H); }
}

const closeUp = (t) => (t >= OWL1 && t < FLICKER) || (t >= OWL2 && t < CROWD) || (t >= OWL3 && t < STRAIN);
function draw(t) {
    if (closeUp(t)) shotB(t);
    else wide(t);
    for (const c of [OWL1, FLICKER, OWL2, CROWD, OWL3, STRAIN]) if (t >= c && t < c + 0.1) { o.fillStyle = `rgba(255,220,210,${0.3 * (1 - (t - c) / 0.1)})`; o.fillRect(0, 0, W, H); }
    const black = 1 - smooth(0, 1.0, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs). Scene 4's `blood` under the ritual, cut by the summoning; from SUMMON franken-rise's cues.
const panX = (x) => clamp((x - 160) / 160, -1, 1) * 0.7;
const STEADY_AT = (() => { for (let t = STRAIN; t < SUMMON; t += 0.02) if (steadyAt(t) >= 0.999) return t; return SUMMON - 1; })();
window.SOUND = [
    { music: 'blood', from: 0, to: SUMMON, intensity: [[0, 0.35], [FLICKER, 0.25], [STRAIN, 0.45], [STEADY_AT, 0.8], [SUMMON, 1]], fadeIn: 1.5, fadeOut: 0.05 },
    { music: 'rise', from: SUMMON, to: DURATION, intensity: 1, fadeIn: 0.6, fadeOut: 0.05 },
    ...WORMS.slice(0, 3).map((w, k) => ({ sfx: 'worm.squelch', at: 0.6 + k * 0.9, pan: panX(w[0]), vol: 0.45, variant: k })),
    { sfx: 'owl.hoot', at: L[0].from - 0.85, pan: -0.3 },
    ...L.map((l) => ({ speak: 'owl', text: l.text, at: l.from, pan: -0.3 })),
    // the faulty circle: crackle on every flare and blackout, zaps on the sparks
    ...CRACKLES.map((at, k) => ({ sfx: 'circle.click', at, vol: 0.9, pan: (hash(k + 40) - 0.5) * 0.6, variant: k })),
    ...SPARKS.filter((p, k) => k % 4 === 0 && faultAt(p.born) >= 0.3).map((p, k) => ({ sfx: 'bonfire.click', at: p.born, vol: 0.3, pitch: 7, pan: Math.cos(p.a) * 0.4, variant: k })),
    { sfx: 'finale.strike', at: FLICKER + 1.3, variant: 0, vol: 0.25, pitch: 5 },
    ...FLIPS.map((at, k) => ({ sfx: 'bush.rustle', at, pitch: 9, vol: 0.35, variant: k })),
    { sfx: 'word.fail', at: QMARKS, vol: 0.5 },
    ...AROUND.map((_, i) => ({ sfx: 'circle.click', at: QMARKS + i * 0.14, vol: 0.5, pitch: 7 + i, variant: i })),
    { sfx: 'owl.hoot', at: L[2].from - 0.85, pan: -0.3, vol: 0.7 },
    // the chorus: the crowd's farts (the elephant's, pitched up), the herd's
    ...CLOUDS.filter((c) => !c.elephant).map((c, k) => ({ sfx: 'elephant.fart', at: c.at, pitch: 4 + (c.walker * 1.7 + k * 0.9) % 6, vol: 0.5, pan: panX(CENTRE.x + AROUND[c.walker][0]) })),
    ...CLOUDS.filter((c) => c.elephant).map((c, k) => ({ sfx: 'elephant.fart', at: c.at, pitch: -1 - (k % 3), vol: 0.85, pan: -0.4 + (k % 3) * 0.4 })),
    ...CLOUDS.filter((_, k) => k % 2 === 0).map((c, k) => ({ sfx: 'pumpkin.enchant', at: c.funnel + 1.6, vol: 0.4, pan: 0, variant: k })),
    ...[0, 1, 2].map((k) => ({ sfx: 'circle.stage', at: STEADY_AT - 1.6 + k * 0.6, variant: k, vol: 0.6 })),
    { sfx: 'circle.done', at: STEADY_AT },
    { sfx: 'bush.rustle', at: DUCK_OUT - 0.5, pan: 0.7 },
    { sfx: 'bush.rustle', at: DUCK_OUT - 0.05, pan: 0.7, variant: 1 },
    { sfx: 'duck.quack', at: DUCK_OUT + 0.1, pan: 0.6 },
    ...DUCK_PUFFS.filter((_, i) => i % 3 === 0).map((at) => ({ sfx: 'elephant.fart', at, pitch: 14, vol: 0.25, pan: panX(duckPath(at).x) })),
    { sfx: 'duck.quack', at: DUCK_OUT + 1.3, pan: 0.2, variant: 2 },
    { sfx: 'shot.pistol', at: SHOT - 0.02, pan: 0.6 },
    { sfx: 'flyer.hit', at: SHOT },
    { sfx: 'elephant.fart', at: SHOT + 0.05, pitch: 8, vol: 0.6 },
    { sfx: 'flyer.fall', at: SHOT + 0.1 },
    { sfx: 'circle.click', at: DROP, vol: 1, pitch: -5 },
    ...RING.map((_, i) => ({ sfx: 'pumpkin.charged', at: SPIRAL[0] + i * 0.05 + 0.1, vol: 0.18, pitch: i * 0.6, variant: i })),
    ...[0, 1, 2].map((k) => ({ sfx: 'finale.strike', at: SPIRAL[1] - 0.9 + k * 0.32, variant: k, vol: 0.35 })),
    // the summoning: the blast of it, then franken-rise's opening cues
    { sfx: 'bonfire.explode', at: SUMMON, vol: 0.7 },
    { sfx: 'finale.wake', at: SUMMON },
    ...[0.3, 0.75, 1.3].map((d, k) => ({ sfx: 'finale.strike', at: SUMMON + d, variant: k, vol: 0.3 })),
    { sfx: 'owl.hoot', at: SUMMON + 0.85, pan: -0.6 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
window.T = { OWL1, FLICKER, OWL2, CROWD, OWL3, STRAIN, DUCK_OUT, SHOT, DROP, SPIRAL, SUMMON, STEADY_AT, DURATION, L: L.map((l) => [l.from, l.said, l.to]) };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
