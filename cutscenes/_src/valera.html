<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// Valera: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Finale step 5 of the game, where the owl flew off to: over the cursed world under the blood moon, past bats, crows
// and zombie workers clawing out of the ground, to a far window in cold blue light. Inside, from behind, Valera — a dark
// silhouette in a backwards cap — types on a split keyboard before two monitors (the cursed world's Grafana, Rapira's
// benchmarks). The owl comes in through the window's vent pane and tells him; he stands, blue arcs run over his outline
// as the rapier charges somewhere in the room behind him, and he hands it over half turned. The owl flies off with it.
// Valera's face is never shown: he is only ever a silhouette.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, pumpkinLayers, seedOf } from '/js/pixel/sprites.js';
import { NIGHT, bakeLit, halo, paintSky, relightCanvas } from '/js/pixel/night.js';
import { OWL, OWL_FLIGHT, armed, glowing } from '/js/pixel/owl.js';
import { FLYERS } from '/js/pixel/flyers.js';
import { wanderArt } from '/js/pixel/deaths.js';
import { BAR_MUG, bakeBar } from '/js/pixel/bar.js';
import { speechPlan, beakAt, wingAt } from '/js/owl-speech.js';

const W = 1920, H = 1080;
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const rgba = (n, a) => `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;
const lit = new Map();
const litOf = (s, l) => { const k = s; if (!lit.has(k)) lit.set(k, new Map()); const m = lit.get(k); if (!m.has(l)) m.set(l, bakeLit(s, l)); return m.get(l); };
function put(c, def, x, y, s, flip = false) {
    if (!flip) { o.drawImage(c, Math.round(x - def.anchor.x * s), Math.round(y - def.anchor.y * s), def.w * s, def.h * s); return; }
    o.save(); o.translate(Math.round(x), 0); o.scale(-1, 1);
    o.drawImage(c, Math.round(-(def.w - def.anchor.x) * s), Math.round(y - def.anchor.y * s), def.w * s, def.h * s);
    o.restore();
}

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. PRE and POST are calm handles for the editor's transitions; the fades stay inside them.
const PRE = 2, POST = 2;
const PUSH = 7.8;                    // the camera turns to the far window and dives into it
const CUT_B = 11.0;                  // → the room, behind Valera
const FORT = 13.0;                   // the vent pane swings open
const OWL_IN = [13.15, 14.05];       // the owl flies in and lands on the right monitor
const HOOT = 14.3;
const BUBBLES = [
    { who: 'owl', from: 15.25, to: 20.9, lines: ['Валера, настало твоё время.', 'У нас проблема.'] },
    { who: 'owl', from: 21.2, to: 25.2, lines: ['Там это… Франкен.'] },
    { who: 'valera', from: 25.5, to: 29.4, lines: ['Ни слова больше!'] },
    { who: 'valera', from: 36.0, to: 42.0, lines: ['Она ещё не готова,', 'но с чудовищем справится.'] },
    { who: 'valera', from: 42.3, to: 46.5, lines: ['Ты знаешь, что делать.'] },
];
const textOf = (b) => b.lines.join(' ');
const PLANS = BUBBLES.map((b) => speechPlan(textOf(b)));
const KEYS_STOP = BUBBLES[0].from + PLANS[0].ms / 1000 + 0.15;   // the typing breaks off after the first line
const STAND = [27.3, 28.3];          // Valera gets up, back to the camera
const CHARGE = [28.6, 33.6];         // the rapier charges behind him: arcs over his outline, sparks, the hum
const CLICK = CHARGE[1];
const TURN = [34.5, 35.3];           // he turns half round and holds the rapier out
const TAKE = 46.7;                   // the owl takes it
const SIT = [47.4, 48.4];            // back down to the keyboard
const EXIT = [49.0, 49.85];          // the owl flies out through the vent pane…
const AWAY = [49.85, 52.5];          // …and away into the night
const DURATION = AWAY[1] + POST;

// Characters typed `ms` into a bubble: each word as the speech reaches it (owl-speech.js syllables).
function typedOf(i, ms) {
    const text = textOf(BUBBLES[i]), plan = PLANS[i];
    const words = [...text.matchAll(/[\p{L}\p{N}]+/gu)];
    const counts = words.map((m) => Math.max(1, Math.min(5, (m[0].match(/[аеёиоуыэюяaeiouy]/giu) ?? []).length || Math.ceil(m[0].length / 3))));
    if (counts.reduce((a, c) => a + c, 0) !== plan.syllables.length) return Math.floor(text.length * clamp(ms / plan.ms));
    let n = 0, k = 0;
    for (let w = 0; w < words.length; w++) {
        const first = plan.syllables[k], last = plan.syllables[k + counts[w] - 1];
        k += counts[w];
        const start = first.at, end = last.at + last.len, m = words[w];
        if (ms < start) return n;
        const into = clamp((ms - start) / Math.max(1, end - start));
        n = m.index + Math.ceil(m[0].length * into);
        if (into < 1) return n;
        n = words[w + 1]?.index ?? text.length;
        if (w === words.length - 1) n = text.length;
    }
    return n;
}
const speaking = (i, t) => { const ms = (t - BUBBLES[i].from) * 1000; return ms >= 0 && ms <= PLANS[i].ms + 150 ? ms : null; };

// Valera's keys: runs of strokes, left and right half of the split keyboard, the space under a thumb now and then.
function keyRun(from, to, seed) {
    const out = [];
    let t = from + 0.05, n = 0;
    while (t < to) {
        const space = hash(seed * 31 + n * 1.91) < 0.13;
        out.push({ t, side: space ? 0 : hash(seed * 17 + n * 3.71) < 0.5 ? -1 : 1, space, n });
        n++;
        t += 0.06 + hash(seed * 7 + n * 7.13) * 0.12;
        if (hash(seed * 3 + n * 5.37) < 0.07) t += 0.3 + hash(seed + n * 2.2) * 0.45;
    }
    return out;
}
const KEYS = [...keyRun(CUT_B, KEYS_STOP, 1), ...keyRun(SIT[1] + 0.1, DURATION, 2)];
const pressed = (t, side) => KEYS.some((k) => t >= k.t && t < k.t + 0.08 && (k.side === side || k.side === 0));

// ---------------------------------------------------------------------------------------------------------------
// Shot A: the flight. The cursed world in the game's art px (6 screen px each), side view as in the game: sky, far
// hills, a row of dead trees, then the lawn in depth — each row of it scrolls with its own parallax.
const S = 6, MW = 320, MH = 180, HZ = 74;
const X = (t) => (t < PUSH ? 42 * t : 42 * PUSH + 42 * (t - PUSH) - (21 * (t - PUSH) ** 2) / (CUT_B - PUSH));
const rowF = (y) => 0.3 + 0.95 * ((y - HZ) / (MH - HZ));

const SKY = (() => { const [c, x] = canvas(MW + 80, HZ + 1); paintSky(x, MW + 80, HZ + 1, 'blood', { seed: 13 }); return c; })();
const HILLS = (() => {
    const w = 900, h = DECOR.hills.h;
    const [c, x] = canvas(w, h);
    for (let k = 0; k < w; k += DECOR.hills.w) x.drawImage(bakeLit(DECOR.hills, 'day'), k, 0);
    return relightCanvas(c, 'blood');
})();
const HILLS_FAR = (() => {
    const [c, x] = canvas(HILLS.width, HILLS.height);
    x.drawImage(HILLS, 0, 0);
    x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(70,14,30,0.75)'; x.fillRect(0, 0, c.width, c.height);
    return c;
})();
// The far house: walls and a pitched roof in the dark, one window in cold blue light.
const HOUSE = (() => {
    const rows = [
        '.........OO........',
        '.........OO........',
        '.......OOOOO.......',
        '......OkkkkkO......',
        '.....OkkkkkkkO.....',
        '....OkkkkkkkkkO....',
        '...OkkkkkkkkkkkO...',
        '..OkkkkkkkkkkkkkO..',
        '.OOOOOOOOOOOOOOOOO.',
        '..OwwwwwwwwwwwwwO..',
        '..OwwwwOOOOOOwwwO..',
        '..OwwwwOBbbbOwwwO..',
        '..OwwwwObbbbOwwwO..',
        '..OwwwwOOOOOOwwwO..',
        '..OwwwwOBbbbOwwwO..',
        '..OwwwwObbbbOwwwO..',
        '..OwwwwOOOOOOwwwO..',
        '..OwwwwwwwwwwwwwO..',
        '..OwwwOOOwwwwwwwO..',
        '..OwwwOdOwwwwwwwO..',
        '.OOOOOOOOOOOOOOOOO.',
    ];
    return { w: rows[0].length, h: rows.length, rows, legend: { '.': null, O: 'outline', k: 'crowDark', w: 'crow', d: 'barkDark', b: 'eyeBlue', B: 'skyLight' }, anchor: { x: 9, y: rows.length - 1 } };
})();
const HOUSE_C = (() => {
    const day = bakeLit(HOUSE, 'day');
    const c = relightCanvas(day, 'blood');
    const x = c.getContext('2d');
    HOUSE.rows.forEach((r, y) => [...r].forEach((ch, xx) => { if (ch === 'b' || ch === 'B') { x.fillStyle = hex(ch === 'b' ? PALETTE.eyeBlue : PALETTE.skyLight); x.fillRect(xx, y, 1, 1); } }));
    return c;
})();
const HOUSE_F = 0.2;
const HOUSE_X = X(PUSH) * HOUSE_F + 1330 / S, HOUSE_Y = HZ - 3;
const WINDOW = { x: HOUSE_X - HOUSE.anchor.x + 10, y: HOUSE_Y - HOUSE.anchor.y + 13 };   // the window's centre, art px
const TREES = Array.from({ length: 16 }, (_, i) => ({ x: i * 47 + hash(i + 3) * 30, def: DECOR.farTree[i % DECOR.farTree.length] }))
    .filter((tr) => Math.abs(tr.x - (HOUSE_X / HOUSE_F) * 0.38) > 40);

// The lawn: blood-lit grass with scorched patches, wider than the whole flight.
const GW = 1300;
const GROUND = (() => {
    const [c, x] = canvas(GW, MH - HZ);
    for (let y = 0; y < MH - HZ; y++) for (let xx = 0; xx < GW; xx++) {
        const n = hash(xx * 0.37 + y * 13.1);
        const scorch = Math.sin(xx * 0.021 + Math.sin(y * 0.13) * 2) + Math.sin(xx * 0.057 + y * 0.09) > 1.1;
        const k = scorch ? (n < 0.3 ? 'ashDark' : n < 0.8 ? 'ash' : 'ashLight') : n < 0.07 ? 'leafLight' : n < 0.25 ? 'leafDark' : 'leaf';
        x.fillStyle = hex(PALETTE[k]); x.fillRect(xx, y, 1, 1);
    }
    return relightCanvas(c, 'blood');
})();
const TOMB = { w: 8, h: 11, rows: ['..OOOO..', '.OlllsO.', 'OllsssdO', 'OlsOOsdO', 'OlOOOOdO', 'OlsOOsdO', 'OlsOOsdO', 'OlssssdO', 'OlssssdO', 'OOOOOOOO', 'OmmmmmmO'], legend: { '.': null, O: 'outline', l: 'stoneLight', s: 'stone', d: 'stoneDark', m: 'soilDark' }, anchor: { x: 4, y: 10 } };
const PROPS = [];
for (let i = 0; i < 70; i++) {
    const y = HZ + 8 + Math.floor(hash(i + 50) * (MH - HZ - 6));
    const x = hash(i + 90) * (GW - 200);
    const r = hash(i + 7);
    PROPS.push({ x, y, kind: r < 0.22 ? 'pumpkin' : r < 0.42 ? 'tomb' : r < 0.6 ? 'stone' : 'weed', seed: i, size: hash(i + 11) < 0.5 ? 's' : 'm' });
}
// Zombie workers clawing up out of the ground where the camera will be when they rise.
const ZOMBIES = [[2.7, 1380, 150], [3.4, 1720, 122], [4.1, 1080, 168], [4.8, 1500, 138], [5.5, 1830, 160], [6.1, 1230, 116], [6.8, 1640, 148], [7.4, 1420, 172]]
    .map(([tr, sx, y]) => ({ tr, y, x: X(tr) * rowF(y) + sx / S }));
const RISE_FRAME = 0.18;
function zombieAt(z, t) {
    if (t < z.tr) return null;
    const age = t - z.tr, rise = wanderArt().rise;
    if (age < RISE_FRAME * 5) return { def: rise[Math.floor(age / RISE_FRAME)], x: z.x };
    const walk = Math.max(0, age - RISE_FRAME * 5 - 0.5);
    if (walk <= 0) return { def: FLYERS.zombie[1].idle[frameAt(age * 1000, 2, 600)], x: z.x };
    return { def: FLYERS.zombie[1].fly[frameAt(walk * 1000 + z.tr * 300, 4, 210)], x: z.x - walk * 6, flip: true };
}
function pumpkinAt(p, x, y, ms) {
    const L = pumpkinLayers(11, p.size, seedOf(`pumpkin-${p.seed}`), 'franken');
    const h = halo(p.size === 'm' ? 14 : 11, 4, 'franken');
    o.save(); o.globalCompositeOperation = 'lighter'; o.globalAlpha = 0.45; put(litOf(h, 'day'), h, x, y, S); o.restore();
    const at = (list, per) => list[frameAt(ms + p.seed * 97, list.length, per)];
    if (L.auraFrames) put(litOf(at(L.auraFrames, 160), 'day'), L, x, y, S);
    put(litOf(L.layers.back, 'blood'), L, x, y, S);
    if (L.glowFrames) put(litOf(at(L.glowFrames, 120), 'day'), L, x, y, S);
    put(litOf(L.layers.body, 'blood'), L, x, y, S);
    put(litOf(L.layers.rim, 'blood'), L, x, y, S);
    if (L.layers.stem) put(litOf(L.layers.stem, 'blood'), L, x, y, S);
    if (L.fireFrames) put(litOf(at(L.fireFrames, 110), 'day'), L, x, y, S);
}

// The night's flyers in screen space: they cross toward and past the owl, the near ones big and out of focus.
const FLY = [
    { k: 'bat', d: 1, s: 5, t0: 0, x0: 1300, y: 200, v: 90, dir: -1 },
    { k: 'crow', d: 1, s: 5, t0: 0, x0: 1700, y: 120, v: 70, dir: -1 },
    { k: 'bat', d: 1, s: 4, t0: 0, x0: 400, y: 150, v: 60, dir: -1 },
    { k: 'bat', d: 2, s: 8, t0: 2.2, y: 250, v: 560, dir: -1 },
    { k: 'crow', d: 2, s: 9, t0: 2.8, y: 170, v: 470, dir: -1 },
    { k: 'bat', d: 2, s: 20, t0: 3.5, y: 560, v: 1500, dir: -1, near: true },
    { k: 'ghost', d: 2, s: 8, t0: 3.9, y: 330, v: 280, dir: -1 },
    { k: 'bat', d: 1, s: 6, t0: 4.4, y: 110, v: 420, dir: -1 },
    { k: 'bat', d: 1, s: 6, t0: 4.55, y: 150, v: 440, dir: -1 },
    { k: 'bat', d: 1, s: 6, t0: 4.7, y: 95, v: 410, dir: -1 },
    { k: 'witch', d: 2, s: 7, t0: 4.6, y: 110, v: 330, dir: 1 },
    { k: 'crow', d: 2, s: 22, t0: 5.7, y: 300, v: 1700, dir: -1, near: true },
    { k: 'crow', d: 2, s: 8, t0: 6.3, y: 230, v: 450, dir: -1 },
    { k: 'bat', d: 2, s: 8, t0: 6.9, y: 300, v: 600, dir: -1 },
    { k: 'bat', d: 2, s: 7, t0: 7.05, y: 260, v: 580, dir: -1 },
];
const flyX = (f, t) => (f.x0 ?? (f.dir < 0 ? W + 260 : -260)) + f.dir * f.v * (t - f.t0);
function drawFlyer(f, i, t) {
    if (t < f.t0) return;
    const x = flyX(f, t);
    if (x < -500 || x > W + 500) return;
    const set = FLYERS[f.k][f.d];
    const def = set.fly[frameAt(t * 1000 + i * 137, 4, f.k === 'crow' ? 110 : f.k === 'ghost' ? 160 : 75)];
    const y = f.y + Math.sin(t * (f.k === 'bat' ? 7 : 2.5) + i) * (f.k === 'bat' ? 18 : 10);
    put(litOf(def, 'blood'), def, x, y, f.s, f.dir < 0);
}

// The owl in flight, big in screen space.
const OWL_A = 9;
function owlA(t) {
    let x = 760 + 50 * Math.sin(t * 0.55), y = 400 + 34 * Math.sin(t * 1.15);
    return { x, y };
}

// Out of focus without canvas filters (slow in the software renderer): paint into a buffer 1/k the size and stretch
// it back smoothed.
const softBufs = new Map();
function soft(k, paint) {
    if (!softBufs.has(k)) softBufs.set(k, canvas(Math.ceil(W / k), Math.ceil(H / k)));
    const [c, x] = softBufs.get(k);
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(1 / k, 0, 0, 1 / k, 0, 0);
    o = x; paint(); o = OUT;
    o.save(); o.imageSmoothingEnabled = true; o.drawImage(c, 0, 0, c.width * k, c.height * k); o.restore();
}
function vignette(k = 0.6, tint = '8,4,12') {
    const v = o.createRadialGradient(W / 2, H * 0.48, H * 0.34, W / 2, H * 0.5, H * 1.08);
    v.addColorStop(0, `rgba(${tint},0)`); v.addColorStop(1, `rgba(${tint},${k})`);
    o.fillStyle = v; o.fillRect(0, 0, W, H);
}
function wash(x, y, r, color) {
    const g = o.createRadialGradient(x, y, 10, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    o.save(); o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.restore();
}
const MOTES = Array.from({ length: 70 }, (_, i) => ({ x: hash(i) * W, ph: hash(i + 3), v: 12 + hash(i + 5) * 30, s: hash(i + 9) < 0.25 ? 10 : 6, d: 0.5 + hash(i + 13), green: hash(i + 17) < 0.35 }));
function motes(t, pan, alpha, cold = false) {
    for (const e of MOTES) {
        const y = H - ((t * e.v * e.d + e.ph * H * 1.3) % (H * 1.3));
        const x = ((e.x + Math.sin(t * 0.7 + e.ph * 9) * 30 - pan * e.d) % W + W) % W;
        const a = (0.15 + 0.4 * Math.sin(t * 2.4 + e.ph * 20) ** 2) * alpha;
        o.fillStyle = cold ? `rgba(170,215,255,${a * 0.6})` : e.green ? `rgba(200,240,90,${a})` : `rgba(255,120,90,${a})`;
        const s = e.s * e.d;
        o.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, s, s);
    }
}

function shotA(t) {
    const ms = t * 1000, x = X(t);
    const k = smooth(PUSH, CUT_B - 0.15, t);
    const dive = k ** 2.4;
    const z = Math.exp(Math.log(45) * dive);
    const bob = 6 * Math.sin(t * 0.8);
    // where the window is on screen without the dive, and where the dive centres it
    const wp = { x: (WINDOW.x - x * HOUSE_F) * S, y: (WINDOW.y) * S + bob * 0.3 };
    const c = { x: lerp(wp.x, W / 2, smooth(PUSH, CUT_B - 0.6, t)), y: lerp(wp.y, H * 0.48, smooth(PUSH, CUT_B - 0.6, t)) };
    const far = (fn) => { o.save(); o.translate(c.x, c.y); o.scale(z, z); o.translate(-wp.x, -wp.y); fn(); o.restore(); };
    o.fillStyle = hex(PALETTE.bloodTop); o.fillRect(0, 0, W, H);
    far(() => {
        o.drawImage(SKY, -x * 0.05 * S - 40 * S, bob * 0.2, (MW + 80) * S, (HZ + 1) * S);
        const moon = { x: 250 - x * 0.03, y: 20 };
        put(litOf(NIGHT.bloodMoonHalo, 'day'), NIGHT.bloodMoonHalo, moon.x * S, moon.y * S, S);
        put(litOf(NIGHT.bloodMoon, 'day'), NIGHT.bloodMoon, moon.x * S, moon.y * S, S);
    });
    // far hills out of focus, the house sharp on the near ridge
    const hillsPaint = () => far(() => {
        o.fillStyle = '#2c0f16'; o.fillRect(-2 * W, HZ * S - 4 * S, 5 * W, 3 * H);
        o.drawImage(HILLS_FAR, -((x * 0.1) % DECOR.hills.w) * S - DECOR.hills.w * S, (HZ - HILLS.height - 9) * S + bob * 0.3, HILLS.width * S, HILLS.height * S);
        o.drawImage(HILLS, -((x * HOUSE_F) % DECOR.hills.w) * S - DECOR.hills.w * S, (HZ - HILLS.height + 1) * S + bob * 0.3, HILLS.width * S, HILLS.height * S);
    });
    if (dive < 0.05) soft(4, hillsPaint); else hillsPaint();
    far(() => {
        wash((WINDOW.x - x * HOUSE_F) * S, WINDOW.y * S + bob * 0.3, 160, `rgba(80,190,255,${0.35 + 0.08 * Math.sin(t * 7)})`);
        o.drawImage(HOUSE_C, (HOUSE_X - HOUSE.anchor.x - x * HOUSE_F) * S, (HOUSE_Y - HOUSE.anchor.y) * S + bob * 0.3, HOUSE.w * S, HOUSE.h * S);
    });
    // the near ground drops away as the camera dives at the window
    const drop = dive * 1400;
    o.save(); o.globalAlpha = 1 - smooth(0.2, 0.7, dive); o.translate(0, drop);
    soft(3, () => { for (const tr of TREES) { const sx = (tr.x - x * 0.38) * S; if (sx > -200 && sx < W + 200) put(litOf(tr.def, 'blood'), tr.def, sx, (HZ + 3) * S + bob * 0.5, S); } });
    for (let y = HZ; y < MH; y++) {
        const off = x * rowF(y);
        const sx = Math.floor(off), fr = off - sx;
        o.drawImage(GROUND, sx % GW, y - HZ, MW + 2, 1, -fr * S, y * S + bob, (MW + 2) * S, S);
    }
    const items = [];
    for (const p of PROPS) {
        const sx = (p.x - x * rowF(p.y)) * S;
        if (sx < -150 || sx > W + 150) continue;
        items.push({ y: p.y, draw: () => {
            const yy = p.y * S + bob;
            if (p.kind === 'pumpkin') pumpkinAt(p, sx, yy, ms);

                }
                if (b) bolt(a, b, slot * 11 + k, VP / 2, '#f2fbff', 'rgba(70,170,255,0.5)', 3);
                if (hash(slot + k * 9.9) < 0.35 * c) {
                    const out = { x: a.x + (a.x - W / 2) * 0.35 + (hash(slot + k) - 0.5) * 200, y: a.y - 80 - hash(slot * 2 + k) * 200 };
                    bolt(a, out, slot * 5 + k * 3, VP / 2, '#e8f6ff', 'rgba(60,150,255,0.45)', 4);
                }
            }
            o.restore();
            sparks(t, edges, origin, 0.25 + 0.75 * c);
        }
        if (t >= CLICK && t < CLICK + 1.2) sparks(t, edges, origin, 1, CLICK);
        // the rapier, held out to the owl
        if (pose.offer > 0.02 && t < TAKE) {
            const hand = armPts(1, pose)[2];
            const hp = { x: W / 2 + hand[0] * VP, y: hy + (hand[1] - 2) * VP };
            const residual = 0.35 + 0.65 * Math.exp(-(t - TURN[1]) / 4);
            rapier(hp.x, hp.y, VP, t, residual);
            const slot = Math.floor(t * 9);
            if (hash(slot * 1.37) < 0.6 * residual) {
                o.save(); o.globalCompositeOperation = 'lighter';
                const y0 = hp.y - (4 + hash(slot) * 20) * VP;
                bolt({ x: hp.x + VP / 2, y: y0 }, { x: hp.x + VP / 2 + (hash(slot + 2) - 0.5) * 120, y: y0 - 40 - hash(slot + 3) * 60 }, slot * 3, VP / 2, '#eaf8ff', 'rgba(70,170,255,0.5)', 2);
                for (let k = 0; k < 5; k++) {
                    const age = (t * 3 + hash(k + slot)) % 1;
                    o.fillStyle = `rgba(150,215,255,${0.8 * (1 - age) * residual})`;
                    o.fillRect(Math.round((hp.x + (hash(k * 7 + slot) - 0.5) * 80) / 8) * 8, Math.round((hp.y - hash(k * 3 + slot) * 280 + age * 60) / 8) * 8, 8, 8);
                }
                o.restore();
            }
        }
    });
    gust(t);
    vignette(0.7, '4,6,16');
    // the click: a flash
    if (t >= CLICK && t < CLICK + 0.15) { o.fillStyle = `rgba(225,242,255,${0.9 * (1 - (t - CLICK) / 0.15)})`; o.fillRect(0, 0, W, H); }
    // bubbles
    const owlP = owlRoom(t);
    const owlHead = owlP ? toScreen(cam, 0.85, { x: PERCH.x - 30, y: PERCH.y - 13 * OWL_P }) : { x: 0, y: 0 };
    bubble(0, t, owlHead, (bw) => ({ bx: Math.round(owlHead.x - bw - 140), by: 70 }));
    bubble(1, t, owlHead, (bw) => ({ bx: Math.round(owlHead.x - bw - 140), by: 70 }));
    const vHead = toScreen(cam, 1.1, { x: W / 2 + (pose.turn * 3 - 10) * VP, y: hy - 15 * VP });
    bubble(2, t, vHead, (bw) => ({ bx: 120, by: 70 }));
    const vSide = toScreen(cam, 1.1, { x: W / 2 - 13 * VP, y: hy + 2 * VP });
    bubble(3, t, vSide, (bw, bh) => ({ bx: 60, by: 330 }));
    bubble(4, t, vSide, (bw, bh) => ({ bx: 60, by: 330 }));
    // in from the window's light
    const flash = 1 - smooth(CUT_B, CUT_B + 0.45, t);
    if (flash > 0) { o.fillStyle = `rgba(150,215,255,${flash})`; o.fillRect(0, 0, W, H); }
}

// ---------------------------------------------------------------------------------------------------------------
function draw(t) {
    if (t < CUT_B) shotA(t); else shotB(t);
    const black = 1 - smooth(0, 1.0, t) + smooth(DURATION - 0.9, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// ---------------------------------------------------------------------------------------------------------------
// Sound cues (sound.mjs): the game's own synth. Valera's voice is the owl's murmur seven semitones down and level:
// the same syllables as the typing in his bubbles, so a real voice can be laid over them.
const VALERA_PITCH = -7;
const valeraVoice = (i) => PLANS[i].syllables.map((s) => ({ sfx: 'owl.babble', at: BUBBLES[i].from + s.at / 1000, variant: s.variant, pitch: VALERA_PITCH, vol: 1.5, pan: -0.1 }));
const flyerCues = FLY.flatMap((f, i) => {
    const start = f.x0 ?? (f.dir < 0 ? W + 260 : -260);
    const tc = f.t0 + (W / 2 - start) / (f.dir * f.v);
    if (tc < 0.3 || tc > PUSH + 1) return [];
    const name = f.k === 'bat' ? 'bat.squeak' : f.k === 'crow' ? 'crow.caw' : f.k === 'ghost' ? 'ghost.wail' : 'witch.cackle';
    return [{ sfx: name, at: tc - (f.k === 'ghost' ? 0.6 : 0.1), pan: f.dir * 0.2, vol: f.near ? 1.4 : f.d === 1 ? 0.6 : 1, variant: i }];
});
const hum = [];
for (let at = CHARGE[0] + 0.2, k = 0; at < CLICK - 0.2; at += 0.32, k++) {
    const q = (at - CHARGE[0]) / (CLICK - CHARGE[0]);
    hum.push({ sfx: 'fly.buzz', at, variant: k, pitch: -14 + 10 * q, vol: 0.5 + 0.9 * q, pan: (k % 2 ? 0.15 : -0.15) });
}
const crackles = [];
for (let k = 0; k < 18; k++) {
    const q = (k / 18) ** 0.7;
    crackles.push({ sfx: 'ability.zap', at: CHARGE[0] + 0.5 + q * (CLICK - CHARGE[0] - 0.6), variant: k, pan: (hash(k) - 0.5) * 1.2, vol: 0.25 + 0.5 * q, pitch: 3 + hash(k + 5) * 4 });
}
for (let k = 0; k < 7; k++) crackles.push({ sfx: 'ability.zap', at: TURN[1] + 0.4 + k * 1.4 + hash(k + 40) * 0.6, variant: k, pan: 0.35, vol: 0.18, pitch: 7 });
window.SOUND = [
    { music: 'cursed', from: 0, to: DURATION, intensity: 0.1, vol: 0.4, fadeIn: 1, fadeOut: 1.2 },
    { music: 'cursed', from: 0, to: CUT_B + 0.3, intensity: 0.85, vol: 0.45, fadeIn: 1, fadeOut: 0.5 },
    ...Array.from({ length: 12 }, (_, i) => ({ sfx: 'bush.rustle', at: 0.3 + i * 0.76, variant: i, pitch: -12, vol: 0.45 })),
    ...flyerCues,
    ...ZOMBIES.flatMap((z, i) => [
        { sfx: 'worm.squelch', at: z.tr, variant: i, pitch: -5, vol: 0.5, pan: 0.4 },
        { sfx: 'zombie.groan', at: z.tr + 0.6, variant: i, vol: 2.2, pan: 0.4 },
    ]),
    { sfx: 'owl.hoot', at: PUSH + 0.4, pan: 0.3, vol: 0.8 },
    // the room
    ...KEYS.map((k) => ({ sfx: 'ui.click', at: k.t, variant: k.n, pan: k.side * 0.35, pitch: k.space ? -6 : (hash(k.n * 1.7) - 0.5) * 3, vol: k.space ? 1.1 : 0.8 })),
    { sfx: 'bar.door', at: FORT - 0.72, pan: 0.7, pitch: 3 },
    { sfx: 'bush.rustle', at: FORT, pan: 0.7, pitch: -6, vol: 1.2 },
    ...[0, 0.24, 0.48, 0.7].map((d, i) => ({ sfx: 'bush.rustle', at: OWL_IN[0] + d, pan: 0.6, pitch: -11, vol: 0.9, variant: i })),
    { sfx: 'walk.step', at: OWL_IN[1], pan: 0.5, pitch: 4, vol: 1.5 },
    { sfx: 'owl.hoot', at: HOOT, pan: 0.5 },
    ...BUBBLES.flatMap((b, i) => (b.who === 'owl' ? [{ speak: 'owl', text: textOf(b), at: b.from, pan: 0.5, vol: 1.3 }] : valeraVoice(i))),
    { sfx: 'bar.door', at: STAND[0] - 0.1, pan: 0, pitch: 5, vol: 0.8 },
    { sfx: 'finale.wake', at: CHARGE[0] + 0.3, vol: 0.8 },
    ...hum,
    ...crackles,
    { sfx: 'ui.click', at: CLICK, pitch: -12, vol: 2 },
    { sfx: 'shot.rapira', at: CLICK },
    { sfx: 'ability.zap', at: CLICK + 0.02, variant: 2, vol: 1.2 },
    { sfx: 'owl.rapier', at: TURN[1] - 0.1, pan: 0.3 },
    { sfx: 'ability.grant', at: TAKE, pan: 0.5 },
    { sfx: 'owl.hoot', at: TAKE + 0.25, pan: 0.5, vol: 0.8 },
    { sfx: 'bar.door', at: SIT[0], pan: 0, pitch: 6, vol: 0.6 },
    { sfx: 'finale.owlAway', at: EXIT[0], pan: 0.3 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
