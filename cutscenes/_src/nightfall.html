// stack of spell books from under its wing and remembers, in a sepia flashback to the bar, the hooded necromancer who
// told it about the ritual and slid the books over the counter; then it throws a book to everyone, the pages light up
// green, the first spells fly at the pumpkins, and up close the owl wonders aside what could possibly go wrong.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, bake, pumpkinLayers, pumpkinSprite, seedOf } from '/js/pixel/sprites.js';
import { characterFrame, randomLook, SHOT_FX } from '/js/pixel/characters.js';

const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const lerp = (a, b, k) => a + (b - a) * k;

const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const mixHex = (a, b, k) => { const c = [16, 8, 0].map((s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, k))); return `rgb(${c[0]},${c[1]},${c[2]})`; };
// scene.js: the same seeded generator, so the patch grows the game's vines.
function rng(seed) {
    return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. PRE and POST are calm handles for the editor's transitions.
const PRE = 2, POST = 2;
const GRADE = [2.0, 9.5];            // the sunset's colours go over to the night's
const MOON = [2.6, 10.5];            // the moon climbs out from behind the hills
const CUT_B = 12.2;                  // → the owl on its branch, nearer
const HOOT_B = 12.7;                 // a hoot, then it pulls the books out from under its wing
const PULL = [13.0, 13.7];
const FB_IN = [15.3, 16.3];          // the thought cloud swells into the flashback…
const FB_OUT = [27.0, 27.8];         // …and shrinks back to the owl
const LIFT = [27.9, 28.5];           // the owl holds the books up: «вот это»
const CUT_C = 30.6;                  // → the crowd under the tree: the books handed out
const CUT_D = 39.0;                  // → the owl up close, aside
const DURATION = 49.4;
const BUBBLES = [
    { from: 6.6, to: 11.6, lines: ['Ночь…', 'Самое время для главного.'] },
    { from: 13.7, to: 22.2, lines: ['Про этот ритуал мне рассказал', 'один некромант.', 'Как его… Дун… Дуг…', 'А, неважно.'], box: true },
    { from: 22.6, to: 30.4, lines: ['Всё расписал в подробностях:', 'тыквы, свечи, костёр…', 'И оставил вот это.'], box: true },
    { from: 31.95, to: 38.45, lines: ['Магические книги!', 'Читайте заклинания', 'над тыквами!'] },
    { from: 40.3, to: 47.3, lines: ['Он клялся, что всё', 'под контролем…', 'Что может пойти не так?'], quiet: true },
];
const textOf = (b) => b.lines.join(' ');
const PLANS = BUBBLES.map((b) => speechPlan(textOf(b)));
// The moments inside the lines (owl-speech.js word timings of the lines above).
const GLITCH = [BUBBLES[1].from + 3.15, BUBBLES[1].from + 4.15];       // «Дун… Дуг…»: the memory flickers
const ICONS = [1.61, 2.07, 2.52].map((d) => BUBBLES[2].from + d);    // «тыквы, свечи, костёр»
const SLIDE = [BUBBLES[2].from + 2.95, BUBBLES[2].from + 3.95];     // «И оставил…»: the books slide over the counter
const TAKE = SLIDE[1] + 0.05;
// The hand-out: a book thrown to each of the crowd, then the first spells at the pumpkins.
const TOSS = Array.from({ length: 6 }, (_, i) => 32.5 + i * 0.55), TOSS_AIR = 0.65;
const CAST = [36.0, 36.35, 36.7, 37.05, 37.4, 37.75], CAST_AIR = 0.4;
// The finale's hint: a crow over the moon, the fire flaring green for a moment.
const CROW = [43.2, 46.0], FLARE = [44.6, 45.5];

// Characters typed `ms` into a bubble: each word as the speech reaches it (owl-speech.js syllables).
function typedOf(i, ms) {
    const text = textOf(BUBBLES[i]), plan = PLANS[i];
    const words = [...text.matchAll(/[\p{L}\p{N}]+/gu)];
    const counts = words.map((m) => Math.max(1, Math.min(5, (m[0].match(/[аеёиоуыэюяaeiouy]/giu) ?? []).length || Math.ceil(m[0].length / 3))));
    if (counts.reduce((a, c) => a + c, 0) !== plan.syllables.length) return Math.floor(text.length * clamp(ms / plan.ms));
    let n = 0, k = 0;
    for (let w = 0; w < words.length; w++) {
        const first = plan.syllables[k], last = plan.syllables[k + counts[w] - 1];
        k += counts[w];
        const start = first.at, end = last.at + last.len, m = words[w];
        if (ms < start) return n;
        const into = clamp((ms - start) / Math.max(1, end - start));
        n = m.index + Math.ceil(m[0].length * into);
        if (into < 1) return n;
        n = words[w + 1]?.index ?? text.length;
        if (w === words.length - 1) n = text.length;
    }
    return n;
}
function owlTalk(i, t) {
    const plan = PLANS[i], ms = (t - BUBBLES[i].from) * 1000;
    if (ms < 0 || ms > plan.ms + 200) return null;
    const beak = beakAt(plan, ms);
    return wingAt(plan, ms) ? OWL.beakWing[beak] : OWL.beak[beak];
}

// ---------------------------------------------------------------------------------------------------------------
// Light: the sunset going over to the night. NK is the night's share for the frame being drawn.
let NK = 0;
const nightAt = (t) => smooth(GRADE[0], GRADE[1], t);

// ---------------------------------------------------------------------------------------------------------------
// The patch of scenes 2–3 as scene.js lays it out on a 1920 × 1080 screen: 480 × 270 art px (4 screen px each), the
// horizon at 37 %, the root of the vines at 50 % × 63 %. Every pumpkin is lit, so the patch has jumped out from the
// root (layout.js, PUMPKIN_STAND.out) and the bonfire burns in the middle where the root and its leaves were.
const AW = 480, AH = 270, HZ = 100, S = W / AW;
const toArt = (p) => ({ x: Math.round((p.x / 100) * AW), y: Math.round((p.y / 100) * AH) });
const ROOT = toArt({ x: 50, y: 63 });
const OUTF = 1.18;
const PUMPKINS = [
    ['pumpkin-1', 47.8, 51.2, 'm'], ['pumpkin-2', 55.7, 55, 's'], ['pumpkin-3', 66.2, 48.3, 's'], ['pumpkin-4', 62.8, 56, 's'],
    ['pumpkin-5', 71.2, 58.4, 'm'], ['pumpkin-6', 64.7, 63.7, 's'], ['pumpkin-7', 71, 72.8, 'l'], ['pumpkin-8', 59.6, 71.1, 'm'],
    ['pumpkin-9', 60.7, 80.8, 'm'], ['pumpkin-10', 50.4, 82.7, 'l'], ['pumpkin-11', 40, 83.7, 'm'], ['pumpkin-12', 43.6, 74.1, 'm'],
    ['pumpkin-13', 29.3, 78.5, 'l'], ['pumpkin-14', 35.4, 69.6, 's'], ['pumpkin-15', 27.7, 60.2, 'm'], ['pumpkin-16', 40.6, 64, 's'],
    ['pumpkin-17', 35.8, 51.5, 's'], ['pumpkin-18', 45.2, 58.4, 's'],
].map(([id, x, y, size], i) => {
    const p = toArt({ x, y });
    return { id, size, i, x: Math.round(ROOT.x + (p.x - ROOT.x) * OUTF), y: Math.round(ROOT.y + (p.y - ROOT.y) * OUTF), seed: seedOf(id), phase: hash(i + 40) * 1100, charged: Infinity };
});
const BUSHES = [
    ['bush-1', 4, 86], ['bush-2', 96, 88], ['bush-3', 2, 62], ['bush-4', 98, 66], ['bush-5', 16, 44], ['bush-6', 88, 43],
].map(([id, x, y]) => ({ id, ...toArt({ x, y }), seed: seedOf(id) }));

const bakes = new WeakMap();
const baked = (def) => bakes.get(def) ?? bakes.set(def, bake(def)).get(def);
const blit = (ctx, c, def, x, y, flip = false) => {
    if (!flip) { ctx.drawImage(c, Math.round(x - def.anchor.x), Math.round(y - def.anchor.y)); return; }
    ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -(def.w - def.anchor.x), Math.round(y - def.anchor.y)); ctx.restore();
};
const stamp = (ctx, def, x, y, flip = false) => blit(ctx, baked(def), def, x, y, flip);
const additive = (ctx, def, x, y, a) => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; stamp(ctx, def, x, y); ctx.restore(); };

const GROUND = [];
const addGround = (def, x, y, sortY = y) => GROUND.push({ def, x: Math.round(x), y: Math.round(y), sy: sortY });
const shape = { cx: ROOT.x, cy: ROOT.y, rx: AW * 0.29, ry: Math.min(AH * 0.24, ROOT.y - HZ - 3) };
// scene.js: the bonfire's warm reach at night; sprites inside 0.75 of it take the firelight.
const FIRE_LIGHT = { x: Math.round(shape.cx), y: Math.round(shape.cy + shape.ry * 0.35), rx: Math.round(shape.rx * 1.45), ry: Math.round(shape.ry * 1.65), near: 'firelight' };
const nearFire = (x, y) => Math.hypot((x - FIRE_LIGHT.x) / FIRE_LIGHT.rx, (y - FIRE_LIGHT.y) / FIRE_LIGHT.ry) < 0.75;
// A sprite in the frame's light: the sunset's bake, the night's (or the firelight's) over it by NK.
// `at` — where the sprite stands on the stage, when it is drawn through a transform.
function putLit(ctx, def, x, y, flip = false, nightDef = def, at = { x, y }) {
    if (NK < 1) blit(ctx, bakeLit(def, 'sunset'), def, x, y, flip);
    if (NK > 0) { ctx.save(); ctx.globalAlpha *= NK; blit(ctx, bakeLit(nightDef, nearFire(at.x, at.y) ? 'firelight' : 'night'), nightDef, x, y, flip); ctx.restore(); }
}

const inPatch = (x, y) => ((x - shape.cx) / shape.rx) ** 2 + ((y - shape.cy) / shape.ry) ** 2;
function inRagged(x, y) {
    const a = Math.atan2((y - shape.cy) / shape.ry, (x - shape.cx) / shape.rx);
    const wobble = 1 + 0.05 * Math.sin(5 * a + 1) + 0.035 * Math.sin(11 * a + 2) + 0.02 * Math.sin(23 * a);
    return inPatch(x, y) / (wobble * wobble);
}
const onRim = (deg, r) => { const a = (deg * Math.PI) / 180; return { x: shape.cx + Math.cos(a) * shape.rx * r, y: shape.cy + Math.sin(a) * shape.ry * r }; };
function rootIn(x, y, halfW, random) {
    const tufts = [...DECOR.grass, ...DECOR.weed];
    const front = 3 + Math.floor(random() * 3);
    for (let i = 0; i < front + 2; i++) {
        const dy = i < front ? 1 + random() * 2 : -(1 + random() * 2);
        addGround(tufts[Math.floor(random() * tufts.length)], x + (random() - 0.5) * 2 * halfW, y + dy);
    }
}
const farPlan = Math.max(DECOR.hills.h, ...DECOR.farTree.map((t) => t.h));

// The far plan (hills, far trees) and the lawn with the dug patch: magic-place.html / scene.js drawBase.
const [FAR, farX] = canvas(AW, HZ + 40);
const [LAWN, lawnX] = canvas(AW, AH);
{
    const random = rng(42);
    farX.fillStyle = hex(PALETTE.leaf); farX.fillRect(0, HZ - 2, AW, 42);
    for (let x = 0; x < AW; x += DECOR.hills.w) farX.drawImage(baked(DECOR.hills), x - DECOR.hills.anchor.x, HZ - DECOR.hills.anchor.y);
    const farTrees = [];
    for (let x = 4 + random() * 20; x < AW; x += 18 + random() * 40) farTrees.push({ def: DECOR.farTree[Math.floor(random() * DECOR.farTree.length)], x, y: HZ - Math.floor(random() * 2) });
    farTrees.sort((a, b) => a.y - b.y).forEach((t) => stamp(farX, t.def, t.x, t.y));

    const image = lawnX.createImageData(AW, AH - HZ);
    const rgb = (k) => [(PALETTE[k] >> 16) & 255, (PALETTE[k] >> 8) & 255, PALETTE[k] & 255];
    const vp = { x: shape.cx, y: HZ - (shape.cy - HZ) * 0.6 };
    const fan = (shape.cy + shape.ry - vp.y) / 10;
    for (let y = HZ; y < AH; y++) {
        const depth = (y - HZ) / (AH - HZ);
        for (let x = 0; x < AW; x++) {
            const d = inRagged(x, y);
            const checker = (x + y) % 2 === 0;
            let key;
            if (d < 0.9 || (d < 1 && checker)) {
                const lane = (((x - vp.x) / (y - vp.y)) * fan) % 1;
                const f = lane < 0 ? lane + 1 : lane;
                key = f < 0.2 ? 'soilDark' : f < 0.3 ? 'soilLight' : random() < 0.03 ? (random() < 0.5 ? 'soilDark' : 'soilLight') : 'soil';
            } else if (d < 1.1 && random() < (1.1 - d) * 6) key = random() < 0.6 ? 'soilDark' : 'soilLight';
            else {
                const mow = (Math.sqrt(y - HZ + 1) * 1.7) % 1 < 0.14;
                const n = random();
                const warm = Math.max(0, 1.6 - d) * 0.12;
                key = n < warm * 0.5 ? 'leafShine' : n < 0.05 * depth + warm ? 'leafLight'
                    : mow || n < 0.04 + 0.12 * depth || (depth > 0.4 && y % 4 === 0 && checker) ? 'leafDark' : 'leaf';
            }
            image.data.set([...rgb(key), 255], ((y - HZ) * AW + x) * 4);
        }
    }
    lawnX.putImageData(image, 0, HZ);
    for (let i = 0; i < shape.rx * 6; i++) {
        const p = onRim(random() * 360, 0.9 + random() * 0.08);
        const tall = 2 + Math.floor(random() * 2);
        lawnX.fillStyle = hex(PALETTE[random() < 0.5 ? 'leaf' : 'leafDark']);
        const tuft = random() < 0.4;
        lawnX.fillRect(Math.round(p.x), Math.round(p.y) - tall + 1, 1, tall);
        if (tuft) lawnX.fillRect(Math.round(p.x) + 1, Math.round(p.y) - 1, 1, 1);
    }
    const smallest = DECOR.grass.reduce((a, b) => (a.w * a.h <= b.w * b.h ? a : b));
    const tries = Math.round((AW * (AH - HZ)) / 16);

        const edge = Math.max(1 - x / (AW * 0.18), 1 - (AW - x) / (AW * 0.18), 1 - (AH - y) / (AH * 0.15), 0);
        const chance = (d < 1 ? 0.012 : Math.min(0.9, 0.05 + (d - 1) * 0.5 + edge * 0.6)) * (0.15 + 0.85 * depth);
        if (random() >= chance) continue;

            const list = d < 1 ? DECOR.grass : random() < 0.08 && DECOR.flower?.length ? DECOR.flower : random() < 0.55 ? DECOR.weed : DECOR.grass;
            def = list[Math.floor(random() * list.length)];
        }

        if (Math.hypot((x - ROOT.x) / 26, (y - ROOT.y) / 12) < 1) continue;
        addGround(def, x, y);
    }
    const fence = DECOR.fence[0];
    const arc = [];
    for (let deg = -150; deg <= -30; deg += 0.5) arc.push(onRim(deg, 1.06));
    const posts = [arc[0]];
    let run = 0;
    for (let i = 1; i < arc.length; i++) {
        run += Math.hypot(arc[i].x - arc[i - 1].x, arc[i].y - arc[i - 1].y);
        if (run >= fence.w - 1) { posts.push(arc[i]); run = 0; }
    }
    for (let i = 1; i < posts.length; i++) {
        const a = posts[i - 1], b = posts[i], y = Math.max(a.y, b.y);
        addGround(DECOR.fence[i % DECOR.fence.length], (a.x + b.x) / 2, y);
        rootIn(b.x, y, 2, random);
    }
    for (const post of [posts[0], posts[posts.length - 1]]) { addGround(DECOR.fenceEnd, post.x, post.y); rootIn(post.x, post.y, 2, random); }
    const items = [
        { def: DECOR.hay, at: onRim(18, 1.16) }, { def: DECOR.basket, at: onRim(158, 1.12) }, { def: DECOR.can, at: onRim(52, 1.08) },
        { def: DECOR.stone[0], at: onRim(104, 1.07) }, { def: DECOR.stone[DECOR.stone.length - 1], at: onRim(206, 1.06) },
    ];
    for (const { def, at } of items.sort((a, b) => a.at.y - b.at.y)) { addGround(def, at.x, at.y); rootIn(at.x, at.y, def.w / 2, random); }
}

// The tree with the owl's branch: scene.js drawTree.
const TREE = DECOR.tree;
const TREE_FOOT = { x: Math.round(Math.max(AW * 0.07, AW * 0.32 - (TREE.perch[0] - TREE.anchor.x))), y: HZ + 3 };
addGround(TREE, TREE_FOOT.x, TREE_FOOT.y);
rootIn(TREE_FOOT.x, TREE_FOOT.y, 6, rng(5));
const PERCH = { x: TREE_FOOT.x - TREE.anchor.x + TREE.perch[0], y: TREE_FOOT.y - TREE.anchor.y + TREE.perch[1] };

// The vines from the root to every stem, the leaves along them: scene.js drawPlants.
function stemColumn(def) {
    const row = def.rows.find((r) => [...r].some((ch) => def.legend[ch])) ?? '';
    const xs = [...row].flatMap((ch, x) => (def.legend[ch] ? [x] : []));
    return xs.length ? Math.round((xs[0] + xs[xs.length - 1]) / 2) : def.anchor.x;
}
function wavyCurve(from, c1, c2, to, wave) {
    const length = Math.hypot(to.x - from.x, to.y - from.y) || 1;
    const steps = Math.ceil(length * 3);
    const raw = [];
    for (let i = 0; i <= steps; i++) {
        const t = i / steps, u = 1 - t;
        raw.push({ t, x: u * u * u * from.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * to.x, y: u * u * u * from.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * to.y });

        const a = raw[Math.max(0, i - 1)], b = raw[Math.min(raw.length - 1, i + 1)];

}
function strokeVine(ctx, points, width) {

        ctx.fillStyle = hex(PALETTE[key]);
        for (const p of points) { const w = Math.max(1, Math.round(width(p.t)) + grow); ctx.fillRect(p.x - (w >> 1), p.y - (w >> 1) + dy, w, w); }
    };
    pass('leafDark', 0, 1);
    pass('leafLight', -1, 0);
    ctx.fillStyle = hex(PALETTE.leafShine);

}
function drawVine(ctx, from, stem, reach, seed, foliage) {
    const random = rng(seed);
    const side = random() < 0.5 ? 1 : -1;
    const toward = Math.sign(from.x - stem.x) || side;
    const dx = stem.x - from.x, dy = stem.y - from.y;
    const length = Math.hypot(dx, dy) || 1;
    const bend = side * length * (0.1 + random() * 0.15);
    const c1 = { x: from.x + dx * 0.35 - (dy / length) * bend, y: from.y + dy * 0.35 + (dx / length) * bend };
    const c2 = { x: stem.x + toward * reach, y: stem.y - 12 };
    const wave = { amp: clamp(length * 0.06, 2, 7), turns: 1.5 + random(), phase: random() * Math.PI * 2 };
    const points = wavyCurve(from, c1, c2, stem, wave);
    const travelled = points[points.length - 1].d;
    const shoots = 1 + Math.floor(random() * 2);
    for (let i = 0; i < shoots; i++) {
        const base = points[Math.floor((0.2 + random() * 0.55) * (points.length - 1))];

    fireSparks(t, { x: W * 0.66, y: H * 1.02 }, 600, 900, 30, 10, flare > 0.2);
    motes(t, k * 14, 0.5, 1);
    o.save();
    o.translate(W / 2, H / 2); o.scale(zoom, zoom); o.translate(-W / 2, -H / 2);
    const perch = { x: 600 - k * 3, y: 1040 };
    branch(-200, 1180, perch.y, -0.05, OWL_D);
    const f = owlFrameD(t);
    bigOwl(f, perch.x, perch.y, OWL_D, 0.25 * (1 - flare));
    // the fire's light from below right, green for a moment
    o.globalCompositeOperation = 'lighter';
    const g = o.createRadialGradient(perch.x + 300, perch.y, 50, perch.x + 300, perch.y, 700);
    g.addColorStop(0, flare > 0 ? `rgba(110,255,90,${0.35 * flare})` : `rgba(255,140,60,${0.12 * flick})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = g; o.fillRect(0, 0, W, H);
    o.globalCompositeOperation = 'source-over';
    o.restore();
    o.restore();
    vignette(0.78);
    const head = { x: W / 2 + (perch.x - W / 2) * zoom, y: H / 2 + (perch.y - 15 * OWL_D - H / 2) * zoom };
    bubble(4, t, head, (bw, bh) => ({ bx: Math.round(head.x + 330), by: Math.round(clamp(head.y - bh - 40, 40, H - bh - 40)) }));
}

// ---------------------------------------------------------------------------------------------------------------
function draw(t) {
    NK = nightAt(t);
    if (t < CUT_B) shotA(t);
    else if (t < CUT_C) {
        const b = shotB(t);
        const inK = smooth(FB_IN[0], FB_IN[1], t) * (1 - smooth(FB_OUT[0], FB_OUT[1], t));
        if (inK > 0) {
            const fb = glitched(paintFlashback(t), t);
            drawCloud(inK, b.head, fb);
        }
        bubble(1, t, b.head, (bw) => ({ bx: 70, by: 60 }));
        bubble(2, t, b.head, (bw) => ({ bx: 70, by: 60 }));
    } else if (t < CUT_D) shotC(t);
    else shotD(t);
    const black = 1 - smooth(0, 0.8, t) + smooth(DURATION - 0.8, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs): the game's own synth. Scene 2's track `dusk` gives way to scene 3's `night`; the flashback
// plays the bar's track quietly with the night track out.
const PAN_OWL_A = -0.35, PAN_OWL_B = 0.4;
const crackle = [];
for (let at = 0.3, i = 0; at < DURATION - 0.5; at += 0.55 + hash(i) * 0.7, i++) {
    if (at > FB_IN[0] + 0.5 && at < FB_OUT[0]) continue;
    const near = at >= CUT_B && at < CUT_C ? 0.6 : at >= CUT_D ? 0.5 : 1;
    crackle.push({ sfx: 'bonfire.click', at, pan: (hash(i + 7) - 0.5) * 0.4 + (at >= CUT_D ? 0.35 : 0), vol: 0.32 * near, pitch: -2 + hash(i + 3) * 2 });
}
window.SOUND = [
    { music: 'dusk', from: 0, to: 11.0, intensity: 0.45, fadeIn: 1.2, fadeOut: 4.0 },
    { music: 'night', from: 7.0, to: FB_IN[0] + 0.7, intensity: [[7, 0.15], [12, 0.3]], fadeIn: 3.5, fadeOut: 1.0 },
    { music: 'bar', from: FB_IN[0] + 0.2, to: FB_OUT[1], intensity: 0.2, vol: 0.4, fadeIn: 1.0, fadeOut: 0.9 },
    { music: 'night', from: FB_OUT[0] + 0.2, to: DURATION, intensity: [[FB_OUT[0], 0.3], [CUT_C, 0.4], [TOSS[0], 0.7], [CUT_D, 0.75], [CUT_D + 0.6, 0.2], [DURATION, 0.12]], fadeIn: 1.2, fadeOut: 1.4 },
    ...crackle,
    { sfx: 'bonfire.stage', at: 0.4, vol: 0.35, pan: 0.1 },
    // the lines
    { sfx: 'owl.hoot', at: BUBBLES[0].from - 0.95, pan: PAN_OWL_A },
    { speak: 'owl', text: textOf(BUBBLES[0]), at: BUBBLES[0].from, pan: PAN_OWL_A },
    { sfx: 'owl.hoot', at: HOOT_B, pan: PAN_OWL_B, vol: 0.85 },
    { speak: 'owl', text: textOf(BUBBLES[1]), at: BUBBLES[1].from, pan: PAN_OWL_B * 0.5 },
    { speak: 'owl', text: textOf(BUBBLES[2]), at: BUBBLES[2].from, pan: PAN_OWL_B * 0.5 },
    { sfx: 'owl.hoot', at: BUBBLES[3].from - 0.95, pan: -0.3 },
    { speak: 'owl', text: textOf(BUBBLES[3]), at: BUBBLES[3].from, pan: -0.3 },
    { sfx: 'owl.hoot', at: BUBBLES[4].from - 0.95, pan: -0.4, vol: 0.4, pitch: -2 },
    { speak: 'owl', text: textOf(BUBBLES[4]), at: BUBBLES[4].from, pan: -0.4, vol: 0.7, pitch: -1 },
    // the books out from under the wing
    { sfx: 'bush.rustle', at: PULL[0], pan: PAN_OWL_B, pitch: 4, vol: 0.7 },
    { sfx: 'bar.take', at: PULL[0] + 0.45, pan: PAN_OWL_B, vol: 0.8 },
    // into the memory and out
    { sfx: 'pumpkin.charged', at: FB_IN[0] - 0.1, vol: 0.55, pitch: -3 },
    { sfx: 'shot.book', at: GLITCH[0], vol: 0.3, pitch: -7, pan: -0.3 },
    { sfx: 'shot.book', at: GLITCH[0] + 0.45, vol: 0.25, pitch: -9, pan: -0.3, variant: 1 },
    ...[17.2, 19.6, 21.0, 23.4].map((at, k) => ({ sfx: 'clink.glass', at, vol: 0.18, pan: k % 2 ? 0.6 : -0.6, variant: k })),
    ...ICONS.map((at, k) => ({ sfx: 'pumpkin.stage', at, vol: 0.45, variant: k, pan: (k - 1) * 0.3 })),
    { sfx: 'bar.take', at: SLIDE[0], pan: -0.3, vol: 0.9, pitch: -3 },
    { sfx: 'bar.take', at: SLIDE[0] + 0.4, pan: 0, vol: 0.7, pitch: -4, variant: 1 },
    { sfx: 'bar.mug', at: SLIDE[1], pan: 0.2 },
    { sfx: 'bush.rustle', at: TAKE + 0.05, pan: 0.25, pitch: 4, vol: 0.5 },
    { sfx: 'pumpkin.enchant', at: FB_OUT[0], vol: 0.6 },
    { sfx: 'pumpkin.charged', at: LIFT[0], pan: PAN_OWL_B, vol: 0.7 },
    // the hand-out
    ...CROWD.flatMap((w) => [
        { sfx: 'bush.rustle', at: TOSS[w.i], pan: -0.3, pitch: 7, vol: 0.4 },
        { sfx: 'walk.step', at: TOSS[w.i] - 0.45, pan: (w.x - 170) / 200, vol: 0.5 },
        { sfx: 'walk.step', at: TOSS[w.i] - 0.15, pan: (w.x - 170) / 200, vol: 0.5 },
        { sfx: 'bar.take', at: TOSS[w.i] + TOSS_AIR, pan: (w.x - 170) / 200, vol: 0.5, pitch: 3 },
        { sfx: 'shot.book', at: TOSS[w.i] + TOSS_AIR + 0.03, pan: (w.x - 170) / 200, vol: 0.45 },
        { sfx: 'shot.book', at: CAST[w.i], pan: (w.x - 190) / 200, vol: 0.75 },
        { sfx: 'pumpkin.enchant', at: w.target.charged, pan: (w.target.x - 190) / 200, vol: 0.8 },
    ]),
    // the hint
    { sfx: 'crow.caw', at: CROW[0] + 0.7, pan: 0.3, vol: 1 },
    { sfx: 'crow.caw', at: CROW[0] + 1.7, pan: -0.2, vol: 0.7, variant: 2 },
    { sfx: 'bonfire.stage', at: FLARE[0] - 0.05, pan: 0.35, vol: 0.9 },
    { sfx: 'pumpkin.enchant', at: FLARE[0] + 0.1, pan: 0.35, vol: 0.5, pitch: -5 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
