<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// The bar intro cutscene: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
import { DEFAULT_BAR_LAYOUT as layout, BAR_FLICKER_MS, BAR_MUG, barLights, barOwlSpot, barProps, bakeBar, paintBar } from '/js/pixel/bar.js';
import { OWL_BAR, pourFrame } from '/js/pixel/owl.js';
import { characterFrame } from '/js/pixel/characters.js';
import { halo, relightCanvas } from '/js/pixel/night.js';
import { bake } from '/js/pixel/sprites.js';
import { PALETTE } from '/js/pixel/palette.js';
import { FLYERS } from '/js/pixel/flyers.js';

const W = 1920, H = 1080, lit = 'firelight';
const o = document.getElementById('out').getContext('2d');
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };

// ---------------------------------------------------------------------------------------------------------------
// Timeline (seconds).
const BUBBLES = [
    { from: 1.2, to: 5.4, lines: ['Ребята, сегодня Хэллоуин!', 'Ух-ху!'] },
    { from: 5.9, to: 10.3, lines: ['И RoadRunner', 'можно воскресить!'] },
    { from: 10.7, to: 16.4, lines: ['Я знаю одно магическое', 'место неподалёку…', 'За мной!'] },
];
const CPS = 24;
const POUR = [0.5, 3.5];
const GO = 10.7 + 'Я знаю одно магическое место неподалёку…За мной!'.length / CPS + 0.1;
const DURATION = 17.2;
// The fly that lands on the counter in front of the owl and gets shot from the crowd.
const FLY = FLYERS.fly[1];
const FLY_IN = 6.0, FLY_LAND = 7.6, SHOT = 9.1;

// ---------------------------------------------------------------------------------------------------------------
// The midground at art scale M: counter, keg, owl, mugs, beer. Margins let the camera move.
const M = 14, MG = 12;
const aw = Math.ceil(W / M) + 2 * MG, ah = Math.ceil(H / M) + 2 * MG;
const top = MG + Math.round((H / M) * 0.6);
const owlA = { x: MG + Math.round((W / M) * 0.6), y: top + 3 };
const tap = { x: owlA.x + OWL_BAR.tap.x, y: owlA.y + OWL_BAR.tap.y };
const owlMug = { x: owlA.x + OWL_BAR.mug.x, y: owlA.y + OWL_BAR.mug.y };

const [base, bx] = canvas(aw, ah);
{
    const P = (x, y, k) => { bx.fillStyle = hex(PALETTE[k]); bx.fillRect(x, y, 1, 1); };
    for (let y = top + 3; y < ah; y++) for (let x = 0; x < aw; x++) {
        const plank = x % 7;
        let k = plank === 0 ? 'timberDeep' : plank === 6 ? 'timberDark' : (x * 3 + y * 7) % 23 === 0 ? 'timberDark' : 'timber';
        if (y === top + 3) k = 'outline';
        if (y === top + 4) k = 'timberDark';
        if (y === top + 9) k = 'ironLight';
        if (y === top + 10) k = 'iron';
        P(x, y, k);
    }
    for (let x = 0; x < aw; x++) { P(x, top, 'outline'); P(x, top + 1, x % 9 === 4 ? 'timberShine' : 'timberLight'); P(x, top + 2, 'timberLight'); }
    const keg = { x1: tap.x + 3, x2: tap.x + 15, y2: top, y1: top - 13 };
    for (let y = keg.y1; y < keg.y2; y++) for (let x = keg.x1; x <= keg.x2; x++) {
        const edge = x === keg.x1 || x === keg.x2 || y === keg.y1;
        const band = y === keg.y1 + 2 || y === keg.y2 - 3;
        const b = (x - keg.x1) / (keg.x2 - keg.x1);
        P(x, y, edge ? 'outline' : band ? (x % 3 ? 'iron' : 'ironLight') : b < 0.3 ? 'plankLight' : b > 0.8 ? 'plankDark' : 'plank');
    }
    for (let x = tap.x; x < keg.x1; x++) { P(x, tap.y - 1, 'outline'); P(x, tap.y, 'ironLight'); P(x, tap.y + 1, 'outline'); }
    P(tap.x + 1, tap.y - 2, 'ironLight'); P(tap.x + 1, tap.y - 3, 'ironLight'); P(tap.x + 1, tap.y - 4, 'outline');
}
const litBase = relightCanvas(base, lit);
const [counterEdge, cex] = canvas(aw, 3);
cex.drawImage(litBase, 0, top, aw, 3, 0, 0, aw, 3);
const owlBakes = new Map();
const owlCanvas = (f) => { if (!owlBakes.has(f)) owlBakes.set(f, bakeBar(f, lit)); return owlBakes.get(f); };
const mugC = bakeBar(BAR_MUG, lit);
const flyBakes = new Map();
const mugs = [];
for (let x = owlA.x - 14, i = 0; x > MG - 6; x -= 10, i++) mugs.push({ x, y: top + 2 + (i % 2), fx: x + (hash(i) < 0.5 ? -4 : 4), spill: i % 3 !== 2 });
const setMug = { x: owlA.x - 6, y: top + 2 };

const BEER = [PALETTE.pumpkinShine, PALETTE.pumpkinLight], FOAM = [PALETTE.white, PALETTE.cream];

function owlFrame(t) {
    const blink = (t % 3.3) < 0.13 || (t > SHOT + 0.03 && t < SHOT + 0.3);
    if (t >= POUR[0] && t < POUR[1]) return pourFrame((t - POUR[0]) / (POUR[1] - POUR[0]));
    if (t >= POUR[1] && t < POUR[1] + 0.18) return OWL_BAR.set[0];
    if (t >= POUR[1] + 0.18 && t < POUR[1] + 0.36) return OWL_BAR.set[1];
    for (const b of BUBBLES) {
        const n = b.lines.join('').length;
        const typedUntil = b.from + n / CPS;
        if (t >= b.from && t < typedUntil && t > POUR[1]) return OWL_BAR.talk[Math.floor(t / 0.11) % 2];
    }
    if (t > SHOT + 0.03 && t < SHOT + 0.3) return OWL_BAR.blink;
    if ((t > 7.2 && t < 9.4) || t > GO) return OWL_BAR.talk[2];
    return blink ? OWL_BAR.blink : OWL_BAR.idle[Math.floor(t / 0.7) % 2];
}

function drawMid(t) {
    const [c, x] = mid;
    x.clearRect(0, 0, aw, ah);
    x.drawImage(litBase, 0, 0);
    const P = (px, py, col) => { x.fillStyle = hex(col); x.fillRect(Math.round(px), Math.round(py), 1, 1); };
    const f = owlFrame(t);
    x.drawImage(owlCanvas(f), owlA.x - f.anchor.x, owlA.y - f.anchor.y);
    x.drawImage(counterEdge, 0, top);
    const all = t > POUR[1] + 0.1 ? [...mugs, setMug] : mugs;
    for (const m of all) x.drawImage(mugC, m.x - BAR_MUG.anchor.x, m.y - BAR_MUG.anchor.y);
    const flow = Math.floor(t * 24);
    for (const [i, m] of mugs.entries()) {
        // foam crown, breathing
        const lift = Math.floor(t * 2 + i) % 2;
        for (let k = -2; k <= 4; k++) {
            P(m.x + k, m.y - 7, FOAM[(k + 9) % 2]);
            if (k > -2 && k < 4) P(m.x + k, m.y - 8, PALETTE.white);
            if (k > -1 && k < 3) P(m.x + k, m.y - 9 - (lift && k === 1 ? 1 : 0), PALETTE.cream);
        }
        // rising bubbles in the beer
        for (let b = 0; b < 2; b++) {
            const ph = (t * 1.6 + hash(i * 7 + b)) % 1;
            P(m.x - 1 + ((i + b * 2) % 3), m.y - 2 - Math.floor(ph * 3), PALETTE.white);
        }
        if (!m.spill) continue;
        // the spill: down the mug's side, over the counter's edge, down the front
        for (let y = m.y - 6; y < m.y; y++) P(m.fx, y, BEER[(y + flow) % 2]);
        for (let y = top + 1; y < ah; y++) for (let k = 0; k < 2; k++) {
            const wob = y > top + 4 ? Math.round(Math.sin((y - flow * 0.5) * 0.7 + m.x) * 0.7) : 0;
            const v = (y - flow + k + m.x) % 6;
            P(m.fx + k + wob - (m.fx < m.x ? 1 : 0), y, v === 0 ? PALETTE.cream : BEER[(k + ((y - flow) >> 1)) & 1]);
        }
        for (let k = -3; k <= 3; k++) P(m.fx + k, top + 1, FOAM[(k + 10 + flow) % 2]);
    }
    // the pour: the owl's stream and the foam rising in its mug
    if (t >= POUR[0] && t < POUR[1] + 0.2) {
        for (let y = tap.y + 1; y < owlMug.y - 5; y++) P(tap.x + 1, y, BEER[(y + flow) % 2]);
        const rise = smooth(POUR[0], POUR[1], t);
        if (rise > 0.6) for (let k = -2; k <= 2; k++) P(owlMug.x + k, owlMug.y - 7 - (rise > 0.85 && Math.abs(k) < 1 ? 1 : 0), FOAM[(k + flow + 9) % 2]);
    }
    // flies, around the light over the counter
    const flyC = (sp) => flyBakes.get(sp) ?? flyBakes.set(sp, bakeBar(sp, lit)).get(sp);
    const put = (sp, px, py, flip = false) => {
        const c = flyC(sp);
        if (!flip) { x.drawImage(c, Math.round(px - sp.anchor.x), Math.round(py - sp.anchor.y)); return; }
        x.save(); x.translate(Math.round(px), 0); x.scale(-1, 1); x.drawImage(c, -sp.anchor.x, Math.round(py - sp.anchor.y)); x.restore();
    };
    for (let i = 0; i < 3; i++) {
        const cx = owlA.x - 30 + i * 22, cy = top - 20 - i * 3;
        const a = t * (1.3 + i * 0.4) + i * 2;
        const fx = cx + Math.sin(a) * 9 + Math.sin(t * 3.1 + i) * 2;
        const fy = cy + Math.sin(t * (2.1 + i * 0.3) + i) * 4;
        put(FLY.fly[Math.floor(t * 25 + i) % 4], fx, fy, Math.cos(a) < 0);
    }
    // the landing fly: in from the left, a loop, down onto the counter; legs rubbed; shot; tumbles; a splat
    const land = { x: setMug.x + 1, y: top - 4 };
    if (t >= FLY_IN && t < FLY_LAND) {
        const k = (t - FLY_IN) / (FLY_LAND - FLY_IN);
        const e = 1 - (1 - k) ** 2;
        const fx = land.x - (1 - e) * 46 + Math.sin(k * 9) * 5 * (1 - k);
        const fy = land.y - (1 - e) * 22 - Math.sin(k * Math.PI) * 6 + Math.cos(k * 13) * 2 * (1 - k);
        put(FLY.fly[Math.floor(t * 25) % 4], fx, fy);
    } else if (t >= FLY_LAND && t < SHOT) {
        const s = t - FLY_LAND;
        const f = s % 1.3 > 1.15 ? 3 : 1 + (Math.floor(s / 0.14) % 2);
        put(FLY.sit[s < 0.25 ? 0 : f], land.x, land.y);
    } else if (t >= SHOT && t < SHOT + 0.12) put(FLY.hit, land.x, land.y - 2);
    else if (t >= SHOT + 0.12 && t < SHOT + 0.5) {
        const k = (t - SHOT - 0.12) / 0.38;
        put(FLY.fall[Math.floor(t / 0.06) % 2], land.x + k * 8, land.y - 2 - Math.sin(k * Math.PI) * 6 + k * 9);
    } else if (t >= SHOT + 0.5) put(FLY.splat, land.x + 8, top + 2);
    if (t >= SHOT && t < SHOT + 0.35) for (let k = 0; k < 6; k++) {
        const a2 = hash(k) * Math.PI * 2, d = (t - SHOT) * (20 + hash(k + 9) * 30);
        P(land.x + Math.cos(a2) * d, land.y - 2 + Math.sin(a2) * d * 0.7 + (t - SHOT) * 20, k % 2 ? PALETTE.crimson : PALETTE.outline);
    }
    return c;
}
const mid = canvas(aw, ah);

// ---------------------------------------------------------------------------------------------------------------
// Backdrop: the game's hall, softened and dimmed, wider than the screen.
const back = (() => {
    const hw = 320, hh = 180;
    const [hall, hx] = canvas(hw, hh);
    paintBar(hx, hw, hh, layout, { lighting: lit });
    for (const l of barLights(layout, hw, hh)) {
        if (l.halo) { hx.save(); hx.globalCompositeOperation = 'lighter'; hx.globalAlpha = 0.35; hx.drawImage(bake(halo(l.halo.rx, l.halo.ry, 'warm')), l.halo.x - l.halo.rx, l.halo.y - l.halo.ry); hx.restore(); }
        hx.drawImage(l.frames[Math.floor(900 / BAR_FLICKER_MS + l.phase) % l.frames.length], l.x - l.anchor.x, l.y - l.anchor.y);
    }
    for (const p of barProps(layout, hw, hh, { lighting: lit })) if (p.y < hh * 0.42) hx.drawImage(p.canvas, p.x - p.anchor.x, p.y - p.anchor.y);
    const spot = barOwlSpot(layout, hw, hh);
    const Zb = M * 0.75, cw = (W * 1.3) / Zb, ch = (H * 1.3) / Zb;
    const sx = Math.max(0, Math.min(hw - cw, spot.x - cw * 0.55)), sy = Math.max(0, spot.y - ch * 0.95);
    const [c, x] = canvas(Math.round(W * 1.3), Math.round(H * 1.3));
    x.filter = 'blur(4px) brightness(0.6) saturate(0.9)';
    x.drawImage(hall, sx, sy, cw, ch, 0, 0, c.width, c.height);
    return c;
})();

// ---------------------------------------------------------------------------------------------------------------
// Foreground crowd: rim-lit silhouettes, their beer glowing.
const L = {
    witch: { body: 'witch', cloak: 'cape', face: 'grin', eyes: 'green', hat: 'witch' },
    cat: { body: 'cat', cloak: 'none', face: 'smile', eyes: 'amber', hat: 'none' },
    skel: { body: 'skeleton', cloak: 'none', face: 'smile', eyes: 'amber', hat: 'pumpkin' },
    mummy: { body: 'mummy', cloak: 'none', face: 'scared', eyes: 'blue', hat: 'top-hat' },
    scare: { body: 'scarecrow', cloak: 'poncho', face: 'stitches', eyes: 'violet', hat: 'horns' },
    vamp: { body: 'vampire', cloak: 'cape', face: 'fangs', eyes: 'red', hat: 'none' },
};
const silCache = new Map();
function silhouette(look, frame, dir, lightLeft) {
    const key = JSON.stringify([look, frame, dir, lightLeft]);
    if (silCache.has(key)) return silCache.get(key);
    const f = characterFrame(look, { dir, pose: 'toast', frame, item: 'beer' });
    const w = f.canvas.width, h = f.canvas.height;
    const src = f.canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const beer = f.beer?.getContext ? f.beer.getContext('2d').getImageData(0, 0, w, h).data : null;
    const [c, cc] = canvas(w, h);
    const img = cc.createImageData(w, h);
    const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
    const lx = lightLeft ? -1 : 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (!src[i + 3]) continue;
        let col;
        if (beer && beer[i + 3]) col = [beer[i], beer[i + 1], beer[i + 2]];
        else if (!on(x, y - 1) || !on(x + lx, y)) col = [0xf0, 0x96, 0x44];
        else if (!on(x + lx * 2, y)) col = [0xa8, 0x4c, 0x26];
        else if (!on(x, y - 2) || !on(x + lx * 3, y)) col = [0x4a, 0x20, 0x20];
        else col = [0x17, 0x0b, 0x13];
        img.data.set([...col, 255], i);
    }
    cc.putImageData(img, 0, 0);
    const out = { canvas: c, anchor: f.anchor, muzzle: f.muzzle };
    silCache.set(key, out);
    return out;
}
const CROWD = [
    { look: L.skel, x: 690, s: 11, cut: 5, dir: 'back', depth: 1.25 },
    { look: L.vamp, x: 1250, s: 11, cut: 5, flip: true, dir: 'side', depth: 1.25 },
    { look: L.cat, x: 430, s: 13, cut: 7, dir: 'side', depth: 1.4 },
    { look: L.mummy, x: 1540, s: 13, cut: 7, flip: true, dir: 'back', depth: 1.4 },
    { look: L.witch, x: 160, s: 15, cut: 8, dir: 'side', depth: 1.6 },
    { look: L.scare, x: 1800, s: 15, cut: 8, flip: true, dir: 'side', depth: 1.6 },
];

// ---------------------------------------------------------------------------------------------------------------
// Camera: a slow drift and push toward the owl on «воскресить», a pull back for «За мной!».
function camera(t) {
    let zoom = 1 + 0.04 * smooth(0, 5.9, t) + 0.62 * smooth(5.9, 7.5, t) - 0.62 * smooth(10.4, 12.2, t) - 0.03 * smooth(GO, DURATION, t);
    const push = smooth(5.9, 7.5, t) - smooth(10.4, 12.2, t);
    const owlScreen = { x: (owlA.x - MG) * M, y: (owlA.y - MG - 12) * M };
    const x = Math.sin(t * 0.35) * 28 + (owlScreen.x - W / 2) * 0.85 * push;
    const y = Math.cos(t * 0.27) * 10 + (owlScreen.y - H / 2) * 0.8 * push;
    return { x, y, zoom };
}
// A layer at depth f (1 — the counter plane): moves and zooms by f.
function withLayer(cam, f, fn) {
    const z = 1 + (cam.zoom - 1) * f;
    o.save();
    o.translate(W / 2, H / 2);
    o.scale(z, z);
    o.translate(-W / 2 - cam.x * f, -H / 2 - cam.y * f);
    fn();
    o.restore();
}
const toScreen = (cam, f, p) => { const z = 1 + (cam.zoom - 1) * f; return { x: (p.x - W / 2 - cam.x * f) * z + W / 2, y: (p.y - H / 2 - cam.y * f) * z + H / 2 }; };

// ---------------------------------------------------------------------------------------------------------------
// Bubbles.
const u = 8, OUTL = hex(PALETTE.outline), CREAM = hex(PALETTE.cream);
const FONT = '700 56px Consolas, "Cascadia Mono", monospace', LH = 70;
function bubble(b, t, head) {
    const age = t - b.from;
    if (age < 0 || t > b.to + 0.25) return;
    const out = t > b.to ? 1 - (t - b.to) / 0.25 : 1;
    const pop = backOut(age / 0.22) * out;
    o.font = FONT;
    const bw = Math.max(...b.lines.map((s) => o.measureText(s).width)) + 88, bh = b.lines.length * LH + 52;
    const bx = clamp(head.x - bw - 30, 50, W - bw - 50), by = clamp(head.y - bh - 120, 40, H - bh - 40);
    const ox = head.x - 40, oy = by + bh;
    o.save();
    o.globalAlpha = clamp(out * 1.5);
    o.translate(ox, oy); o.scale(pop, pop); o.translate(-ox, -oy);
    // shadow, frame, fill
    o.globalAlpha *= 0.4; o.fillStyle = '#000'; o.fillRect(bx + 2 * u, by + 3 * u, bw, bh); o.globalAlpha = clamp(out * 1.5);
    o.fillStyle = OUTL; o.fillRect(bx + u, by, bw - 2 * u, bh); o.fillRect(bx, by + u, bw, bh - 2 * u);
    o.fillStyle = CREAM; o.fillRect(bx + 2 * u, by + u, bw - 4 * u, bh - 2 * u); o.fillRect(bx + u, by + 2 * u, bw - 2 * u, bh - 4 * u);
    // the tail, stepping toward the head
    let x = clamp(head.x - 160, bx + 40, bx + bw - 120), y = by + bh - 2 * u;
    const steps = clamp(Math.floor((head.y - 20 - y) / (3 * u)), 2, 16);
    const dx = (head.x - 30 - x) / steps;
    for (let i = 0; i < steps; i++) {
        const w = Math.max(2, 8 - Math.floor((i * 7) / steps)) * u;
        const sx = Math.round(x / u) * u;
        o.fillStyle = OUTL; o.fillRect(sx - u, y + (i ? 0 : 2 * u), w + 2 * u, (i ? 4 : 2) * u);
        o.fillStyle = CREAM; o.fillRect(sx, y, w, 3 * u);
        x += dx; y += 3 * u;
    }
    // typewriter
    let left = Math.floor(age * CPS);
    o.fillStyle = OUTL;
    b.lines.forEach((s, i) => {
        const shown = s.slice(0, Math.max(0, left));
        left -= s.length;
        o.fillText(shown, bx + 44, by + 26 + 50 + i * LH);
        if (left < 0 && left > -s.length - 1 && Math.floor(t * 4) % 2 === 0 && shown.length < s.length) {
            o.fillRect(bx + 44 + o.measureText(shown).width + 4, by + 26 + 50 + i * LH - 40, 26, 46);
        }
    });
    o.restore();
}

// ---------------------------------------------------------------------------------------------------------------
// The frame.
const motes = Array.from({ length: 90 }, (_, i) => ({ x: hash(i) * W * 1.2 - W * 0.1, y: hash(i + 99) * H, s: hash(i + 7) < 0.25 ? 1 : 0.5, v: 8 + hash(i + 3) * 18, ph: hash(i + 5) * 6, f: 0.6 + hash(i + 11) * 1.2 }));

function draw(t) {
    const cam = camera(t);
    o.fillStyle = '#100810'; o.fillRect(0, 0, W, H);
    withLayer(cam, 0.35, () => o.drawImage(back, -W * 0.15, -H * 0.15));
    const flick = 0.9 + 0.1 * Math.sin(t * 9) * Math.sin(t * 4.3 + 1);
    withLayer(cam, 1, () => {
        o.drawImage(drawMid(t), -MG * M, -MG * M, aw * M, ah * M);
        const oc = { x: (owlA.x - MG - 2) * M, y: (owlA.y - MG - 14) * M };
        const g = o.createRadialGradient(oc.x, oc.y, 30, oc.x, oc.y, 640);
        g.addColorStop(0, `rgba(255,190,100,${0.3 * flick})`); g.addColorStop(1, 'rgba(255,150,60,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(-W, -H, 3 * W, 3 * H); o.globalCompositeOperation = 'source-over';
    });
    // dust: two depths
    for (const m of motes) {
        withLayer(cam, m.f, () => {
            const x = m.x + Math.sin(t * 0.5 + m.ph) * 30, y = ((m.y - t * m.v) % H + H) % H;
            const s = M * m.s * (m.f > 1.2 ? 1.4 : 1);
            o.fillStyle = `rgba(255,232,170,${(0.15 + 0.3 * hash(m.ph)) * (0.6 + 0.4 * Math.sin(t * 2 + m.ph))})`;
            o.fillRect(Math.round(x / s) * s, Math.round(y / s) * s, s, s);
        });
    }
    // crowd
    const cheer = smooth(GO, GO + 0.5, t);
    const sprays = [];
    CROWD.forEach((m, i) => {
        withLayer(cam, m.depth, () => {
            const frame = Math.floor(t / (cheer ? 0.22 : 0.45) + i * 0.37) % 2;
            const lightLeft = m.x > W * 0.6;
            const sil = silhouette(m.look, frame, m.dir, m.flip ? !lightLeft : lightLeft);
            const bob = Math.sin(t * 2.2 + i * 1.3) * m.s * 0.35;
            const lift = cheer * m.s * (2.5 + (i % 2)) + Math.abs(Math.sin(t * 7 + i)) * cheer * m.s * 0.8;
            const lean = cheer * (m.x < W * 0.6 ? 1 : -1) * m.s * 2;
            const feet = H + m.cut * m.s - bob - lift;
            const x0 = m.x + lean;
            o.save(); o.translate(x0, feet); if (m.flip) o.scale(-1, 1);
            o.drawImage(sil.canvas, -sil.anchor.x * m.s, -sil.anchor.y * m.s, sil.canvas.width * m.s, sil.canvas.height * m.s);
            o.restore();
            if (sil.muzzle) sprays.push({ depth: m.depth, x: x0 + (m.flip ? -1 : 1) * (sil.muzzle.x - sil.anchor.x) * m.s, y: feet + (sil.muzzle.y - sil.anchor.y) * m.s, s: m.s, i, toward: m.x < W * 0.6 ? 1 : -1 });
        });
    });
    // beer leaping out of the mugs: a little all along, a fountain on «За мной!»
    for (const sp of sprays) withLayer(cam, sp.depth, () => {
        const n = 4 + Math.round(cheer * 18);
        for (let k = 0; k < n; k++) {
            const period = 1.1 + hash(sp.i * 31 + k) * 0.8;
            const born = Math.floor((t + hash(k * 13 + sp.i) * period) / period);
            const age = (t + hash(k * 13 + sp.i) * period) % period;
            const seed = sp.i * 1000 + k * 17 + born;
            const vx = sp.toward * (0.5 + hash(seed) * 2.4) * (0.4 + cheer);
            const vy = -(2 + hash(seed + 1) * 3) * (0.5 + cheer * 0.8);
            const px = sp.x + vx * age * 5 * sp.s, py = sp.y + (vy * age * 5 + 7 * age * age * 5) * sp.s;
            const q = Math.max(5, Math.round(sp.s * (hash(seed + 2) < 0.35 ? 1 : 0.55)));
            const c = hash(seed + 3);
            o.fillStyle = hex(c < 0.3 ? PALETTE.white : c < 0.6 ? PALETTE.cream : PALETTE.pumpkinShine);
            o.fillRect(Math.round(px / q) * q, Math.round(py / q) * q, q, q);
        }
    });
    // the shot: a tracer from the crowd below-left to the fly
    if (t >= SHOT - 0.04 && t < SHOT + 0.05) {
        const to = toScreen(cam, 1, { x: (setMug.x + 1 - MG) * M, y: (top - 8 - MG) * M });
        const from = { x: 80, y: H + 40 };
        const n = 24;
        for (let k = 0; k < n; k++) {
            const q = k / n;
            o.fillStyle = k > n - 4 ? '#fff6c8' : 'rgba(255,214,96,0.9)';
            o.fillRect(Math.round((from.x + (to.x - from.x) * q) / 8) * 8 - 4, Math.round((from.y + (to.y - from.y) * q) / 8) * 8 - 4, 18, 18);
        }
        o.fillStyle = 'rgba(255,240,180,0.25)'; o.fillRect(0, 0, W, H);
    }
    // vignette
    const g = o.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 1.1);
    g.addColorStop(0, 'rgba(12,4,14,0)'); g.addColorStop(1, 'rgba(12,4,14,0.8)');
    o.fillStyle = g; o.fillRect(0, 0, W, H);
    // bubbles, from the owl's head on screen
    const f = owlFrame(t);
    const head = toScreen(cam, 1, { x: (owlA.x - f.anchor.x + 9 - MG) * M, y: (owlA.y - f.anchor.y + 8 - MG) * M });
    for (const b of BUBBLES) bubble(b, t, head);
    // fade in / out
    const black = 1 - smooth(0, 0.7, t) + smooth(DURATION - 0.6, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs): the game's own synth.
const owlPan = 0.25;
window.SOUND = [
    { music: 'bar', from: 0, to: DURATION, intensity: [[0, 0.45], [GO, 0.5], [GO + 0.6, 1]], fadeIn: 1, fadeOut: 0.7 },
    { sfx: 'owl.hoot', at: BUBBLES[0].from - 0.95, pan: owlPan },
    ...BUBBLES.map((b) => ({ speak: 'owl', text: b.lines.join(' '), at: b.from, pan: owlPan })),
    { sfx: 'bar.pour', at: POUR[0], pan: owlPan + 0.1 },
    { sfx: 'bar.mug', at: POUR[1] + 0.18, pan: owlPan },
    ...Array.from({ length: 10 }, (_, i) => ({ sfx: 'fly.buzz', at: 0.4 + i * 1.65, pan: Math.sin(i * 2.1) * 0.6, vol: 0.45 })),
    { sfx: 'fly.buzz', at: FLY_IN, pan: -0.5, vol: 0.9 },
    { sfx: 'fly.buzz', at: FLY_IN + 0.8, pan: 0.1, vol: 0.8 },
    { sfx: 'shot.pistol', at: SHOT - 0.04, pan: -0.7 },
    { sfx: 'flyer.hit', at: SHOT, pan: 0.2 },
    { sfx: 'flyer.fall', at: SHOT + 0.05, pan: 0.2 },
    { sfx: 'clink.cheer', at: GO, vol: 1.2 },
    { sfx: 'clink.glass', at: GO + 0.25, pan: -0.3 },
    { sfx: 'clink.glass', at: GO + 0.45, pan: 0.4, variant: 1 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
