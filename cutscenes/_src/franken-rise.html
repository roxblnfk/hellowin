<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// FrankenPHP rises: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, PUMPKIN_SHADOW, bake, pumpkinLayers, seedOf } from '/js/pixel/sprites.js';
import { ASH } from '/js/pixel/bonfire.js';
import { EMISSIVE, LIT_PALETTE, NIGHT, halo, paintSky, relightCanvas } from '/js/pixel/night.js';
import { characterFrame, randomLook } from '/js/pixel/characters.js';
import { OWL, glowing } from '/js/pixel/owl.js';
import { FRANKEN, SILHOUETTE, FX, FINALE_EMISSIVE, frankenHalo } from '/js/pixel/finale.js';

const W = 1920, H = 1080;
const o = document.getElementById('out').getContext('2d');
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds.
const STRIKE = 6.6;                 // the first of three lightning strikes
const NIGHT_AT = STRIKE + 0.78, REVEAL = STRIKE + 0.9;
const ROAR = [9.5, 10.4];
const CUT = 10.6;                   // to the owl's close-up
const SHOUT = 16.3;
const DURATION = 20.8;
const BUBBLES = [
    { from: 1.8, to: 6.4, lines: ['Вот он!', 'Он возвращается!'], cps: 16, shot: 'A' },
    { from: 11.0, to: 14.2, lines: ['Что это?..', 'Это разве RoadRunner?!'], cps: 18, shot: 'C' },
    { from: 14.5, to: SHOUT - 0.15, lines: ['Что мы…'], cps: 7, shot: 'C' },
    { from: SHOUT, to: DURATION, lines: ['ЧТО ВЫ', 'НАДЕЛАЛИ?'], cps: 60, shot: 'C', shout: true },
];

// ---------------------------------------------------------------------------------------------------------------
// The stage of the finale (as public/dev/finale.html stages it): 320 × 180 art px.
const UNLIT = new Set([...EMISSIVE, ...FINALE_EMISSIVE]);
const baked = new WeakMap();
function bakeF(sprite, lighting = 'day') {
    if (!baked.has(sprite)) baked.set(sprite, new Map());
    const per = baked.get(sprite);
    if (per.has(lighting)) return per.get(lighting);
    const [c, ctx] = canvas(sprite.w, sprite.h);
    const img = ctx.createImageData(sprite.w, sprite.h);
    for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
        const k = sprite.legend[sprite.rows[y][x]];
        if (!k) continue;
        const color = UNLIT.has(k) || lighting === 'day' ? PALETTE[k] : LIT_PALETTE[lighting][k];
        const i = (y * sprite.w + x) * 4;
        img.data[i] = (color >> 16) & 255; img.data[i + 1] = (color >> 8) & 255; img.data[i + 2] = color & 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    per.set(lighting, c);
    return c;
}
const light = (s) => bakeF(s, 'day');
const stamp = (ctx, c, def, x, y) => ctx.drawImage(c, Math.round(x - def.anchor.x), Math.round(y - def.anchor.y));
const additive = (ctx, c, def, x, y, a) => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; stamp(ctx, c, def, x, y); ctx.restore(); };
const glowCache = new WeakMap();
const glow = (s) => glowCache.get(s) ?? glowCache.set(s, glowing(s)).get(s);

const MW = 320, MH = 180, HORIZON = 62;
const CENTRE = { x: 166, y: 124 };
const RING = [
    [-70, -18, 'm', 'pumpkin-1'], [-38, -30, 's', 'pumpkin-2'], [6, -34, 's', 'pumpkin-3'], [44, -28, 'm', 'pumpkin-5'],
    [78, -12, 's', 'pumpkin-6'], [96, 14, 'l', 'pumpkin-7'], [60, 38, 'm', 'pumpkin-8'], [14, 46, 'l', 'pumpkin-10'],
    [-34, 44, 'm', 'pumpkin-11'], [-80, 26, 'l', 'pumpkin-13'], [-100, 0, 's', 'pumpkin-14'],
];
const TREE_AT = { x: 34, y: 118 };
const PERCH = { x: TREE_AT.x - DECOR.tree.anchor.x + DECOR.tree.perch[0], y: TREE_AT.y - DECOR.tree.anchor.y + DECOR.tree.perch[1] };
const looks = Array.from({ length: 6 }, (_, i) => randomLook(((s) => () => ((s = (s * 16807) % 2147483647) / 2147483647))(41 + i * 13)));
const AROUND = [[-58, 8], [58, 8], [-34, 30], [34, 30], [0, 38], [-74, -10]];
const EDGES = [[-140, 40], [140, 36], [-120, 54], [124, 52], [40, 56], [-150, 0]];

const LAWN = (() => {
    const [c, ctx] = canvas(MW, MH);
    let seed = 9;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let x = 0; x < MW; x += DECOR.hills.w) ctx.drawImage(bake(DECOR.hills), x, HORIZON - DECOR.hills.h);
    for (let y = HORIZON; y < MH; y++) for (let x = 0; x < MW; x++) {
        const d = Math.hypot((x - CENTRE.x) / 132, (y - CENTRE.y + 4) / 52);
        let k;
        if (d < 0.9 || (d < 1 && (x + y) % 2 === 0)) {
            const lane = ((((x - CENTRE.x) / (y - HORIZON + 30)) * 9) % 1 + 1) % 1;
            k = lane < 0.2 ? 'soilDark' : lane < 0.3 ? 'soilLight' : 'soil';
        } else { const n = r(); k = n < 0.06 ? 'leafLight' : n < 0.18 ? 'leafDark' : 'leaf'; }
        ctx.fillStyle = hex(PALETTE[k]); ctx.fillRect(x, y, 1, 1);
    }
    stamp(ctx, bake(DECOR.tree), DECOR.tree, TREE_AT.x, TREE_AT.y);
    return c;
})();
const GROUND = { blood: relightCanvas(LAWN, 'blood'), night: relightCanvas(LAWN, 'night') };
const SKY = Object.fromEntries(['blood', 'night'].map((l) => {
    const [c, ctx] = canvas(MW, HORIZON + 1);
    paintSky(ctx, MW, HORIZON + 1, l, { seed: 5 });
    return [l, c];
}));

function pumpkin(ctx, i, x, y, lighting, float, ms) {
    const [, , size, id] = RING[i];
    const L = pumpkinLayers(11, size, seedOf(id), 'violet');
    if (float > 0) { const sh = PUMPKIN_SHADOW[size][Math.min(2, Math.floor(float / 3))]; ctx.globalAlpha = 0.5; stamp(ctx, bake(sh), sh, x, y - 1); ctx.globalAlpha = 1; }
    const h = halo(size === 'l' ? 16 : 13, 5, 'violet');
    additive(ctx, light(h), h, x, y, 0.4);
    const at = (list, per) => list[frameAt(ms + i * 97, list.length, per)];
    const yy = y - float;
    if (L.auraFrames) stamp(ctx, light(at(L.auraFrames, 160)), L, x, yy);
    stamp(ctx, bakeF(L.layers.back, lighting), L, x, yy);
    if (L.glowFrames) stamp(ctx, light(at(L.glowFrames, 120)), L, x, yy);
    stamp(ctx, bakeF(L.layers.body, lighting), L, x, yy);
    stamp(ctx, bakeF(L.layers.rim, lighting), L, x, yy);
    if (L.layers.stem) stamp(ctx, bakeF(L.layers.stem, lighting), L, x, yy);
    if (L.fireFrames) stamp(ctx, light(at(L.fireFrames, 110)), L, x, yy);
}
const relit = new Map();
function walker(ctx, i, x, y, lighting, pose, ms) {
    const dx = CENTRE.x - x;
    const dir = Math.abs(dx) < 20 ? 'back' : 'side';
    const f = characterFrame(looks[i], { dir, pose, frame: frameAt(ms + i * 170, pose === 'ritual' ? 4 : 2, pose === 'ritual' ? 380 : 600) });
    const key = f.canvas;
    if (!relit.has(key)) relit.set(key, new Map());
    const per = relit.get(key);
    if (!per.has(lighting)) per.set(lighting, relightCanvas(f.canvas, lighting));
    const draw = (c) => {
        if (dir === 'side' && dx < 0) { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -f.anchor.x, Math.round(y - f.anchor.y)); ctx.restore(); }
        else ctx.drawImage(c, Math.round(x - f.anchor.x), Math.round(y - f.anchor.y));
    };
    draw(per.get(lighting));
    if (f.glow) draw(f.glow);
}

function figureAt(t) {
    const ms = t * 1000;
    if (t < STRIKE) {
        if (t < 0.4) return null;
        if (t < 2.0) return SILHOUETTE.rise[Math.min(3, Math.floor((t - 0.4) / 0.4))];
        if (t > 4.4) return SILHOUETTE.eyes[frameAt(ms, 2, 500)];
        return SILHOUETTE.idle[frameAt(ms, 2, 500)];
    }
    if (t < REVEAL) return SILHOUETTE.idle[frameAt(ms, 2, 500)];
    if (t < REVEAL + 0.45) return SILHOUETTE.reveal[Math.floor((t - REVEAL) / 0.15)];
    if (t >= ROAR[0] && t < ROAR[1]) return FRANKEN.talk[2];
    const s = ms % 2400;
    if (s > 2000 && s < 2270) return FRANKEN.spark[Math.floor((s - 2000) / 90)];
    return FRANKEN.idle[frameAt(ms, 2, 700)];
}
const lightingAt = (t) => (t < NIGHT_AT ? 'blood' : 'night');

// The stage, sky left transparent (the sky is its own layer).
const [stage, sx] = canvas(MW, MH);
function drawStage(t, { owl = true } = {}) {
    const ms = t * 1000;
    const lighting = lightingAt(t);
    sx.clearRect(0, 0, MW, MH);
    sx.drawImage(GROUND[lighting], 0, HORIZON - DECOR.hills.h, MW, MH - HORIZON + DECOR.hills.h, 0, HORIZON - DECOR.hills.h, MW, MH - HORIZON + DECOR.hills.h);
    const items = [];
    items.push({ y: CENTRE.y - 6, draw: () => {
        stamp(sx, bakeF(ASH.pit, lighting), ASH.pit, CENTRE.x, CENTRE.y);
        stamp(sx, light(ASH.circle[7]), ASH.circle[7], CENTRE.x, CENTRE.y);
        if (t < 0.27) { const fl = FX.flash[Math.floor(t / 0.09)]; stamp(sx, light(fl), fl, CENTRE.x, CENTRE.y); }
        if (t >= REVEAL) { const h = frankenHalo(40, 12); additive(sx, light(h), h, CENTRE.x, CENTRE.y - 2, 0.35 * smooth(REVEAL, REVEAL + 1, t)); }
    } });
    const fall = t < REVEAL ? 0 : smooth(REVEAL, REVEAL + 0.3, t);
    RING.forEach(([dx, dy], i) => {
        let x = CENTRE.x + dx, y = CENTRE.y + dy;
        let float = 4 + Math.round(2 * Math.sin(ms / 420 + i));
        if (t < REVEAL + 0.3) {
            const a = (i / RING.length) * Math.PI * 2 + ms / 900;
            const pull = Math.min(1, t / 1.5);
            const fx = CENTRE.x + Math.cos(a) * 84, fy = CENTRE.y + 6 + Math.sin(a) * 30;
            x += (fx - x) * pull * (1 - fall); y += (fy - y) * pull * (1 - fall);
            float = Math.round((10 + 3 * Math.sin(ms / 200 + i)) * (1 - fall));
        } else float = 0;
        items.push({ y, draw: () => pumpkin(sx, i, x, y, lighting, float, ms) });
    });
    const ritual = t < STRIKE + 0.8;
    (ritual ? AROUND : EDGES).forEach(([dx, dy], i) => {
        const x = clamp(CENTRE.x + dx, 8, MW - 8), y = CENTRE.y + dy;
        items.push({ y, draw: () => walker(sx, i, x, y, lighting, ritual ? 'ritual' : 'idle', ms) });
    });
    items.push({ y: t < REVEAL + 0.3 ? 900 : CENTRE.y, draw: () => {
        if (t > 0.18 && t < STRIKE + 0.1) { const col = FX.column[frameAt(ms, 4, 90)]; additive(sx, light(col), col, CENTRE.x, CENTRE.y + 2, 0.55 * (1 - smooth(STRIKE - 0.3, STRIKE + 0.1, t))); }
        const fig = figureAt(t);
        if (t < REVEAL) { const cl = FX.smoke.cloud[frameAt(ms, 4, 220)]; stamp(sx, bakeF(cl, 'blood'), cl, CENTRE.x, CENTRE.y + 4); }
        if (fig) stamp(sx, bakeF(fig, lighting), fig, CENTRE.x, CENTRE.y);
        if (t < REVEAL) { const fr = FX.smoke.cloud[(frameAt(ms, 4, 220) + 2) % 4]; sx.globalAlpha = 0.8; stamp(sx, bakeF(fr, 'blood'), fr, CENTRE.x, CENTRE.y + 10); sx.globalAlpha = 1; }
        // the strikes
        for (const k of [0, 1, 2]) {
            const s = t - (STRIKE + k * 0.38);
            if (s >= 0 && s < 0.18) { const b = FX.lightning[k]; stamp(sx, light(b[Math.floor(s / 0.06)] ?? b), b[0] ?? b, CENTRE.x + (k - 1) * 4, CENTRE.y - 2); }
        }
    } });
    if (t > REVEAL) items.push({ y: CENTRE.y + 2, draw: () => {
        [[-60, 6, 0], [10, 10, 2], [70, 2, 1], [-20, 22, 3]].forEach(([dx, dy, ph]) => {
            const s = FX.smoke.creep[(frameAt(ms, 4, 300) + ph) % 4];
            sx.globalAlpha = 0.8 * smooth(REVEAL, REVEAL + 0.6, t); stamp(sx, bakeF(s, lighting), s, CENTRE.x + dx, CENTRE.y + dy); sx.globalAlpha = 1;
        });
    } });
    if (owl) items.push({ y: 1000, draw: () => { const s = owlFrameA(t); stamp(sx, bakeF(glow(s), lighting), s, PERCH.x, PERCH.y); } });
    items.sort((a, b) => a.y - b.y).forEach((it) => it.draw());
    return stage;
}
function owlFrameA(t) {
    const b = BUBBLES[0];
    if (t >= b.from && t < b.from + b.lines.join('').length / b.cps) return OWL.talk[Math.floor(t / 0.11) % 2];
    if (t > STRIKE) return OWL.hoot;
    if (t >= b.from) return OWL.talk[2];
    return (t % 3.1) < 0.13 ? OWL.blink : OWL.idle[Math.floor(t / 0.7) % 2];
}

// ---------------------------------------------------------------------------------------------------------------
// Camera over the stage: world point at the screen centre, magnification, depth layers.
const S = W / MW; // 6: the whole stage
function cameraA(t) {
    const shake = shakeAt(t);
    let z = 1.32 + 0.1 * smooth(0, STRIKE, t);
    let cx = 142, cy = 92;
    const push = smooth(7.6, 9.3, t);
    z += push * 0.95; cx += (CENTRE.x - cx) * push; cy += (CENTRE.y - 58 - cy) * push;
    cy += 0.4 * Math.sin(t * 0.5);
    cx += 0.6 * Math.sin(t * 0.37);
    return { cx: cx + shake.x, cy: cy + shake.y, z };
}
function shakeAt(t) {
    let a = 0;
    if (t < 2.4) a += 1.6 * (1 - t / 2.4) + 0.4;           // the ground rumbles as it rises
    for (const k of [0, 1, 2]) { const s = t - (STRIKE + k * 0.38); if (s >= 0 && s < 0.3) a += 2.5 * (1 - s / 0.3); }
    if (t >= ROAR[0] && t < ROAR[1]) a += 1.2;
    const q = Math.floor(t * 30);
    return { x: (hash(q) - 0.5) * 2 * a, y: (hash(q + 77) - 0.5) * 2 * a };
}
function layer(cam, f, fn, neutral = { x: MW / 2, y: MH / 2 }) {
    const z = S * (1 + (cam.z - 1) * f);
    const cx = neutral.x + (cam.cx - neutral.x) * f, cy = neutral.y + (cam.cy - neutral.y) * f;
    o.save(); o.translate(W / 2, H / 2); o.scale(z, z); o.translate(-cx, -cy); fn(); o.restore();
    return (p) => ({ x: (p.x - cx) * z + W / 2, y: (p.y - cy) * z + H / 2 });
}

// ---------------------------------------------------------------------------------------------------------------
// Foreground: two ritual walkers from the back, huge and dark, rim-lit by the column (red) or FrankenPHP (lime).
function rimSilhouette(f, rim) {
    const w = f.canvas.width, h = f.canvas.height;
    const src = f.canvas.getContext('2d').getImageData(0, 0, w, h).data;
    const [c, cc] = canvas(w, h);
    const img = cc.createImageData(w, h);
    const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && src[(y * w + x) * 4 + 3] > 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (!src[i + 3]) continue;
        const edge = !on(x, y - 1) || !on(x - 1, y) || !on(x + 1, y);
        const col = edge ? rim : !on(x, y - 2) ? rim.map((v) => v * 0.35) : [0x0e, 0x08, 0x10];
        img.data.set([...col, 255], i);
    }
    cc.putImageData(img, 0, 0);
    return c;
}
const fgCache = new Map();
function foreground(t, ms) {
    const night = t >= NIGHT_AT;
    const rim = night ? [0xb6, 0xf0, 0x4a] : [0xff, 0x52, 0x40];
    const flee = smooth(STRIKE + 0.2, STRIKE + 1.2, t);
    [[0, 260, 16, 0], [3, 1650, 17, 1]].forEach(([li, x, s, side], k) => {
        const pose = t < STRIKE + 0.4 ? 'ritual' : 'idle';
        const f = characterFrame(looks[li], { dir: 'back', pose, frame: frameAt(ms + k * 200, pose === 'ritual' ? 4 : 2, pose === 'ritual' ? 380 : 600) });
        const key = `${li}|${pose}|${f.canvas.width}|${frameAt(ms + k * 200, pose === 'ritual' ? 4 : 2, pose === 'ritual' ? 380 : 600)}|${night}`;
        if (!fgCache.has(key)) fgCache.set(key, rimSilhouette(f, rim));
        const c = fgCache.get(key);
        const dx = (side ? 1 : -1) * flee * 420;
        o.drawImage(c, x + dx - f.anchor.x * s, H + 9 * s - f.anchor.y * s, c.width * s, c.height * s);
    });
}

// ---------------------------------------------------------------------------------------------------------------
// Particles: embers rising (red, then FrankenPHP's lime motes), screen space with depth.
const embers = Array.from({ length: 80 }, (_, i) => ({ x: hash(i) * W, ph: hash(i + 3), v: 40 + hash(i + 5) * 120, s: hash(i + 9) < 0.3 ? 12 : 6, d: 0.6 + hash(i + 13) }));
function drawEmbers(t, cam) {
    const night = t >= NIGHT_AT;
    for (const e of embers) {
        const y = H - ((t * e.v * e.d + e.ph * H * 1.3) % (H * 1.3));
        const x = e.x + Math.sin(t * 1.3 + e.ph * 9) * 30 - (cam.cx - 150) * e.d * 4;
        const a = 0.35 + 0.45 * Math.sin(t * 5 + e.ph * 20) ** 2;
        o.fillStyle = night ? `rgba(190,255,90,${a})` : `rgba(255,${80 + 60 * e.ph | 0},50,${a})`;
        const s = e.s * e.d;
        o.fillRect(Math.round(x / 6) * 6, Math.round(y / 6) * 6, s, s);
    }
}

// ---------------------------------------------------------------------------------------------------------------
// Bubbles.
const u = 8, OUTL = hex(PALETTE.outline), CREAM = hex(PALETTE.cream);
function frameRect(x, y, w, h, fill = CREAM) {
    o.fillStyle = OUTL; o.fillRect(x + u, y, w - 2 * u, h); o.fillRect(x, y + u, w, h - 2 * u);
    o.fillStyle = fill; o.fillRect(x + 2 * u, y + u, w - 4 * u, h - 2 * u); o.fillRect(x + u, y + 2 * u, w - 2 * u, h - 4 * u);
}
function bubble(b, t, head, place) {
    const age = t - b.from;
    if (age < 0 || t > b.to + 0.2) return;
    const out = t > b.to ? 1 - (t - b.to) / 0.2 : 1;
    const pop = backOut(age / (b.shout ? 0.16 : 0.22)) * out;
    const size = b.shout ? 120 : 56, LH = b.shout ? 132 : 70;
    o.font = `700 ${size}px Consolas, "Cascadia Mono", monospace`;
    const bw = Math.max(...b.lines.map((s) => o.measureText(s).width)) + (b.shout ? 120 : 88), bh = b.lines.length * LH + (b.shout ? 80 : 52);
    const { bx, by } = place(bw, bh);
    const ox = head.x, oy = head.y;
    o.save();
    o.globalAlpha = clamp(out * 1.5);
    o.translate(ox, oy); o.scale(pop, pop); o.translate(-ox, -oy);
    if (b.shout) { // a burst behind the box: stepped spikes
        o.fillStyle = OUTL;
        for (let k = 0; k < 18; k++) {
            const a = (k / 18) * Math.PI * 2 + 0.2, cx = bx + bw / 2, cy = by + bh / 2;
            const ex = cx + Math.cos(a) * (bw / 2 + 70), ey = cy + Math.sin(a) * (bh / 2 + 60);
            for (let s = 0; s < 6; s++) {
                const px = cx + (ex - cx) * (0.55 + s * 0.08), py = cy + (ey - cy) * (0.55 + s * 0.08), r = (6 - s) * u;
                o.fillStyle = OUTL; o.fillRect(Math.round((px - r) / u) * u, Math.round((py - r) / u) * u, 2 * r, 2 * r);
            }
        }
        for (let k = 0; k < 18; k++) {
            const a = (k / 18) * Math.PI * 2 + 0.2, cx = bx + bw / 2, cy = by + bh / 2;
            const ex = cx + Math.cos(a) * (bw / 2 + 70), ey = cy + Math.sin(a) * (bh / 2 + 60);
            for (let s = 0; s < 5; s++) {
                const px = cx + (ex - cx) * (0.55 + s * 0.08), py = cy + (ey - cy) * (0.55 + s * 0.08), r = (5 - s) * u;
                o.fillStyle = CREAM; o.fillRect(Math.round((px - r) / u) * u + u, Math.round((py - r) / u) * u + u, 2 * r - 2 * u, 2 * r - 2 * u);
            }
        }
    }
    o.globalAlpha *= 0.4; o.fillStyle = '#000'; o.fillRect(bx + 2 * u, by + 3 * u, bw, bh); o.globalAlpha = clamp(out * 1.5);
    frameRect(bx, by, bw, bh);
    // the tail toward the head
    if (!b.shout) {
        const fromRight = head.x > bx + bw / 2;
        let x = fromRight ? bx + bw - 160 : bx + 60, y = by + bh - 2 * u;
        const steps = clamp(Math.floor((head.y - 20 - y) / (3 * u)), 2, 16);
        const dx = (head.x - 30 - x) / steps;
        for (let i = 0; i < steps; i++) {
            const w = Math.max(2, 8 - Math.floor((i * 7) / steps)) * u, sxp = Math.round(x / u) * u;
            o.fillStyle = OUTL; o.fillRect(sxp - u, y + (i ? 0 : 2 * u), w + 2 * u, (i ? 4 : 2) * u);
            o.fillStyle = CREAM; o.fillRect(sxp, y, w, 3 * u);
            x += dx; y += 3 * u;
        }
    }
    let left = Math.floor(age * b.cps);
    o.fillStyle = b.shout ? hex(PALETTE.runeDark ?? PALETTE.outline) : OUTL;
    b.lines.forEach((s, i) => {
        const shown = s.slice(0, Math.max(0, left));
        left -= s.length;
        const tx = bx + (b.shout ? 60 : 44), ty = by + (b.shout ? 40 + 104 : 26 + 50) + i * LH;
        if (b.shout) {
            let x = tx;
            [...shown].forEach((ch, k) => {
                const j = Math.floor(t * 20) * 31 + k * 7 + i * 101;
                o.fillText(ch, x + (hash(j) - 0.5) * 10, ty + (hash(j + 5) - 0.5) * 12);
                x += o.measureText(ch).width;
            });
        } else o.fillText(shown, tx, ty);
    });
    o.restore();
}

// ---------------------------------------------------------------------------------------------------------------
// Shot C: the owl up close on its branch, FrankenPHP looming out of focus behind.
const OWL_S = 34;
function owlFrameC(t) {
    if (t >= SHOUT) return Math.floor(t / 0.09) % 4 === 0 ? OWL.beak[2] : OWL.hoot;
    for (const b of [BUBBLES[1], BUBBLES[2]]) if (t >= b.from && t < b.from + b.lines.join('').length / b.cps) return OWL.beak[Math.floor(t / (b.cps < 10 ? 0.16 : 0.11)) % 2];
    if (t < BUBBLES[1].from) return OWL.turnLeft[t < CUT + 0.15 ? 0 : 1];
    return OWL.beak[2];
}
function shotC(t) {
    const k = t - CUT;
    const crash = smooth(SHOUT, SHOUT + 0.18, t);
    const zoom = 1 + 0.06 * smooth(0, SHOUT - CUT, k) + 0.16 * crash;
    const q = Math.floor(t * 30);
    const amp = t >= SHOUT ? 14 * (1 - smooth(SHOUT, SHOUT + 1.6, t)) + 4 : 2;
    const sh = { x: (hash(q) - 0.5) * 2 * amp, y: (hash(q + 3) - 0.5) * 2 * amp };
    o.fillStyle = '#05060c'; o.fillRect(0, 0, W, H);
    // background: sky + the stage around FrankenPHP, magnified and out of focus
    const stageNow = drawStage(t, { owl: false });
    const bgZ = 9 * (1 + (zoom - 1) * 0.4);
    const fc = { x: CENTRE.x + 4, y: CENTRE.y - 52 };
    o.save();
    o.filter = 'blur(7px) brightness(0.8)';
    o.translate(W * 0.36 + sh.x * 0.4 - k * 8, H * 0.5 + sh.y * 0.4); o.scale(bgZ, bgZ); o.translate(-fc.x, -fc.y);
    o.drawImage(SKY.night, 0, 0); o.drawImage(stageNow, 0, 0);
    o.restore();
    o.filter = 'none';
    // lime light from FrankenPHP
    const g = o.createRadialGradient(W * 0.36, H * 0.45, 40, W * 0.36, H * 0.45, 900);
    g.addColorStop(0, 'rgba(170,255,80,0.22)'); g.addColorStop(1, 'rgba(170,255,80,0)');
    o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
    // the branch and the owl, foreground
    o.save();
    o.translate(W / 2 + sh.x, H / 2 + sh.y); o.scale(zoom, zoom); o.translate(-W / 2, -H / 2);
    const perch = { x: 1390 + k * 6, y: 900 };
    o.fillStyle = hex(LIT_PALETTE.night.outline ?? PALETTE.outline);
    for (let x = 900; x < W + 300; x += OWL_S / 2) {
        const yy = perch.y + Math.round(((x - perch.x) * 0.08) / (OWL_S / 2)) * (OWL_S / 2);
        o.fillStyle = '#1a1018'; o.fillRect(x, yy, OWL_S / 2, OWL_S * 1.6);
        o.fillStyle = '#3a2a2c'; o.fillRect(x, yy, OWL_S / 2, OWL_S / 2);
    }
    const f = owlFrameC(t);
    const oc = bakeF(glow(f), 'night');
    o.drawImage(oc, perch.x - f.anchor.x * OWL_S, perch.y - f.anchor.y * OWL_S, f.w * OWL_S, f.h * OWL_S);
    // lime rim on the owl's left edge (facing FrankenPHP)
    o.restore();
    // vignette
    const v = o.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    // red pulse on the shout
    if (t >= SHOUT) { o.fillStyle = `rgba(255,30,40,${0.18 * (1 - smooth(SHOUT, SHOUT + 0.6, t)) + 0.05 * (Math.sin(t * 9) + 1) / 2})`; o.fillRect(0, 0, W, H); }
    const head = { x: W / 2 + (perch.x - W / 2) * zoom + sh.x - 80, y: H / 2 + (perch.y - 15 * OWL_S - H / 2) * zoom + sh.y };
    bubble(BUBBLES[1], t, head, (bw, bh) => ({ bx: head.x - bw - 120, by: 120 }));
    bubble(BUBBLES[2], t, head, (bw, bh) => ({ bx: head.x - bw - 120, by: 120 }));
    bubble(BUBBLES[3], t, { x: W * 0.42, y: H * 0.3 }, (bw, bh) => ({ bx: W * 0.42 - bw / 2, by: 110 }));
}

// ---------------------------------------------------------------------------------------------------------------
function draw(t) {
    const ms = t * 1000;
    if (t >= CUT) shotC(t);
    else {
        const cam = cameraA(t);
        const lighting = lightingAt(t);
        o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
        // sky and moon — far
        layer(cam, 0.35, () => {
            o.drawImage(SKY[lighting], -60, -20, MW + 120, HORIZON + 21);
            const [moon, ring] = lighting === 'blood' ? [NIGHT.bloodMoon, NIGHT.bloodMoonHalo] : [NIGHT.moon, NIGHT.moonHalo];
            stamp(o, bake(ring), ring, 250, 22); stamp(o, bake(moon), moon, 250, 22);
        });
        let toScreen;
        layer(cam, 1, () => o.drawImage(drawStage(t), 0, 0));
        toScreen = (p) => { const z = S * cam.z; return { x: (p.x - cam.cx) * z + W / 2, y: (p.y - cam.cy) * z + H / 2 }; };
        // the column's red light / the lime after the reveal
        const c = toScreen({ x: CENTRE.x, y: CENTRE.y - 40 });
        const g = o.createRadialGradient(c.x, c.y, 30, c.x, c.y, 900);
        const red = t < NIGHT_AT;
        g.addColorStop(0, red ? `rgba(255,60,40,${0.22 + 0.06 * Math.sin(t * 13)})` : `rgba(170,255,80,${0.2 * smooth(REVEAL, REVEAL + 1, t)})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(0, 0, W, H); o.globalCompositeOperation = 'source-over';
        drawEmbers(t, cam);
        foreground(t, ms);
        // vignette
        const v = o.createRadialGradient(W / 2, H * 0.45, H * 0.32, W / 2, H * 0.5, H * 1.1);
        v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.7)');
        o.fillStyle = v; o.fillRect(0, 0, W, H);
        // lightning flashes
        for (const k of [0, 1, 2]) {
            const s = t - (STRIKE + k * 0.38);
            if (s >= 0 && s < 0.25) { o.fillStyle = `rgba(235,240,255,${(k === 2 ? 0.9 : 0.6) * (1 - s / 0.25)})`; o.fillRect(0, 0, W, H); }
        }
        const owlHead = toScreen({ x: PERCH.x, y: PERCH.y - 14 });
        bubble(BUBBLES[0], t, owlHead, (bw, bh) => ({ bx: 40, by: 40 }));
    }
    // a white frame on the cut, fades
    if (t >= CUT && t < CUT + 0.12) { o.fillStyle = `rgba(255,255,255,${1 - (t - CUT) / 0.12})`; o.fillRect(0, 0, W, H); }
    const black = 1 - smooth(0, 0.8, t) + smooth(DURATION - 0.6, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs): the game's own synth, timed as sound.js times the finale.
window.SOUND = [
    { music: 'rise', from: 0, to: CUT, intensity: [[0, 1], [STRIKE, 1], [NIGHT_AT, 0.1]], fadeIn: 0.6, fadeOut: 0.05 },
    { music: 'rise', from: CUT, to: DURATION, intensity: [[CUT, 0.1], [SHOUT, 0.1], [SHOUT + 0.4, 1]], fadeIn: 0.3, fadeOut: 0.8 },
    { sfx: 'finale.wake', at: 0 },
    { sfx: 'owl.hoot', at: BUBBLES[0].from - 0.95, pan: -0.6 },
    { speak: 'owl', text: BUBBLES[0].lines.join(' '), at: BUBBLES[0].from, pan: -0.6 },
    ...[0, 1, 2].map((k) => ({ sfx: 'finale.strike', at: STRIKE + k * 0.38, variant: k })),
    { sfx: 'finale.tada', at: REVEAL },
    { speak: 'franken', text: 'Гррррр-хррррр-мммм!', at: ROAR[0], vol: 1.6, pitch: -3 },
    { speak: 'owl', text: BUBBLES[1].lines.join(' '), at: BUBBLES[1].from, pan: 0.3 },
    { speak: 'owl', text: BUBBLES[2].lines.join(' '), at: BUBBLES[2].from, pan: 0.3, pitch: -1 },
    { sfx: 'owl.hoot', at: SHOUT - 0.25, pan: 0.3 },
    { speak: 'owl', text: BUBBLES[3].lines.join(' '), at: SHOUT, pan: 0.3, vol: 1.3, pitch: 2 },
    { sfx: 'finale.strike', at: SHOUT, variant: 2, vol: 0.6 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
