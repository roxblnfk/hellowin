<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// FrankenPHP rises: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Opens on the last frame of 05.1 (circle): the silhouette already stands in the red column. The owl asks for a 6-6-6,
// a montage of rolls and abilities, NIH rolls it, the circle builds up, three strikes reveal FrankenPHP.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, PUMPKIN_SHADOW, bake, pumpkinLayers, pumpkinSprite, seedOf } from '/js/pixel/sprites.js';
import { ASH } from '/js/pixel/bonfire.js';
import { EMISSIVE, LIT_PALETTE, NIGHT, halo, paintSky, relightCanvas } from '/js/pixel/night.js';
import { SHOT_FX, characterFrame, randomLook } from '/js/pixel/characters.js';
import { OWL, glowing } from '/js/pixel/owl.js';
import { DICE, FRANKEN, SILHOUETTE, FX, FINALE_EMISSIVE, frankenHalo } from '/js/pixel/finale.js';
import { FLYERS } from '/js/pixel/flyers.js';
import { FART_SCALE, LAUNCH_COLORS, ZAP, ZAP_COLORS, pumpkinKind } from '/js/pixel/ability.js';
import { PUFFS, fartAt, fartCloud } from '/js/pixel/elephant.js';

const MEEP = 'Мип-мип!';            // finale-stage.js MEEP (ru); that module pulls in PixiJS

const W = 1920, H = 1080;
const o = document.getElementById('out').getContext('2d');
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. A line hangs while it types, then long enough to read it and 2–3 s more.
const OFF = 3.9;                    // 05.1 ends on this moment of the old opening: ambient motion continues from it
const say = (from, lines, cps, extra = {}) => {
    const n = lines.join('').length;
    return { from, lines, cps, to: from + n / cps + (extra.hold ?? Math.max(2.3, 1.2 + n / 25)), ...extra };
};
const B1 = say(0.6, ['Вот он!', 'Он возвращается!'], 16);
const B2 = say(B1.to + 0.3, ['Чтобы он восстал, нужна версия,', 'которой никогда не было…'], 20);
const B3 = say(B2.to + 0.3, ['Бросайте кости!', 'Нужно шесть-шесть-шесть!'], 20);
const MONT = B3.to + 0.15;          // the montage of rolls

const LOOK = {
    witch: { body: 'witch', cloak: 'cape', face: 'grin', eyes: 'green', hat: 'witch' },
    skel: { body: 'skeleton', cloak: 'none', face: 'smile', eyes: 'amber', hat: 'pumpkin' },
    mummy: { body: 'mummy', cloak: 'none', face: 'scared', eyes: 'blue', hat: 'top-hat' },
    scare: { body: 'scarecrow', cloak: 'poncho', face: 'stitches', eyes: 'violet', hat: 'horns' },
    vamp: { body: 'vampire', cloak: 'cape', face: 'fangs', eyes: 'red', hat: 'none' },
    nih: { body: 'cat', cloak: 'none', face: 'smile', eyes: 'green', hat: 'cat-ears' },
};
// kind, look, faces, length; hx — the feet on screen; flip — faces left; focal — the stage point behind (blurred).
const SHOTS = [
    { kind: 'pumpkin', look: LOOK.witch, faces: [1, 1, 1], dur: 1.55, hx: 760, dir: 'side', flip: false, focal: [-70, -14] },
    { kind: 'miss', look: LOOK.mummy, faces: [2, 5, 1], dur: 0.8, hx: 1180, dir: 'front', focal: [60, 10] },
    { kind: 'meep', look: LOOK.skel, faces: [3, 3, 3], dur: 1.55, hx: 820, dir: 'front', focal: [-30, 30] },
    { kind: 'miss', look: LOOK.scare, faces: [6, 6, 3], dur: 1.2, hx: 1000, dir: 'front', focal: [90, -10], tease: true },
    { kind: 'zap', look: LOOK.vamp, faces: [4, 4, 4], dur: 1.55, hx: 620, dir: 'side', flip: false, focal: [-90, 20] },
    { kind: 'flyers', look: LOOK.mummy, faces: [2, 2, 2], dur: 1.65, hx: 960, dir: 'front', focal: [20, -30] },
    { kind: 'miss', look: LOOK.skel, faces: [6, 3, 6], dur: 0.8, hx: 1120, dir: 'side', flip: true, focal: [-50, 0] },
    { kind: 'fart', look: LOOK.scare, faces: [5, 5, 5], dur: 1.95, hx: 760, dir: 'side', flip: true, focal: [70, 30] },
];
{ let at = MONT; SHOTS.forEach((s, k) => { s.at = at; s.k = k; at += s.dur; }); }
const SIX = SHOTS.at(-1).at + SHOTS.at(-1).dur;  // NIH rolls
const SIX_LAND = [1.45, 2.45, 3.5];              // from SIX: six… six… six
const SIX_WIN = SIX + SIX_LAND[2] + 0.4;         // the dice flare red, the silhouette's eyes flare
const SIX_END = SIX + 5.1;
const B4 = say(SIX_END + 0.3, ['NIH выбросил 6-6-6!', 'PHP 6 всё-таки вышел!'], 18);
const BUILD = B4.from + 1.8;        // the build-up: sparks, tremor, pebbles, worms, the circle pulsing
const STRIKE = BUILD + 9.2;         // the first of three lightning strikes
const NIGHT_AT = STRIKE + 0.78, REVEAL = STRIKE + 0.9;
const ROAR = [STRIKE + 2.9, STRIKE + 3.8];
const CUT = STRIKE + 4.0;           // to the owl's close-up
const C1 = say(CUT + 0.4, ['Что это?..', 'Это разве RoadRunner?!'], 18);
const C2 = say(C1.to + 0.25, ['Что мы…'], 7, { hold: 1.4 });
const SHOUT = C2.to + 0.15;
const C3 = say(SHOUT, ['ЧТО ВЫ', 'НАДЕЛАЛИ?'], 60, { hold: 3.5, shout: true });
const DURATION = C3.to + 0.2 + 2.0; // 2 s of calm at the end, the fade only in them
const A_LINES = [B1, B2, B3, B4];
// The circle's pulses on the build-up, closer and closer.
// The ground insert inside the build-up: low and close on the ash at the circle's edge — pebbles, worms.
const GROUND_SHOT = [B4.to + 0.15, B4.to + 3.25];
const inGround = (t) => t >= GROUND_SHOT[0] && t < GROUND_SHOT[1];
const PULSES = [1.0, 2.6, 3.9, 5.0, 5.9, 6.6, 7.2, 7.7, 8.1, 8.45, 8.75, 9.0].map((d) => BUILD + d);

const isMontage = (t) => t >= MONT && t < SIX;
const shotAt = (t) => SHOTS.findLast((s) => t >= s.at);

// ---------------------------------------------------------------------------------------------------------------
// The stage of the finale (as public/dev/finale.html stages it): 320 × 180 art px.
const UNLIT = new Set([...EMISSIVE, ...FINALE_EMISSIVE]);
const baked = new WeakMap();
function bakeF(sprite, lighting = 'day') {
    if (!baked.has(sprite)) baked.set(sprite, new Map());
    const per = baked.get(sprite);
    if (per.has(lighting)) return per.get(lighting);
    const [c, ctx] = canvas(sprite.w, sprite.h);
    const img = ctx.createImageData(sprite.w, sprite.h);
    for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
        const k = sprite.legend[sprite.rows[y][x]];
        if (!k) continue;
        const color = UNLIT.has(k) || lighting === 'day' ? PALETTE[k] : LIT_PALETTE[lighting][k];
        const i = (y * sprite.w + x) * 4;
        img.data[i] = (color >> 16) & 255; img.data[i + 1] = (color >> 8) & 255; img.data[i + 2] = color & 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    per.set(lighting, c);
    return c;
}
const light = (s) => bakeF(s, 'day');
const stamp = (ctx, c, def, x, y) => ctx.drawImage(c, Math.round(x - def.anchor.x), Math.round(y - def.anchor.y));
const stampFlip = (ctx, c, def, x, y) => { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -def.anchor.x - (def.w - 2 * def.anchor.x), Math.round(y - def.anchor.y)); ctx.restore(); };
const additive = (ctx, c, def, x, y, a) => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; stamp(ctx, c, def, x, y); ctx.restore(); };
const glowCache = new WeakMap();
const glow = (s) => glowCache.get(s) ?? glowCache.set(s, glowing(s)).get(s);
const litHex = (key, lighting) => hex(UNLIT.has(key) || lighting === 'day' ? PALETTE[key] : LIT_PALETTE[lighting][key]);

const MW = 320, MH = 180, HORIZON = 62;
const CENTRE = { x: 166, y: 124 };
const RING = [
    [-70, -18, 'm', 'pumpkin-1'], [-38, -30, 's', 'pumpkin-2'], [6, -34, 's', 'pumpkin-3'], [44, -28, 'm', 'pumpkin-5'],
    [78, -12, 's', 'pumpkin-6'], [96, 14, 'l', 'pumpkin-7'], [60, 38, 'm', 'pumpkin-8'], [14, 46, 'l', 'pumpkin-10'],
    [-34, 44, 'm', 'pumpkin-11'], [-80, 26, 'l', 'pumpkin-13'], [-100, 0, 's', 'pumpkin-14'],
];
const TREE_AT = { x: 34, y: 118 };
const PERCH = { x: TREE_AT.x - DECOR.tree.anchor.x + DECOR.tree.perch[0], y: TREE_AT.y - DECOR.tree.anchor.y + DECOR.tree.perch[1] };
const looks = Array.from({ length: 6 }, (_, i) => randomLook(((s) => () => ((s = (s * 16807) % 2147483647) / 2147483647))(41 + i * 13)));
const AROUND = [[-58, 8], [58, 8], [-34, 30], [34, 30], [0, 38], [-74, -10]];
const EDGES = [[-140, 40], [140, 36], [-120, 54], [124, 52], [40, 56], [-150, 0]];

const LAWN = (() => {
    const [c, ctx] = canvas(MW, MH);
    let seed = 9;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let x = 0; x < MW; x += DECOR.hills.w) ctx.drawImage(bake(DECOR.hills), x, HORIZON - DECOR.hills.h);
    for (let y = HORIZON; y < MH; y++) for (let x = 0; x < MW; x++) {
        const d = Math.hypot((x - CENTRE.x) / 132, (y - CENTRE.y + 4) / 52);
        let k;
        if (d < 0.9 || (d < 1 && (x + y) % 2 === 0)) {
            const lane = ((((x - CENTRE.x) / (y - HORIZON + 30)) * 9) % 1 + 1) % 1;
            k = lane < 0.2 ? 'soilDark' : lane < 0.3 ? 'soilLight' : 'soil';
        } else { const n = r(); k = n < 0.06 ? 'leafLight' : n < 0.18 ? 'leafDark' : 'leaf'; }
        ctx.fillStyle = hex(PALETTE[k]); ctx.fillRect(x, y, 1, 1);
    }
    stamp(ctx, bake(DECOR.tree), DECOR.tree, TREE_AT.x, TREE_AT.y);
    return c;
})();
const GROUND = { blood: relightCanvas(LAWN, 'blood'), night: relightCanvas(LAWN, 'night') };
const SKY = Object.fromEntries(['blood', 'night'].map((l) => {
    const [c, ctx] = canvas(MW, HORIZON + 1);
    paintSky(ctx, MW, HORIZON + 1, l, { seed: 5 });
    return [l, c];
}));

// How far the build-up has gone, 0–1; it ends on the strike.
const buildOf = (t) => (t < BUILD || t >= STRIKE + 0.3 ? (t >= STRIKE ? 1 : 0) : smooth(BUILD, STRIKE, t));
// The last pulse of the circle before t: its flash, 0–1, and how strong it was.
function pulseAt(t) {
    let best = 0;
    PULSES.forEach((p, k) => {
        const s = t - p;
        if (s >= 0 && s < 0.7 && t < STRIKE) best = Math.max(best, (1 - s / 0.7) ** 2 * (0.45 + 0.55 * (k / (PULSES.length - 1))));
    });
    return best;
}

function pumpkin(ctx, i, x, y, lighting, float, ms, t) {
    const [, , size, id] = RING[i];
    const L = pumpkinLayers(11, size, seedOf(id), 'violet');
    if (float > 0) { const sh = PUMPKIN_SHADOW[size][Math.min(2, Math.floor(float / 3))]; ctx.globalAlpha = 0.5; stamp(ctx, bake(sh), sh, x, y - 1); ctx.globalAlpha = 1; }
    const h = halo(size === 'l' ? 16 : 13, 5, 'violet');
    additive(ctx, light(h), h, x, y, 0.4);
    const at = (list, per) => list[frameAt(ms + i * 97, list.length, per)];
    const yy = y - float;
    if (L.auraFrames) stamp(ctx, light(at(L.auraFrames, 160)), L, x, yy);
    stamp(ctx, bakeF(L.layers.back, lighting), L, x, yy);
    if (L.glowFrames) stamp(ctx, light(at(L.glowFrames, 120)), L, x, yy);
    stamp(ctx, bakeF(L.layers.body, lighting), L, x, yy);
    stamp(ctx, bakeF(L.layers.rim, lighting), L, x, yy);
    if (L.layers.stem) stamp(ctx, bakeF(L.layers.stem, lighting), L, x, yy);
    if (L.fireFrames) stamp(ctx, light(at(L.fireFrames, 110)), L, x, yy);
    // The build-up: the pumpkins start to spark, more and more of them.
    const b = buildOf(t);
    if (b > 0 && t < STRIKE + 0.3) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let j = 0; j < 9; j++) {
            if (hash(i * 31 + j) > b * 1.15 - 0.05) continue;
            const per = 0.45 + hash(i * 7 + j * 3) * 0.4;
            const ph = (t / per + hash(i + j * 11)) % 1;
            const cyc = Math.floor(t / per + hash(i + j * 11));
            const sx = Math.round(x + (hash(i * 13 + j + cyc * 7) - 0.5) * 16);
            const sy = Math.round(yy - 4 - hash(i * 5 + j + cyc) * 8 - ph * 12);
            const key = ph < 0.25 ? 'white' : ph < 0.55 ? 'pumpkinShine' : ph < 0.8 ? 'flameCore' : 'ember';
            ctx.fillStyle = hex(PALETTE[key]);
            ctx.fillRect(sx, sy, 1, 1);
            if (ph < 0.2) { ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3); }
        }
        ctx.restore();
    }
}
const relit = new Map();
function relitOf(c, lighting) {
    if (!relit.has(c)) relit.set(c, new Map());
    const per = relit.get(c);
    if (!per.has(lighting)) per.set(lighting, relightCanvas(c, lighting));
    return per.get(lighting);
}
function walker(ctx, i, x, y, lighting, pose, ms) {
    const dx = CENTRE.x - x;
    const dir = Math.abs(dx) < 20 ? 'back' : 'side';
    const f = characterFrame(looks[i], { dir, pose, frame: frameAt(ms + i * 170, pose === 'ritual' ? 4 : 2, pose === 'ritual' ? 380 : 600) });
    const draw = (c) => {
        if (dir === 'side' && dx < 0) { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -f.anchor.x, Math.round(y - f.anchor.y)); ctx.restore(); }
        else ctx.drawImage(c, Math.round(x - f.anchor.x), Math.round(y - f.anchor.y));
    };
    draw(relitOf(f.canvas, lighting));
    if (f.glow) draw(f.glow);
}

function figureAt(t) {
    const ms = (t + OFF) * 1000;
    if (t < STRIKE) return (t >= SIX_WIN ? SILHOUETTE.eyes : SILHOUETTE.idle)[frameAt(ms, 2, 500)];
    if (t < REVEAL) return SILHOUETTE.idle[frameAt(ms, 2, 500)];
    if (t < REVEAL + 0.45) return SILHOUETTE.reveal[Math.floor((t - REVEAL) / 0.15)];
    if (t >= ROAR[0] && t < ROAR[1]) return FRANKEN.talk[2];
    const s = ms % 2400;
    if (s > 2000 && s < 2270) return FRANKEN.spark[Math.floor((s - 2000) / 90)];
    return FRANKEN.idle[frameAt(ms, 2, 700)];
}
const lightingAt = (t) => (t < NIGHT_AT ? 'blood' : 'night');

// The silhouette spreads its crest on the build-up: strands fan out of the top of its head, dark with a red rim.
const crestCache = new Map();
function crestTop(fig) {
    if (crestCache.has(fig)) return crestCache.get(fig);
    const c = bakeF(fig, 'blood');
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let top = null;
    for (let y = 0; y < c.height && !top; y++) {
        const xs = [];
        for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3]) xs.push(x);
        if (xs.length) top = { x: Math.round((xs[0] + xs.at(-1)) / 2) - fig.anchor.x, y: y - fig.anchor.y };
    }
    crestCache.set(fig, top);
    return top;
}
// [angle, length]: up and back over its shoulder (it faces left), the middle ones longest
const STRANDS = [[-1.55, 0.7], [-1.2, 1.05], [-0.88, 1.2], [-0.58, 1], [-0.3, 0.7]];
function crest(ctx, fig, x, y, spread, t) {
    if (spread <= 0) return;
    const top = crestTop(fig);
    if (!top) return;
    const bx = x + top.x + 9, by = y + top.y + 7;
    STRANDS.forEach(([a0, len], k) => {
        const a = a0 + Math.sin(t * 3 + k) * 0.05 * spread;
        const n = Math.round(len * 18 * spread);
        for (let s = 0; s < n; s++) {
            const bend = (s / 18) ** 2 * 0.7;
            const px = Math.round(bx + Math.cos(a + bend) * s), py = Math.round(by + Math.sin(a + bend) * s);
            ctx.fillStyle = hex(PALETTE[s >= n - 2 ? 'columnCore' : 'rune']); ctx.fillRect(px - 1, py - 1, s < n - 4 ? 3 : 2, 1);
            ctx.fillStyle = '#100810'; ctx.fillRect(px - 1, py, s < n - 4 ? 3 : 2, s < n - 6 ? 2 : 1);
        }
    });
}

// Pebbles lifting off the trembling ground and hanging in the air; they drop on the strike.
const PEBBLES = Array.from({ length: 46 }, (_, k) => {
    const a = hash(k + 500) * Math.PI * 2, r = 0.3 + 0.75 * Math.sqrt(hash(k + 600));
    // half of them on the patch of ground the insert looks at
    const near = k % 2 === 0;
    const x = near ? CENTRE.x - 80 + hash(k + 510) * 100 : CENTRE.x + Math.cos(a) * 120 * r;
    const y = near ? CENTRE.y + hash(k + 520) * 36 : CENTRE.y + 4 + Math.sin(a) * 46 * r;
    return { x, y, at: GROUND_SHOT[0] - 0.4 + hash(k + 700) * 5.5, h: 6 + hash(k + 800) * 22, key: ['soilLight', 'ashLight', 'soilDark', 'ashLight'][k % 4], big: hash(k + 900) < 0.4 };
});
function pebble(ctx, p, k, t, lighting) {
    const up = t < STRIKE ? smooth(p.at, p.at + 0.9, t) : 1 - smooth(STRIKE, STRIKE + 0.25, t);
    if (up <= 0) return;
    const lift = Math.round(up * p.h + (t < STRIKE ? Math.sin(t * 2.2 + k) * 1.2 * up : 0));
    ctx.globalAlpha = 0.45 * up; ctx.fillStyle = '#080406'; ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y), 3, 1); ctx.globalAlpha = 1;
    // a tremble before it goes up
    const jit = t < p.at + 0.2 && t > p.at - 0.6 ? (hash(Math.floor(t * 30) + k) < 0.5 ? -1 : 1) : 0;
    // a stone: its own colour on top, lit red from below by the circle, a dark outline
    const n = p.big ? 3 : 2, X = Math.round(p.x) + jit, Y = Math.round(p.y) - lift - n;
    ctx.fillStyle = OUTL; ctx.fillRect(X - 1, Y, n + 2, n); ctx.fillRect(X, Y - 1, n, n + 2);
    ctx.fillStyle = litHex(p.key, lighting); ctx.fillRect(X, Y, n, n);
    ctx.fillStyle = hex(PALETTE[lighting === 'blood' ? 'rune' : 'frankenGlow']); ctx.fillRect(X, Y + n - 1, n, 1);
}

// Worms crawling out of the ash, more and more of them.
const WORM = FLYERS.worm[2] ?? FLYERS.worm;
const WORMS = Array.from({ length: 15 }, (_, k) => {
    // in front of the circle, out of the ash round it, across the ground the camera looks down on
    const x = CENTRE.x - 78 + hash(k + 40) * 96, y = CENTRE.y + 4 + hash(k + 50) * 30;
    return { x, y, at: GROUND_SHOT[0] + 0.3 + 5.4 * (k / 15) ** 0.9 + hash(k + 60) * 0.25, dir: hash(k + 70) < 0.5 ? -1 : 1 };
});
function worm(ctx, w, k, t, lighting) {
    const s = t - w.at;
    if (s < 0) return;
    let def, x = w.x;
    if (s < 0.42) def = WORM.emerge[Math.min(2, Math.floor(s / 0.14))];
    else { def = WORM.fly[frameAt((s - 0.42) * 1000 + k * 90, 4, 170)]; x += w.dir * Math.floor((s - 0.42) * 3); }
    (w.dir < 0 ? stampFlip : stamp)(ctx, bakeF(def, lighting), def, x, w.y);
}

// The stage, sky left transparent (the sky is its own layer).
const [stage, sx] = canvas(MW, MH);
function drawStage(t, { owl = true } = {}) {
    const ms = (t + OFF) * 1000;
    const lighting = lightingAt(t);
    const b = buildOf(t);
    sx.clearRect(0, 0, MW, MH);
    sx.drawImage(GROUND[lighting], 0, HORIZON - DECOR.hills.h, MW, MH - HORIZON + DECOR.hills.h, 0, HORIZON - DECOR.hills.h, MW, MH - HORIZON + DECOR.hills.h);
    const items = [];
    items.push({ y: CENTRE.y - 6, draw: () => {
        stamp(sx, bakeF(ASH.pit, lighting), ASH.pit, CENTRE.x, CENTRE.y);
        stamp(sx, light(ASH.circle[7]), ASH.circle[7], CENTRE.x, CENTRE.y);
        // the circle fills with light and pulses
        if (t < STRIKE + 0.3) {
            const fill = b * (0.35 + 0.15 * Math.sin(t * (4 + 8 * b))) + pulseAt(t) * 0.9;
            if (fill > 0) {
                additive(sx, light(ASH.circle[7]), ASH.circle[7], CENTRE.x, CENTRE.y, clamp(fill));
                const hh = halo(60, 20, 'warm');
                additive(sx, light(hh), hh, CENTRE.x, CENTRE.y + 2, clamp(fill * 0.5));

// The puff a walker turns into a pumpkin in: smoke blown out all round from its middle, a pop of light (scene.js poof).

// The vampire's lightning into a bat: the bat flaps up there, a jagged bolt from the raised hand (FX.chain in the
// finale's lightning colours, three shapes, thinning to ZAP.end), the bat struck, tumbling down.
function zapShot(h, hx, s, sh) {
    const bat = FLYERS.bat[2] ?? FLYERS.bat;

    const hitS = s - A0;

    else { const f = hitS - 0.22; def = bat.fall[Math.floor(f / 0.1) % 2]; bx += f * 10; by += 40 * f * f + 8 * f; }
    o.drawImage(light(def), Math.round(hx + (bx - def.anchor.x) * HS), Math.round(FEET + (by - def.anchor.y) * HS), def.w * HS, def.h * HS);
    if (hitS < 0 || hitS * 1000 >= ZAP.end) return;
    const m = h.f.muzzle ? { x: h.f.muzzle[0] - h.f.anchor.x, y: h.f.muzzle[1] - h.f.anchor.y } : { x: 6, y: -22 };
    const from = { x: m.x, y: m.y }, to = { x: Math.round(home.x), y: Math.round(home.y) - 4 };
    const ms = hitS * 1000;
    const kk = Math.min(3, Math.floor(ms / ZAP.frame));

    const { core, edge } = FX.chain(from, to, 7 + Math.min(2, kk));
    const px = (x, y, c) => { o.fillStyle = c; o.fillRect(Math.round(hx + x * HS), Math.round(FEET + y * HS), HS, HS); };
    if (kk < 3) {

        for (const [x, y] of core) px(x, y + 1, hex(PALETTE[ZAP_COLORS[1]]));
    }
    core.forEach(([x, y], i) => (fadeStep === 0 || i % (fadeStep + 1) === 0) && px(x, y, hex(PALETTE[kk < 3 ? ZAP_COLORS[0] : ZAP_COLORS[1]])));

        const x = to.x + Math.cos(a) * v * q, y = to.y + (Math.sin(a) * v - 10) * q + 25 * q * q;

}

// A flock bursting out from under the mummy's feet, cool sparks thrown up from its hands.
const FLOCK = ['bat', 'crow', 'duck', 'bat', 'crow', 'duck', 'bat'].map((kind, i) => ({ kind, vx: (i - 3) * 16 + (hash(i + 20) - 0.5) * 10, vy: -50 - hash(i + 30) * 30, d: hash(i + 40) * 0.12 }));

    const perch = { x: 1390 + k * 6, y: 900 };
    for (let x = 900; x < W + 300; x += OWL_S / 2) {
        const yy = perch.y + Math.round(((x - perch.x) * 0.08) / (OWL_S / 2)) * (OWL_S / 2);
        o.fillStyle = '#1a1018'; o.fillRect(x, yy, OWL_S / 2, OWL_S * 1.6);
        o.fillStyle = '#3a2a2c'; o.fillRect(x, yy, OWL_S / 2, OWL_S / 2);
    }
    const f = owlFrameC(t);
    const oc = bakeF(glow(f), 'night');
    o.drawImage(oc, perch.x - f.anchor.x * OWL_S, perch.y - f.anchor.y * OWL_S, f.w * OWL_S, f.h * OWL_S);
    o.restore();
    const v = o.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.75)');
    o.fillStyle = v; o.fillRect(0, 0, W, H);
    // red pulse on the shout
    if (t >= SHOUT) { o.fillStyle = `rgba(255,30,40,${0.18 * (1 - smooth(SHOUT, SHOUT + 0.6, t)) + 0.05 * (Math.sin(t * 9) + 1) / 2 * (1 - smooth(C3.to, C3.to + 1, t))})`; o.fillRect(0, 0, W, H); }
    const head = { x: W / 2 + (perch.x - W / 2) * zoom + sh.x - 80, y: H / 2 + (perch.y - 15 * OWL_S - H / 2) * zoom + sh.y };
    bubble(C1, t, head, (bw) => ({ bx: head.x - bw - 120, by: 120 }));
    bubble(C2, t, head, (bw) => ({ bx: head.x - bw - 120, by: 120 }));
    bubble(C3, t, { x: 0, y: 0 }, (bw) => ({ bx: W * 0.37 - bw / 2, by: 190 }));
}

// ---------------------------------------------------------------------------------------------------------------
function draw(t) {
    if (t >= CUT) shotC(t);
    else if (isMontage(t)) shotMontage(t);
    else if (t >= SIX && t < SIX_END) shotSix(t);
    else if (inGround(t)) shotGround(t);
    else shotA(t);
    // a white frame on the cut, fades
    if (t >= CUT && t < CUT + 0.12) { o.fillStyle = `rgba(255,255,255,${1 - (t - CUT) / 0.12})`; o.fillRect(0, 0, W, H); }
    const black = smooth(DURATION - 2, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// Sound cues (sound.mjs): the game's own synth.
const panX = (x) => clamp((x / W - 0.5) * 1.4, -0.8, 0.8);
const montageCues = SHOTS.flatMap((sh) => {
    const p = panX(sh.hx), at = sh.at;
    const land = sh.tease ? 0.82 : 0.56;
    const cues = [
        { sfx: 'dice.roll', at: at + 0.02, variant: sh.k % 4, pan: p, vol: 1.2 },
        { sfx: 'dice.land', at: at + land - 0.1, variant: sh.k % 3, pan: p, vol: 1.2 },
    ];
    const a = at + A0;
    if (sh.kind === 'pumpkin') cues.push({ sfx: 'pumpkin.stage', at: a, variant: 1, pan: p }, { sfx: 'bush.rustle', at: a, pitch: 5, vol: 0.7, pan: p });
    if (sh.kind === 'meep') cues.push({ sfx: 'rr.meep', at: a + 0.03, pan: p, vol: 1.3 });
    if (sh.kind === 'zap') cues.push({ sfx: 'bat.squeak', at: at + 0.15, pan: 0.3 }, { sfx: 'ability.zap', at: a, pan: p }, { sfx: 'flyer.hit', at: a + 0.05, pan: 0.3 }, { sfx: 'bat.squeak', at: a + 0.08, pan: 0.3, pitch: 3 }, { sfx: 'flyer.fall', at: a + 0.2, pan: 0.3 });
    if (sh.kind === 'flyers') cues.push({ sfx: 'bat.squeak', at: a + 0.05, pan: -0.3 }, { sfx: 'crow.caw', at: a + 0.15, pan: 0.4, vol: 0.8 }, { sfx: 'duck.quack', at: a + 0.25, pan: -0.5 }, { sfx: 'bat.squeak', at: a + 0.35, pan: 0.5 }, { sfx: 'duck.quack', at: a + 0.5, pan: 0.6, variant: 2 });
    if (sh.kind === 'fart') cues.push({ sfx: 'elephant.fart', at: a, pan: p, pitch: 3 });
    if (sh.tease) cues.push({ sfx: 'word.fail', at: at + land + 0.02, vol: 0.7, pan: p });
    return cues;
});
window.SOUND = [
    { music: 'rise', from: 0, to: SIX + SIX_LAND[0] - 0.3, intensity: [[0, 1], [MONT, 0.75], [SIX, 0.45]], fadeIn: 0.15, fadeOut: 1.1 },
    { music: 'rise', from: SIX_END - 0.2, to: CUT, intensity: [[SIX_END, 0.1], [BUILD, 0.2], [STRIKE - 1.5, 1], [STRIKE, 1], [NIGHT_AT, 0.1]], fadeIn: 3, fadeOut: 0.05 },
    { music: 'rise', from: CUT, to: DURATION, intensity: [[CUT, 0.1], [SHOUT, 0.1], [SHOUT + 0.4, 1]], fadeIn: 0.3, fadeOut: 2 },
    { sfx: 'owl.hoot', at: 0.02, pan: -0.6, vol: 0.8 },
    ...A_LINES.map((b) => ({ speak: 'owl', text: b.lines.join(' '), at: b.from, pan: -0.6 })),
    ...montageCues,
    // NIH: the slow roll; each six lands on a deep bass hit, harder each time; then silence
    { sfx: 'dice.roll', at: SIX + 0.1, variant: 0, pitch: -5, vol: 1.1 },
    { sfx: 'dice.roll', at: SIX + 1.55, variant: 1, pitch: -6, vol: 0.8 },
    ...SIX_LAND.map((l, i) => ({ sfx: 'dice.land', at: SIX + l - 0.02, variant: i, pitch: -4, vol: 1.1 })),
    ...SIX_LAND.map((l, i) => ({ sfx: 'bonfire.explode', at: SIX + l, pitch: -7 - i, vol: [0.32, 0.5, 0.85][i] })),
    // the build-up: the hum and the riser, the circle's pulses, worms, the sparks' tinkle, the ground's crackle
    { sfx: 'finale.wake', at: BUILD, vol: 0.7, pitch: -2 },
    { sfx: 'finale.wake', at: BUILD + 4.6, vol: 1 },
    ...PULSES.map((at, k) => ({ sfx: 'circle.stage', at, variant: k % 3, vol: 0.35 + 0.55 * (k / (PULSES.length - 1)), pitch: Math.floor(k / 4) })),
    ...GWORM.map((w, k) => ({ sfx: 'worm.squelch', at: w.at, variant: k % 4, vol: 0.6, pan: clamp((w.x - G_FX) / 60, -1, 1) * 0.6 })),
    ...[0.2, 0.9, 1.7, 2.4].map((d, k) => ({ sfx: 'bonfire.click', at: GROUND_SHOT[0] + d, variant: k, vol: 0.5, pitch: -5 })),
    ...[0, 1, 2, 3, 4, 5, 6, 7].map((k) => ({ sfx: 'pumpkin.enchant', at: BUILD + 1.2 + k * 0.95, variant: k % 5, vol: 0.4 + k * 0.04, pan: (hash(k) - 0.5) })),
    ...[2.4, 4.4, 6.1, 7.4, 8.4].map((d, k) => ({ sfx: 'bonfire.stage', at: BUILD + d, variant: k % 3, vol: 0.5 + k * 0.1 })),
    ...[0, 1, 2].map((k) => ({ sfx: 'finale.strike', at: STRIKE + k * 0.38, variant: k })),
    { sfx: 'finale.tada', at: REVEAL },
    { speak: 'franken', text: 'Гррррр-хррррр-мммм!', at: ROAR[0], vol: 1.6, pitch: -3 },
    { speak: 'owl', text: C1.lines.join(' '), at: C1.from, pan: 0.3 },
    { speak: 'owl', text: C2.lines.join(' '), at: C2.from, pan: 0.3, pitch: -1 },
    { sfx: 'owl.hoot', at: SHOUT - 0.25, pan: 0.3 },
    { speak: 'owl', text: C3.lines.join(' '), at: SHOUT, pan: 0.3, vol: 1.3, pitch: 2 },
    { sfx: 'finale.strike', at: SHOUT, variant: 2, vol: 0.6 },
];
window.DURATION = DURATION;
window.T = { B1, B2, B3, MONT, SHOTS: SHOTS.map((s) => [s.kind, s.faces.join('-'), +s.at.toFixed(2)]), SIX, SIX_LAND, SIX_WIN, SIX_END, B4, BUILD, STRIKE, REVEAL, CUT, C1, C2, SHOUT, C3, DURATION };
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 0));
document.title = 'ready';
</script>
