<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// The prologue: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// Evening, the bar still empty and dim: the owl slowly wipes a mug behind the counter, the hooded necromancer sits in
// the gloom at the counter's left end. The owl thinks (thought clouds, never aloud) that RoadRunner is said to be dead,
// glances at his dusty mug, sighs. The door creaks: the heroes come in one after another, the bar fills, warms and
// gets loud, and the necromancer's place is empty. The owl perks up, decides to raise RoadRunner, pours, the mugs
// slide down the counter, everyone drinks; a sly squint, «…маны. Ух-ху.», and the frame settles on bar-intro's opening.
import { DEFAULT_BAR_LAYOUT as layout, BAR_FLICKER_MS, BAR_MUG, DOOR_OPEN, barDoor, barLights, barOwlSpot, barProps, bakeBar, paintBar } from '/js/pixel/bar.js';
import { OWL, OWL_BAR, pourFrame } from '/js/pixel/owl.js';
import { characterFrame } from '/js/pixel/characters.js';
import { halo, relightCanvas } from '/js/pixel/night.js';
import { bake } from '/js/pixel/sprites.js';
import { PALETTE } from '/js/pixel/palette.js';
import { FLYERS } from '/js/pixel/flyers.js';

const W = 1920, H = 1080, lit = 'firelight';
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. Thoughts type slower than spoken lines, wait on every «…», and stay up 2.6 s after the last
// letter.
const PRE = 2, POST = 2;
const CPS = 13, ELL = 0.55, HOLD = 2.6;
function typing(lines, ell) {
    const text = lines.join(' ');
    const at = [];
    let s = 0;
    for (const ch of text) { at.push(s); s += 1 / CPS + (ch === '…' ? ell : 0); }
    return { text, at, dur: s };
}
const THOUGHTS = [];
let cursor = PRE + 4.0;
function think(lines, gap, ell = ELL) {
    const b = { lines, from: cursor, ...typing(lines, ell) };
    b.to = b.from + b.dur + HOLD;
    THOUGHTS.push(b);
    cursor = b.to + gap;
    return b;
}
const T0 = think(['Ходит молва…', 'будто RoadRunner мёртв.'], 1.4);
const T1 = think(['Может, и правда мёртв…', 'Давно его не было в баре…'], 0.5);
const T2 = think(['Печально, конечно…'], 0);
const WIPE_END = T0.to + 0.2;                 // the owl stops wiping and lowers its eyes
const DOOR = T2.to + 0.3;                     // the creak
// The necromancer gets up and slips away to the right into the dark while the door creaks; his eyes go out last.
const LEAVE = [DOOR + 0.25, DOOR + 2.0];
const HALL = DOOR + 2.9;                      // → the hall: the door already open, the heroes coming in
const OPEN = DOOR + 0.05;
const ENTER = Array.from({ length: 6 }, (_, i) => HALL + 0.3 + i * 0.8);
const SPOT = ENTER[5] + 1.7;                  // → the necromancer's place, empty
const PERK = SPOT + 2.4;                      // the owl perks up
cursor = PERK + 0.7;
const T3 = think(['Но сегодня Хэллоуин,', 'и в баре полно авантюристов…'], 0.4);
const T4 = think(['Так почему бы не попробовать', 'его воскресить?'], 0);
const POUR = [T4.to - 0.5, T4.to + 1.7];
const SLIDE0 = POUR[1] + 0.36, SLIDE_GAP = 0.3;
const SQUINT_GAP = 0.2;
// filled below, once the mug slots are known
let TOAST, CLINK, DRINK, SQUINT, T5, HOOT, PULL, DURATION;

// ---------------------------------------------------------------------------------------------------------------
// The counter plane (bar-intro.html): art scale M, margins MG for the camera.
const M = 14, MG = 12;
const aw = Math.ceil(W / M) + 2 * MG, ah = Math.ceil(H / M) + 2 * MG;
const top = MG + Math.round((H / M) * 0.6);
const ax = (f) => MG + Math.round((W / M) * f);
const owlA = { x: ax(0.6), y: top + 3 };
const tap = { x: owlA.x + OWL_BAR.tap.x, y: owlA.y + OWL_BAR.tap.y };
const owlMug = { x: owlA.x + OWL_BAR.mug.x, y: owlA.y + OWL_BAR.mug.y };
const setMug = { x: owlA.x - 6, y: top + 2 };
const toWorld = (p) => ({ x: (p.x - MG) * M, y: (p.y - MG) * M });

// bar-intro's counter mugs; slot 1 is RoadRunner's dusty mug, the others slide out farthest first.
const SLOTS = [];
for (let x = owlA.x - 14, i = 0; x > MG - 6; x -= 10, i++) SLOTS.push({ i, x, y: top + 2 + (i % 2), fx: x + (hash(i) < 0.5 ? -4 : 4), spill: i % 3 !== 2 });
const RR_MUG = SLOTS[1];
const SLIDERS = SLOTS.filter((s) => s !== RR_MUG).sort((a, b) => a.x - b.x).map((s, k) => {
    const at = SLIDE0 + k * SLIDE_GAP;
    const dur = 0.3 + (setMug.x - s.x) / 110;
    return { ...s, at, dur, arrive: at + dur };
});
TOAST = SLIDERS.at(-1).arrive + 0.25;

cursor = SQUINT + 0.5;

// The counter, the keg and its tap (bar-intro.html).
const [base, bx] = canvas(aw, ah);
{
    const P = (x, y, k) => { bx.fillStyle = hex(PALETTE[k]); bx.fillRect(x, y, 1, 1); };
    for (let y = top + 3; y < ah; y++) for (let x = 0; x < aw; x++) {

        if (y === top + 3) k = 'outline';
        if (y === top + 4) k = 'timberDark';
        if (y === top + 9) k = 'ironLight';
        if (y === top + 10) k = 'iron';
        P(x, y, k);
    }
    for (let x = 0; x < aw; x++) { P(x, top, 'outline'); P(x, top + 1, x % 9 === 4 ? 'timberShine' : 'timberLight'); P(x, top + 2, 'timberLight'); }
    const keg = { x1: tap.x + 3, x2: tap.x + 15, y2: top, y1: top - 13 };
    for (let y = keg.y1; y < keg.y2; y++) for (let x = keg.x1; x <= keg.x2; x++) {
        const edge = x === keg.x1 || x === keg.x2 || y === keg.y1;
        const band = y === keg.y1 + 2 || y === keg.y2 - 3;
        const b = (x - keg.x1) / (keg.x2 - keg.x1);
        P(x, y, edge ? 'outline' : band ? (x % 3 ? 'iron' : 'ironLight') : b < 0.3 ? 'plankLight' : b > 0.8 ? 'plankDark' : 'plank');
    }
    for (let x = tap.x; x < keg.x1; x++) { P(x, tap.y - 1, 'outline'); P(x, tap.y, 'ironLight'); P(x, tap.y + 1, 'outline'); }
    P(tap.x + 1, tap.y - 2, 'ironLight'); P(tap.x + 1, tap.y - 3, 'ironLight'); P(tap.x + 1, tap.y - 4, 'outline');
}
const litBase = relightCanvas(base, lit);
const [counterEdge, cex] = canvas(aw, 3);
cex.drawImage(litBase, 0, top, aw, 3, 0, 0, aw, 3);
const barBakes = new Map();
const barBake = (def) => barBakes.get(def) ?? barBakes.set(def, bakeBar(def, lit)).get(def);
const mugC = bakeBar(BAR_MUG, lit);

// ---------------------------------------------------------------------------------------------------------------
// The owl behind the counter. OWL_BAR has no wiping, no lowered eyes and no squint: these frames are built here the way

const EYE_ROWS = {
    sad: { 5: 'OFDDDFMFDDDFO', 6: 'OFEEEFbFEEEFO', 7: 'OFEKEFbFEKEFO' },     // lids half down, looking at the counter

function withEyes(owl, rows) {

}
const BAR_W = 30, BAR_H = 22, BAR_TOP = BAR_H - OWL.idle[0].h, MUG_X = 19, MUG_Y = 12;
const EMPTY_MUG = ['.....', 'g...g', 'g...g', 'g...g', 'g...g', 'ggggg'];

    [16, 14, 'O'], [17, 14, 'O'], [18, 14, 'O'],
    [15, 15, 'D'], [16, 15, 'L'], [17, 15, 'L'], [18, 15, 'L'],
    [15, 16, 'D'], [16, 16, 'M'], [17, 16, 'M'], [18, 16, 'D'],
    [16, 17, 'O'], [17, 17, 'O'], [18, 17, 'O'],

// The rag going round the glass: [dx, dy] of its top left over the mug, three steps of a slow circle.

function owlWith(owl, { mug = true, rag = null } = {}) {
    const grid = Array.from({ length: BAR_H }, () => Array(BAR_W).fill('.'));
    owl.rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') grid[y + BAR_TOP][x] = ch; }));
    if (mug) {
        const own = new Set();
        EMPTY_MUG.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { grid[MUG_Y + y][MUG_X + x] = ch; own.add(`${MUG_X + x},${MUG_Y + y}`); } }));
        for (let y = MUG_Y - 1; y <= MUG_Y + EMPTY_MUG.length; y++) for (let x = MUG_X - 1; x <= MUG_X + 5; x++) {
            if (own.has(`${x},${y}`) || grid[y][x] !== '.') continue;
            if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => own.has(`${x + a},${y + b}`))) grid[y][x] = 'O';
            else if (x > MUG_X - 1 && x < MUG_X + 5 && y >= MUG_Y + 1 && y < MUG_Y + EMPTY_MUG.length) grid[y][x] = 'O';
        }
        for (const [x, y, ch] of HOLD_WING) grid[y][x] = ch;
        if (rag) {
            const [dx, dy] = rag;
            ['Owwc', 'wwcc', 'Ocaa'].forEach((r, y) => [...r].forEach((ch, x) => { grid[MUG_Y + dy + y - 1][MUG_X + dx + x] = ch; }));

const memo = new Map();
const owlOf = (key, make) => memo.get(key) ?? memo.set(key, make()).get(key);
const OWLS = {
    idleMug: (k) => owlOf(`im${k}`, () => owlWith(OWL.idle[k])),
    blinkMug: () => owlOf('bm', () => owlWith(OWL.blink)),
    wipe: (k, r) => owlOf(`w${k}${r}`, () => owlWith(OWL.idle[k], { rag: RAG[r] })),
    sadMug: (k) => owlOf(`s${k}`, () => owlWith(withEyes(OWL.idle[k], EYE_ROWS.sad))),
    turnMug: (k) => owlOf(`t${k}`, () => owlWith(OWL.turnLeft[k])),
    hootMug: () => owlOf('h', () => owlWith(OWL.hoot)),
    wideMug: () => owlOf('wd', () => owlWith(OWL.beak[2])),
    squint: (k) => owlOf(`q${k}`, () => owlWith(withEyes(OWL.idle[k], EYE_ROWS.squint), { mug: false })),
    hoot: () => owlOf('ho', () => owlWith(OWL.hoot, { mug: false })),
};
const blinkAt = (t, per = 3.3) => (t % per) < 0.13;
function owlFrame(t) {
    const k = Math.floor(t / 0.7) % 2;
    if (t < WIPE_END) {
        if (blinkAt(t)) return OWLS.blinkMug();
        return OWLS.wipe(k, Math.floor(t / 0.42) % RAG.length);
    }
    if (t < DOOR + 0.15) return blinkAt(t, 4.1) ? OWLS.blinkMug() : OWLS.sadMug(k);
    if (t < SPOT) return t < DOOR + 0.3 ? OWLS.turnMug(0) : OWLS.turnMug(1);
    if (t < PERK) return blinkAt(t) ? OWLS.blinkMug() : OWLS.sadMug(k);
    if (t < PERK + 0.45) return OWLS.hootMug();
    if (t < POUR[0]) return blinkAt(t) ? OWLS.blinkMug() : t < PERK + 1.6 ? OWLS.wideMug() : OWLS.idleMug(k);
    if (t < POUR[1]) return pourFrame((t - POUR[0]) / (POUR[1] - POUR[0]));
    // the first mug set down, then a push of the wing for each next one
    if (t < POUR[1] + 0.18) return OWL_BAR.set[0];
    if (t < SLIDE0) return OWL_BAR.set[1];
    for (const s of SLIDERS.slice(1)) if (t >= s.at - 0.2 && t < s.at + 0.06) return OWL_BAR.talk[2];
    if (t < SLIDERS.at(-1).at + 0.3) return OWL_BAR.idle[k];
    if (t >= CLINK - 0.2 && t < CLINK + 0.8) return OWL_BAR.talk[2];
    if (t >= SQUINT && t < PULL[1] - 0.3) {
        if (t >= HOOT - 0.05 && t < HOOT + 0.5) return OWLS.hoot();

// ---------------------------------------------------------------------------------------------------------------
// The necromancer (nightfall.html's drawing): a hooded figure on a stool at the counter's left end, turned to the
// owl, nothing in the hood but two green eyes; a bony hand round his mug. Gone once the bar fills.
const NECRO_LEGEND = { O: 'outline', K: 'crowDark', k: 'crow', h: 'crowLight', L: 'paleShade', v: 'violetDark', X: 'eyeBlack', G: 'eyeGreen', g: 'eerieMid' };
const NECRO = (() => {
    const w = 34, h = 62;
    const g = Array.from({ length: h }, () => Array(w).fill('.'));
    const hood = { cx: 15, cy: 13, rx: 10, ry: 11 };
    const inHood = (x, y) => (((x - hood.cx) / hood.rx) ** 2 + ((y - hood.cy) / hood.ry) ** 2 <= 1)
        || (y >= 0 && y < 9 && x >= 4 + y * 0.2 && x <= 13 - (8 - y) * 0.15 && (x - 4) > (8 - y) * 0.9);
    const robe = (x, y) => {
        if (y < 18) return false;
        const k = (y - 18) / (h - 18);
        return x >= lerp(6, 0, Math.min(1, k * 1.6)) && x <= lerp(27, 33, Math.min(1, k * 1.4));
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (inHood(x, y) || robe(x, y)) g[y][x] = 'k';
    for (let y = 0; y < h; y++) {
        const xs = g[y].flatMap((ch, x) => (ch !== '.' ? [x] : []));
        if (!xs.length) continue;
        const l = xs[0], r = xs[xs.length - 1];
        for (const x of xs) {
            const f = (x - l) / Math.max(1, r - l);
            g[y][x] = x === r ? 'L' : f > 0.8 ? 'h' : f < 0.3 ? 'K' : 'k';
            if (y > 22 && (x === 11 || x === 18 || x === 24) && (y + x) % 5 !== 0 && f <= 0.8) g[y][x] = f < 0.5 ? 'v' : 'K';
        }
    }
    const op = { cx: 21, cy: 15, rx: 4.6, ry: 6.5 };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (((x - op.cx) / op.rx) ** 2 + ((y - op.cy) / op.ry) ** 2 <= 1 && g[y][x] !== '.') g[y][x] = 'X';
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (g[y][x] !== 'X') continue;
        if (g[y - 1]?.[x] !== 'X' && g[y - 1]?.[x] !== undefined && g[y - 1][x] !== '.') g[y - 1][x] = 'h';

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (g[y][x] !== '.') continue;

    }

})();
const NECRO_AT = { x: ax(0.13), y: ah + 4 };
const HAND = { w: 9, h: 5, rows: ['OOO..OOO.', 'KkhOPPPPO', 'KkhOpPpPO', 'OOOOPpPpO', '...OOOOO.'], legend: { '.': null, O: 'outline', P: 'pale', p: 'paleShade', K: 'crowDark', k: 'crow', h: 'crowLight' }, anchor: { x: 8, y: 4 } };
const NECRO_MUG = { x: NECRO_AT.x - NECRO.anchor.x + 34, y: top + 2 };
const necroHere = (t) => t < LEAVE[1] + 0.8;
// Where he is while he leaves: up off the stool, then gliding right, fading into the gloom (the eyes last).
const necroOff = (t) => ({ x: Math.round(14 * smooth(LEAVE[0] + 0.35, LEAVE[1], t)), y: -Math.round(3 * smooth(LEAVE[0], LEAVE[0] + 0.45, t)) });
const necroFade = (t) => 1 - smooth(LEAVE[0] + 0.5, LEAVE[1], t);
const eyesFade = (t) => 1 - smooth(LEAVE[1] - 0.1, LEAVE[1] + 0.75, t);

// RoadRunner's mug, where he used to stand: empty, grey with dust, a cobweb from its handle to the counter; a blue

const DUSTY = { ...BAR_MUG, rows: ['.OOOOO...', 'OaagaaO..', 'OgaaaaOO.', 'OaaaaaOgO', 'OaagaaO.O', 'OaaaaaOgO', 'OgggggOO.', '.OOOOO...'], legend: { '.': null, O: 'outline', a: 'gray', g: 'grayLight' } };
const FEATHER = { w: 6, h: 3, rows: ['...OO.', '.OdDDO', 'ODDDO.'], legend: { '.': null, O: 'outline', D: 'denim', d: 'denimDark' }, anchor: { x: 0, y: 2 } };

// Two lanterns hung from the beams: one over the keg, one (failing) over RoadRunner's mug.
const LANTERN = (core) => ({
    w: 9, h: 11,
    rows: ['...OOO...', '..OiIiO..', '.OOOOOOO.', '.OiyyyiO.', `.Oy${core}yO.`, `.OyYwYyO.`, '.OyYYYyO.', '.OiyyyiO.', '.OOOOOOO.', '..OiIiO..', '...OOO...'],
    legend: { '.': null, O: 'outline', i: 'iron', I: 'ironLight', y: 'pumpkinShine', Y: 'pumpkinLight', w: 'flameCore', W: 'white' },
    anchor: { x: 4, y: 10 },

const LANTERNS = [bake(LANTERN('YwY')), bake(LANTERN('wWw')), bake(LANTERN('YYY'))];
const LAMPS = [
    { x: owlA.x + 15, y: top - 24, ph: 0, bad: 0 },

// How bright a lamp burns at t: a steady flicker, the failing one dipping now and then.
function lampLevel(l, t) {

    for (const m of motes) {
        withLayer(cam, m.f, () => {
            const x = m.x + Math.sin(t * 0.5 + m.ph) * 30, y = ((m.y - t * m.v) % H + H) % H;
            const s = M * m.s * (m.f > 1.2 ? 1.4 : 1);
            o.fillStyle = `rgba(255,232,170,${(0.12 + 0.25 * hash(m.ph)) * (0.6 + 0.4 * Math.sin(t * 2 + m.ph)) * (0.5 + 0.5 * full)})`;
            o.fillRect(Math.round(x / s) * s, Math.round(y / s) * s, s, s);
        });
    }
    // the crowd
    const sprays = [];
    CROWD.forEach((m, i) => {
        const at = ARRIVE[i];
        if (t < at) return;
        withLayer(cam, m.depth, () => {
            const walk = clamp((t - at) / WALK_IN);
            const lightLeft = m.x > W * 0.6;
            const side = m.x < W / 2 ? -1 : 1;
            let pose = 'idle', frame = frameAt(t * 1000 + i * 170, 2, 600), item = null, dir = m.dir;
            if (walk < 1) { pose = 'walk'; frame = frameAt(t * 1000 + i * 90, 4, 150); dir = 'side'; }
            else if (t >= TOAST) { pose = 'toast'; item = 'beer'; frame = Math.floor(t / (t > CLINK - 0.3 && t < CLINK + 1.0 ? 0.22 : 0.45) + i * 0.37) % 2; }
            if (t >= DRINK[0] + i * 0.08 && t < DRINK[1]) { pose = 'drink'; item = 'beer'; frame = Math.min(2, Math.floor(((t - DRINK[0] - i * 0.08) / (DRINK[1] - DRINK[0] - 0.4)) * 3)); }
            const flip = walk < 1 ? side > 0 : m.flip;
            const sil = silhouette(m.look, dir, pose, frame, item, flip ? !lightLeft : lightLeft);
            const ex = 1 - easeOut(walk);
            const bob = Math.sin(t * 2.2 + i * 1.3) * m.s * 0.35 + (walk < 1 ? Math.abs(Math.sin(t * 10 + i)) * m.s * 0.8 : 0);
            const raise = t >= TOAST ? smooth(TOAST, TOAST + 0.3, t) * m.s * 1.2 * (1 - smooth(DRINK[1], DRINK[1] + 0.5, t)) : 0;
            const feet = H + m.cut * m.s - bob - raise;
            const x0 = m.x + side * ex * 700;
            o.save(); o.translate(x0, feet); if (flip) o.scale(-1, 1);
            o.drawImage(sil.canvas, -sil.anchor.x * m.s, -sil.anchor.y * m.s, sil.canvas.width * m.s, sil.canvas.height * m.s);
            o.restore();
            if (sil.muzzle && pose === 'toast') sprays.push({ depth: m.depth, x: x0 + (flip ? -1 : 1) * (sil.muzzle[0] - sil.anchor.x) * m.s, y: feet + (sil.muzzle[1] - sil.anchor.y) * m.s, s: m.s, i, toward: m.x < W * 0.6 ? 1 : -1 });
        });
    });
    // beer leaping out of the raised mugs, a burst on the clink; sparks of glass where they meet
    const burst = smooth(CLINK - 0.1, CLINK + 0.05, t) * (1 - smooth(CLINK + 0.5, CLINK + 1.4, t));
    for (const sp of sprays) withLayer(cam, sp.depth, () => {
        const n = 3 + Math.round(burst * 14);
        for (let k = 0; k < n; k++) {
            const period = 1.1 + hash(sp.i * 31 + k) * 0.8;
            const born = Math.floor((t + hash(k * 13 + sp.i) * period) / period);
            const age = (t + hash(k * 13 + sp.i) * period) % period;
            const seed = sp.i * 1000 + k * 17 + born;
            const vx = sp.toward * (0.5 + hash(seed) * 2.4) * (0.4 + burst);
            const vy = -(2 + hash(seed + 1) * 3) * (0.5 + burst * 0.8);
            const px = sp.x + vx * age * 5 * sp.s, py = sp.y + (vy * age * 5 + 7 * age * age * 5) * sp.s;
            const q = Math.max(5, Math.round(sp.s * (hash(seed + 2) < 0.35 ? 1 : 0.55)));
            const c = hash(seed + 3);
            o.fillStyle = hex(c < 0.3 ? PALETTE.white : c < 0.6 ? PALETTE.cream : PALETTE.pumpkinShine);
            o.fillRect(Math.round(px / q) * q, Math.round(py / q) * q, q, q);
        }
        if (t >= CLINK && t < CLINK + 0.5) {
            const a = (t - CLINK) / 0.5;
            for (let k = 0; k < 8; k++) {
                const ang = hash(sp.i * 50 + k) * Math.PI * 2, d = a * (60 + hash(k + sp.i) * 80);
                o.fillStyle = `rgba(255,246,200,${1 - a})`;
                o.fillRect(Math.round((sp.x + Math.cos(ang) * d) / 6) * 6, Math.round((sp.y + Math.sin(ang) * d) / 6) * 6, 8, 8);
            }
        }
    });
    // the light of the room over it all
    const lights = lamps.map(({ p, k }) => ({ x: p.x, y: p.y + 120 * z, r: 620 * z, a: 0.75 * k }));
    const owlP = toScreen(cam, 1, owlW);
    lights.push({ x: owlP.x, y: owlP.y, r: 480 * z, a: 0.25 });
    lightUp(lerp(0.3, 0.96, full), lights);
    // the lantern flames keep burning through it, haloed
    o.save(); o.globalCompositeOperation = 'lighter';
    for (const { p, k } of lamps) {
        const g = o.createRadialGradient(p.x, p.y, 4, p.x, p.y, 150 * z);
        g.addColorStop(0, `rgba(255,200,110,${0.45 * k})`); g.addColorStop(1, 'rgba(255,160,80,0)');
        o.fillStyle = g; o.fillRect(p.x - 160 * z, p.y - 160 * z, 320 * z, 320 * z);
    }
    o.restore();
    // the necromancer's eyes: the one thing in the gloom that does not dim
    const ea = eyesFade(t);
    if (necroHere(t) && ea > 0 && ((t % 5.3) > 0.14 || t > LEAVE[0])) {
        const d = necroOff(t);
        o.save(); o.globalAlpha = ea;
        for (const [ex, ey] of NECRO.eyes) {
            const p = toScreen(cam, 1, toWorld({ x: NECRO_AT.x + d.x - NECRO.anchor.x + ex, y: NECRO_AT.y + d.y - NECRO.anchor.y + ey }));
            const g = o.createRadialGradient(p.x, p.y, 2, p.x, p.y, 55 * z);
            g.addColorStop(0, `rgba(124,240,100,${t > LEAVE[1] - 0.3 ? 0.45 : 0.32})`); g.addColorStop(1, 'rgba(124,240,100,0)');
            o.globalCompositeOperation = 'lighter'; o.fillStyle = g; o.fillRect(p.x - 60 * z, p.y - 60 * z, 120 * z, 120 * z); o.globalCompositeOperation = 'source-over';
            o.fillStyle = hex(PALETTE.eyeGreen);
            o.fillRect(Math.round(p.x - M * z * 0.5), Math.round(p.y - M * z * 0.5), Math.round(M * z * (ex > 22 ? 0.9 : 1.6)), Math.round(M * z));
        }
        o.restore();
    }
    vignette(lerp(0.9, 0.8, full));
    const f = owlFrame(t);
    return toScreen(cam, 1, toWorld({ x: owlA.x - f.anchor.x + 9, y: owlA.y - f.anchor.y + 5 }));
}

// ---------------------------------------------------------------------------------------------------------------
// The hall shot: the game's bar as the players see it (384 × 216 art, 5 screen px each at zoom 1), the door on the
// back wall swinging open, the heroes stepping in and walking over toward the counter.
const AW = 384, AH = 216, S = W / AW;
const toArt = (p) => ({ x: (p.x / 100) * AW, y: (p.y / 100) * AH });
const [HALLBG, hbX] = canvas(AW, AH);
paintBar(hbX, AW, AH, layout, { lighting: lit });
const HALL_LIGHTS = barLights(layout, AW, AH);
const HALL_PROPS = barProps(layout, AW, AH, { lighting: lit });
const DOOR_ART = barDoor(layout, AW, AH, { lighting: lit });
const OWL_SPOT = barOwlSpot(layout, AW, AH);
const COUNTER_Y = HALL_PROPS.find((p) => p.kind === 'counter')?.y ?? OWL_SPOT.y + 4;
const [STAGE, stX] = canvas(AW, AH);
const THRESHOLD = toArt(layout.door);
const INSIDE = toArt({ x: layout.door.x, y: layout.door.y + layout.door_in });
const ORDER = ['witch', 'skel', 'cat', 'mummy', 'vamp', 'scare'];
const GOALS = [[64, 70], [52, 80], [72, 76], [44, 68], [80, 86], [58, 90]].map(([x, y]) => toArt({ x, y }));
const SPEED = 50;
const WALKERS = ORDER.map((name, i) => {
    const start = ENTER[i];
    const leg1 = Math.hypot(INSIDE.x - THRESHOLD.x, INSIDE.y - THRESHOLD.y) / SPEED;
    const leg2 = Math.hypot(GOALS[i].x - INSIDE.x, GOALS[i].y - INSIDE.y) / SPEED;
    return { i, look: LOOKS[name], start, in: start + leg1, end: start + leg1 + leg2, goal: GOALS[i] };
});
const CLOSE = WALKERS.at(-1).in + 0.6;
function doorFrame(t) {
    if (t < OPEN) return 0;
    if (t < CLOSE) return Math.min(DOOR_OPEN, Math.floor((t - OPEN) / 0.12));
    return Math.max(0, DOOR_OPEN - Math.floor((t - CLOSE) / 0.12));
}
function walkerAt(w, t) {
    if (t < w.start) return null;
    let x, y, dir = 'side', pose = 'walk', left = false;
    if (t < w.in) { const k = (t - w.start) / (w.in - w.start); x = lerp(THRESHOLD.x, INSIDE.x, k); y = lerp(THRESHOLD.y, INSIDE.y, k); dir = 'front'; }
    else if (t < w.end) { const k = (t - w.in) / (w.end - w.in); x = lerp(INSIDE.x, w.goal.x, k); y = lerp(INSIDE.y, w.goal.y, k); left = w.goal.x < INSIDE.x; }
    else { x = w.goal.x; y = w.goal.y; pose = 'idle'; dir = 'back'; }
    const f = characterFrame(w.look, { dir, pose, frame: pose === 'walk' ? frameAt(t * 1000 + w.i * 60, 4, 150) : frameAt(t * 1000, 2, 600) });
    return { x, y, f, left };
}
const relit = new Map();
const relitOf = (c) => relit.get(c) ?? relit.set(c, relightCanvas(c, lit)).get(c);
function hallCamera(t) {
    const k = smooth(HALL, SPOT, t);
    return { cx: lerp(124, 176, k) + Math.sin(t * 0.4) * 1.2, cy: lerp(116, 128, k), z: lerp(1.62, 1.45, k) };
}
const owlHall = (t) => owlFrame(t);
function hallShot(t) {
    const x = stX;
    x.drawImage(HALLBG, 0, 0);
    const fl = Math.floor((t * 1000) / BAR_FLICKER_MS);
    for (const l of HALL_LIGHTS) {
        if (l.halo) { x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = 0.35; x.drawImage(bake(halo(l.halo.rx, l.halo.ry, 'warm')), l.halo.x - l.halo.rx, l.halo.y - l.halo.ry); x.restore(); }
        x.drawImage(l.frames[Math.floor(fl + l.phase) % l.frames.length], l.x - l.anchor.x, l.y - l.anchor.y);
    }
    if (DOOR_ART) x.drawImage(DOOR_ART.frames[doorFrame(t)], DOOR_ART.x, DOOR_ART.y);
    const items = HALL_PROPS.map((p) => ({ y: p.y, draw: () => x.drawImage(p.canvas, p.x - p.anchor.x, p.y - p.anchor.y) }));
    const of = owlHall(t);
    items.push({ y: COUNTER_Y - 0.5, draw: () => x.drawImage(barBake(of), OWL_SPOT.x - of.anchor.x, OWL_SPOT.y - of.anchor.y) });
    for (const w of WALKERS) {
        const c = walkerAt(w, t);
        if (!c) continue;
        items.push({ y: c.y, draw: () => {
            x.fillStyle = 'rgba(20,10,20,0.4)'; x.fillRect(Math.round(c.x) - 5, Math.round(c.y), 10, 1);
            const img = relitOf(c.f.canvas);
            if (c.left) { x.save(); x.translate(Math.round(c.x), 0); x.scale(-1, 1); x.drawImage(img, -c.f.anchor.x, Math.round(c.y - c.f.anchor.y)); x.restore(); }
            else x.drawImage(img, Math.round(c.x - c.f.anchor.x), Math.round(c.y - c.f.anchor.y));
        } });
    }
    items.sort((a, b) => a.y - b.y).forEach((it) => it.draw());
    const cam = hallCamera(t);
    const z = S * cam.z;
    o.fillStyle = '#100810'; o.fillRect(0, 0, W, H);
    o.save(); o.translate(W / 2, H / 2); o.scale(z, z); o.translate(-cam.cx, -cam.cy); o.drawImage(STAGE, 0, 0); o.restore();
    const sp = (p) => ({ x: (p.x - cam.cx) * z + W / 2, y: (p.y - cam.cy) * z + H / 2 });
    // moonlight in through the open door, dust in it
    const open = doorFrame(t) / DOOR_OPEN;
    const d = sp(INSIDE);
    if (open > 0) {
        o.save(); o.globalCompositeOperation = 'lighter';
        const g = o.createRadialGradient(d.x, d.y - 40, 10, d.x, d.y - 40, 420);
        g.addColorStop(0, `rgba(120,150,255,${0.16 * open})`); g.addColorStop(1, 'rgba(80,100,220,0)');
        o.fillStyle = g; o.fillRect(0, 0, W, H);
        o.restore();
    }
    // sparks off the torches
    o.save(); o.globalCompositeOperation = 'lighter';
    for (const l of HALL_LIGHTS) {
        if (l.kind === 'candle') continue;
        for (let i = 0; i < 5; i++) {
            const life = 0.9 + hash(i + l.x) * 0.7, age = (t + hash(i * 3 + l.x) * life) % life, k = age / life;
            const p = sp({ x: l.x + (hash(i + l.y) - 0.5) * 4 + Math.sin(t * 3 + i) * 1.5, y: l.y - l.anchor.y - k * 14 });
            o.fillStyle = `rgba(255,${hash(i + 9) < 0.4 ? 230 : 150},70,${0.9 * (1 - k)})`;
            o.fillRect(Math.round(p.x / 6) * 6, Math.round(p.y / 6) * 6, 6, 6);
        }
    }
    o.restore();
    // the room, still dim, warming as it fills
    const full = fullness(t);
    const lights = HALL_LIGHTS.filter((l) => l.kind !== 'candle').map((l) => ({ ...sp({ x: l.x, y: l.y }), r: 700, a: 0.55 }));
    lightUp(lerp(0.42, 0.8, full), lights);
    // out of focus in front: a post of the hall and the end of a bench, moving faster than the room
    soft(24, () => {
        const px = 1700 - (cam.cx - 150) * z * 1.8;
        o.fillStyle = '#0e060c'; o.fillRect(px, -50, 200, H + 100);
        o.fillStyle = '#4a2418'; o.fillRect(px, -50, 40, H + 100);
    });
    vignette(0.75);
}

// ---------------------------------------------------------------------------------------------------------------
function draw(t) {
    if (t >= HALL && t < SPOT) hallShot(t);
    else {
        const head = counterShot(t);
        for (const b of THOUGHTS) thought(b, t, head);
    }
    const black = 1 - smooth(0, 1.2, t) + smooth(DURATION - 0.9, DURATION, t);
    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

// ---------------------------------------------------------------------------------------------------------------
// Sound cues (sound.mjs). The empty bar: the hearth's crackle, a fly, the owl's thoughts as a murmur under its breath,
// word by word as they type. The bar's track comes in with the first guest and grows to bar-intro's opening level.
const owlPan = 0.25;
const murmur = (b) => [...b.text.matchAll(/[\p{L}-]+/gu)].filter((m) => m[0] !== 'Ух-ху').map((m) => ({ speak: 'owl', text: m[0], at: b.from + 0.25 + b.at[m.index], pan: owlPan, vol: 0.22, pitch: -2 }));
const crackle = [];
for (let at = 0.3, i = 0; at < DURATION - 1; at += 0.6 + hash(i) * 0.9, i++) crackle.push({ sfx: 'bonfire.click', at, pan: -0.5 + (hash(i + 7) - 0.5) * 0.3, vol: 0.16 * (at < HALL ? 1 : 0.6), pitch: -3 + hash(i + 3) * 2 });
const steps = WALKERS.flatMap((w) => {
    const out = [];
    for (let at = w.start + 0.1, k = 0; at < Math.min(w.end, SPOT + 0.5); at += 0.3, k++) out.push({ sfx: 'walk.step', at, pan: clamp((lerp(THRESHOLD.x, w.goal.x, clamp((at - w.start) / (w.end - w.start))) - 180) / 160, -1, 1), vol: 0.35, variant: k });
    return out;
});
window.SOUND = [
    { music: 'bar', from: HALL - 0.3, to: DURATION, intensity: [[HALL, 0], [SPOT, 0.15], [PERK, 0.3], [T4.from, 0.42], [POUR[0], 0.5], [CLINK, 0.85], [SQUINT + 1, 0.55], [DURATION, 0.45]], fadeIn: 4.0, fadeOut: 0.9 },
    ...crackle,
    // one fly, now and then, drifting slowly from side to side
    ...[0.8, 6.0, 11.3, 16.2, 21.6].map((at, i) => ({ sfx: 'fly.buzz', at, pan: Math.sin(at * 0.33 + 0.4) * 0.6, vol: 0.16, pitch: (hash(i + 21) - 0.5) * 1.5, variant: i })),
    ...THOUGHTS.flatMap(murmur),
    { sfx: 'bar.door', at: DOOR, pan: -0.6 },
    ...steps,
    { sfx: 'bar.door', at: CLOSE, pan: -0.5, vol: 0.45, pitch: -2 },
    { sfx: 'bar.pour', at: POUR[0], pan: owlPan + 0.1 },
    ...SLIDERS.flatMap((s, k) => [
        { sfx: 'bar.mug', at: s.at - 0.02, pan: owlPan, vol: 0.8, variant: k },
        { sfx: 'bar.mug', at: s.arrive - 0.1, pan: clamp((s.x - 80) / 70, -1, 1), vol: 0.45, pitch: 2, variant: k + 1 },
    ]),
    { sfx: 'clink.cheer', at: CLINK, vol: 1.1 },
    { sfx: 'clink.glass', at: CLINK + 0.02, pan: -0.4 },
    { sfx: 'clink.glass', at: CLINK + 0.18, pan: 0.45, variant: 1 },
    { sfx: 'clink.glass', at: CLINK + 0.33, pan: 0.05, variant: 2 },
    { sfx: 'bar.gulp', at: DRINK[0] + 0.3, pan: -0.3, vol: 0.6 },
    { sfx: 'bar.gulp', at: DRINK[0] + 0.55, pan: 0.35, vol: 0.5, variant: 1 },
    { sfx: 'owl.hoot', at: HOOT, pan: owlPan, vol: 0.35, pitch: -1 },
];
window.DURATION = DURATION;
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 3));
document.title = 'ready';
</script>
</body>
</html>
