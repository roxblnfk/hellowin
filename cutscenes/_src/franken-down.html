<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>loading</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
// FrankenPHP goes down: window.draw(t) paints the frame at t seconds; window.DURATION is the length.
// The end of the boss fight (scenario.md, step 6 → 7): the boss in black glasses with a blinking sliver of health
// snaps at the crowd, a zombie burns and heals him; the heroes ring him, Ivan steps forward, everyone strikes at once
// in slow motion; the freeze, the glasses slide down, he crumbles to ash; the owl names Ivan, the dawn comes, the
// heroes cheer, ducks and chickens fly in, the first duck is shot — the duck shoot of the recording starts from here.
import { PALETTE } from '/js/pixel/palette.js';
import { DECOR, bake, pumpkinLayers, seedOf } from '/js/pixel/sprites.js';
import { ASH } from '/js/pixel/bonfire.js';
import { EMISSIVE, NIGHT, LIT_PALETTE, halo, paintSky, relightCanvas } from '/js/pixel/night.js';
import { characterFrame, randomLook } from '/js/pixel/characters.js';
import { OWL, armed, glowing } from '/js/pixel/owl.js';
import { BOSS, FRANKEN, FX, FINALE_EMISSIVE, bossBurn, breathOf, frankenHalo } from '/js/pixel/finale.js';
import { frankenBake } from '/js/pixel/finale-stage.js';
import { FLYERS, digitsSprite, feathersOf } from '/js/pixel/flyers.js';
import { zombieBurnArt, smoulderOf, healDigitsOf, wanderArt } from '/js/pixel/deaths.js';
import { ZBURN } from '/js/pixel/zombie-burn.js';
import { BURN, burnFrameOf, burnFlame, burnLight, burnSparksAt } from '/js/pixel/finale-timeline.js';
import { RISE_MS } from '/js/pixel/wander.js';
import { speechPlan, beakAt } from '/js/owl-speech.js';

const W = 1920, H = 1080;
const OUT = document.getElementById('out').getContext('2d');
let o = OUT;
o.imageSmoothingEnabled = false;
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const frameAt = (ms, n, per) => Math.floor(ms / per) % n;

// ---------------------------------------------------------------------------------------------------------------
// Timeline, seconds. A line hangs while it types, then long enough to read it and 2–3 s more.
const fline = (from, lines, cps, extra = {}) => {
    const n = lines.join('').length;
    return { from, lines, cps, to: from + n / cps + 2.3 + n / 30, ...extra };
};
const F1 = fline(2.0, ['Вы не в силах', 'меня остановить!'], 18);
const F2 = fline(F1.to + 0.3, ['Рапира? Серьёзно?', 'Против бинарника на Go?'], 18);
const ZB = F2.to - 0.9;                 // every zombie on the field catches FrankenPHP's fire (smouldering a second before)
const HEAL = ZB + 0.26 + (ZBURN.wispAt + ZBURN.wispMs) / 1000;  // the last wisp reaches him: the bar has grown
const RISE0 = HEAL + 0.3;               // new zombies claw out of the ground
const F3 = fline(HEAL + 0.45, ['Я перезапускаюсь быстрее,', 'чем вы кликаете!'], 18, { glad: true });
const RING = [F3.to - 1.4, F3.to + 1.8];  // the heroes walk in and ring him
const IVAN = RING[1] + 0.2;             // cut: Ivan steps forward
const STRIKE = IVAN + 3.6;              // cut: everyone strikes, slow motion
const FIRE = STRIKE + 0.45;             // the bolts leave the rapiers
const DRAIN = [FIRE + 0.3, FIRE + 2.4]; // the health runs out
const CRACK = DRAIN[1] + 0.25;          // …and the bar cracks
const FREEZE = STRIKE + 4.1;            // the stop frame: silence
const SLIDE = [FREEZE + 0.8, FREEZE + 3.4];  // the glasses slide down his nose
const F4 = fline(FREEZE + 2.2, ['Caddy…', 'прикрой… меня…'], 7, { whisper: true });
const CRUMBLE = F4.to + 0.3;            // cut back: glowing cracks run over him
const F5 = fline(CRUMBLE + 0.6, ['Это не падение…', 'это… graceful shutdown…'], 12, { crumble: true });
// He burns as in the game (finale.js bossBurn, finale-timeline.js BURN), a little slowed: BURN_RATE game ms a ms.
const BURN_RATE = 0.8;
const BURN0 = F5.from + 3.4;            // the fire catches at his feet
const gameS = (ms) => ms / 1000 / BURN_RATE;
const FALL = [BURN0, BURN0 + gameS(BURN.frames * BURN.frameMs)];  // the burning body, until he is a heap
const BUB_FALL = [BURN0 + gameS(BURN.crumble), BURN0 + gameS(BURN.crumble + BURN.crumbleMs)]; // the bubble crumbles with him
F5.to = BUB_FALL[0] + 2.6;
const BOLTS = FALL[1] + 0.3;            // the two bolts drop last
const GLASSES_LAND = BOLTS + 1.35;      // the glasses settle on top of the heap
const OWL_CUT = GLASSES_LAND + 0.9;
const O1 = { from: OWL_CUT + 0.9, lines: ['Ivan нанёс последний удар!'] };
const DAWN = O1.from + 5.3;             // cut back wide: the shock wave of light
const DAWN_FADE = [DAWN + 0.3, DAWN + 5.5];
const SUN = [DAWN + 1.0, DAWN + 8];
const CHEER = DAWN + 5.6;               // the heroes cheer
const FLOCK = DAWN + 7.2;               // the ducks and chickens fly in
const O3 = { from: 0, lines: ['Настреляйте дичи к пиву —', 'и все в бар!'] };
const OWL_LINES = [O1, O3];
const textOf = (b) => b.lines.join(' ');
for (const b of OWL_LINES) b.plan = speechPlan(textOf(b));
const owlTo = (b) => b.from + b.plan.ms / 1000 + 2.4 + textOf(b).length / 30;
O1.to = owlTo(O1);
O3.from = FLOCK + 1.2;
O3.to = owlTo(O3);
const AIM = O3.to - 1.4;                // the heroes turn to the sky and aim
const DURATION = AIM + 2.6 + 2.0;       // 2 s of calm at the end, the fade only in them
const F_LINES = [F1, F2, F3, F4, F5];

// ---------------------------------------------------------------------------------------------------------------
// The stage (as franken-rise.html stages the finale): 320 × 180 art px.
const UNLIT = new Set([...EMISSIVE, ...FINALE_EMISSIVE]);
const baked = new WeakMap();
function bakeF(sprite, lighting = 'day') {
    if (!baked.has(sprite)) baked.set(sprite, new Map());
    const per = baked.get(sprite);
    if (per.has(lighting)) return per.get(lighting);
    const [c, ctx] = canvas(sprite.w, sprite.h);
    const img = ctx.createImageData(sprite.w, sprite.h);
    for (let y = 0; y < sprite.h; y++) for (let x = 0; x < sprite.w; x++) {
        const k = sprite.legend[sprite.rows[y][x]];
        if (!k) continue;
        const color = UNLIT.has(k) || lighting === 'day' ? PALETTE[k] : LIT_PALETTE[lighting][k];
        if (color === undefined) continue;
        const i = (y * sprite.w + x) * 4;
        img.data[i] = (color >> 16) & 255; img.data[i + 1] = (color >> 8) & 255; img.data[i + 2] = color & 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    per.set(lighting, c);
    return c;
}
const light = (s) => bakeF(s, 'day');
const anchorOf = (def) => def.anchor ?? { x: def.w >> 1, y: def.h >> 1 };
const stamp = (ctx, c, def, x, y, flip = false) => {
    const a = anchorOf(def);
    if (!flip) { ctx.drawImage(c, Math.round(x - a.x), Math.round(y - a.y)); return; }
    ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, -(def.w - a.x), Math.round(y - a.y)); ctx.restore();
};
const additive = (ctx, c, def, x, y, a) => { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a); stamp(ctx, c, def, x, y); ctx.restore(); };
const glowCache = new WeakMap();
const glow = (s) => glowCache.get(s) ?? glowCache.set(s, glowing(s)).get(s);
const relit = new Map();
function relitOf(c, lighting) {
    if (!relit.has(c)) relit.set(c, new Map());
    const per = relit.get(c);
    if (!per.has(lighting)) per.set(lighting, relightCanvas(c, lighting));
    return per.get(lighting);
}

const MW = 320, MH = 180, HORIZON = 62;
const CENTRE = { x: 166, y: 124 };
const TREE_AT = { x: 34, y: 118 };
const PERCH = { x: TREE_AT.x - DECOR.tree.anchor.x + DECOR.tree.perch[0], y: TREE_AT.y - DECOR.tree.anchor.y + DECOR.tree.perch[1] };
const PUMPKINS = [
    [-108, -10, 'm', 'pumpkin-1'], [-84, -32, 's', 'pumpkin-2'], [-44, -44, 's', 'pumpkin-3'], [2, -48, 's', 'pumpkin-5'],
    [46, -44, 'm', 'pumpkin-6'], [86, -32, 's', 'pumpkin-7'], [112, -8, 'l', 'pumpkin-8'], [104, 26, 'm', 'pumpkin-10'],
    [66, 44, 'l', 'pumpkin-11'], [-8, 50, 'm', 'pumpkin-13'], [-70, 42, 'l', 'pumpkin-14'], [-112, 22, 's', 'pumpkin-15'],
];

const LAWN = (() => {
    const [c, ctx] = canvas(MW, MH);
    let seed = 9;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let x = 0; x < MW; x += DECOR.hills.w) ctx.drawImage(bake(DECOR.hills), x, HORIZON - DECOR.hills.h);
    for (let y = HORIZON; y < MH; y++) for (let x = 0; x < MW; x++) {
        const d = Math.hypot((x - CENTRE.x) / 140, (y - CENTRE.y + 4) / 56);
        let k;
        if (d < 0.9 || (d < 1 && (x + y) % 2 === 0)) {
            const lane = ((((x - CENTRE.x) / (y - HORIZON + 30)) * 9) % 1 + 1) % 1;
            k = lane < 0.2 ? 'soilDark' : lane < 0.3 ? 'soilLight' : 'soil';
        } else { const n = r(); k = n < 0.06 ? 'leafLight' : n < 0.18 ? 'leafDark' : 'leaf'; }
        ctx.fillStyle = hex(PALETTE[k]); ctx.fillRect(x, y, 1, 1);
    }
    return c;
})();
const GROUND = { night: relightCanvas(LAWN, 'night'), dawn: relightCanvas(LAWN, 'dawn') };
const SKYC = Object.fromEntries([['blood', true], ['dawn', false]].map(([l, stars]) => {
    const [c, ctx] = canvas(MW + 120, HORIZON + 41);
    paintSky(ctx, MW + 120, HORIZON + 41, l, { seed: 5, stars });
    return [l, c];
}));
// A far ridge behind the hills for the blurred back layer: two rolling lines, dark against the sky.
const RIDGE = (() => {
    const [c, ctx] = canvas(MW + 160, 40);
    for (let x = 0; x < c.width; x++) {
        const h1 = 18 + 6 * Math.sin(x * 0.031) + 4 * Math.sin(x * 0.083 + 1) + 2 * Math.sin(x * 0.21);
        const h2 = 10 + 5 * Math.sin(x * 0.05 + 2) + 3 * Math.sin(x * 0.13);
        ctx.fillStyle = hex(PALETTE.leafDark); ctx.fillRect(x, 40 - h1, 1, h1);
        ctx.fillStyle = hex(PALETTE.leaf); ctx.fillRect(x, 40 - h2, 1, h2);
    }
    return c;
})();
const RIDGE_LIT = { night: relightCanvas(RIDGE, 'night'), dawn: relightCanvas(RIDGE, 'dawn') };

// How far the dawn has come, 0–1: the two lightings of the stage cross-fade over it.
const dawnK = (t) => smooth(DAWN_FADE[0], DAWN_FADE[1], t);

// ---------------------------------------------------------------------------------------------------------------
// The cast. Ivan: a vampire with a pink mohawk (violet tips), a smile and the red cape.
const IVAN_LOOK = { body: 'vampire', cloak: 'cape', face: 'smile', eyes: 'violet', hat: 'mohawk' };
const rnd = (s) => () => ((s = (s * 16807) % 2147483647) / 2147483647);
const LOOKS = Array.from({ length: 8 }, (_, i) => randomLook(rnd(77 + i * 31)));
// home — where each stands while he talks; ring — round him, art px from his foot; Ivan last.
const HEROES = [
    { home: [34, 150], ring: [-70, -2] }, { home: [70, 104], ring: [-56, -20] }, { home: [108, 92], ring: [-36, -30] },
    { home: [232, 96], ring: [36, -30] }, { home: [284, 112], ring: [56, -20] }, { home: [298, 152], ring: [70, -2] },
    { home: [248, 162], ring: [56, 18] }, { home: [82, 164], ring: [-56, 18] },
    { home: [138, 166], ring: [-30, 26], ivan: true },
].map((h, i) => ({ ...h, i, look: h.ivan ? IVAN_LOOK : LOOKS[i], walk: [RING[0] + hash(i + 3) * 0.6, RING[1] - 0.2 - hash(i + 9) * 0.5] }));
const IVAN_H = HEROES.at(-1);
// Ivan steps forward out of the ring before the strike.
const IVAN_FWD = [-28, 36];

function heroPos(h, t) {
    const ring = { x: CENTRE.x + h.ring[0], y: CENTRE.y + h.ring[1] };
    const home = { x: h.home[0], y: h.home[1] };
    const k = smooth(h.walk[0], h.walk[1], t);
    let p = { x: lerp(home.x, ring.x, k), y: lerp(home.y, ring.y, k) };
    if (h.ivan) {
        const f = smooth(IVAN - 0.1, IVAN + 1.4, t);
        p = { x: lerp(p.x, CENTRE.x + IVAN_FWD[0], f), y: lerp(p.y, CENTRE.y + IVAN_FWD[1], f) };
    }
    return { ...p, walking: t > h.walk[0] && t < h.walk[1] };
}
// Pose of a hero at t: the whole choreography.
function heroPose(h, t) {
    const p = heroPos(h, t);
    const dx = CENTRE.x - p.x;
    let face = dx >= 0 ? 1 : -1;   // 1: faces right
    let dir = 'side', pose = 'idle', frame = Math.floor((t + h.i * 0.37) / 0.6), hop = 0, spin = false;
    if (p.walking) { pose = 'walk'; frame = Math.floor((t + h.i * 0.1) / 0.15); face = Math.sign((CENTRE.x + h.ring[0]) - h.home[0]) || face; }
    else if (t >= RING[1] - 0.3 && t < FIRE - 0.15) { pose = 'toast'; frame = Math.floor((t + h.i * 0.2) / 0.45); }
    else if (t >= FIRE - 0.15 && t < CRUMBLE + 1) { pose = 'shoot'; frame = 0; }
    if (t >= CHEER && t < AIM) {
        // the cheer: hops, the rapiers up and spun, the neighbours clink their blades
        const s = t - CHEER - hash(h.i + 40) * 0.6;
        const clinkPair = CLINKS.find((c) => c.pair.includes(h.i));
        dir = 'side';
        if (clinkPair && clinkAt(clinkPair, t)) {
            pose = 'clink'; frame = Math.floor(t / 0.35);
            face = clinkPair.pair[0] === h.i ? 1 : -1;
        } else {
            pose = 'toast'; frame = Math.floor((t + h.i * 0.3) / 0.45);
            hop = s > 0 ? Math.round(Math.abs(Math.sin((s / (0.55 + hash(h.i) * 0.2)) * Math.PI)) * 7) : 0;
            spin = h.i % 2 === 0;
            face = Math.floor(s / 1.7 + h.i) % 2 ? 1 : -1;
        }
    }
    if (t >= AIM) {
        // turn to the sky and aim at the flock coming over, from the right
        const turn = t - AIM - hash(h.i + 60) * 0.5;
        if (turn > 0) { pose = turn < 0.3 ? 'idle' : 'shoot'; frame = 0; face = 1; hop = 0; spin = false; }
    }
    return { ...p, dir, pose, frame, flip: face < 0, hop, spin };
}
// Pairs that clink rapiers on the cheer, each at its own moments.
const CLINKS = [
    { pair: [0, 7], at: [CHEER + 1.2, CHEER + 4.6] },
    { pair: [3, 4], at: [CHEER + 2.1, CHEER + 5.8] },
    { pair: [1, 2], at: [CHEER + 3.3, CHEER + 7.4] },
];
const clinkAt = (c, t) => c.at.some((a) => t >= a && t < a + 0.7);
const clinkHit = (c, t) => c.at.find((a) => t >= a + 0.35 && t < a + 0.75);

function drawHero(ctx, h, t, lighting) {
    const s = heroPose(h, t);
    const f = characterFrame(h.look, { dir: s.dir, pose: s.pose, frame: s.frame, item: 'rapier' });
    const x = Math.round(s.x), y = Math.round(s.y - s.hop);
    const put = (c) => {
        if (s.flip) { ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(c, -f.anchor.x, y - f.anchor.y); ctx.restore(); }
        else ctx.drawImage(c, x - f.anchor.x, y - f.anchor.y);
    };
    if (s.hop) { ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.fillRect(x - 5, Math.round(s.y), 11, 1); ctx.globalAlpha = 1; }
    // a gold light on the ground round a rapier at night
    if (lighting === 'night') { const g = halo(12, 5, 'gold'); additive(ctx, light(g), g, x, Math.round(s.y), 0.35); }
    put(relitOf(f.canvas, lighting));
    const shimmer = f.flames ? f.flames[frameAt(t * 1000 + h.i * 57, f.flames.length, 110)] : f.glow;
    if (shimmer) put(shimmer);
    const m = f.muzzle ?? f.flame;
    const tip = m ? { x: x + (s.flip ? -1 : 1) * (m[0] - f.anchor.x), y: y + m[1] - f.anchor.y } : { x, y: y - 30 };
    // a spun rapier leaves a gold arc over the head
    if (s.spin) {
        const a0 = t * 9 + h.i;
        for (let k = 0; k < 7; k++) {
            const a = a0 - k * 0.32;
            ctx.fillStyle = hex(PALETTE[['goldCore', 'goldHot', 'goldHot', 'goldGlow', 'goldGlow', 'goldDeep', 'goldDeep'][k]]);
            ctx.fillRect(Math.round(tip.x + Math.cos(a) * 7), Math.round(tip.y + 2 + Math.sin(a) * 3), 1, 1);
        }
    }
    return { tip, x, y, f };
}

// Zombie workers: wandering at the back, lime-lit. FrankenPHP devours them all at once: each smoulders, burns in his
// lime fire and sends him a wisp; then new ones claw their way out of the ground (wanderArt().rise, RISE_MS) and
// wander on. At the dawn the curse leaves them: the lime goes, the skin turns back to a worker's.
const ZOMBIE = FLYERS.zombie[1];
const cured = new WeakMap();
const cure = (def) => cured.get(def) ?? cured.set(def, { ...def, legend: { ...def.legend, z: 'skin', Z: 'skinShade' } }).get(def);
// The first wave, all burnt; `burn` — when each catches fire.
const OLD = [
    { x: 52, y: 88, range: 16, v: 4, ph: 0 }, { x: 278, y: 94, range: 12, v: 3.5, ph: 2 }, { x: 118, y: 80, range: 10, v: 3, ph: 4 },
    { x: 246, y: 76, range: 14, v: 3.2, ph: 1 }, { x: 302, y: 128, range: 8, v: 2.6, ph: 3 }, { x: 202, y: 88, range: 0, v: 0, ph: 0 },
    { x: 96, y: 140, range: 6, v: 2.2, ph: 5 },
].map((z, k) => ({ ...z, burn: ZB + [0, 0.18, 0.08, 0.26, 0.12, 0.04, 0.22][k] }));
// The second wave, out of the ground once the first has fed him.
const NEW = [
    { x: 146, y: 90, range: 8, v: 3.4, ph: 1 }, { x: 262, y: 88, range: 10, v: 3, ph: 3 }, { x: 132, y: 78, range: 8, v: 2.8, ph: 0 },
    { x: 222, y: 74, range: 12, v: 3, ph: 2 }, { x: 296, y: 120, range: 6, v: 2.4, ph: 4 }, { x: 84, y: 136, range: 8, v: 2.6, ph: 5 },
].map((z, k) => ({ ...z, rise: RISE0 + [0, 0.35, 0.15, 0.5, 0.25, 0.42][k] }));
const RISE_S = RISE_MS / 1000;
const rimCache = new WeakMap();
function limeRim(c) {
    if (rimCache.has(c)) return rimCache.get(c);
    const w = c.width, h = c.height;
    const d = c.getContext('2d').getImageData(0, 0, w, h).data;
    const [r, rx] = canvas(w + 2, h + 2);
    rx.fillStyle = hex(PALETTE.frankenGlow);
    const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0;
    for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) if (!on(x, y) && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) rx.fillRect(x + 1, y + 1, 1, 1);
    rimCache.set(c, r);
    return r;
}
// Where a zombie stands at t (an old one stops dead as it starts to smoulder).
function zombiePos(z, t) {
    const tt = z.burn !== undefined ? Math.min(t, z.burn - ZBURN.warnMs / 1000) : z.rise !== undefined ? Math.max(0, t - z.rise - RISE_S) : t;
    const ph = z.range ? (tt * z.v) / z.range + z.ph : 0;
    return { x: z.x + Math.sin(ph) * z.range, left: Math.cos(ph) < 0, still: z.burn !== undefined && t >= z.burn - ZBURN.warnMs / 1000 };
}
function zombieBody(ctx, def, x, y, left, t, k, lighting, glowA = 1) {
    const night = lighting === 'night';
    if (!night) def = cure(def);
    if (night) { const g = frankenHalo(9, 4); additive(ctx, light(g), g, x, y, 0.45 * glowA); }
    const c = bakeF(def, lighting);
    stamp(ctx, c, def, x, y, left);
    if (night) {
        const a = anchorOf(def);
        ctx.globalAlpha = (0.55 + 0.25 * Math.sin(t * 5 + k)) * glowA;
        const r = limeRim(c);
        if (left) { ctx.save(); ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(r, -(def.w - anchorOf(def).x) - 1, Math.round(y - a.y) - 1); ctx.restore(); }
        else ctx.drawImage(r, Math.round(x - a.x) - 1, Math.round(y - a.y) - 1);
        ctx.globalAlpha = 1;
    }
}
function zombieAt(ctx, z, k, t, lighting) {
    if (z.rise !== undefined && t < z.rise) return;
    if (z.burn !== undefined && t >= z.burn) { burner(ctx, z, k, t, lighting); return; }
    const p = zombiePos(z, t);
    if (z.rise !== undefined && t < z.rise + RISE_S) {
        const def = wanderArt().rise[Math.min(4, Math.floor(((t - z.rise) / RISE_S) * 5))];
        zombieBody(ctx, def, p.x, z.y, p.left, t, k, lighting, 0.6);
        return;
    }

function draw(t) {
    if (t >= IVAN && t < STRIKE) shotIvan(t);
    else if (t >= FREEZE && t < CRUMBLE) shotFreeze(t);
    else if (t >= OWL_CUT && t < DAWN) shotOwl(t);
    else shotStage(t);
    // a white frame on the cuts into the strike and out of the freeze
    for (const c of [STRIKE, CRUMBLE]) if (t >= c && t < c + 0.1) { o.fillStyle = `rgba(255,250,235,${0.8 * (1 - (t - c) / 0.1)})`; o.fillRect(0, 0, W, H); }

    if (black > 0) { o.fillStyle = `rgba(0,0,0,${clamp(black)})`; o.fillRect(0, 0, W, H); }
}

    { sfx: 'dice.land', at: GLASSES_LAND, variant: 2, vol: 0.4, pitch: 3 },

    ...OWL_LINES.map((b, k) => ({ sfx: 'owl.hoot', at: b.from - 0.95, pan: k ? -0.7 : 0.4, vol: 0.8 })),
    { speak: 'owl', text: textOf(O1), at: O1.from, pan: 0.4 },
    { speak: 'owl', text: textOf(O3), at: O3.from, pan: -0.7 },
    // the dawn
    { sfx: 'circle.done', at: DAWN, vol: 0.7 },
    { sfx: 'dawn.rise', at: DAWN + 0.6 },
    // the cheer: clinks of the blades, cheers
    ...CLINKS.flatMap((c, k) => c.at.map((a) => ({ sfx: 'clink.glass', at: a + 0.35, variant: k % 4, pitch: 4, vol: 0.7, pan: clamp((HEROES[c.pair[0]].ring[0]) / 80) * 0.6 }))),
    { sfx: 'clink.cheer', at: CHEER + 0.3, vol: 0.9 },
    { sfx: 'clink.cheer', at: CHEER + 3.6, vol: 0.7, variant: 1 },
    // the flock
    ...flockCues,
];
window.DURATION = DURATION;
window.T = { F1, F2, ZB, HEAL, F3, RING, IVAN, STRIKE, FIRE, DRAIN, CRACK, FREEZE, SLIDE, F4, CRUMBLE, F5, FALL, BUB_FALL, BOLTS, GLASSES_LAND, OWL_CUT, O1: [O1.from, O1.to], DAWN, CHEER, FLOCK, O3: [O3.from, O3.to], AIM, BURN0, RISE0, DURATION };
window.draw = (t) => { draw(t); return true; };
draw(Number(new URLSearchParams(location.search).get('t') ?? 0));
document.title = 'ready';
</script>
